apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def hasValidReleaseKeystore = keystorePropertiesFile.exists() &&
        keystoreProperties['storeFile'] &&
        keystoreProperties['storePassword'] &&
        keystoreProperties['keyAlias'] &&
        keystoreProperties['keyPassword']

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ebaiboly.app"
    packagingOptions {
        resources {
            excludes += [
                "META-INF/LICENSE*",
                "META-INF/NOTICE*",
                "META-INF/DEPENDENCIES",
                "META-INF/AL2.0",
                "META-INF/LGPL2.1",
            ]
        }
        jniLibs {
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        applicationId "com.ebaiboly.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "1.3.0"
        resConfigs "fr"

        // 16KB page size support - ensures native libs are aligned to 16KB boundaries.
        // Must stay in sync with reactNativeArchitectures in android/gradle.properties.
        // Every ABI listed here MUST also be compiled there — listing an ABI that RN
        // does not build ships an empty lib/<abi>/ folder and crashes SoLoader on that
        // architecture (e.g. react-native-gesture-handler). x86 / x86_64 are included
        // for Chromebooks, Intel tablets and Android Automotive; AAB per-ABI splits
        // mean ARM users never download these extra libs.
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }

        // NDK r28+ automatically aligns to 16KB page size
    }
    // Disabled for AAB builds (Play Store). AAB format handles ABI splits automatically.
    // splits {
    //     abi {
    //         enable true
    //         reset()
    //         include "armeabi-v7a", "arm64-v8a"
    //         universalApk false
    //     }
    // }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasValidReleaseKeystore) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            if (!hasValidReleaseKeystore) {
                throw new GradleException("Missing release signing config. Create android/keystore.properties with storeFile/storePassword/keyAlias/keyPassword and place the keystore file at the referenced path.")
            }
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            // proguard-android-optimize (not plain proguard-android) is what turns
            // R8's optimization passes on — Play Console flags the plain file as
            // "optimization not enabled".
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"

            // Note: ABI filtering handled by splits.abi configuration above
        }
    }

    // Database assets configuration: dev for debug, prod for release.
    // Each srcDir's contents become the asset root, so debug ships the raw
    // .db files at the top level and release ships the .zip files at the top
    // level. Runtime lookups in src/utils/paths.ts -> getDatabaseAssetPath
    // must match this flat layout.
    // Each variant maps ONLY its own data directory onto the assets root, so
    // the packaged asset is flat (BibleMG65.zip at the top) — which is what
    // getDatabaseAssetPath() returns on Android.
    //
    // Both point at the repo-root assets/ on purpose. These files used to also
    // be duplicated under src/main/assets/data/, which the main source set
    // then merged into EVERY variant: release shipped the dev .db files it
    // never reads (17.4 MB) plus a second copy of the prod zips (8.1 MB) on
    // top of the flat ones it does read — 25.5 MB of dead weight in every
    // user's download. Keep the DB files out of src/main/assets entirely.
    sourceSets {
        debug {
            assets.srcDirs = ['../../assets/data/dev']
        }
        release {
            assets.srcDirs = ['../../assets/data/prod']
        }
    }

    // Prod ZIPs are built by `yarn build:database`. Run it manually before
    // a release build if the source data changed.
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    // Provides Activity.enableEdgeToEdge(), the SDK 35-compatible replacement
    // for the deprecated WindowCompat.setDecorFitsSystemWindows + statusBarColor
    // / navigationBarColor APIs flagged by Play Console.
    implementation("androidx.activity:activity-ktx:1.9.3")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "28.0.3"
        kotlinVersion = "2.1.20"
        // react-native-in-app-review reads these with no fallback of its own
        // (safeExtGet('playReviewVersion') with no second arg), so leaving them
        // undefined resolves to "…:review:null" and fails the build.
        playReviewVersion = "2.0.2"
        playServicesVersion = "18.5.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.5.2")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.20")
    }
}

apply plugin: "com.facebook.react.rootproject"

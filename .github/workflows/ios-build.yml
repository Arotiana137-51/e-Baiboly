name: iOS Build (Device Archive)

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install

      - name: Build databases
        run: yarn build:database

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true
          working-directory: .

      - name: Install CocoaPods with specific versions
        run: |
          gem install cocoapods -v '>= 1.13' --version '!= 1.15.0' --version '!= 1.15.1'
          gem install activesupport -v '>= 6.1.7.5' --version '!= 7.1.0'
          gem install xcodeproj -v '< 1.26.0'

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update

      # Release archive for real device hardware rather than a simulator build:
      # this is the configuration TestFlight ships, so it compiles for arm64 and
      # runs the Hermes bundling phase a Debug simulator build skips. Signing
      # stays off because verifying the compile needs no Apple account.
      - name: Archive iOS app for device
        run: |
          cd ios
          xcodebuild -workspace SmartBaibolyYarn.xcworkspace \
            -scheme SmartBaibolyYarn \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SmartBaibolyYarn.xcarchive" \
            clean archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Confirm the archive holds a real app binary
        run: |
          APP="$RUNNER_TEMP/SmartBaibolyYarn.xcarchive/Products/Applications/SmartBaibolyYarn.app"
          test -d "$APP" || { echo "No .app produced in the archive"; exit 1; }
          test -f "$APP/main.jsbundle" || { echo "No JS bundle in the archive"; exit 1; }
          echo "Archive OK"
          du -sh "$APP"

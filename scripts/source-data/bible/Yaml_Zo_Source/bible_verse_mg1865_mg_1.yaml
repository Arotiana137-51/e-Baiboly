mg1865::mg_1::1::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 1
  verse_date_revised: '2022-03-02T00:00:12+0000'
  verse_title: 'Ny namoronan''Andriamanitra izao tontolo izao'
  verse_text: 'Tamin''ny voalohany Andriamanitra nahary ny lanitra sy ny tany.'
mg1865::mg_1::1::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny tany dia tsy nisy endrika sady foana; ary aizina no tambonin''ny lalina. Ary ny fanahin''Andriamanitra nanomba tambonin''ny rano.'
mg1865::mg_1::1::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao hoe: Misia mazava; dia nisy mazava.'
mg1865::mg_1::1::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan''Andriamanitra fa tsara ny mazava; ary nampisarahin''Andriamanitra ny mazava sy ny maizina.'
mg1865::mg_1::1::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao ny mazava hoe andro; ary ny maizina nataony hoe alina. Dia nisy hariva, ary nisy maraina, andro voalohany izany.'
mg1865::mg_1::1::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao hoe: Misia habakabaka eo anelanelan''ny rano; ary aoka hampisaraka ny rano amin''ny rano izy.'
mg1865::mg_1::1::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao ny habakabaka ka nampisaraka ny rano ambanin''ny habakabaka tamin''ny rano ambonin''ny habakabaka; dia nisy izany.'
mg1865::mg_1::1::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao ny habakabaka hoe lanitra. Dia nisy hariva, ary nisy maraina, andro faharoa izany.'
mg1865::mg_1::1::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao hoe : Aoka hiangona ny rano eny ambanin''ny lanitra ho eo amin''ny fitoerana iray, ary aoka hiseho ny maina; dia nisy izany.'
mg1865::mg_1::1::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao ny maina hoe tany; ary ny rano tafangona nataony hoe ranomasina. Ary hitan''Andriamanitra fa tsara izany.'
mg1865::mg_1::1::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao hoe: Aoka ny tany haniry ahitra sy anana mamoa ary hazo fihinam-boa izay mamoa, samy araka ny karazany avy, ka manam-boa ao aminy, eny ambonin''ny tany; dia nisy izany.'
mg1865::mg_1::1::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny tany naniry ahitra sy anana mamoa samy araka ny karazany avy, ary hazo mamoa izay manam-boa ao aminy, samy araka ny karazany avy. Ary hitan''Andriamanitra fa tsara izany.'
mg1865::mg_1::1::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nisy hariva. ary nisy maraina, andro fahatelo izany.'
mg1865::mg_1::1::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao hoe: Misia fahazavana eny amin''ny habakabaky ny lanitra hampisaraka ny andro sy ny alina; ary aoka ho famantarana sy ho fotoana ary ho andro sy taona ireo.'
mg1865::mg_1::1::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary aoka ho fanazavana eny amin''ny habakabaky ny lanitra izy hanazava eny ambonin''ny tany; dia nisy izany.'
mg1865::mg_1::1::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao ny fanazavana roa lehibe, dia ny fanazavana lehibe ho mpanapaka ny andro ary ny fanazavana kely ho mpanapaka ny alina sy ny kintana.'
mg1865::mg_1::1::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nametraka azy teny amin''ny habakabaky ny lanitra hanazava eny ambonin''ny tany,'
mg1865::mg_1::1::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy ho mpanapaka ny andro sy ny alina, ary hampisaraka ny mazava sy ny maizina. Ary hitan''Andriamanitra fa tsara izany.'
mg1865::mg_1::1::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nisy hariva, ary nisy maraina, andro fahefatra izany.'
mg1865::mg_1::1::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao hoe: Aoka ny rano ho be zava-manan''aina; ary aoka hisy vorona hanidina ambonin''ny tany eny amin''ny habakabaky ny lanitra.'
mg1865::mg_1::1::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nahary ny biby vaventy anaty rano sy ny zava-manan''aina mihetsiketsika rehetra, izay efa betsaka ao amin''ny rano, samy araka ny karazany avy, ary ny voro-manidina rehetra, samy araka ny karazany avy. Ary hitan''Andriamanitra fa tsara izany.'
mg1865::mg_1::1::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nitso-drano azy hoe: Maroa anaka sy mihabetsaha ary mamenoa ny rano ao amin''ny ranomasina; ary aoka ny vorona hihamaro eny ambonin''ny tany.'
mg1865::mg_1::1::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 23
  verse_date_revised: '2022-12-30T06:28:36+0000'
  verse_title: null
  verse_text: 'Dia nisy ny hariva, ary nisy maraina, andro fahadimy izany.'
mg1865::mg_1::1::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao hoe: Aoka ny tany hamoaka zava-manan''aina samy araka ny karazany avy, dia biby fiompy sy biby mandady sy mikisaka ary bibi-dia, samy araka ny karazany avy; dia nisy izany.'
mg1865::mg_1::1::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao ny bibi-dia, samy araka ny karazany avy, sy ny biby fiompy, samy araka ny karazany avy, ary ny biby rehetra izay mandady na mikisaka amin''ny tany, samy araka ny karazany avy. Ary hitan''Andriamanitra fa tsara izany.'
mg1865::mg_1::1::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao hoe: Andeha Isika hamorona olona tahaka ny endritsika, araka ny tarehintsika ; ary aoka izy hanjaka amin''ny hazandrano ao amin''ny ranomasina sy ny voro-manidina sy ny biby fiompy sy ny tany rehetra ary ny biby rehetra izay mandady na mikisaka amin''ny tany.'
mg1865::mg_1::1::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nahary ny olona tahaka ny endriny; tahaka ny endrik''Andriamanitra no namoronany azy; lahy sy vavy no namoronany azy.'
mg1865::mg_1::1::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 28
  verse_date_revised: '2023-01-06T09:47:50+0000'
  verse_title: null
  verse_text: 'Ary Andriamanitra nitso-drano azy hoe: Maroa fara sy mihabetsaha ary mamenoa ny tany, ka mampanompoa azy; ary manjakà amin''ny hazandrano ao amin''ny ranomasina sy ny voro-manidina ary ny biby rehetra izay mihetsiketsika ambonin''ny tany.'
mg1865::mg_1::1::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nanao hoe: Indro, efa nomeko anareo ny anana manintsam-boa rehetra izay ambonin''ny tany rehetra ary ny hazo rehetra izay misy voa sady manintsam-boa; dia ho fihinana ho anareo ireny.'
mg1865::mg_1::1::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny amin''ny bibi-dia rehetra sy ny voro-manidina rehetra ary ny zava-manan''aina rehetra izay mandady na mikisaka amin''ny tany, dia efa nomeko azy ny zava-maitso rehetra ho fihinany; dia nisy izany.'
mg1865::mg_1::1::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 1
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan''Andriamanitra izay rehetra nataony, ary, indro, tsara indrindra izany. Dia nisy hariva, ary nisy maraina, andro fahenina izany.'
mg1865::mg_1::2::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia vita ny lanitra sy ny tany sy izay rehetra ao aminy.'
mg1865::mg_1::2::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''ny andro fahafito dia vitan''Andriamanitra ny asa efa nataony; ary dia nitsahatra tamin''ny andro fahafito Izy tamin''ny asany rehetra izay efa nataony.'
mg1865::mg_1::2::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nitahy ny andro fahafito sy nanamasina azy, satria tamin''izany no nitsaharan''Andriamanitra tamin''ny asany rehetra izay noforoniny tamin''ny nanaovany azy.'
mg1865::mg_1::2::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 4
  verse_date_revised: null
  verse_title: 'Ny saha tao Edena, sy ny toetry ny olombelona fony tsy mbola nanota izy'
  verse_text: 'Ary izao no tantaran''ny lanitra sy ny tany tamin''ny namoronana azy, dia tamin''ny nanaovan''i Jehovah Andriamanitra ny tany sy ny lanitra:'
mg1865::mg_1::2::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny hazo madinika famboly dia tsy mbola nisy teo amin''ny tany, ary ny anana famboly tsy mbola nisy naniry; fa tsy mbola nampilatsaka ranonorana tambonin''ny tany Jehovah Andriamanitra, ary tsy nisy olona hiasa ny tany;'
mg1865::mg_1::2::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'nefa nisy zavona niakatra avy tamin''ny tany ka nandena ny tany rehetra.'
mg1865::mg_1::2::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary vovo-tany no namoronan''i Jehovah Andriamanitra ny olona, ary nofofoniny fofonaina mahavelona ny vavorony; dia tonga olombelona izy*. [*Tonga manan''aina ny olona]'
mg1865::mg_1::2::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah Andriamanitra nanao saha tao Edena tany atsinanana, ka napetrany tao ralehilahy izay noforoniny.'
mg1865::mg_1::2::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nampanirin''i Jehovah Andriamanitra teo amin''ny tany ny hazo rehetra izay maha-te-hizaha sady tsara ho fihinana, ary ny hazon''aina teo afovoan''ny saha sy ny hazo fahalalana ny tsara sy ny ratsy.'
mg1865::mg_1::2::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy ony nivoaka avy tao Edena handena ny saha; hatreo izy dia nizara ka nisampana efatra:'
mg1865::mg_1::2::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny anaran''ny voalohany dia Pisona; io no mandeha manodidina ny tany Havila rehetra, izay misy ny volamena;'
mg1865::mg_1::2::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary tsara ny volamena amin''izany tany izany; any ny bedola sy ny vato beryla.'
mg1865::mg_1::2::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''ny ony faharoa dia Gihona; io no mandeha manodidina ny tany Kosy rehetra.'
mg1865::mg_1::2::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''ny ony fahatelo dia Hidekela; io no mandeha tandrifin''i Asyria. Ary ny ony fahefatra dia Eofrata.'
mg1865::mg_1::2::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah Andriamanitra nitondra an-dralehilahy ka namponina azy tao amin''ny saha Edena hiasa sy hitandrina azy.'
mg1865::mg_1::2::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah Andriamanitra nandidy an-dralehilahy ka nanao hoe: Ny hazo rehetra eo amin''ny saha dia azonao ihinanana ihany;'
mg1865::mg_1::2::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa ny hazo fahalalana ny tsara sy ny ratsy dia aza ihinanana; fa amin''ny andro izay ihinananao azy dia ho faty tokoa ianao.'
mg1865::mg_1::2::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah Andriamanitra nanao hoe: Tsy tsara raha irery ralehilahy; dia hanaovako vady sahaza ho azy izy.'
mg1865::mg_1::2::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tany no namoronan''i Jehovah Andriamanitra ny bibi-dia rehetra sy ny voro-manidina rehetra; dia nentiny tany amin-dralehilahy ireny hahitany izay hanononany azy avy; ary izay rehetra nanononan-dralehilahy ny zava-manan''aina rehetra, dia izany no anarany.'
mg1865::mg_1::2::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nomen-dralehilahy anarana ny biby fiompy rehetra sy ny voro-manidina mbamin''ny bibi-dia rehetra; nefa tsy hita izay vady sahaza ho an-dralehilahy.'
mg1865::mg_1::2::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah Andriamanitra nahasondrian-tory an-dralehilahy, ka dia natory izy; dia naka ny taolan-tehezany anankiray Izy ka nanakombona nofo ho solony.'
mg1865::mg_1::2::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny taolan-tehezana izay nalain''i Jehovah Andriamanitra tamin-dralehilahy dia nataony vehivavy ka nentiny tany amin-dralehilahy.'
mg1865::mg_1::2::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ralehilahy: Ankehitriny dia taolana avy amin''ny taolako sy nofo avy amin''ny nofoko ity; ity dia hatao hoe vehivavy satria lehilahy no nanalana azy.'
mg1865::mg_1::2::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary noho izany ny lehilahy dia handao ny rainy sy ny reniny ka hikambana amin''ny vadiny; dia ho nofo iray ihany ireo.'
mg1865::mg_1::2::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 2
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nitanjaka izy mivady, dia ralehilahy sy ny vadiny, nefa tsy nahalala henatra izy.'
mg1865::mg_1::3::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nanotan''i Adama sy Eva, sy izay nataon''Andriamanitra taminy'
  verse_text: 'Ary ny menarana dia fetsy noho ny bibi-dia rehetra izay nataon''i Jehovah Andriamanitra. Ary hoy izy tamin-dravehivavy: Hanky! efa nataon''Andriamanitra hoe: Aza ihinananareo ny hazo rehetra amin''ny saha?'
mg1865::mg_1::3::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy ravehivavy tamin''ny menarana: Ny voan''ny hazo eo amin''ny saha dia azonay ihinanana ihany;'
mg1865::mg_1::3::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa ny voan''ny hazo eo afovoan''ny saha kosa no efa nataon''Andriamanitra hoe: Aza hihinanareo na tendrenareo izany, fandrao maty ianareo.'
mg1865::mg_1::3::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny menarana tamin-dravehivavy: Tsy ho faty tsy akory ianareo;'
mg1865::mg_1::3::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa fantatr''Andriamanitra fa amin''izay andro hihinananareo azy dia hahiratra ny masonareo, ka ho tahaka an''Andriamanitra ianareo, hahalala ny tsara sy ny ratsy.'
mg1865::mg_1::3::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan-dravehivavy fa tsara ho fihinana ny hazo sady mahafinaritra ny maso ary hazo mahatsiriritra hampahahendry, dia nanotazany ny voany ka nihinanany; ary nomeny koa ny vadiny; ka dia nihinana izy.'
mg1865::mg_1::3::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nahiratra ny mason''izy mivady, ka fantany fa mitanjaka izy; ary nanjaitra ravin''aviavy izy, ka nataony sikina ho azy.'
mg1865::mg_1::3::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nandre an''i Jehovah Andriamanitra nitsangantsangana teo amin''ny saha izy, rehefa ho hariva ny andro; ary ralehilahy sy ny vadiny niery ny tavan''i Jehovah Andriamanitra tao anaty hazo tao amin''ny saha.'
mg1865::mg_1::3::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah Andriamanitra dia niantso an-dralehilahy ka nanao taminy hoe: Aiza moa ianao?'
mg1865::mg_1::3::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Nandre Anao tao amin''ny saha aho; dia natahotra aho, satria mitanjaka, ka dia niery.'
mg1865::mg_1::3::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy: Iza moa no nanambara taminao fa mitanjaka ianao? Efa nihinanao va ny hazo izay nandrarako anao tsy hihinananao?'
mg1865::mg_1::3::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ralehilahy: Ny vehivavy izay nomenao ho namako, izy no nanome ahy ny voankazo, ka dia nihinana aho.'
mg1865::mg_1::3::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah Andriamanitra tamin-dravehivavy: Inona izao nataonao izao? Dia hoy ravehivavy: Ny menarana no namitaka ahy, ka dia nihinana aho.'
mg1865::mg_1::3::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah Andriamanitra tamin''ny menarana: Satria nanao izany ianao, koa amin''ny biby fiompy rehetra sy ny bibi-dia rehetra dia ianao no voaozona: ny kibonao no handehananao, ary vovo-tany no hohaninao amin''ny andro rehetra hiainanao.'
mg1865::mg_1::3::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hampifandrafesiko ianao sy ny vehivavy ary ny taranakao sy ny taranany: izy hanorotoro ny lohanao, ary ianao kosa hanorotoro ny ombelahin-tongony.'
mg1865::mg_1::3::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa Izy tamin-dravehivavy: Hahabe dia hahabe ny fahorianao Aho, indrindra fa raha manan''anaka ianao; ary fahoriana no hiterahanao zanaka; ary ny vadinao no hianteheran''ny fanirianao, ka izy no hanapaka anao.'
mg1865::mg_1::3::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa Izy tamin''i Adama: Satria efa nihaino ny feon''ny vadinao ianao, ka nihinananao ny hazo, izay nandrarako anao hoe: Aza ihinananao izany, dia voaozona ny tany noho izay nataonao; fahoriana no hihinanao ny vokany amin''ny andro rehetra hiainanao.'
mg1865::mg_1::3::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary haniry tsilo sy hery ho anao izy; ary hohaninao ny anana famboly.'
mg1865::mg_1::3::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny fahatsembohan''ny tavanao no hahazoanao hanina mandra-piverinao any amin''ny tany; fa ny tany no nanalana anao; fa vovoka ianao, ary hiverina ho amin''ny vovoka indray ianao.'
mg1865::mg_1::3::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ralehilahy nanao ny anaran''ny vadiny hoe Eva, satria izy no renin''ny olombelona rehetra.'
mg1865::mg_1::3::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah Andriamanitra nanao akanjo hoditra ho an''i Adama sy ny vadiny ka nampiakanjo azy.'
mg1865::mg_1::3::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah Andriamanitra: Indro, ny olona efa tonga tahaka ny anankiray amintsika ka hahalala ny tsara sy ny ratsy; ary ankehitriny, andrao haninjitra ny tanany izy ka hakany koa ny hazon''aina, ary hohaniny, ka ho velona mandrakizay izy;'
mg1865::mg_1::3::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka dia nesorin''i Jehovah Andriamanitra tamin''ny saha Edena izy hiasa ny tany izay nanalana azy.'
mg1865::mg_1::3::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 3
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Eny, noroahiny ny olona; ary nampitoeriny tany atsinanan''ny saha Edena ny kerobima sy ny lelafon''ny sabatra mihebiheby hiambina ny lalana mankany amin''ny hazon''aina.'
mg1865::mg_1::4::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny amin''i Kaina sy Abela'
  verse_text: 'Ary Adama nahalala an''i Eva vadiny; dia nanan''anaka Eva ka niteraka an''i Kaina, ary hoy izy: Efa nahazo zazalahy tamin''i Jehovah aho.'
mg1865::mg_1::4::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niteraka an''i Abela rahalahiny koa izy. Ary Abela dia mpiandry ondry, fa Kaina kosa mpiasa tany.'
mg1865::mg_1::4::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka elaela, dia nitondran''i Kaina ny vokatry ny tany ho fanatitra ho an''i Jehovah;'
mg1865::mg_1::4::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa nitondran''i Abela kosa ny voalohan-terak''ondriny, dia izay matavy. Ary Jehovah nankasitraka an''i Abela mbamin''ny fanatiny;'
mg1865::mg_1::4::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa Kaina mbamin''ny fanatiny kosa tsy mba nankasitrahany. Dia tezitra indrindra Kaina, sady nanjombona ny tarehiny.'
mg1865::mg_1::4::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah tamin''i Kaina: Nahoana no tezitra ianao? Ary nahoana no manjombona ny tarehinao?'
mg1865::mg_1::4::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha tsara toetra ianao, moa tsy ho miramirana va? Fa raha tsy tsara toetra kosa ianao, dia mamitsaka eo am-baravarana ny ota; ary ianao no kendren''ny faniriany, kanefa ianao no tokony hanapaka azy.'
mg1865::mg_1::4::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Kaina niteny tamin''i Abela rahalahiny; ary nony tany an-tsaha izy mirahalahy, dia nitsangana Kaina nanatona an''i Abela rahalahiny, ka namono azy.'
mg1865::mg_1::4::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah tamin''i Kaina: Aiza Abela rahalahinao? Fa hoy izy: Asa; moa mpitandrina ny rahalahiko va aho?'
mg1865::mg_1::4::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy: Inona no nataonao? Ny feon''ny ran''ny rahalahinao mitaraina amiko avy amin''ny tany.'
mg1865::mg_1::4::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ankehitriny dia voaozona ianao hiala amin''ny tany onenana, izay nivava hitelina ny ran''ny rahalahinao nalatsaky ny tananao.'
mg1865::mg_1::4::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha miasa ny tany ianao, tsy mba hahavokatra ho anao intsony izy; ho mpanjenjena sy mpirenireny eny ambonin''ny tany ianao.'
mg1865::mg_1::4::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Kaina tamin''i Jehovah: Lehibe ny valin''ny heloko mihoatra noho izay zakako.'
mg1865::mg_1::4::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Indro, efa noroahinao hiala amin''ny tany onenana aho androany; dia hiery ny tavanao aho ary ho mpanjenjena sy mpirenireny eny ambonin''ny tany; koa na iza na iza hahita ahy dia hamono ahy.'
mg1865::mg_1::4::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah taminy: Noho izany na iza na iza hamono an''i Kaina, dia hovaliana fito eny izy. Ary Jehovah nanao famantarana ho an''i Kaina; mba tsy hisy hamono azy izay rehetra hahita azy.'
mg1865::mg_1::4::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Kaina dia niala teo anatrehan''i Jehovah ka nonina tao amin''ny tany Noda tandrifin''i Edena.'
mg1865::mg_1::4::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 17
  verse_date_revised: null
  verse_title: 'Ny taranak''i Kaina, sy ny nahaterahan''i Seta'
  verse_text: 'Ary Kaina nahalala ny vadiny, dia nanan''anaka ravehivavy ka niteraka an''i Enoka; ary nanorina vohitra Kaina, ka ny anaran''ny vohitra dia nataony hoe Enoka, araka ny anaran''ny zananilahy.'
mg1865::mg_1::4::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Enoka niteraka an''Irada; ary Irada niteraka an''i Mehojaela; ary Mehojaela niteraka an''i Metosaela; ary Metosaela niteraka an''i Lameka.'
mg1865::mg_1::4::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Lameka nampirafy roa: ny anaran''ny anankiray Ada, ary ny anaran''ny anankiray Zila.'
mg1865::mg_1::4::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Ada niteraka an''i Jabala; izy no rain''ny mpitoetra an-day, mpiandry omby aman''ondry.'
mg1865::mg_1::4::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''ny rahalahiny dia Jobala; izy no rain''ny mpitendry lokanga sy mpitsoka sodina rehetra.'
mg1865::mg_1::4::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Zila kosa niteraka an''i Tobala-kaina, mpanefy fiasana maranitra, na varahina na vy; ary ny anabavin''i Tobala-kaina dia Nama.'
mg1865::mg_1::4::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Lameka tamin''ny vadiny: Ry Ada sy Zila o, mihainoa ny feoko; Ry vadin''i Lameka, mitandrema ny teniko: Efa namono lehilahy aho noho ny feriko, Ary tovolahy noho ny faharatrako.'
mg1865::mg_1::4::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha valiana fito heny izay mamono an''i Kaina, Dia fito amby fito-polo heny kosa izay mamono an''i Lameka.'
mg1865::mg_1::4::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Adama nahalala ny vadiny indray, ka dia niteraka zazalahy ravehivavy; ary ny anarany nataony hoe Seta; fa Andriamanitra, hoy izy, efa nanome ahy zanaka anankiray koa ho solon''i Abela, satria novonoin''i Kaina izy.'
mg1865::mg_1::4::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 4
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Seta koa niteraka zazalahy; ary ny anarany nataony hoe Enosy. Tamin''izany vao niantso ny anaran''i Jehovah ny olona.'
mg1865::mg_1::5::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny taranak''i Adama tamin''i Seta ka hatramin''i Noa'
  verse_text: 'Ity no boky milaza ny taranak''i Adama: Tamin''ny andro namoronan''Andriamanitra ny olona dia tahaka ny tarehin''Andriamanitra no nanaovany azy;'
mg1865::mg_1::5::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'lahy sy vavy no namoronany azy; dia nitahy azy Izy ka nanao ny anarany hoe Adama tamin''ny andro namoronany azy.'
mg1865::mg_1::5::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa telo-polo amby zato taona ny andro niainan''i Adama, dia niteraka tahaka ny tarehiny, araka ny endriny izy; ary ny anarany nataony hoe Seta.'
mg1865::mg_1::5::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andron''i Adama taorian''ny niterahany an''i Seta dia valon-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::5::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro rehetra niainan''i Adama dia telo-polo amby sivin-jato taona; dia maty izy.'
mg1865::mg_1::5::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa dimy amby zato taona ny andro niainan''i Seta, dia niteraka an''i Enosy izy.'
mg1865::mg_1::5::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Seta taorian''ny niterahany an''i Enosy dia fito amby valon-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::5::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro rehetra niainan''i Seta dia roa ambin''ny folo amby sivin-jato taona; dia maty izy;'
mg1865::mg_1::5::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa sivi-folo taona ny andro niainan''i Enosy, dia niteraka an''i Kenana izy.'
mg1865::mg_1::5::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Enosy taorian''ny niterahany an''i Kenana dia dimy ambin''ny folo amby valon-jato taona; ary niteraka zazalahy sy zazavavy izy;'
mg1865::mg_1::5::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro rehetra niainan''i Enosy dia dimy amby sivin-jato taona; dia maty izy.'
mg1865::mg_1::5::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa fito-polo taona ny andro niainan''i Kenana, dia niteraka an''i Mahalalila izy.'
mg1865::mg_1::5::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Kenana taorian''ny niterahany an''i Mahalalila dia efa-polo amby valon-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::5::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro rehetra niainan''i Kenana dia folo amby sivin-jato taona; dia maty izy.'
mg1865::mg_1::5::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa dimy amby enim-polo taona ny andro niainan''i Mahalalila, dia niteraka an''i Jareda izy.'
mg1865::mg_1::5::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Mahalalila taorian''ny niterahany an''i Jareda dia telo-polo amby valon-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::5::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro rehetra niainan''i Mahalalila dia dimy amby sivi-folo amby valon-jato taona; dia maty izy.'
mg1865::mg_1::5::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 18
  verse_date_revised: '2022-05-26T06:49:26+0000'
  verse_title: null
  verse_text: 'Ary rehefa roa amby enim-polo amby zato taona ny andro niainan''i Jareda dia niteraka an''i Enoka izy.'
mg1865::mg_1::5::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Jareda taorian''ny niterahany an''i Enoka dia valon-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::5::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro rehetra niainan''i Jareda dia roa amby enim-polo amby sivin-jato taona; dia maty izy.'
mg1865::mg_1::5::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa dimy amby enim-polo taona ny andro niainan''i Enoka, dia niteraka an''i Metosela izy.'
mg1865::mg_1::5::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niara-nandeha tamin''Andriamanitra telon-jato taona Enoka taorian''ny niterahany an''i Metosela; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::5::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro rehetra niainan''i Enoka dia dimy amby enim-polo amby telon-jato taona.'
mg1865::mg_1::5::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niara-nandeha tamin''Andriamanitra Enoka; ka tsy hita izy, fa nentin''Andriamanitra.'
mg1865::mg_1::5::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa fito amby valo-polo amby zato taona ny andro niainan''i Metosela, dia niteraka an''i Lameka izy.'
mg1865::mg_1::5::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Metosela taorian''ny niterahany an''i Lameka dia roa amby valo-polo amby fiton-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::5::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro rehetra niainan''i Metosela dia sivy amby enim-polo amby sivin-jato taona; dia maty izy.'
mg1865::mg_1::5::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa roa amby valo-polo amby zato taona ny andro niainan''i Lameka, dia niteraka zazalahy izy;'
mg1865::mg_1::5::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny anarany nataony hoe Noa, fa hoy izy: Ity no hampionona antsika amin''ny asantsika sy ny fisasaran''ny tanantsika noho ny tany izay voaozon''i Jehovah.'
mg1865::mg_1::5::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Lameka taorian''ny niterahany an''i Noa dia dimy amby sivi-folo amby diman-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::5::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro rehetra niainan''i Lameka dia fito amby fito-polo amby fiton-jato taona; dia maty izy.'
mg1865::mg_1::5::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 5
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa diman-jato taona Noa, dia niteraka an''i Sema sy Hama ary Jafeta izy.'
mg1865::mg_1::6::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Noa sy ny Safo-drano'
  verse_text: 'Ary raha vao nihamaro ny olona tambonin''ny tany ka teraka zazavavy maro,'
mg1865::mg_1::6::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia hitan''ny zanak''Andriamanitra fa tsara tarehy ny zanakavavin''ny olona; ka dia nifidy vady ho azy tamin''izy rehetra araka izay tiany izy.'
mg1865::mg_1::6::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah: Tsy mba hanapaka mandrakariva ao amin''ny olona ny Fanahiko, fa amin''ny faniavany dia nofo izy; nefa ho roa-polo amby zato taona ny androny.'
mg1865::mg_1::6::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny Nefilima nitoetra tambonin''ny tany tamin''izany andro izany, sy taorian''izany koa, raha nivady tamin''ny zanakavavin''ny olona ny zanak''Andriamanitra, ka niterahany; ireo no ilay olo-mahery hatrizay ela izay, dia ny lehilahy nanan-daza.'
mg1865::mg_1::6::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan''i Jehovah fa be ny faharatsian''ny olona tambonin''ny tany, ka izay fisainana rehetra avy amin''ny fony dia ratsy ihany mandritra ny andro.'
mg1865::mg_1::6::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah nanenina noho ny nanaovany ny olona tambonin''ny tany, ka nalahelo ny fony.'
mg1865::mg_1::6::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Jehovah: Haringako tsy hisy ambonin''ny tany ny olona izay noforoniko, hatramin''ny olona ka hatramin''ny biby fiompy sy ny biby mandady na mikisaka mbamin''ny voro-manidina; fa manenina Aho noho ny nanaovako azy.'
mg1865::mg_1::6::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Noa kosa nahita fitia teo imason''i Jehovah.'
mg1865::mg_1::6::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no tantaran''i Noa: Noa dia lehilahy marina sady tsy nisy tsiny teo amin''ny olona niara-belona taminy; eny, niara-nandeha tamin''Andriamanitra Noa.'
mg1865::mg_1::6::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Noa niteraka zanaka telo mirahalahy, dia Sema sy Hama ary Jafeta.'
mg1865::mg_1::6::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary simba ny tany teo anatrehan''Andriamanitra sady heni-doza;'
mg1865::mg_1::6::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia hitan''Andriamanitra ny tany, ka, indro, efa simba izy; fa ny nofo rehetra samy efa nanimba ny lalany avy tambonin''ny tany.'
mg1865::mg_1::6::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Andriamanitra tamin''i Noa: Ny faran''ny nofo rehetra efa mby eto anatrehako, satria efa heni-doza ny tany noho ny amin''olona, ka, indro, efa handringana azy mbamin''ny tany Aho.'
mg1865::mg_1::6::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa manaova sambo-fiara ho anao amin''ny hazo gofera; ary hasianao efitrefitra ny sambo-fiara, ka hopetahanao dity ao anatiny sy eo ivelany izy.'
mg1865::mg_1::6::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary toy izao no hanaovanao azy: hakiho telon-jato ny lavan''ny sambo-fiara, hakiho dimam-polo ny sakany, ary hakiho telo-polo ny hahavony.'
mg1865::mg_1::6::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hasianao fidiran''ny mazava ny sambo-fiara, ary amin''ny hakiho iray no hahavitanao azy hatreo ambony; ary hasianao varavarana ny rindrin''ny sambo-fiara ; hataonao efitra telo mifanongoa izy.'
mg1865::mg_1::6::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary, indro, Izaho efa hahatonga ny safo-drano ambonin''ny tany handringana ny nofo rehetra izay manam-pofonaina ambanin''ny lanitra; dia ho faty izay rehetra eo amin''ny tany.'
mg1865::mg_1::6::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa kosa haoriko ny fanekeko aminao; ary hiditra ao anatin''ny sambo-fiara ianao sy ny vadinao aman-janakao mbamin''ny vinantonao vavy miaraka aminao.'
mg1865::mg_1::6::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zava-manan''aina rehetra, dia ny nofo rehetra, hitondranao roa avy isan-karazany ho ao anatin''ny sambo-fiara, hovelomina miaraka aminao; ho lahy sy vavy avy ireo.'
mg1865::mg_1::6::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny vorona, samy araka ny karazany avy; ary ny biby, samy araka ny karazany avy, ary ny biby rehetra izay mandady na mikisaka amin''ny tany, samy araka ny karazany avy, dia, roa avy samy araka ny karazany avy, dia roa avy isan-karazany no hankeo aminao hovelomina.'
mg1865::mg_1::6::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary analao ho anao ny zavatra rehetra izay mety ho fihinana, ka angony ho eo aminao; dia ho fihinana ho anao sy ho an''ireo koa izany.'
mg1865::mg_1::6::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 6
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nataon''i Noa izany; araka izay rehetra nandidian''Andriamanitra azy no nataony.'
mg1865::mg_1::7::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah tamin''i Noa: Midira ao anatin''ny sambo-fiara ianao mbamin''ny ankohonanao rehetra, satria ianao no hitako fa marina eo anatrehako amin''izao olona miara-belona aminao izao.'
mg1865::mg_1::7::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny biby madio rehetra isan-karazany dia hanalanao ho ao aminao fito avy, lahy sy vavy; ary ny biby tsy madio isan-karazany roa avy, lahy sy vavy;'
mg1865::mg_1::7::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny voro-manidina koa isan-karazany fito avy, lahy sy vavy: mba tsy ho lany taranaka ambonin''ny tany rehetra ireny.'
mg1865::mg_1::7::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa raha afaka hafitoana, Izaho handatsaka ranonorana ambonin''ny tany efa-polo andro sy efa-polo alina; ary ny zavatra velona rehetra izay, nataoko dia haringako tsy ho ambonin''ny tany.'
mg1865::mg_1::7::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Noa nanao araka izay rehetra nandidian''i Jehovah azy.'
mg1865::mg_1::7::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary efa enin-jato taona Noa, raha tonga tambonin''ny tany ny safo-drano.'
mg1865::mg_1::7::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Noa sy ny vadiny aman-janany, mbamin''ny vinantoni-vavy niaraka taminy dia niditra tao anatin''ny sambo-fiara mba tsy ho tratry ny safo-drano.'
mg1865::mg_1::7::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny biby madio sy ny biby izay tsy madio sy ny vorona mbamin''izay rehetra mandady na mikisaka amin''ny tany,'
mg1865::mg_1::7::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia nisy niditra tsiroaroa ho ao amin''i Noa tao anatin''ny sambo-fiara, dia lahy sy vavy, araka izay nandidian''Andriamanitra an''i Noa.'
mg1865::mg_1::7::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka hafitoana, dia tonga tambonin''ny tany ny safo-drano.'
mg1865::mg_1::7::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tamin''ny andro fahafito ambin''ny folo tamin''ny volana faharoa tamin''ny fahenin-jato taona niainan''i Noa, tamin''izany andro izany dia nipoitra ny loharano rehetra amin''ny lalina lehibe, ary nivoha ny varavaran''ny lanitra.'
mg1865::mg_1::7::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nisy ranonorana nivatravatra tamin''ny tany efa-polo andro sy efa-polo alina.'
mg1865::mg_1::7::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Androtrizay indrindra dia efa tafiditra tao anatin''ny sambo-fiara Noa, sy Sema sy Hama ary Jafeta, zanakalahin''i Noa, mbamin''ny vadin''i Noa, ary ny vinantony telo vavy niaraka taminy;'
mg1865::mg_1::7::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia izy ireo sy ny bibi-dia rehetra; samy araka ny karazany avy, sy ny biby fiompy rehetra, samy araka ny karazany avy, ary ny biby rehetra izay mandady na mikisaka amin''ny tany, samy araka ny karazany avy, ary ny vorona rehetra, samy araka ny karazany avy. dia ny voronkely sy ny manana elatra rehetra.'
mg1865::mg_1::7::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niditra tao amin''i Noa tao anatin''ny sambo-fiara ireo, dia tsiroaroa avy tamin''ny nofo rehetra izay manam-pofonaina.'
mg1865::mg_1::7::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izay niditra tao dia lahy sy vavy, avy tamin''ny nofo rehetra, araka izay nandidian''Andriamanitra an''i Noa; ary narindrin''i Jehovah tao izy.'
mg1865::mg_1::7::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary naharitra efa-polo andro tambonin''ny tany ny safo-drano, dia tonga betsaka ny rano ka nanainga ny sambo-fiara, dia nitsinkafona ho afaka amin''ny tany izy.'
mg1865::mg_1::7::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nahery ny rano ka tonga betsaka indrindra tambonin''ny tany; dia nandeha teny ambonin''ny rano ny sambo-fiara.'
mg1865::mg_1::7::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nahery dia nahery indrindra ny rano teny ambonin''ny tany, ka voasarona ny tendrombohitra avo rehetra izay tambanin''ny lanitra rehetra.'
mg1865::mg_1::7::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dimy ambin''ny folo hakiho no nihoaran''ny rano, ka voasarona ny tendrombohitra.'
mg1865::mg_1::7::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia maty ny nofo rehetra izay nihetsiketsika tambonin''ny tany, dia ny vorona sy ny biby fiompy sy ny bibi-dia sy ny biby rehetra izay mandady na mikisaka amin''ny tany ary ny olona rehetra.'
mg1865::mg_1::7::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izay rehetra nanam-pofonaina teo am-bavorony, avy tamin''izay rehetra teo amin''ny tany maina, dia maty avokoa.'
mg1865::mg_1::7::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary naringana ny zavatra velona rehetra izay tambonin''ny tany, hatramin''ny olona ka hatramin''ny biby fiompy sy ny zava-mandady na mikisaka ary ny voro-manidina; dia naringana tsy ho amin''ny tany ireny; ary Noa sy izay niara-nitoetra taminy tao anatin''ny sambo-fiara ihany no sisa velona.'
mg1865::mg_1::7::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 7
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nahery tambonin''ny tany dimam-polo amby zato andro ny rano.'
mg1865::mg_1::8::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nahatsiaro an''i Noa mbamin''ny bibi-dia rehetra ary ny biby fiompy rehetra, izay niara-nitoetra taminy tao anatin''ny sambo-fiara; ary Andriamanitra nampandeha rivotra eran''ny tany, ka dia nihena ny rano.'
mg1865::mg_1::8::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tampina ny loharanon''ny lalina sy ny varavaran''ny lanitra, ka nitsahatra ilay ranonorana nivatravatra avy tany an-danitra.'
mg1865::mg_1::8::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nihena niandalana niala tamin''ny tany ny rano; ary rehefa afaka dimam-polo amby zato andro, dia efa nihena ny rano.'
mg1865::mg_1::8::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nipetraka teo amin''ny tendrombohitra any Ararata ny sambo-fiara tamin''ny andro fahafito ambin''ny folo tamin''ny volana fahafito.'
mg1865::mg_1::8::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny rano dia mbola nihena niandalana hatramin''ny volana fahafolo; tamin''ny andro voalohany tamin''ny volana fahafolo dia niseho ny tampon''ny tendrombohitra.'
mg1865::mg_1::8::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka efa-polo andro, dia novohan''i Noa ny varavarankelin''ny sambo-fiara izay efa nataony.'
mg1865::mg_1::8::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namoaka goaika anankiray izy, ary niverimberina mandra-paharitry ny rano tamin''ny tany iny.'
mg1865::mg_1::8::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namoaka voromailala anankiray izay teo aminy izy, hizahany na efa kely ny rano tambonin''ny tany, na tsia.'
mg1865::mg_1::8::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa tsy hitan''ilay voromailala izay hipetrahan''ny faladiany, dia niverina tamin''i Noa tao anatin''ny sambo-fiara izy, satria mbola nisy rano tambonin''ny tany rehetra; ary Noa naninjitra ny tanany ka nandray sy nampiditra azy ho ao aminy tao anatin''ny sambo-fiara.'
mg1865::mg_1::8::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary mbola niandry hafitoana koa izy; dia namoaka ilay voromailala tamin''ny sambo-fiara indray izy.'
mg1865::mg_1::8::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niditra teo aminy ilay voromailala nony hariva ny andro; ary, indro, nisy ravin''oliva maitso teo am-bavany; izany no nahafantaran''i Noa fa efa kely ny rano tambonin''ny tany.'
mg1865::mg_1::8::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary mbola niandry hafitoana indray izy, dia namoaka ilay voromailala; ary tsy niverina teo aminy intsony iny.'
mg1865::mg_1::8::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 13
  verse_date_revised: null
  verse_title: 'Ny nivoahan''i Noa avy tao amin''ny sambo-fiara sy ny nanaovan''Andriamanitra fanekena taminy.'
  verse_text: 'Ary tamin''ny andro voalohany tamin''ny volana voalohany tamin''ny taona fahiraika amby enin-jato, dia ritra ny rano teo ambonin''ny tany; ary nanaisotra ny tafon''ny sambo-fiara Noa ka nijery, ary, indro, efa maina ny tany.'
mg1865::mg_1::8::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''ny andro fahafito amby roa-polo tamin''ny volana faharoa, dia maina ny tany.'
mg1865::mg_1::8::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra dia niteny tamin''i Noa ka nanao hoe:'
mg1865::mg_1::8::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mivoaha amin''ny sambo-fiara ianao sy ny vadinao aman-janakao ary ny vinantonao vavy miaraka aminao.'
mg1865::mg_1::8::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zava-manan''aina rehetra, izay eo aminao, avy tamin''ny nofo rehetra, dia ny vorona sy ny biby fiompy sy ny biby rehetra izay mandady na mikisaka amin''ny tany, dia ento mivoaka miaraka aminao; ary aoka hiteraka be eny ambonin''ny tany sy ho maro anaka ary hihabetsaka eny ambonin''ny tany ireny.'
mg1865::mg_1::8::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 18
  verse_date_revised: null
  verse_title: 'Ny nataon''izy telo mirahalahy, zanak''i Noa, sy ny teny naminanian-drainy azy'
  verse_text: 'Dia nivoaka Noa mbamin''ny vadiny aman-janany ary ny vinantonivavy niaraka taminy;'
mg1865::mg_1::8::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny zava-manan''aina rehetra sy ny biby rehetra izay mandady na mikisaka ary ny vorona rehetra mbamin''izay rehetra mihetsiketsika eny ambonin''ny tany dia samy nivoaka avy tao amin''ny sambo-fiara araka ny karazany.'
mg1865::mg_1::8::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Noa dia nanorina alitara ho an''i Jehovah; ary ny biby madio rehetra sy ny vorona madio rehetra dia nanalany ka nataony fanatitra odorana teo ambonin''ny alitara.'
mg1865::mg_1::8::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandre ny hanitra ankasitrahana Jehovah, ka hoy Izy tam-pony: Tsy mba hanozona ny tany intsony noho ny amin''ny olona Aho; fa ny fisainan''ny fon''ny olona dia ratsy hatramin''ny fahazazany; ary tsy mba handringana ny velona rehetra intsony Aho tahaka izay nataoko.'
mg1865::mg_1::8::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 8
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha mbola maharitra koa ny tany, dia tsy hanam-pitsaharana ny taom-pamafazana sy ny taom-pijinjana, ary ny hatsiaka sy ny hafanana ary ny fahavaratra sy ny ririnina, ary ny andro sy ny alina.'
mg1865::mg_1::9::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nitso-drano an''i Noa sy ny zanany hoe; Maroa fara sy mihabetsaha ary mamenoa ny tany.'
mg1865::mg_1::9::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny tahotra sy horohoro anareo hahazo ny bibi-dia rehetra sy ny voro-manidina rehetra; ireny mbamin''izay rehetra mandady na mikisaka amin''ny tany sy ny hazandrano rehetra ao amin''ny ranomasina dia efa natolotra eo an-tananareo.'
mg1865::mg_1::9::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny biby mihetsiketsika rehetra izay miaina dia ho fihinana ho anareo; dia efa nomeko anareo toy ny zava-maitso izy rehetra.'
mg1865::mg_1::9::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Kanefa ny nofo izay mbola misy aina dia ny ràny no aza haninareo.'
mg1865::mg_1::9::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ny ranareo kosa dia hadiniko, satria ainareo izany; eo amin''ny tanan''ny manan''aina rehetra no hanadinako azy; ary eo amin''ny tanan''ny olona, dia eo amin''ny tanan''ny olona avy, no hanadinako ny ain''ny olona.'
mg1865::mg_1::9::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izay mandatsaka ny ran''olona, dia mba halatsak''olona kosa ny ràny, satria tahaka ny endrik''Andriamanitra no nanaovany ny olona.'
mg1865::mg_1::9::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ny aminareo, dia maroa fara sy mihabetsaha; miteraha be eny ambonin''ny tany sy mihabetsaha eny.'
mg1865::mg_1::9::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra niteny tamin''i Noa sy tamin''ny zanany, izay niaraka taminy, ka nanao hoe:'
mg1865::mg_1::9::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Indro, Izaho efa manorina ny fanekeko aminareo sy amin''ny taranakareo mandimby anareo'
mg1865::mg_1::9::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy amin''ny zava-manan''aina rehetra eo aminareo, na ny vorona, na ny biby fiompy, na ny bibi-dia rehetra eo aminareo: izay rehetra nivoaka avy tao anatin''ny sambo-fiara, dia ny biby samy hafa rehetra.'
mg1865::mg_1::9::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia aoriko ny fanekeko aminareo, ka tsy haringako amin''ny safo-drano intsony ny nofo rehetra, ary tsy hisy safo-drano hanimba ny tany intsony.'
mg1865::mg_1::9::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Andriamanitra: Izao no famantarana ny fanekena izay ataoko ho amiko sy ho aminareo mbamin''ny zava-manan''aina rehetra eo aminareo hatramin''ny taranaka fara mandimby:'
mg1865::mg_1::9::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny avako efa napetrako eo amin''ny rahona ho famantarana ny fanekena ho amiko sy ho amin''ny tany.'
mg1865::mg_1::9::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha mampiangona rahona eo ambonin''ny tany Aho, ka hita eo amin''ny rahona ny avana,'
mg1865::mg_1::9::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia hotsarovako ny fanekeko izay ho amiko sy ho aminareo mbamin''ny zava-manan''aina, dia ny nofo rehetra; ary tsy hisy safo-drano, handringana ny nofo rehetra intsony.'
mg1865::mg_1::9::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ho eo amin''ny rahona ny avana; ary hitsinjo azy Aho hahatsiarovako ny fanekena mandrakizay izay ho amin''Andriamanitra sy ho amin''ny zava-manan''aina rehetra, dia ny nofo rehetra ambonin''ny tany.'
mg1865::mg_1::9::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Andriamanitra tamin''i Noa: Izany no famantarana ny fanekena izay naoriko ho amiko sy ho amin''ny nofo rehetra ambonin''ny tany.'
mg1865::mg_1::9::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Noa izay nivoaka avy tamin''ny sambo-fiara dia Sema sy Hama ary Jafeta; ary i Hama no rain''i Kanana.'
mg1865::mg_1::9::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo telo lahy ireo no zanak''i Noa; ary avy tamin''ireo no nielezan''ny olona tambonin''ny tany rehetra.'
mg1865::mg_1::9::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary vao tonga mpiasa tany Noa ka nanao tanim-boaloboka.'
mg1865::mg_1::9::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisotro tamin''ny divay izy ka mamo; dia nanary lamba izy ka nitanjaka tao anatin''ny lainy.'
mg1865::mg_1::9::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan''i Hama, rain''i Kanana ny fitanjahan''ny rainy, dia nambarany tamin''ny rahalahiny roa lahy teo ivelany.'
mg1865::mg_1::9::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nalain''i Sema sy Jafeta ny lamba ka nentin''izy mirahalahy teo an-tsorony, dia nanao dia mianotra izy ka nandrakotra ny fitanjahan''ny rainy; ary ny tavany tsy nanatrika, ka dia tsy hitany ny fitanjahan''ny rainy.'
mg1865::mg_1::9::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nahatsiaro Noa, rehefa afaka ny hamamoany, ka nahafantatra izay efa nataon''ny zanany faralahy taminy.'
mg1865::mg_1::9::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Ho voaozona anie Kanana; Ho tena andevon''ny rahalahiny izy.'
mg1865::mg_1::9::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa izy: Isaorana anie Jehovah, Andriamanitr''i Sema; Ary aoka Kanana ho andevony.'
mg1865::mg_1::9::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Hataon''Andriamanitra malalaka anie Jafeta; Ary aoka honina ao an-dain''i Sema izy; Ary aoka Kanana ho andevony.'
mg1865::mg_1::9::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Noa taorian''ny safo-drano dia dimam-polo amby telon-jato taona.'
mg1865::mg_1::9::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 9
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro rehetra niainan''i Noa dia dimam-polo amby sivin-jato taona; dia maty izy.'
mg1865::mg_1::10::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny taranak''izy telo lahy zanak''i Noa, sy ny nielezany'
  verse_text: 'Ary izao no taranaky ny zanakalahin''i Noa, dia Sema sy Hama ary Jafeta: Samy niteraka zazalahy avy izy taorian''ny safo-drano.'
mg1865::mg_1::10::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny zanakalahin''i Jafeta dia Gomera sy Magoga sy Maday sy Javana sy Tobala sy Maseka ary Tirasa.'
mg1865::mg_1::10::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Gomera dia Askenaza sy Rifata ary Togarma.'
mg1865::mg_1::10::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Javana dia Elisaha sy Tarsisy sy ny Kitima sy ny Dodanita.'
mg1865::mg_1::10::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Avy tamin''ireo no niavakavahan''ny nosin''ny firenena tany amin''ny taniny, dia samy araka ny fiteniny avy, araka ny mpianakaviny avy, tamin''ny fireneny avy.'
mg1865::mg_1::10::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Hama dia Kosy sy Mizraima sy Pota ary Kanana.'
mg1865::mg_1::10::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Kosy dia Seba sy Havila sy Sabta sy Ragama ary Sabteka; ary ny zanakalahin''i Ragama dia Seba sy Dedana.'
mg1865::mg_1::10::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Kosy niteraka an''i Nimroda; izy no voalohany izay tonga olona mahery tambonin''ny tany.'
mg1865::mg_1::10::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izy dia mpihaza mahery teo anatrehan''i Jehovah, ka izany no nanaovan''ny olona hoe: Tahaka an''i Nimroda, mpihaza mahery eo anatrehan''i Jehovah.'
mg1865::mg_1::10::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny niandohan''ny fanjakany dia Babela sy Ereka sy Akada ary Kalne tany amin''ny tany Sinara.'
mg1865::mg_1::10::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nivoaka avy tamin''izany tany izany izy ka nankany Asyria, dia nanorina an''i Ninive mbamin''i Rehobot-ira sy Kala'
mg1865::mg_1::10::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary Resena teo anelanelan''i Ninive sy Kala, dia ilay tanàna lehibe izany.'
mg1865::mg_1::10::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Mizraima niteraka ny Lodita sy ny Anamita sy ny Lehabita sy ny Naftohita'
mg1865::mg_1::10::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy ny Patrosita sy ny Kaslohita izay nihavian''ny Filistina ary ny Kaftorita.'
mg1865::mg_1::10::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Kanana niteraka an''i Sidona lahimatoany sy Heta,'
mg1865::mg_1::10::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny Jebosita, sy ny Amorita sy ny Girgasita'
mg1865::mg_1::10::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy ny Hivita sy ny Arkita sy ny Sinita'
mg1865::mg_1::10::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy ny Arvadita sy ny Zemarita ary ny Hamatita; ary nony taoriana dia niely ny firenen''ny Kananita.'
mg1865::mg_1::10::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny faritanin''ny Kananita dia hatrany Sidona ka hatrany Gaza ao akaikin''i Gerara, ka hatrany Lesa ao akaikin''i Sodoma sy Gomora sy Adma ary Zeboima.'
mg1865::mg_1::10::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo no zanak''i Hama, araka ny mpianakaviny, araka ny fiteniny, amin''ny taniny, amin''ny fireneny.'
mg1865::mg_1::10::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niteraka koa Sema, rain''ny zanak''i Ebera rehetra rahalahin''i Jafeta, izay zokiny.'
mg1865::mg_1::10::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny zanakalahin''i Sema dia Elama sy Asyra sy Arpaksada sy Loda ary Arama.'
mg1865::mg_1::10::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Arama dia Oza sy Hola sy Gatera ary Masy.'
mg1865::mg_1::10::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Arpaksada niteraka an''i Sela; ary Sela niteraka an''i Ebera.'
mg1865::mg_1::10::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Ebera niteraka roa lahy: ny anaran''ny iray natao hoe Palega, satria tamin''ny androny no nizarana ny tany; ary Joktana no anaran''ny rahalahiny.'
mg1865::mg_1::10::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Joktana niteraka an''i Almodada sy Salefa sy Hazarmaveta sy Jera'
mg1865::mg_1::10::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Hadorama sy Ozala sy Dikla'
mg1865::mg_1::10::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Obala sy Abimaela sy Sheba'
mg1865::mg_1::10::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Ofira sy Havila ary Jobaba; ireo rehetra ireo no zanakalahin''i Joktana.'
mg1865::mg_1::10::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny fonenan''ireo dia hatrany Mesa ao akaikin''i Sefara, tendrombohitra atsinanana.'
mg1865::mg_1::10::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo no zanak''i Sema, araka ny mpianakaviny, araka ny fiteniny, amin''ny taniny, araka ny fireneny.'
mg1865::mg_1::10::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 10
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo no mpianakavin''ny zanak''i Noa, araka ny taranany, amin''ny fireneny; ary avy tamin''ireo no niavakavahan''ny firenena tambonin''ny tany taorian''ny safo-drano.'
mg1865::mg_1::11::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nanaovan''ny olona ilay tilikambo tao Babela, sy ny nanorokoroan''Andriamanitra ny fitenin''ny olona'
  verse_text: 'Ary ny tany rehetra dia iray fanononana sy iray fiteny.'
mg1865::mg_1::11::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha nifindrafindra niantsinanana ny olona, dia nahita tany lemaka tany amin''ny tany Sinara izy ka nonina teo.'
mg1865::mg_1::11::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niresadresaka hoe izy: Andeha isika hanao biriky ka handotra azy tsara. Ary ny biriky nataony solom-bato, ary ny asfalta nataony solon-drihitra.'
mg1865::mg_1::11::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Andeha isika hanao tanàna sy tilikambo ho antsika, ka ny tampony hahatakatra ny lanitra, dia hanao izay hahazoantsika laza, fandrao hiely eny ambonin''ny tany rehetra isika.'
mg1865::mg_1::11::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nidina Jehovah hizaha ny tanàna sy ny tilikambo, izay nataon''ny zanak''olombelona.'
mg1865::mg_1::11::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah : Indro, iray foko ny olona, sady iray fanononana izy rehetra, ary ity vao fiandohan''ny hataony; koa izao dia tsy hisy azo sakanana na inona na inona izay saintsaininy hatao.'
mg1865::mg_1::11::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 7
  verse_date_revised: '2022-05-04T05:32:21+0000'
  verse_title: null
  verse_text: 'Aoka isika hidina, ka eny no hanorokoroantsika ny fiteniny, mba tsy hifankahalala teny izy.'
mg1865::mg_1::11::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia tao no nampielezan''i Jehovah azy hiala ho eny ambonin''ny tany rehetra; dia nitsahatra tsy nanao ny tanàna intsony izy.'
mg1865::mg_1::11::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa izany no nanaovana ny anarany hoe Babela; fa tao Jehovah no nanorokoro ny fitenin''ny tany rehetra; ary tao no nampielezan''i Jehovah ny olona ho eny ambonin''ny tany rehetra.'
mg1865::mg_1::11::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 10
  verse_date_revised: null
  verse_title: 'Ny taranak''i Sema mandraka mby amin''i Tera, rain''i Abrama'
  verse_text: 'Izao no taranak''i Sema: Rehefa zato taona Sema, dia niteraka an''i Arpaksada izy roa taona taorian''ny safo-drano.'
mg1865::mg_1::11::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Sema taorian''ny niterahany an''i Arpaksada dia diman-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::11::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa dimy amby telo-polo taona ny andro niainan''i Arpaksada, dia niteraka an''i Sela izy.'
mg1865::mg_1::11::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Arpaksada taorian''ny niterahany an''i Sela dia telo amby efa-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::11::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa telo-polo taona ny andro niainan''i Sela, dia niteraka an''i Ebera izy.'
mg1865::mg_1::11::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Sela taorian''ny niterahany an''i Ebera dia telo amby efa-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::11::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa efatra amby telo-polo taona ny andro niainan''i Ebera, dia niteraka an''i Palega izy.'
mg1865::mg_1::11::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Ebera taorian''ny niterahany an''i Palega dia telo-polo amby efa-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::11::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa telo-polo taona ny andro niainan''i Palega, dia niteraka an-dReo izy,'
mg1865::mg_1::11::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Palega taorian''ny niterahany an-dReo dia sivy amby roan-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::11::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 20
  verse_date_revised: '2022-04-26T05:01:20+0000'
  verse_title: null
  verse_text: 'Ary rehefa roa amby telo-polo taona ny andro niainan-dReo, dia niteraka an''i Seroga izy.'
mg1865::mg_1::11::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan-dReo taorian''ny niterahany an''i Seroga dia fito amby roan-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::11::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa telo-polo taona ny andro niainan''i Seroga, dia niteraka an''i Nahora izy,'
mg1865::mg_1::11::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Seroga taorian''ny niterahany an''i Nahora dia roan-jato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::11::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa sivy amby roa-polo taona ny andro niainan''i Nahora, dia niteraka an''i Tera izy.'
mg1865::mg_1::11::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Nahora taorian''ny niterahany an''i Tera dia sivy ambin''ny folo amby zato taona; ary niteraka zazalahy sy zazavavy izy.'
mg1865::mg_1::11::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa fito-polo taona ny andro niainan''i Tera, dia niteraka an''i Abrama sy Nahora ary Harana izy:'
mg1865::mg_1::11::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 27
  verse_date_revised: null
  verse_title: 'Ny taranak''i Tera, sy ny nifindrany nankany Harana'
  verse_text: 'Ary izao no taranak''i Tera: Tera niteraka an''i Abrama sy Nahora ary Harana; ary Harana niteraka an''i Lota.'
mg1865::mg_1::11::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary maty Harana, raha mbola teo anatrehan''i Tera rainy tany amin''ny tany nahaterahany, dia tao Oran''ny Kaldeana.'
mg1865::mg_1::11::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrama sy Nahora dia samy naka vady ho azy: ny anaran''ny vadin''i Abrama dia Saray; ary ny anaran''ny vadin''i Nahora dia Milka, zanakavavin''i Harana, rain''i Milka sy rain''Iska.'
mg1865::mg_1::11::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary momba Saray; tsy nanan-janaka izy.'
mg1865::mg_1::11::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Tera nitondra an''i Abrama zanany sy Lota zafiny, zanak''i Harana, ary Saray vinantoni-vavy, vadin''i Abrama zanany; dia niaraka taminy ireo ka niala tao Oran''ny Kaldeana hankany amin''ny tany Kanana; dia tonga tao Harana izy ka nonina tao.'
mg1865::mg_1::11::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 11
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dimy amby roan-jato taona ny andro niainan''i Tera; dia maty tao Harana izy.'
mg1865::mg_1::12::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 1
  verse_date_revised: '2022-05-05T05:20:44+0000'
  verse_title: 'Ny niantsoan''Andriamanitra an''i Abrama sy ny nivahinianany tany Kanana sy Egypta'
  verse_text: 'Ary hoy Jehovah tamin''i Abrama: Mandehana miala amin''ny taninao sy ny havanao ary ny tranon''ny rainao hankany amin''ny tany izay hasehoko anao;'
mg1865::mg_1::12::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia hahatonga anao ho firenena lehibe Aho sady hitahy anao sy hahalehibe ny anaranao; ary ho fitahiana tokoa ianao;'
mg1865::mg_1::12::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary hitahy izay manisy soa anao Aho, fa hanozona izay manozona anao; ary aminao no hitahiana ny firenena rehetra ambonin''ny tany.'
mg1865::mg_1::12::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha Abrama araka izay efa nolazain''i Jehovah taminy, ary Lota koa mba niaraka taminy. Ary efa dimy amby fito-polo taona Abrama, raha niala tao Harana izy.'
mg1865::mg_1::12::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrama nitondra an''i Saray vadiny sy Lota zana-drahalahiny mbamin''ny fananan''izy rehetra izay efa nohariny sy ny olona izay efa azony tao Harana; dia niainga izy ireo hankany amin''ny tany Kanana, ka tonga tany amin''ny tany Kanana izy.'
mg1865::mg_1::12::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrama dia nitety ny tany hatrany Sekema, dia tao an-kazo terebintan''i More. Ary ny Kananita no tompon-tany tany Kanana fahizay.'
mg1865::mg_1::12::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah niseho tamin''i Abrama ka nanao hoe: Ny taranakao no homeko ity tany ity. Dia nanorina alitara teo izy ho an''i Jehovah Izay niseho taminy.'
mg1865::mg_1::12::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nifindra niala teo izy hankany amin''ny tendrombohitra atsinanan''i Betela ka nanorina ny lainy teo anelanelan''i Betela tao andrefany sy Ay tao atsinanany; dia nanorina alitara teo koa ho an''i Jehovah izy ka niantso ny anaran''i Jehovah.'
mg1865::mg_1::12::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nifindra Abrama ka nandroso niandalana ho any amin''ny tany atsimo.'
mg1865::mg_1::12::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy mosary teo amin''ny tany; ary Abrama dia nidina nankany Egypta hivahiny any, fa mafy ny mosary teo amin''ny tany.'
mg1865::mg_1::12::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nadiva ho tonga tany Egypta izy, dia hoy izy tamin''i Saray vadiny: Indro, fantatro fa vehivavy tsara tarehy ianao,'
mg1865::mg_1::12::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka, raha hitan''ny Egyptiana, dia hataony hoe: Vadiny io; ka hovonoiny aho, fa ianao kosa hovelominy.'
mg1865::mg_1::12::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Masïna ianao, lazao fa anabaviko ianao, mba hasiany soa aho noho ny aminao, ka ianao no hamelomany ahy.'
mg1865::mg_1::12::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tonga tany Egypta Abrama, dia hitan''ny Egyptiana fa tsara tarehy indrindra ravehivavy.'
mg1865::mg_1::12::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nahita azy ny tandapan''i Farao ka nidera azy tamin''i Farao; dia nentina tao an-tranon''i Farao izy.'
mg1865::mg_1::12::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrama nasian''i Farao soa noho ny amin''i Saray; dia nahazo ondry sy omby sy borikilahy sy andevolahy sy andevovavy sy borikivavy sy rameva izy.'
mg1865::mg_1::12::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nasian''i Jehovah areti-mandoza Farao sy ny ankohonany noho ny amin''i Saray, vadin''i Abrama.'
mg1865::mg_1::12::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Farao dia nampaka an''i Abrama ka nanao hoe: Inona izao nataonao tamiko izao? Nahoana no tsy nambaranao tamiko fa vadinao izy?'
mg1865::mg_1::12::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nahoana ianao no nanao hoe: Anabaviko izy? ka nalaiko ho vady izy; koa ankehitriny, indro ny vadinao, ento izy, ka mandehana.'
mg1865::mg_1::12::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 12
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nomen''i Farao teny ny mpanompony sasany ny amin''i Abrama; ary dia nanatitra azy sy ny vadiny mbamin''ny fananany rehetra ireo.'
mg1865::mg_1::13::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nisarahan''i Abrama sy Lota, ary ny teny fikasana nataon''Andriamanitra tamin''i Abrama'
  verse_text: 'Ary Abrama dia niakatra niala tany Egypta, dia izy sy ny vadiny mbamin''ny fananany rehetra, ary Lota koa niaraka taminy, ho any amin''ny tany atsimo.'
mg1865::mg_1::13::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrama nanana harena be, dia omby aman''ondry sy volafotsy ary volamena.'
mg1865::mg_1::13::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary mbola nandeha ihany izy ka nifindrafindra hatrany amin''ny tany atsimo ka hatrany Betela, izay niorenan''ny lainy tamin''ny voalohany, teo anelanelan''i Betela sy Ay,'
mg1865::mg_1::13::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia teo amin''ny tany izay nisy ilay alitara nataony tamin''ny voalohany; ary dia niantso ny anaran''i Jehovah teo Abrama.'
mg1865::mg_1::13::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Lota koa, izay niara-nandeha tamin''i Abrama, dia mba nanana ondry sy omby sy lay.'
mg1865::mg_1::13::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tsy omby azy roa lahy ny tany hiraisany monina; fa efa be ny fananany, ka tsy nahazo niray monina izy.'
mg1865::mg_1::13::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niady ny mpiandry ombin''i Abrama sy ny mpiandry ombin''i Lota; ary ny Kananita sy ny Perizita no tompon-tany tao Kanana fahizay.'
mg1865::mg_1::13::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abrama tamin''i Lota: Aoka re mba tsy hisy ady amintsika roa lahy, na amin''ny mpiandry ombiko sy ny mpiandry ombinao, fa mpirahalahy isika.'
mg1865::mg_1::13::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Moa tsy eo anoloanao va ny tany rehetra? Masïna ianao, aoka hisaraka amiko ianao; raha hianavaratra ianao. dia hianatsimo aho; fa raha hianatsimo ianao, dia hianavaratra kosa aho.'
mg1865::mg_1::13::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Lota nanopy ny masony ka nitazana ny tany rehetra teny amoron''i Jordana hatrany akaikin''i Zoara, fa azon-drano avokoa izy rehetra (talohan''ny nandravan''i Jehovah an''i Sodoma sy Gomora izany), tahaka ny sahan''i Jehovah sy tahaka ny tany Egypta.'
mg1865::mg_1::13::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nofidin''i Lota ho azy ny tany rehetra amoron''i Jordana, ka nifindra niantsinanana izy; ka dia nisaraka izy roa lahy.'
mg1865::mg_1::13::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrama nonina tao amin''ny tany Kanana. fa Lota kosa nonina tao an-tanàna amin''ny tany amoron''i Jordana ka nifindrafindra toby hatrany Sodoma.'
mg1865::mg_1::13::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny mponina tao Sodoma dia tena ratsy fanahy sady mpanota indrindra tamin''i Jehovah.'
mg1865::mg_1::13::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah niteny tamin''i Abrama taorian''ny nisarahan''i Lota taminy ka nanao hoe: Atopazy ny masonao, ka hatramin''ity tany itoeranao ity dia mitazana mianavaratra sy mianatsimo ary miantsinanana sy miankandrefana;'
mg1865::mg_1::13::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa ny tany rehetra izay tazanao dia homeko anao sy ny taranakao mandrakizay.'
mg1865::mg_1::13::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hataoko maro tahaka ny vovo-tany ny taranakao; koa raha misy olona mahisa ny vovo-tany, dia ho azo isaina koa ny taranakao.'
mg1865::mg_1::13::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Miaingà ianao, mandehana mitety ny tany, dia any amin''ny lavany sy any amin''ny sakany; fa homeko anao izy.'
mg1865::mg_1::13::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 13
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrama nifindrafindra toby. dia nandeha ka nonina teo an-kazo terebintan''i Mamre, izay any Hebrona, ary nanorina alitara teo ho an''i Jehovah izy.'
mg1865::mg_1::14::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny namaboana an''i Lota sy ny namonjen''i Abrama azy, ary ny nitsenan''i Melkizedeka an''i Abrama'
  verse_text: 'Ary tamin''ny andron''i Amrafela. mpanjakan''i Sinara, sy Arioka, mpanjakan''i Elasara. sy Kedorlaomera mpanjakan''i Elama. ary Tidala. mpanjakan''ny Goima,'
mg1865::mg_1::14::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia nandeha izy ireo ka nanafika an''i Bera, mpanjakan''i Sodoma. sy Birsa, mpanjakan''i Gomora. sy Sinaba, mpanjakan''i Adma, sy Semebera, mpanjakan''i Zeboima, ary ny mpanjakan''i Bela (dia Zoara izany).'
mg1865::mg_1::14::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ireo rehetra ireo dia nanao fotoana ka nivory tao an-dohasahan''i Sidima (dia ny Ranomasin-tsira izany).'
mg1865::mg_1::14::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa efa nanompo an''i Kedorlaomera roa ambin''ny folo taona ireo, fa tamin''ny taona fahatelo ambin''ny folo kosa dia niodina izy.'
mg1865::mg_1::14::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''ny taona fahefatra ambin''ny folo dia tonga Kedorlaomera sy ireo mpanjaka nomba azy ka namely ny Refaita tany Astarta-karnaima sy ny Zozima tany Hama ary ny Emima tany Save-kiriataima'
mg1865::mg_1::14::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny Horita tany an-tendrombohitra Seira hatrany Elparana, izay eo anilan''ny efitra.'
mg1865::mg_1::14::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niverina indray izy ireo ka nankany Ena-mispata (dia Kadesy izany) ka namely ny tany rehetra an''ny Amalekita sy ny Amorita koa, izay nonina tany Hazazon-tamara.'
mg1865::mg_1::14::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka ny mpanjakan''i Sodoma sy ny mpanjakan''i Gomora sy ny mpanjakan''i Adma sy ny mpanjakan''i Zeboima ary ny mpanjakan''i Bela (dia Zoara izany) ka nilahatra hiady amin''ireo teo an-dohasahan''i Sidima,'
mg1865::mg_1::14::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia tamin''Kedorlaomera, mpanjakan''i Elama, sy Tidala, mpanjakan''ny Goima sy Amrafela, mpanjakan''i Sinara ary Arioka, mpanjakan''i Elasara; dia mpanjaka efatra no niady tamin''ny mpanjaka dimy.'
mg1865::mg_1::14::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny lohasahan''i Sidima, dia be lavak''asfalta, ary nandositra ny mpanjakan''i Sodoma sy ny mpanjakan''i Gomora ka latsaka tao; ary ny sisa nandositra tany an-tendrombohitra.'
mg1865::mg_1::14::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izy ireo namabo ny fananana rehetra tao Sodoma sy Gomora ary ny hanina rehetra. dia lasa nandeha.'
mg1865::mg_1::14::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary namabo ny zana-drahalahin''i Abrama koa izy, dia Lota, mbamin''ny fananany, dia lasa nandeha; fa nonina tao Sodoma koa Lota.'
mg1865::mg_1::14::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tonga ny anankiray izay efa nandositra ka nanambara tamin''i Abrama Hebreo izay nonina teo an-kazo terebintan''i Mamre Amorita, rahalahin''i Eskola sy Anera; fa ireo dia olona efa vita fanekena tamin''i Abrama.'
mg1865::mg_1::14::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha nahare Abrama fa lasan-ko babo ny rahalahiny dia nitondra ny ompikeliny valo ambin''ny folo amby telon-jato izy, izay efa nahay niady. ka nanenjika hatrany Dana.'
mg1865::mg_1::14::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitokotoko hamely azy nony alina izy sy ny andevolahiny; dia namely azy izy ka nanenjika azy hatrany Hoba, izay ao avaratr''i Damaskosy.'
mg1865::mg_1::14::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nampody ny fananana rehetra izy, ary Lota rahalahiny sy ny fananany dia nampodiny koa mbamin''ny vehivavy sy ny vahoaka.'
mg1865::mg_1::14::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka ny mpanjakan''i Sodoma hitsena an''i Abrama teo an-dohasaha Save (Lohasahan''ny mpanjaka izany), rehefa niverina izy avy nandresy an''i Kedorlaomera sy ireo mpanjaka nomba azy.'
mg1865::mg_1::14::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Melkizedeka, mpanjakan''i Salema, nivoaka nitondra mofo sy divay; ary izy dia mpisoron''Andriamanitra Avo Indrindra.'
mg1865::mg_1::14::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitso-drano azy Izy ka nanao hoe: Hotahin''Andriamanitra Avo indrindra anie Abrama, dia Andriamanitra Izay nahary ny lanitra sy ny tany;'
mg1865::mg_1::14::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary isaorana anie Andriamanitra Avo Indrindra, Izay efa nanolotra ny fahavalonao teo an-tananao. Dia nomen''i Abrama azy ny ampahafolon''ny zavatra rehetra.'
mg1865::mg_1::14::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny mpanjakan''i Sodoma tamin''i Abrama: Omeo ahy ny olona, fa ny fananana ento ihany ho anao.'
mg1865::mg_1::14::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Abrama tamin''ny mpanjakan''i Sodoma: Izaho efa nanangan-tanana tamin''i Jehovah, Andriamanitra Avo Indrindra, Izay nahary ny lanitra sy ny tany,'
mg1865::mg_1::14::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa tsy handray na taretra na fehin-kapa aza amin''izay rehetra mety ho anao andrao hataonao hoe: Izaho no nampanan-karena an''i Abrama),'
mg1865::mg_1::14::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 14
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'afa-tsy izay efa nohanin''ny zatovo sy ny anjaran''ny olona izay niaraka tamiko, dia Anera sy Eskola ary Mamre; aoka horaisin''ireo ny anjarany.'
mg1865::mg_1::15::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nanaovan''Andriamanitra fanekena tamin''i Abrama'
  verse_text: 'Rehefa afaka izany, dia tonga tamin''i Abrama ny tenin''i Jehovah tamin''ny fahitana ka nanao hoe: Aza matahotra, ry Abrama; Izaho no ampinganao sy valim-pitia lehibe indrindra ho anao.'
mg1865::mg_1::15::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abrama: Jehovah Tompo o, inona no homenao ahy? fa izaho mandroso fahanterana nefa tsy manan-janaka, ary ny ho tompon''ny ahy dia ilay Eliezera avy any Damaskosy.'
mg1865::mg_1::15::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa Abrama: Indro, izaho tsy nomenao fara handimby, ka, indro, ny anankiray amin''ny ato an-tranoko no handova ahy.'
mg1865::mg_1::15::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary, indro, ny tenin''i Jehovah tonga taminy hoe: Tsy handova anao izany; fa izay haterakao, dia izy no handova anao.'
mg1865::mg_1::15::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitondra azy nivoaka teo ivelan''ny lay Izy ka nanao hoe: Jereo ange ny lanitra, ka isao ny kintana, raha mahisa azy ianao. Dia hoy Izy taminy: Ho tahaka izany ny taranakao.'
mg1865::mg_1::15::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nino an''i Jehovah izy; ka dia nisainy ho fahamarinany izany.'
mg1865::mg_1::15::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy taminy: Izaho no Jehovah Izay nitondra anao nivoaka avy tany Oran''ny Kaldeana, mba homeko anao ity tany ity ho lovanao.'
mg1865::mg_1::15::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy: Jehovah Tompo o, ahoana no hahafantarako fa handova ity aho?'
mg1865::mg_1::15::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy taminy: Itondray ombivavy kely efa telo taona Aho sy osivavy efa telo taona sy ondrilahy efa telo taona ary domohina sy zana-boromailala.'
mg1865::mg_1::15::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nentiny teo aminy izany rehetra izany; ary nosasahiny ireny, ka nampifanandrifiny avy ny tapany; fa ny vorona tsy mba nosasahiny.'
mg1865::mg_1::15::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nidina teo amin''ny fatin''ireo ny vorona mpihaza, fa nandroaka azy Abrama.'
mg1865::mg_1::15::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hilentika ny masoandro, dia sondrian-tory Abrama; ary, indro, aizina mahatsiravina indrindra no nahazo azy.'
mg1865::mg_1::15::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah tamin''i Abrama: Aoka ho fantatrao marina fa ho vahiny any amin''ny tany izay tsy azy ny taranakao ary hanompo ny olona any; ary hampahoriny efa-jato taona izy.'
mg1865::mg_1::15::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izany firenena izany kosa, izay hotompoiny, dia hotsaraiko; ary rehefa afaka izany, dia hivoaka mitondra harem-bevava izy.'
mg1865::mg_1::15::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa ianao kosa ho any amin''ny razanao amin''ny fiadanana; ho tratrantitra indrindra ianao vao hodi-mandry.'
mg1865::mg_1::15::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa raha mby amin''ny zafiafy, dia hiverina aty izy; fa tsy mbola tanteraka ny heloky ny Amorita.'
mg1865::mg_1::15::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa maty ny masoandro, ka maizina dia maizina ny andro, dia, indro, nisy fatana fandoroana mivoa-tsetroka sy fanilo mirehitra, izay nandeha namaky teo anelanelan''ireo zavatra voasasaka ireo.'
mg1865::mg_1::15::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tamin''izany andro izany Jehovah nanao fanekena tamin''i Abrama ka nanao hoe: Ny taranakao efa nomeko ity tany ity hatrany amin''ny onin''i Egypta ka hatrany amin''ny ony lehibe, dia ny ony Eofrata,'
mg1865::mg_1::15::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia ny Kenita sy ny Kenizita sy ny Kadmonita'
mg1865::mg_1::15::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny Hetita sy ny Perizita sy ny Refaita'
mg1865::mg_1::15::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 15
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny Amorita sy ny Kananita sy ny Girgasita ary ny Jebosita.'
mg1865::mg_1::16::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nahaterahan''Isimaela'
  verse_text: 'Ary Saray, vadin''i Abrama, tsy mba niteraka; ary izy nanana mpanompovavy Egyptiana, Hagara no anarany.'
mg1865::mg_1::16::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Saray tamin''i Abrama: Indro, efa tsy nanome zanaka ahy Jehovah; masïna ianao, mivadia amin''ny mpanompovaviko; angamba hahazo zaza aminy aho. Dia neken''i Abrama ny tenin''i Saray.'
mg1865::mg_1::16::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nonina folo taona teo amin''ny tany Kanana Abrama, dia nalain''i Saray, vadin''i Abrama, Hagara Egyptiana mpanompovaviny, ka nomeny an''i Abrama vadiny mba hovadiny.'
mg1865::mg_1::16::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivady tamin''i Hagara izy, ka nanan''anaka ravehivavy; ary rehefa hitany fa efa manan''anaka izy, dia nataony toy ny tsinontsinona ny tompovaviny.'
mg1865::mg_1::16::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Saray tamin''i Abrama: Hanody anao anie ny fahoriako; fa efa nomeko ho andefimandrinao ny mpanompovaviko, ary nony hitany fa efa manan''anaka izy, dia nataony toy ny tsinontsinona aho; Jehovah anie hitsara ahy sy ianao.'
mg1865::mg_1::16::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abrama tamin''i Saray: Indro, eo an-tananao ihany ny mpanompovavinao; ataovy aminy izay sitraponao. Ary raha nampahorin''i Saray Hagara, dia nandositra ny tavany izy.'
mg1865::mg_1::16::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Ilay Anjelin''i Jehovah nahita azy teo anilan''ny loharano anankiray tany an''efitra, dia teo anilan''ilay loharano eo amin''ny lalana mankany Sora.'
mg1865::mg_1::16::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy: Ry Hagara, andevovavin''i Saray, avy taiza ianao? Ary hankaiza? Ary hoy izy; Mandositra ny tavan''i Saray tompovaviko aho.'
mg1865::mg_1::16::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Ilay Anjelin''i Jehovah taminy: Miverena any amin''ny tompovavinao ka miareta izay ataony aminao.'
mg1865::mg_1::16::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa Ilay Anjelin''i Jehovah taminy: Hataoko maro indrindra ny taranakao, ka tsy ho azo isaina izy noho ny hamaroany.'
mg1865::mg_1::16::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy indray Ilay Anjelin''i Jehovah taminy: Indro, manan''anaka ianao ka hiteraka zazalahy, ary ny anarany hataonao hoe Isimaela, satria efa nihaino ny fahorianao Jehovah.'
mg1865::mg_1::16::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izy ho lehilahy toy ny boriki-dia; ny tanany hamely ny olona rehetra, ary ny tanan''ny olona rehetra kosa hamely azy; ary honina eo tandrifin''ny rahalahiny rehetra izy.'
mg1865::mg_1::16::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 13
  verse_date_revised: '2022-05-06T07:13:05+0000'
  verse_title: null
  verse_text: 'Ary Hagara nanonona ny anaran''i Jehovah, Izay niteny taminy hoe: Ianao no Andriamanitra Izay mahita; fa hoy izy: Tsy teto va no mbola velona aho aorian''ny fahitana?'
mg1865::mg_1::16::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izany no nanaovana ny lavaka fantsakana hoe: Bera-lahai-roy; indro, eo anelanelan''i Kadesy sy Bareda izany.'
mg1865::mg_1::16::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Hagara dia niteraka zazalahy tamin''i Abrama; ary ny anaran''ny zanany izay naterany dia nataon''i Abrama hoe Isimaela.'
mg1865::mg_1::16::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 16
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary efa enina amby valo-polo taona Abrama, raha Hagara niteraka an''Isimaela taminy.'
mg1865::mg_1::17::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nanovan''Andriamanitra ny anaran''i Abrama mivady, sy ny nanendreny ny fora ho famantarana ny fanekena nataony taminy, ary ny amin''ny hahaterahan''Isaka'
  verse_text: 'Ary rehefa sivy amby sivi-folo taona Abrama, dia nisehoan''i Jehovah izy ka nitenenany hoe: Izaho no Andriamanitra Tsitoha; mandehana eo anatrehako, ka aoka ho tsy misy tsiny ianao.'
mg1865::mg_1::17::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Izaho hanao ny fanekeko ho amiko sy ho aminao ary hahamaro anao indrindra.'
mg1865::mg_1::17::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niankohoka Abrama; ary Andriamanitra niteny taminy ka nanao hoe:'
mg1865::mg_1::17::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha ny amiko, dia, indro, aminao ny fanekeko, ka ho tonga rain''ny firenena maro ianao.'
mg1865::mg_1::17::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaranao tsy hatao hoe Abrama intsony, fa hatao hoe Abrahama, satria efa nataoko ho rain''ny firenena maro ianao.'
mg1865::mg_1::17::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hahamaro ny taranakao indrindra Aho, ka hataoko ho firenena maro ianao; ary hisy mpanjaka hiseho avy aminao.'
mg1865::mg_1::17::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary haoriko ny fanekeko ho amiko sy ho aminao mbamin''ny taranakao mandimby anao hatramin''ny taranaka fara mandimby, ho fanekena mandrakizay, mba ho Andriamanitrao sy ny taranakao mandimby anao Aho.'
mg1865::mg_1::17::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary homeko anao sy ny taranakao any aorianao ny tany fivahinianao, dia ny tany Kanana rehetra, ho fananana mandrakizay; ary ho Andriamaniny Aho.'
mg1865::mg_1::17::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Andriamanitra tamin''i Abrahama: Fa ny aminao kosa, dia hitandrina ny fanekeko ianao, dia ianao sy ny taranakao mandimby anao hatramin''ny taranaka fara mandimby.'
mg1865::mg_1::17::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no fanekeko ho amiko sy ho aminareo sy ny taranakao mandimby anao, dia izay hotandremanareo: hoforana ny lehilahy rehetra eo aminareo.'
mg1865::mg_1::17::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoforana ianareo; ary ho famantarana ny fanekena ho amiko sy ho aminareo izany.'
mg1865::mg_1::17::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny zazalahy teraka havaloana eo aminareo no hoforana, dia ny lehilahy rehetra amin''ny taranakareo hatramin''ny fara mandimby: na ny ompikely. na izay novidim-bola tamin''ny hafa firenena ka tsy avy amin''ny taranakao.'
mg1865::mg_1::17::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tsy maintsy hoforana ny ompikelinao sy izay novidinao vola; ary ny fanekeko dia ho ao amin''ny nofonareo ho fanekena mandrakizay.'
mg1865::mg_1::17::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny lehilahy tsy voafora, izay tsy mbola noforana, dia hofongorana tsy ho amin''ny fireneny; efa nivadika ny fanekeko izy.'
mg1865::mg_1::17::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Andriamanitra tamin''i Abrahama: Ny amin''i Saray vadinao, dia tsy mba hataonao Saray intsony ny anarany, fa Saraha no ho anarany.'
mg1865::mg_1::17::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitahy azy Aho ka hampanana azy zazalahy ho anao; eny, hitahy azy Aho, ka ho tonga firenena maro izy; ary hisy mpanjakan''ny firenena maro avy aminy.'
mg1865::mg_1::17::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niankohoka Abrahama ary nitsiky, dia nanao anakampo hoe: Hiteraka va aho, izay efa zato taona? ary hiteraka va Saraha, izay efa sivi-folo taona?'
mg1865::mg_1::17::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abrahama tamin''Andriamanitra : Enga anie ka Isimaela no ho velona eo anatrehanao!'
mg1865::mg_1::17::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Andriamanitra: Tsia, fa Saraha vadinao hiteraka zazalahy aminao; ary ny anarany dia hataonao hoe Isaka; ary ny fanekeko haoriko aminy ho fanekena mandrakizay ho an''ny taranany mandimby azy.'
mg1865::mg_1::17::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny amin''Isimaela, dia efa nihaino anao Aho; indro, efa nitahy azy Aho ka hahamaro ny taranany sy hampitombo azy indrindra; hiteraka andriana roa ambin''ny folo izy, satria efa notendreko ho firenena lehibe.'
mg1865::mg_1::17::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa ny fanekeko haoriko amin''Isaka. izay haterak''i Saraha aminao raha avy ny taona toy izao.'
mg1865::mg_1::17::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa vita ny teny nataony taminy, dia niakatra Andriamanitra niala teo amin''i Abrahama.'
mg1865::mg_1::17::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa dia nalain''i Abrahama Isimaela zanany sy ny ompikeliny rehetra mbamin''izay rehetra novidiny vola dia ny lehilahy rehetra tao an-tranony; dia noforany androtrizay indrindra ireo araka izay nolazain''Andriamanitra taminy.'
mg1865::mg_1::17::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary efa sivy amby sivi-folo taona Abrahama, raha noforana izy.'
mg1865::mg_1::17::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary efa telo ambin''ny folo taona Isimaela zanany, raha noforana izy.'
mg1865::mg_1::17::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Androtrizay indrindra no namorana an''i Abrahama sy Isimaela zanany;'
mg1865::mg_1::17::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 17
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny lehilahy rehetra tao an-tranony, dia ny ompikely mbamin''izay novidim-bola tamin''ny hafa firenena, dia samy niara-noforana taminy avokoa.'
mg1865::mg_1::18::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nisehoan''ny anjely telo tamin''i Abrahama'
  verse_text: 'Ary Jehovah niseho tamin''i Abrahama teo an-kazo terebintan''i Mamre; ary nipetraka teo am-baravaran''ny lainy izy, raha nafana ny andro;'
mg1865::mg_1::18::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 2
  verse_date_revised: '2022-06-08T11:51:00+0000'
  verse_title: null
  verse_text: 'dia nanopy ny masony izy ka nijery, ary, indreo, nisy telo lahy nijanona teo tandrifiny, ka nony nahita ireo izy, dia niala teo am-baravaran''ny lainy ka nihazakazaka hitsena azy, dia niankohoka tamin''ny tany'
mg1865::mg_1::18::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka nanao hoe: Tompo o, raha mahita fitia eto imasonao aho, masïna ianao, aza dia mandalo ny mpanomponao.'
mg1865::mg_1::18::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Aoka hangalana rano kely ianareo hanasana ny tongotrareo; ary aoka mba hiala sasatra kely eo am-pototry ny hazo ianareo;'
mg1865::mg_1::18::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia haka mofo kely aho hataonareo ody am-bavafo; ary rehefa afaka izany, dia handeha ihany ianareo; fa tonga aty amin''ny mpanomponareo ianareo. Ary hoy izy telo lahy: Ataovy ihany araka izay nolazainao.'
mg1865::mg_1::18::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha faingana Abrahama nankany an-day tany amin''i Saraha ka nanao hoe: Faingana, makà koba tsara toto intelon''ny famarana; dia fetafetao ka ataovy mofo.'
mg1865::mg_1::18::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama kosa nihazakazaka nankany amin''ny omby, dia naka zanak''omby tanora sady tsara ka nanolotra azy tamin''ny ankizilahy, dia lasa faingana izy hamboatra azy.'
mg1865::mg_1::18::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama naka ronono mandry sy ronono ary ilay zanak''omby efa namboariny, dia narosony teo anoloan''izy telo lahy; ary nijanona teo anilany teo ambanin''ny hazo izy, dia nihinana izy telo lahy.'
mg1865::mg_1::18::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy telo lahy tamin''i Abrahama: Aiza Saraha vadinao? Ary hoy kosa izy: Indro, ao an-day izy.'
mg1865::mg_1::18::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy: Hiverina aminao tokoa Aho raha avy ny taona toy izao; ary, indro hanana zazalahy Saraha vadinao. Ary Saraha nandre izany teo am-baravaran''ny lay, izay teo ivohon''Ilay niteny.'
mg1865::mg_1::18::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama sy Saraha dia samy efa zoki-olona ka nandroso fahanterana, ary efa nitsahatra tamin''ny fombam-behivavy Saraha.'
mg1865::mg_1::18::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Saraha dia nihomehy anakampo ka nanao hoe: Moa mbola hanana hafaliana ihany va aho rehefa tratrantitra toy izao, sady efa antitra koa itompokolahy?'
mg1865::mg_1::18::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah tamin''i Abrahama: Nahoana no nihomehy Saraha ka nanao hoe: Hiteraka tokoa va aho, kanefa izao efa antitra izao?'
mg1865::mg_1::18::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa moa misy zavatra mahagaga izay tsy hain''i Jehovah va? Amin''ny fotoan''andro raha avy ny taona toy izao dia hiverina aminao Aho, ary Saraha hanana zazalahy.'
mg1865::mg_1::18::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandà Saraha satria natahotra izy, ka nanao hoe: Tsy nihomehy aho tsy akory. Fa hoy Ilay niteny: Tsia; fa nihomehy mihitsy ianao.'
mg1865::mg_1::18::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 16
  verse_date_revised: null
  verse_title: 'Ny nifonan''i Abrahama ho an''i Sodoma'
  verse_text: 'Dia nitsangana ireny lehilahy ireny ka niala teo, dia nitsinjo an''i Sodoma; ary Abrahama niaraka taminy hanatitra azy.'
mg1865::mg_1::18::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah nanao hoe: Hafeniko amin''i Abrahama va izay hataoko?'
mg1865::mg_1::18::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Abrahama ho tonga firenena lehibe sy mahery tokoa, ary aminy no hitahiana ny firenena rehetra ambonin''ny tany.'
mg1865::mg_1::18::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa efa nifidy azy Aho mba handidy ny zanany sy ny taranany mandimby azy hitandreman''ireo ny lalàn''i Jehovah hanao izay marina sy mahitsy, mba hitondran''i Jehovah amin''i Abrahama izay efa nolazainy taminy.'
mg1865::mg_1::18::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah: Ny fitarainan''i Sodoma sy Gomora dia lehibe tokoa, ary ny fahotany dia mavesatra indrindra;'
mg1865::mg_1::18::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'hidina Aho ka hizaha na efa nahatanteraka izany tokoa izy araka ny fitarainan''ny tany, izay efa tonga aty amiko, na tsia; ary raha tsy izany, dia ho fantatro.'
mg1865::mg_1::18::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nihodina niala teo ireo lehilahy ireo ka nandroso ho any Sodoma; fa Abrahama kosa mbola nijanona teo anatrehan''i Jehovah.'
mg1865::mg_1::18::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanatona Abrahama ka nanao hoe: Haringanao miaraka amin''ny meloka va ny marina?'
mg1865::mg_1::18::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Angamba misy olo-marina dimam-polo ao an-tanàna; haringanao koa va, ka tsy hamindranao fo ny tanàna noho ny dimam-polo marina izay ao?'
mg1865::mg_1::18::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Sanatria Anao raha hanao toy izany ka hamono ny marina miaraka amin''ny meloka, ka ny marina hatao tahaka ny meloka; sanatria Anao izany! tsy hitsara marina va ny Mpitsara ny tany rehetra?'
mg1865::mg_1::18::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah: Raha mahita dimam-polo marina ao an-tanàna Sodoma Aho, dia hamindrako fo ny tanàna rehetra noho ireny.'
mg1865::mg_1::18::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly Abrahama ka nanao hoe: Indro, fa efa sahy niteny tamin''ny Tompo aho nefa vovoka sy lavenona:'
mg1865::mg_1::18::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Angamba ho latsaka dimy ny dimam-polo marina; moa haringanao va ny tanàna rehetra noho ny dimy? Ary hoy Izy: Tsy handringana Aho, raha mahita dimy amby efa-polo ao.'
mg1865::mg_1::18::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia, mbola niteny taminy indray izy ka nanao hoe: Angamba efa-polo no ho hita ao. Ary hoy Izy: Tsy mba hanao izany Aho noho ny efa-polo.'
mg1865::mg_1::18::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Aoka anie mba tsy ho tezitra ny Tompo, fa mbola hiteny aho: Angamba telo-polo no ho hita ao. Ary hoy Izy: Tsy mba hanao izany Aho, raha mahita telo-polo ao.'
mg1865::mg_1::18::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Indro, fa efa sahy niteny tamin''ny Tompo aho: Angamba roa-polo no ho hita ao. Ary hoy Izy: Tsy mba handringana azy Aho noho ny roa-polo.'
mg1865::mg_1::18::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Aoka anie mba tsy ho tezitra Ianao, Tompo, fa hiteny izao indray mandeha izao ihany aho: Angamba folo no ho hita ao. Ary hoy Izy: Tsy mba handringana Aho noho ny folo.'
mg1865::mg_1::18::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 18
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia lasa nandeha Jehovah, rehefa vita ny teny nataony tamin''i Abrahama; ary Abrahama niverina ho any amin''ny fonenany.'
mg1865::mg_1::19::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nandravan''Andriamanitra an''i Sodoma sy Gomora, sy ny namonjeny an''i Lota'
  verse_text: 'Dia nankany Sodoma ilay anjely roa nony hariva, raha Lota nipetraka teo am-bavahadin''i Sodoma; ary raha nahita azy Lota, dia nitsangana mba hitsena azy izy ka niankohoka tamin''ny tany.'
mg1865::mg_1::19::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Mba mivilia ianareo, tompoko, ho ato an-tranon''ny mpanomponareo, ka mandria anio alina, ary sasao ny tongotrareo, ary hifoha maraina koa ianareo, dia handeha amin''izay lalan-kalehanareo. Fa hoy izy roa lahy: Tsia; fa hitoetra eto an-kianja ihany izahay anio alina.'
mg1865::mg_1::19::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa noteren''i Lota fatratra izy roa lahy, dia nivily tany aminy izy ka niditra tao an-tranony; dia nanaovany nahandro izy sy nanendasany mofo tsy misy masirasira, dia nihinana izy.'
mg1865::mg_1::19::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha tsy mbola nandry izy, dia avy manodidina ny trano ny mponina tao an-tanàna Sodoma, hatramin''ny tanora ka hatramin''ny antitra, dia ny vahoaka rehetra tao an-tanàna;'
mg1865::mg_1::19::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia niantso an''i Lota izy ireo ka nanao taminy hoe: Aiza ireo lehilahy vao tonga tato aminao izao alina izao? avoahy ho aty aminay izy hahalalanay azy.'
mg1865::mg_1::19::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka teo am-baravarana Lota hankeo aminy, ka nakatony ny varavarana teo ivohony;'
mg1865::mg_1::19::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary hoy izy: Masïna ianareo, ry rahalahiko, aza manao ratsy.'
mg1865::mg_1::19::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Indro, manan-janaka roa vavy aho, izay tsy mbola nahalala lahy; masïna ianareo, aoka re ireo no havoakako ho eto aminareo, ka hataonareo aminy izay sitraponareo; fa ireo lehilahy ireo kosa dia aza anaovanareo na inona na inona; fa tonga hialoka eto ambanin''ny tafon-tranoko izy.'
mg1865::mg_1::19::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy ireo: Mialà eto ianao. Dia hoy izy ireo indray: Ilehity tonga ety hivahiny, kanefa matetika mila hiseho ho mpitsara; ankehitriny dia hanao ratsiratsy kokoa aminao noho ny amin''ireo lehilahy ireo izahay. Dia nanosika mafy an-dralehilahy izy ireo, dia an''i Lota, ka nisesika hamaky ny varavarana.'
mg1865::mg_1::19::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa naninjitra ny tanany izy roa lahy, dia nanintona an''i Lota hankao an-trano ho ao aminy, ka nakatony ny varavarana.'
mg1865::mg_1::19::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampanjambena ny mason''ny lehilahy izay teo am-baravaran''ny trano izy hatramin''ny kely ka hatramin''ny lehibe; ka dia sasa-poana nitady ny varavarana ireo.'
mg1865::mg_1::19::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy roa lahy tamin''i Lota : Mbola manana ato koa va ianao? dia izay vinantonao-lahy sy ny zanakao-lahy sy ny zanakao-vavy, ary na zovy na zovy anananao ato an-tanàna, ento miala amin''ity tanàna ity;'
mg1865::mg_1::19::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa horavanay ity tanàna ity, satria efa lehibe ny fitarainany eo anatrehan''i Jehovah; ka dia naniraka anay Jehovah handrava azy.'
mg1865::mg_1::19::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka Lota ary niteny tamin''ny vinantony, izay efa hanambady ny zananivavy, ka nanao hoe : Miaingà, miala amin''ity tanàna ity; fa horavan''i Jehovah ity tanàna ity. Fa nataon''ny vinantony ho tahaka ny mpanao vazivazy izy.'
mg1865::mg_1::19::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony maraina koa ny andro, dia nandodona an''i Lota ireo anjely ka nanao hoe: Miaingà, ento ny vadinao sy ny zanakao roa vavy izay eto, fandrao mba haringana ianao noho ny heloky ny tanàna.'
mg1865::mg_1::19::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony nitaredretra izy, dia notantanan''izy roa lahy izy sy ny vadiny ary ny zanany roa vavy noho ny famindram-pon''i Jehovah taminy; dia nitondra azy nivoaka izy roa lahy ka nandao azy tany ivelan''ny tanàna.'
mg1865::mg_1::19::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nitondra azy nivoaka tany ivelany izy, dia hoy ny anankiray: Mandosira hamonjy ny ainao; aza miherika ianao, na mijanona eny amin''ny tany lemaka rehetra; mandosira any an-tendrombohitra, fandrao haringana ianao.'
mg1865::mg_1::19::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Lota taminy: Aza an''izany, Tompo o!'
mg1865::mg_1::19::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'indro, fa efa nahita fitia teo imasonao ny mpanomponao, ary efa nahalehibe ny famindram-ponao ianao, izay nataonao tamiko hamonjenao ny aiko; ary tsy afa-mandositra any an-tendrombohitra aho, fandrao hahatratra ahy ny loza, ka ho faty aho;'
mg1865::mg_1::19::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'indro, io vohitra io dia akaiky handosirana sady kely; masïna ianao, aoka handositra ao aho (tsy kely va izy io?), dia ho velona ny aiko.'
mg1865::mg_1::19::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy taminy: Indro, efa nekeko koa ianao tamin''izany zavatra izany, ka tsy horavako io vohitra nolazainao io.'
mg1865::mg_1::19::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mandehana faingana, mandosira ho ao; fa tsy mahazo manao na inona na inona aho mandra-pahatonganao ao. Izany no nanaovana ny anaran''ny tanàna hoe Zoara.'
mg1865::mg_1::19::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny masoandro efa niposaka tamin''ny tany, raha tonga tao Zoara Lota.'
mg1865::mg_1::19::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah nandatsaka tamin''i Sodoma sy Gomora solifara sy afo, avy tamin''i Jehovah tany an-danitra,'
mg1865::mg_1::19::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka nandrava ireny tanàna ireny sy ny tany lemaka rehetra sy ny mponina rehetra tao an-tanàna ary ny zava-maniry teo amin''ny tany.'
mg1865::mg_1::19::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ny vadin''i Lota niherika teo ivohony, dia tonga vongan-tsira mitsangana izy.'
mg1865::mg_1::19::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nifoha maraina koa Abrahama ka nankany amin''ilay efa nijanonany teo anatrehan''i Jehovah;'
mg1865::mg_1::19::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary nitsinjo an''i Sodoma sy Gomora sy ny tany lemaka rehetra izy, dia nahita, ka, indro, niakatra ny setroky ny tany tahaka ny setroky ny lafaoro lehibe.'
mg1865::mg_1::19::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha noravan''Andriamanitra ny tanàna tany amin''ny tany lemaka, dia nahatsiaro an''i Abrahama Andriamanitra ka namoaka an''i Lota hiala teo afovoan''ny horavana, tamin''ny nandravany ny tanàna izay nonenan''i Lota.'
mg1865::mg_1::19::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 30
  verse_date_revised: null
  verse_title: 'Ny niandohan''ny firenen''i Moaba Sy Amona'
  verse_text: 'Dia niakatra Lota avy tao Zoara ka nitoetra tany an-tendrombohitra, dia izy sy ny zanany roa vavy; fa natahotra hitoetra tao Zoara izy; dia nitoetra tao an-johy izy sy ny zanany roa vavy.'
mg1865::mg_1::19::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny vavimatoa tamin''ny zandriny: Efa antitra izao raintsika, ary tsy misy lehilahy ambonin''ny tany hanambady antsika araka ny fanaon''ny tany rehetra;'
mg1865::mg_1::19::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'andeha hampisotrointsika divay ny raintsika dia handry aminy isika hananantsika fara avy amin''ny raintsika.'
mg1865::mg_1::19::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampisotroiny divay ny rainy tamin''iny alina iny dia niditra ny vavimatoa ka nandry tamin-drainy; ary izy tsy nahafantatra izay nandriany na izay nifohazany.'
mg1865::mg_1::19::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony ampitson''iny dia hoy ny vavimatoa tamin''ny zandriny: Indro, efa nandry tamin''ny raintsika aho halina; aoka hampisotrointsika divay indray izy anio alina, dia midira ianao ka mandria aminy hananantsika fara avy amin''ny raintsika.'
mg1865::mg_1::19::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampisotroiny divay indray ny rainy tamin''iny alina iny; dia nitsangana ilay zandriny ka nandry taminy; ary izy tsy nahafantatra izay nandriany, na izay nifohazany.'
mg1865::mg_1::19::36:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia samy nanan''anaka tamin-drainy ny zanak''i Lota roa vavy.'
mg1865::mg_1::19::37:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niteraka zazalahy ny vavimatoa, ka ny anarany nataony hoe Moaba; izy no rain''ny Moabita mandraka androany.'
mg1865::mg_1::19::38:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 19
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zandriny koa dia niteraka zazalahy ary ny anarany nataony hoe Benamy; izy kosa no rain''ny taranak''i Amona mandraka androany.'
mg1865::mg_1::20::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nivahinian''i Abrahama tao Gerara'
  verse_text: 'Dia nifindra niala teo Abrahama nankany amin''ny tany atsimo ka nitoetra teo anelanelan''i Kadesy sy Sora ary nivahiny tao Gerara izy.'
mg1865::mg_1::20::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny filazan''i Abrahama an''i Saraha vadiny: Anabaviko izy; dia naniraka Abimeleka, mpanjakan''i Gerara, nampaka an''i Saraha.'
mg1865::mg_1::20::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Andriamanitra nankeo amin''i Abimeleka, tamin''ny nofy nony alina, ka nanao taminy hoe: Indro, fa ho faty ianao noho ny vehivavy izay nalainao, fa vadin''olona izy.'
mg1865::mg_1::20::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Abimeleka anefa tsy mbola nanakaiky azy, ka hoy izy: Tompo o, hovonoinao koa va izay firenena marina?'
mg1865::mg_1::20::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 5
  verse_date_revised: '2022-06-02T02:57:34+0000'
  verse_title: null
  verse_text: 'Tsy ralehilahy va no nilaza tamiko hoe: Anabaviko izy? ary ravehivavy koa nanao hoe: Anadahiko izy; koa tamin''ny fahatsoran''ny foko sy ny fahadiovan''ny tanako no nanaovako izany.'
mg1865::mg_1::20::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Andriamanitra taminy tamin''ny nofy: Eny ary, fantatro ihany fa tamin''ny fahatsoran''ny fonao no nanaovanao izany; ary Izaho kosa dia niaro anao mba tsy hanota amiko; koa izany no tsy namelako anao hanendry azy.'
mg1865::mg_1::20::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ankehitriny avereno ny vadin-dralehilahy, fa mpaminany izy ka hifona ho anao, dia ho velona ianao; fa raha tsy averinao izy, aoka ho fantatrao fa ho faty tokoa ianao, dia ianao mbamin''izay rehetra mety ho anao.'
mg1865::mg_1::20::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nifoha maraina koa Abimeleka ka niantso ny mpanompony rehetra ary nanambara izany rehetra izany teo anatrehany; ka dia raiki-tahotra indrindra ny olona.'
mg1865::mg_1::20::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abimeleka dia nampaka an''i Abrahama ka nanao taminy hoe: Inona izao nataonao taminay izao? ary inona izao ratsy nataoko taminao izao no dia nahatonga heloka lehibe tamiko sy tamin''ny fanjakako ianao? zavatra izay tsy tokony hatao no nataonao tamiko.'
mg1865::mg_1::20::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa Abimeleka tamin''i Abrahama: Inona no hitanao, no nanao izany zavatra izany ianao?'
mg1865::mg_1::20::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Abrahama: Satria hoy izaho: Tsy misy fahatahorana an''Andriamanitra tokoa amin''ity tany ity, ka hovonoin''ny olona aho noho ny amin''ny vadiko.'
mg1865::mg_1::20::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa anabaviko ihany tokoa izy, satria zanakavavin''ny raiko, fa tsy mba zanakavavin''ny reniko; ka dia nanambady azy aho.'
mg1865::mg_1::20::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha nampifindrafindra ahy hiala tamin''ny tranon''ny raiko Andriamanitra, dia hoy izaho tamin''ny vadiko: Izao no soa hataonao amiko any amin''izay tany rehetra halehantsika dia lazao aho hoe: Anadahiko izy.'
mg1865::mg_1::20::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abimeleka naka ondry sy omby sy ankizilahy ary ankizivavy, ka nomeny an''i Abrahama ireny; ary Saraha vadiny dia naveriny teo aminy.'
mg1865::mg_1::20::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abimeleka: Indro, eo anoloanao ny taniko; mitoera eo amin''izay tianao.'
mg1865::mg_1::20::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy kosa izy tamin''i Saraha: Indro, efa nomeko sekely volafotsy arivo ny anadahinao; indro, ho fanampena-maso aminao izany, dia amin''izay rehetra momba anao: ka dia efa nahazo ny rariny ianao ny amin''izany rehetra izany.'
mg1865::mg_1::20::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama dia nifona tamin''Andriamanitra; ary Andriamanitra nahasitrana an''i Abimeleka sy ny vadiny mbamin''ny mpanompovaviny; dia niteraka izy ireo.'
mg1865::mg_1::20::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 20
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Jehovah efa nahamomba tokoa ny vehivavy rehetra tamin''ny ankohonan''i Abimeleka noho ny amin''i Saraha, vadin''i Abrahama.'
mg1865::mg_1::21::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nahaterahan''Isaka, sy ny nandroahana an''i Hagara mianaka'
  verse_text: 'Ary Jehovah namangy an''i Saraha araka ilay efa nolazainy, ary dia nataon''i Jehovah tamin''i Saraha araka ilay efa noteneniny.'
mg1865::mg_1::21::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka Saraha ka niteraka zazalahy tamin''i Abrahama, rehefa antitra izy, tamin''ny fotoana izay efa nolazain''Andriamanitra taminy.'
mg1865::mg_1::21::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''ny zanany izay teraka, ilay naterak''i Saraha taminy dia nataon''i Abrahama hoe Isaka.'
mg1865::mg_1::21::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia noforan''i Abrahama Isaka zanany, rehefa teraka havaloana izy, araka izay efa nandidian''Andriamanitra azy.'
mg1865::mg_1::21::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary efa zato taona Abrahama, raha niteraka an''i Isaka zanany izy.'
mg1865::mg_1::21::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Saraha: Efa nampihomehezin''Andriamanitra aho; izay rehetra mandre dia hiara-mihomehy amiko.'
mg1865::mg_1::21::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa izy: Nampoizin''iza akory moa no hilaza amin''i Abrahama fa hampinono zaza Saraha? kanjo efa niteraka zazalahy taminy aho, rehefa antitra izy.'
mg1865::mg_1::21::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa lehibe ny zaza, dia notazana; ary Abrahama nanao fanasana lehibe tamin''ny andro nanotazana an''Isaka.'
mg1865::mg_1::21::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Saraha nahita fa nihomehy ny zanak''i Hagara Egyptiana, izay efa naterany tamin''i Abrahama.'
mg1865::mg_1::21::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy tamin''i Abrahama: Roahy io andevovavy io sy ny zanany; fa ny zanak''io andevovavy io tsy hiray lova amin''ny zanako, dia amin''Isaka.'
mg1865::mg_1::21::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ratsy teo imason''i Abrahama indrindra izany teny izany noho ny amin''ny zanany.'
mg1865::mg_1::21::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Andriamanitra tamin''i Abrahama: Aoka tsy ho ratsy eo imasonao ny amin''ny zaza sy ny andevovavinao; fa izay rehetra lazain''i Saraha aminao, dia ekeo ny teniny, fa avy amin''Isaka no hantsoina izay taranaka ho anao.'
mg1865::mg_1::21::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa ny zanaky ny andevovavy kosa dia hataoko ho firenena, satria terakao ihany izy.'
mg1865::mg_1::21::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nifoha maraina koa Abrahama ka naka mofo sy siny hoditra iray feno rano, ary nomeny an''i Hagara ka napetrany teo an-tsorony ary natolony azy koa ny zaza, dia nampandehaniny izy mianaka; ary lasa nandeha izy ka nirenireny tany an''efitr''i Beri-sheba.'
mg1865::mg_1::21::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa lany ny rano tao amin''ny siny hoditra, dia nariany teo ampototry ny hazo kely anankiray ny zaza.'
mg1865::mg_1::21::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia lasa izy ka nipetraka tery lavidavitra tandrifiny, tokony ho tra-tsipïka; fa hoy izy: Aza mba ho hitako anie izay hahafatesan''ny zaza. Ary nipetraka tandrifiny izy, dia nanandratra ny feony nitomany.'
mg1865::mg_1::21::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ren''Andriamanitra ny feon''ny zaza, dia niantso an''i Hagara Ilay Anjelin''Andriamanitra tany an-danitra ka nanao taminy hoe : Inona izato manjo anao, ry Hagara ? Aza matahotra, fa efa ren''Andriamanitra ny feon''ny zaza eo amin''ny itoerany.'
mg1865::mg_1::21::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mitsangana, areno ny zaza, ka tantano; fa hataoko firenena lehibe izy.'
mg1865::mg_1::21::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampahiratin''Andriamanitra ny mason''i Hagara, ka nahita lavaka fantsakana izy; ary lasa izy, dia nameno rano ny siny hoditra ka nampisotro rano ny zaza.'
mg1865::mg_1::21::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nomban''Andriamanitra ny zaza. dia nitombo izy; ary nonina tany an''efitra izy ka nony efa lehibe dia tonga mpandefa tsipïka.'
mg1865::mg_1::21::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nonina tany an''efitra Parana izy ka nakan''ny reniny vady avy tany amin''ny tany Egypta izy.'
mg1865::mg_1::21::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 22
  verse_date_revised: null
  verse_title: 'Ny fanekena nataon''i Abrahama sy Abimeleka'
  verse_text: 'Ary tamin''izany andro izany Abimeleka sy Pikola, komandin''ny miaramilany, dia niteny tamin''i Abrahama ka nanao hoe: Omban''Andriamanitra ianao amin''izay rehetra ataonao;'
mg1865::mg_1::21::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'koa ankehitriny ianiano amin''Andriamanitra aho fa tsy hamitaka ahy na ny zanako na ny taranako ianao; fa araka ny soa izay efa nataoko taminao no mba ataovy amiko sy amin''ny tany izay ivahinianao.'
mg1865::mg_1::21::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abrahama: Hianiana ihany aho.'
mg1865::mg_1::21::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama nananatra an''i Abimeleka noho ny lavaka fantsakana anankiray izay efa nalain''ny mpanompon''i Abimeleka an-keriny'
mg1865::mg_1::21::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Abimeleka: Tsy fantatro izay nanao izany; fa ianao tsy mbola nanambara tamiko, ary izaho koa tsy mba nahare, raha tsy vao izao.'
mg1865::mg_1::21::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama naka ondry aman''osy sy omby. ka nomeny an''i Abimeleka; dia nanao fanekena izy roa lahy.'
mg1865::mg_1::21::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama nanokana ondrivavikely fito navahana tamin''ny ondry.'
mg1865::mg_1::21::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abimeleka tamin''i Abrahama: Hatao inona ireo ondrivavy kely fito natokanao ireo?'
mg1865::mg_1::21::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Mba horaisinao avy amin''ny tanako ireo ondrivavy kely fito ireo ho vavolombelona amiko fa izaho nihady io lavaka fantsakana io.'
mg1865::mg_1::21::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izany no nanaovana io tany io hoe Beri-sheba; satria teo no nianianan''izy roa lahy.'
mg1865::mg_1::21::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanao fanekena tany Beri-sheba izy; ary dia niainga Abimeleka sy Pikola, komandin''ny miaramilany, ka niverina ho any amin''ny tanin''ny Filistina.'
mg1865::mg_1::21::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namboly hazo tamariska tany Beri-sheba Abrahama ka tao no niantsoany ny anaran''i Jehovah, dia Andriamanitra Mandrakizay.'
mg1865::mg_1::21::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 21
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama nivahiny elaela ihany tany amin''ny tanin''ny Filistina.'
mg1865::mg_1::22::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nizahan''Andriamanitra toetra an''i Abrahama'
  verse_text: 'Ary rehefa afaka izany zavatra izany, dia nizahan''Andriamanitra toetra Abrahama, ka hoy Izy taminy: Ry Abrahama o! ary hoy izy; Inty aho.'
mg1865::mg_1::22::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy: Ento ny zanakao, ny lahitokanao izay tianao, dia Isaka ka mankanesa any amin''ny tany Moria; ary atero any izy ho fanatitra dorana ao amin''ny tendrombohitra anankiray izay holazaiko aminao.'
mg1865::mg_1::22::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nifoha maraina koa Abrahama dia nanisy lasely ny borikiny ka nitondra zatovony roa lahy koa niaraka taminy sy Isaka zanany ary namaky ny hazo hataina amin''ny fanatitra dorana izy dia niainga ka nankany amin''ny tany izay efa nolazain''Andriamanitra taminy,'
mg1865::mg_1::22::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nony tamin''ny andro fahatelo Abrahama dia nanopy ny masony ka nahatazana ny tany tery lavitra ery.'
mg1865::mg_1::22::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abrahama tamin''ny zatovony: Mijanona eto amin''ny boriky ianareo, fa izaho sy ny zazalahy handeha hankery; ary hivavaka izahay dia hiverina eto aminareo indray.'
mg1865::mg_1::22::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nalain''i Abrahama ny hazo hataina amin''ny fanatitra dorana ka natataony an''Isaka zanany; fa izy kosa nitondra ny afo sy ny antsy teny an-tanany; ary dia niara-nandeha izy mianaka.'
mg1865::mg_1::22::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Isaka niteny tamin''i Abrahama rainy ka nanao hoe: Ry ikaky o! dia hoy izy: Inty aho, anaka. Ary hoy izy: Indreto ny afo sy ny kitay; fa aiza kosa izay ondry hatao fanatitra dorana?'
mg1865::mg_1::22::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Abrahama: Anaka. Andriamanitra no hahita izay ondry hatao fanatitra dorana; dia niara-nandeha izy mianaka.'
mg1865::mg_1::22::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tonga teo amin''ny tany izay efa nolazain''Andriamanitra taminy izy, dia nanorina ny alitara teo Abrahama ka nandahatra ny kitay; dia namatotra an''i Isaka zanany izy ka nametraka azy tambonin''ny alitara teo ambonin''ny kitay.'
mg1865::mg_1::22::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama naninjitra ny tanany ka nandray ny antsy mba hamonoany ny zanany.'
mg1865::mg_1::22::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa niantso azy Ilay Anjelin''i Jehovah tany an-danitra ka nanao hoe: Ry Abrahama, ry Abrahama o! ary hoy kosa izy: Inty aho.'
mg1865::mg_1::22::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Izy: Aza maninjitra ny tananao amin''ny zazalahy, ary aza maninona azy akory ianao; fa hitako izao fa matahotra an''Andriamanitra ianao, ka tsy narovanao tamiko ny zanakao, dia ny lahitokanao.'
mg1865::mg_1::22::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 13
  verse_date_revised: '2022-06-06T05:44:18+0000'
  verse_title: null
  verse_text: 'Ary Abrahama niherika nijery ka, indro, nisy ondrilahy teo ivohony, voasarangotry ny kirihitrala ny tandrony; dia lasa Abrahama ka naka ny ondrilahy ary nanatitra azy ho fanatitra dorana ho solon''ny zanany.'
mg1865::mg_1::22::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''izany tany izany dia nataon''i Abrahama hoe Jehovah-jire; dia izany no anaovana mandraka ankehitriny ny hoe: Any an-tendrombohitra no hisehoan''i Jehovah.'
mg1865::mg_1::22::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niantso an''i Abrahama fanindroany tany an-danitra Ilay Anjelin''i Jehovah'
mg1865::mg_1::22::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka nanao hoe: Ny tenako no nianianako, hoy Jehovah: Satria nanao izany zavatra izany ianao ka tsy niaro ny zanakao, ilay lahitokanao,'
mg1865::mg_1::22::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia hitahy anao tokoa Aho ary hahamaro dia hahamaro ny taranakao, ho tahaka ny kintana eny amin''ny lanitra sy ho tahaka ny fasika izay any amoron-dranomasina; ary ny taranakao hahazo ny vavahadin''ny fahavalony;'
mg1865::mg_1::22::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary amin''ny taranakao no hitahiana ny firenena rehetra ambonin''ny tany, satria nanaiky ny teniko ianao.'
mg1865::mg_1::22::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama dia niverina nankeny amin''ny zatovony; dia niainga izy ka niaraka nankany Beri-sheba; ary Abrahama dia nonina tany Beri-sheba.'
mg1865::mg_1::22::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 20
  verse_date_revised: null
  verse_title: 'Ny taranak''i Nahora'
  verse_text: 'Ary rehefa afaka izany, dia nisy nanambara tamin''i Abrahama hoe: Indro, efa niteraka zazalahy koa Milka tamin''i Nahora rahalahinao,'
mg1865::mg_1::22::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia Oza lahimatoany sy Boza lahiaivo ary Kemoela, rain''i Arama,'
mg1865::mg_1::22::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary Kaseda sy Hazo sy Pildasy sy Jidiafa ary Betoela.'
mg1865::mg_1::22::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Betoela niteraka an-dRebeka. Ireo valo ireo no naterak''i Milka tamin''i Nahora, rahalahin''i Abrahama.'
mg1865::mg_1::22::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 22
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny vaditsindranony, izay atao hoe Reoma, izy koa dia niteraka an''i Teba sy Gahama sy Tahasy ary Meaka.'
mg1865::mg_1::23::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nahafatesan''i Saraha sy ny nandevenana azy'
  verse_text: 'Ary ny andro niainan''i Saraha dia fito amby roa-polo amby zato taona; izany no taona niainan''i Saraha.'
mg1865::mg_1::23::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Saraha dia maty tao Kiriat-arba (Hebrona izany) tany amin''ny tany Kanana; dia tonga Abrahama hisaona an''i Saraha sy hitomany azy.'
mg1865::mg_1::23::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abrahama nitsangana niala avy teo anilan''ny fatin''ny vadiny, dia niteny tamin''ny taranak''i Heta ka nanao hoe:'
mg1865::mg_1::23::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Vahiny sy mpivahiny eto aminareo aho; omeo tany fandevenana eto aminareo aho mba handevenako ny fatin''ny vadiko tsy ho eto anatrehako.'
mg1865::mg_1::23::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly an''i Abrahama ny taranak''i Heta ka nanao taminy hoe:'
mg1865::mg_1::23::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mihainoa anay, tompokolahy: andrian-dehibe eto aminay ianao; koa izay tsara indrindra amin''ny fasanay no andeveno ny fatin''ny vadinao; tsy misy aminay hiaro ny fasany aminao tsy handevenanao ny fatin''ny vadinao.'
mg1865::mg_1::23::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitsangana Abrahama ka niankohoka teo anatrehan''ny taranak''i Heta tompon-tany,'
mg1865::mg_1::23::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia niteny taminy ka nanao hoe: Raha sitrakareo ary ny handevenako ny fatin''ny vadiko mba tsy ho eto anatrehako, dia mihainoa ahy, ka mba iangavio kely amin''i Efrona, zanak''i Zohara,'
mg1865::mg_1::23::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'mba homeny ahy ny zohy ao Makpela izay azy, dia ilay eo amin''ny sisin''ny sahany; amin''izay vola tokom-bidiny no aoka hanomezany azy ho ahy eto aminareo ho tany fandevenana.'
mg1865::mg_1::23::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Efrona nipetraka teo amin''ny taranak''i Heta; dia namaly an''i Abrahama Efrona Hetita teo anatrehan''ny taranak''i Heta, dia izay rehetra niditra teo am-bavahadin''ny tanànany, ka nanao hoe:'
mg1865::mg_1::23::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tsia, tompokolahy, fa mihainoa ahy: ny saha dia omeko anao, ary ny zohy izay eo anatiny koa dia omeko anao; eto imason''ny zanaky ny fireneko no anomezako azy ho anao; aleveno ny fatin''ny vadinao.'
mg1865::mg_1::23::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niankohoka teo anatrehan''ny olona tompon-tany Abrahama,'
mg1865::mg_1::23::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia niteny tamin''i Efrona teo anatrehan''ny olona tompon-tany ka nanao hoe: Kanefa raha mba hihaino ahy ihany ianao, dia homeko ny vidin''ny saha; raiso amiko izany, dia haleviko ao ny fatin''ny vadiko.'
mg1865::mg_1::23::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Efrona dia namaly an''i Abrahama ka nanao taminy hoe:'
mg1865::mg_1::23::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tompokolahy, mihainoa ahy: tany tokony ho lafo sekely volafotsy efa-jato, inona moa izany amintsika roa lahy? fa aleveno ny fatin''ny vadinao.'
mg1865::mg_1::23::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia neken''i Abrahama ny tenin''i Efrona, ka nolanjainy ho azy ny vola izay efa voalazany teo anatrehan''ny taranak''i Heta, dia sekely volafotsy efa-jato lanin''ny mpivarotra.'
mg1865::mg_1::23::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny sahan''i Efrona, ilay teo Makpela, izay tandrifin''i Mamre, dia ny saha sy ny zohy izay teo anatiny mbamin''ny hazo rehetra izay teo anatiny, izay teo amin''ny sisiny rehetra manodidina, dia natao varo-maty'
mg1865::mg_1::23::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 18
  verse_date_revised: '2022-05-09T06:20:28+0000'
  verse_title: null
  verse_text: 'tamin''i Abrahama ho fananana, teo imason''ny taranak''i Heta, dia izay rehetra niditra teo ambavahadin''ny tanànany.'
mg1865::mg_1::23::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka izany, Abrahama dia nandevina an''i Saraha vadiny tao amin''ny zohy tao amin''ny saha Makpela tandrifin''i Mamre (Hebrona izany), ao amin''ny tany Kanana;'
mg1865::mg_1::23::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 23
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka ny saha mbamin''ny zohy izay ao anatiny dia nataon''ny taranak''i Heta varo-maty tamin''i Abrahama ho tany fandevenana.'
mg1865::mg_1::24::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nampakan''i Abrahama vady ho an''Isaka avy tany amin''ny tanin''ny havany'
  verse_text: 'Ary Abrahama dia efa zokiolona sady nandroso fahanterana; ary Jehovah efa nitahy an''i Abrahama tamin''ny zavatra rehetra.'
mg1865::mg_1::24::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abrahama tamin''ilay lehiben''ny mpanompony tao an-tranony, izay mpanapaka ny nananany rehetra: Mba ataovy ato ambanin''ny feko ny tananao;'
mg1865::mg_1::24::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa hampianianiko amin''i Jehovah, Andriamanitry ny lanitra sy ny tany, ianao, fa tsy haka vady ho an''ny zanako avy amin''ny zanakavavin''ny Kananita izay iraisako monina ianao;'
mg1865::mg_1::24::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa any amin''ny tanin-drazako sy amin''ny havako no halehanao haka vady ho an''Isaka zanako.'
mg1865::mg_1::24::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ilay mpanompony taminy: Angamba tsy hety hiaraka amiko ho amin''ity tany ity ny vehivavy; moa tsy maintsy hitondra ny zanakao hiverina ho any amin''ny tany izay nialanao va aho?'
mg1865::mg_1::24::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abrahama taminy: Tandremo mba tsy ho entinao miverina any ny zanako.'
mg1865::mg_1::24::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Jehovah, Andriamanitry ny lanitra, Izay naka ahy niala tamin''ny tranon''ny raiko sy tamin''ny tany nahaterahako, sady niteny tamiko sy nianiana tamiko hoe: Ny taranakao no homeko ity tany ity, dia Izy no haniraka Ilay Anjeliny eo alohanao, ka any no hakanao vady ho an''ny zanako.'
mg1865::mg_1::24::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha tsy hety hiaraka aminao ny vehivavy, dia ho afaka amin''izao fampianianako anao izao ianao; fa izao ihany: aza entinao miverina any mihitsy ny zanako'
mg1865::mg_1::24::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nataon''ilay mpanompo tambanin''ny fen''i Abrahama tompony ny tanany, ka nianiana taminy ny amin''izany zavatra izany izy.'
mg1865::mg_1::24::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ilay mpanompo naka rameva folo tamin''ny ramevan''ny tompony ka lasa, ary izay zava-tsoa nananan''ny tompony dia samy nitondrany avokoa; dia nandeha izy ka nankany Mesopotamia ho any an-tanànan''i Nahora.'
mg1865::mg_1::24::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nampandohalehiny teo ivelan''ny tanàna tanilan''ny lavaka fantsakan-drano ny rameva, rehefa harivariva ny andro, dia tamin''ilay fandehanan''ny vehivavy mpantsaka iny'
mg1865::mg_1::24::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Jehovah ô, Andriamanitr''i Abrahama tompoko, ambino aho anio, ary asio soa Abrahama tompoko.'
mg1865::mg_1::24::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Indro, mijanona eto anilan''ny fantsakana aho; ary ny zanakavavin''ny mponina ao an-tanàna mivoaka hantsaka rano;'
mg1865::mg_1::24::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'koa izay zazavavy hilazako hoe: Mba areno kely ny sininao hisotroako, ka hamaly hoe izy: Misotroa, sady hampisotro ny ramevanao koa aho : dia izy ihany no aoka ho voatendrinao ho an''Isaka mpanomponao; ary izany no hahafantarako fa nasianao soa ny tompoko.'
mg1865::mg_1::24::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 15
  verse_date_revised: '2022-06-09T11:37:10+0000'
  verse_title: null
  verse_text: 'Ary raha tsy mbola nitsaha-niteny izy, dia, indro, tamy Rebeka, izay naterak''i Betoela, zanakalahin''i Milka, vadin''i Nahora, rahalahin''i Abrahama, nilanja ny sininy teny an-tsorony.'
mg1865::mg_1::24::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ilay zazavavy dia tsara tarehy indrindra sady virijina, ka tsy mbola nisy lehilahy nahalala azy; ary nidina nankeo amin''ny fantsakana izy ka nameno ny sininy, dia niakatra.'
mg1865::mg_1::24::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ilay mpanompo dia nihazakazaka nitsena azy ka nanao taminy hoe: Mba ampisotroy rano kely avy amin''ny sininao aho.'
mg1865::mg_1::24::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy razazavavy: Misotroa, tompokolahy; dia nampidininy faingana ny sininy ho eo an-tanany, ka nampisotroiny ralehilahy.'
mg1865::mg_1::24::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nampisotro azy izy, dia hoy koa izy: Ny ramevanao koa andeha hantsakako hosotroiny ambara-pahatapiny misotro.'
mg1865::mg_1::24::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dia naidiny faingana ny rano teo an-tsininy ho eo amin''ny tavy fisotroana, dia nihazakazaka indray izy nankeo amin''ny lavaka fantsakana hantsaka; ary nantsaka ho an''ny ramevany rehetra izy.'
mg1865::mg_1::24::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ralehilahy nandinika azy tsara sady nangina, mba hahafantarany na efa nambinin''i Jehovah ny nalehany, na tsia.'
mg1865::mg_1::24::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tapi-nisotro avokoa ny rameva, dia nalain-dralehilahy ny kavin''orona volamena iray, lanjan''ny sasaky ny sekely, sy haba volamena roa, lanjan''ny sekely folo, hatao amin''ny tanany;'
mg1865::mg_1::24::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary hoy izy: Zana-jovy moa ianao ? Mba lazao amiko. Ary moa misy azonay handriana va ao an-tranon''ny rainao?'
mg1865::mg_1::24::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy taminy: Zanakavavin''i Betoela, zanakalahin''i Milka, izay naterany tamin''i Nahora, aho.'
mg1865::mg_1::24::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa izy taminy: Na ny mololo na ny vilona, dia samy betsaka ao aminay, sady misy trano handrianareo koa.'
mg1865::mg_1::24::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niondrika ralehilahy ka niankohoka teo anatrehan''i Jehovah,'
mg1865::mg_1::24::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary nanao hoe: Isaorana anie Jehovah, Andriamanitr''i Abrahama tompoko, Izay tsy nanaisotra ny famindram-pony sy ny fahamarinany tamin''ny tompoko; fa izaho dia notantanan''i Jehovah teny an-dàlana ho aty an-tranon''ny havan''ny tompoko.'
mg1865::mg_1::24::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia lasa nihazakazaka razazavavy ka nanambara araka izany teny izany tamin''ny tao an-tranon''ny reniny.'
mg1865::mg_1::24::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Rebeka nanana anadahy, Labana no anarany; dia nihazakazaka Labana nankeo amin-dralehilahy teo ivelany, teo am-pantsakana.'
mg1865::mg_1::24::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitany ny kavin''orona sy ny haba teny an-tanan ''ny anabaviny, sady efa reny ny tenin-dRebeka anabaviny nanao hoe: Izany no nolazain-dralehilahy tamiko, dia nankeo amin-dralehilahy izy; ary, indro, mbola nijanona teo anilan''ny rameva teo am-pantsakana ralehilahy.'
mg1865::mg_1::24::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Labana: Miakara. ry ilay notahin''i Jehovah; nahoana no mijanona eto ivelany ianao? fa izaho efa namboatra ny trano sy izay hitoeran''ny rameva.'
mg1865::mg_1::24::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niditra tao an-trano ralehilahy; ary Labana dia namaha ny entana tamin''ny rameva ka nanome mololo sy vilona ho an''ny rameva ary rano hanasana ny tongo-dralehilahy sy ny tongotry ny olona izay nomba azy.'
mg1865::mg_1::24::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandroso hanina teo anoloany izy; fa hoy ralehilahy: Tsy mbola hihinana aho, raha tsy efa voalazako ny raharahako. Ary hoy izy: Lazao ary!'
mg1865::mg_1::24::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ralehilahy: Mpanompon''i Abrahama aho.'
mg1865::mg_1::24::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah efa nitahy ny tompoko indrindra, ka efa be ny fananany; ary Jehovah efa nanome azy ondry aman''osy sy omby, ary volafotsy sy volamena, ary andevolahy sy andevovavy, ary rameva sy boriky.'
mg1865::mg_1::24::36:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa antitra Saraha, vadin''ny tompoko, dia niteraka zazalahy tamin''ny tompoko izy; ary efa natolotry ny tompoko ho an''ny zanany izay rehetra ananany.'
mg1865::mg_1::24::37:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary efa nampianiana ahy ny tompoko ka nanao hoe: Aza maka vady ho an''ny zanako avy amin''ny zanakavavin''ny Kananita, izay iraisako monina;'
mg1865::mg_1::24::38:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa any amin''ny tranon''ikaky sy any amin''ny havako no halehanao ka hakanao vady any ho an''ny zanako.'
mg1865::mg_1::24::39:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 39
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izaho namaly ny tompoko hoe: Angamba tsy hety hiaraka amiko ny vehivavy.'
mg1865::mg_1::24::40:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 40
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy tamiko: Jehovah, Izay andehanako eo anatrehany, dia haniraka Ilay Anjeliny homba anao sy hanambina ny alehanao, ary ianao haka vady ho an''ny zanako avy amin''ny havako sy amin''ny tranon''ikaky.'
mg1865::mg_1::24::41:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 41
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia ho afaka amin''ny fampianianako anao ianao, raha tonga any amin''ny havako; ary raha tsy manome anao ry zareo, dia ho afaka amin''ny fampianianako anao koa ianao.'
mg1865::mg_1::24::42:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 42
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tonga androany teo amin''ny fantsakana aho, ka hoy izaho: Jehovah ô, Andriamanitr''i Abrahama tompoko, raha hanambina ny alehako Ianao,'
mg1865::mg_1::24::43:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 43
  verse_date_revised: null
  verse_title: null
  verse_text: 'indro, mijanona eto anilan''ny fantsakana aho, koa izay zazavavy hivoaka hantsaka ka hilazako hoe : Mba ampisotroy rano kely avy amin''ny sininao aho,'
mg1865::mg_1::24::44:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 44
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka hamaly hoe izy: Misotroa, ary hantsakako koa ny ramevanao: dia izy no aoka ho izay vehivavy voatendrin''i Jehovah ho an''ny zanakalahin''ny tompoko.'
mg1865::mg_1::24::45:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 45
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha tsy mbola nitsahatra niteny anakampo aho, dia, indro, tamy Rebeka nilanja ny sininy teny an-tsorony, dia nidina nankeo amin''ny fantsakana izy ka nantsaka; ary hoy izaho taminy: Mba ampisotroy rano kely aho.'
mg1865::mg_1::24::46:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 46
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampidininy faingana ny sininy hiala teo an-tsorony, ka hoy izy: Misotroa, ary hampisotroiko koa ny ramevanao; dia nisotro aho, ary nampisotro ny rameva koa izy.'
mg1865::mg_1::24::47:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 47
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanontany azy aho ka nanao hoe: Zana-jovy moa ianao? Ary hoy izy: Zanak''i Betoela, zanakalahin''i Nahora, aho, izay naterak''i Milka taminy. Dia nataoko teo anorony ny kavin''orona, ary ny haba teny amin''ny tanany.'
mg1865::mg_1::24::48:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 48
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niondrika aho ka niankohoka teo anatrehan''i Jehovah, dia nisaotra an''i Jehovah, Andriamanitr''i Abrahama tompoko, Izay efa nitondra ahy tamin''ny lalana marina haka ny zanakavavin''ny rahalahin''ny tompoko, ho an''ny zanany'
mg1865::mg_1::24::49:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 49
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny, raha hanao izay soa sy marina amin''ny tompoko ianareo, dia lazao amiko; fa raha tsy izany kosa, dia lazao amiko, mba hiviliako na ho amin''ny ankavanana, na ho amin''ny ankavia.'
mg1865::mg_1::24::50:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 50
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly Labana sy Betoela ka nanao hoe: Avy tamin''i Jehovah no nisehoan''izany zavatra izany, ka tsy mahazo milaza teny aminao izahay, na ratsy na soa.'
mg1865::mg_1::24::51:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 51
  verse_date_revised: null
  verse_title: null
  verse_text: 'Indro, Rebeka eto anatrehanao, ento izy, ka mandehana; ary aoka ho vadin''ny zanaky ny tomponao izy, araka izay nolazain''i Jehovah.'
mg1865::mg_1::24::52:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 52
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nandre ny tenin-dry zareo ilay mpanompon''i Abrahama, dia niankohoka tamin''ny tany teo anatrehan''i Jehovah izy.'
mg1865::mg_1::24::53:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 53
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ilay mpanompo dia namoaka firavaka volafotsy sy firavaka volamena ary fitafiana, ka nomeny an-dRebeka; ary nomeny zava-tsoa koa ny anadahiny sy ny reniny.'
mg1865::mg_1::24::54:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 54
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia vao izay no nihinana sy nisotro izy mbamin''ireo lehilahy izay nomba azy, dia nandry. Ary nifoha maraina izy ka nanao hoe: Alefaso ary aho handeha ho any amin''ny tompoko.'
mg1865::mg_1::24::55:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 55
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny anadahin-dRebeka sy ny reniny: Aoka hitoetra aty aminay andro vitsivitsy ny zazavavy, na dia hafoloana ihany aza; fa rehefa afaka izany, dia handeha izy.'
mg1865::mg_1::24::56:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 56
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy ralehilahy taminy: Aza samponanareo aho, fa Jehovah efa nanambina ny alehako; alefaso aho mba hankany amin''ny tompoko.'
mg1865::mg_1::24::57:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 57
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy ireo: Aoka ary hantsoinay ny zazavavy, ka hanontanianay izay teniny.'
mg1865::mg_1::24::58:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 58
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niantso an-dRebeka izy ka nanao taminy hoe: Handeha hiaraka amin''io lehilahy io va ianao? Ary hoy izy: Handeha aho.'
mg1865::mg_1::24::59:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 59
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namoaka an-dRebeka anabaviny sy ny mpitaiza azy ary ilay mpanompon''i Abrahama mbamin''ny olony izy.'
mg1865::mg_1::24::60:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 60
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitso-drano an-dRebeka izy ka nanao taminy hoe: Ry anabavinay, tongava alinalina anie ianao, ary aoka ny taranakao hahazo ny vavahadin''izay mankahala azy.'
mg1865::mg_1::24::61:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 61
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niainga Rebeka mbamin''ny ankizivaviny ka nitaingina ny rameva, dia nandeha niaraka tamin-dralehilahy; ary nitondra an-dRebeka ilay mpanompo ka lasa nandeha.'
mg1865::mg_1::24::62:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 62
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Isaka efa tonga avy tamin''ny nalehany tany Bera-lahai-roy; fa nonina tany amin''ny tany atsimo izy.'
mg1865::mg_1::24::63:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 63
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Isaka nivoaka mba hieritreritra any an-tsaha, rehefa nitehin-ko hariva ny andro; dia nanopy ny masony izy ka nahita fa indrery nisy rameva avy manatona.'
mg1865::mg_1::24::64:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 64
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Rebeka koa nanopy ny masony ka nahatazana an''Isaka; dia nidina faingana niala tamin''ny rameva izy.'
mg1865::mg_1::24::65:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 65
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy tamin''ilay mpanompo: Iza moa iry lehilahy mitsangantsangana eny an-tsaha avy mitsena antsika iry? Ary hoy ilay mpanompo : Iny no tompoko, dia nandray ny fisalobonana Rebeka, ka nisalobonany.'
mg1865::mg_1::24::66:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 66
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dia nambaran''ilay mpanompo tamin''Isaka ny zavatra rehetra izay efa nataony.'
mg1865::mg_1::24::67:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 24
  verse_number: 67
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Isaka dia nampandroso an-dRebeka ho ao an-dain''i Saraha reniny ka nampakatra azy ho vadiny; ary tia azy izy, dia nionona ny alahelony an-dreniny.'
mg1865::mg_1::25::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nanambadian''i Abrahama an''i Ketora, sy ny taranany avy taminy; ary ny nahafatesan''i Abrahama, sy ny nandevenan''ny zanany azy'
  verse_text: 'Ary Abrahama nampaka-bady indray, Ketora no anarany.'
mg1865::mg_1::25::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niteraka an''i Zimrana sy Joksana sy Medana sy Midiana sy Jisbaka ary Soaha tamin''i Abrahama izy.'
mg1865::mg_1::25::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Joksana niteraka an''i Sheba sy Dedana. Ary ny zanakalahin''i Dedana dia Asorima sy Letosima ary Leomima.'
mg1865::mg_1::25::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Midiana dia Efaha sy Efera sy Hanoka sy Abida ary Eldaha. Ireo rehetra ireo no zanak''i Ketora.'
mg1865::mg_1::25::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia natolotr''i Abrahama an''Isaka izay rehetra nananany.'
mg1865::mg_1::25::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ny zanak''ireo vaditsindranony hafa, izay nananan''i Abrahama, dia samy notolorany avy ka nampandehaniny, dieny mbola velona izy, hiala amin''Isaka zanany hiantsinanana ho any amin''ny tany atsinanana.'
mg1865::mg_1::25::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Abrahama dia dimy amby fito-polo amby zato taona.'
mg1865::mg_1::25::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niala aina Abrahama ka maty, rehefa fotsy volo tsara sady lahy antitra ela niainana; dia voangona any amin''ny razany izy.'
mg1865::mg_1::25::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nalevin''Isaka sy Isimaela zanany izy tao amin''ny zohy ao Makpela, tao amin''ny sahan''i Efrona, zanak''i Zohara Hetita, izay tandrifin''i Mamre,'
mg1865::mg_1::25::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia ilay saha izay novinidin''i Abrahama tamin''ny taranak''i Heta; tao no nandevenana an''i Abrahama sy Saraha vadiny.'
mg1865::mg_1::25::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa maty Abrahama, dia notahin''Andriamanitra Isaka zanany; ary Isaka dia nonina teo akaikin''i Bera-lahai-roy.'
mg1865::mg_1::25::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 12
  verse_date_revised: null
  verse_title: 'Ny taranak''Isimaela'
  verse_text: 'Ary izao no taranak''Isimaela, zanakalahin''i Abrahama izay naterak''i Hagara, ilay Egyptiana, andevovavin''i Saraha, tamin''i Abrahama :'
mg1865::mg_1::25::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izao no anaran''ny zanakalahin''Isimaela, araka ny anarany sy araka ny taranany: Nebaiota, lahimatoan''Isimaela, sy Kedara sy Adbela sy Mibsama'
mg1865::mg_1::25::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Misma sy Doma sy Masa'
mg1865::mg_1::25::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Hadada sy Tema sy Jetora sy Nafisy ary Kedema.'
mg1865::mg_1::25::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izy ireo no zanakalahin''Isimaela, ary ireo no anarany, araka ny vohiny sy ny tobiny, dia andriana roa ambin''ny folo araka ny fireneny.'
mg1865::mg_1::25::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''Isimaela dia fito amby telo-polo amby zato taona; ary niala aina izy ka maty, dia voangona any amin''ny razany.'
mg1865::mg_1::25::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny taranany nonina hatrany Havila ka hatrany Sora, izay tandrifin''i Egypta amin''ny lalana mankany Asyria; nifanandrify tamin''ny rahalahiny rehetra no nitoerany.'
mg1865::mg_1::25::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 19
  verse_date_revised: null
  verse_title: 'Ny amin''i Esao sy Jakoba'
  verse_text: 'Ary izao no taranak''Isaka, zanakalahin''i Abrahama:'
mg1865::mg_1::25::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Abrahama niteraka an''Isaka; ary efa-polo taona Isaka, raha nampakatra an-dRebeka, zanakavavin''i Betoela Syriana, avy tany Mesopotamia, sady anabavin''i Labana Syriana.'
mg1865::mg_1::25::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Isaka nangataka tamin''i Jehovah ho an''ny vadiny, satria momba izy; ary nohenoin''i Jehovah ny fangatahany, dia nanan''anaka Rebeka vadiny.'
mg1865::mg_1::25::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nifanosika ny zaza kambana tao an-kibony; ary hoy Rebeka: Raha izao, nahoana re aho no dia mbola velona? Dia lasa nanontany tamin''i Jehovah izy.'
mg1865::mg_1::25::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah taminy: Firenena roa no ao an-kibonao; ary vahoaka roa toko no hisaraka hatrao am-bohokanao; ary ny vahoaka iray toko hahery noho ny iray toko. Ka ny zokiny hanompo ny zandriny.'
mg1865::mg_1::25::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tonga ny andro hahaterahany, indreo, nisy zaza kambana tao an-kibony.'
mg1865::mg_1::25::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia teraka ny voalohany ka mena, ary tahaka ny kapoty volom-biby ny tenany rehetra; dia nataony hoe Esao ny anarany.'
mg1865::mg_1::25::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka izany, dia teraka koa ny rahalahiny, ary ny tanany nihazona ny ombelahin-tongotr''i Esao, dia nataony hoe Jakoba ny anarany; ary efa enim-polo taona Isaka tamin''ny niterahana azy mirahalahy.'
mg1865::mg_1::25::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitombo ireo zaza ireo; ary Esao lehilahy nahay nihaza, dia mpianefitra, fa Jakoba kosa lehilahy tsara fanahy sady mpitoetra an-day.'
mg1865::mg_1::25::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Isaka tia an''i Esao, satria nankafy ny hazany; fa Rebeka kosa tia an''i Jakoba.'
mg1865::mg_1::25::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nahandro hanina Jakoba; ary sendra avy tany an-tsaha Esao ka reraka.'
mg1865::mg_1::25::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Esao tamin''i Jakoba: Mba anomezo ahy hohaniko ny mena, dia io mena io, fa reraka aho (izany no nanaovana ny anarany hoe Edoma).'
mg1865::mg_1::25::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Jakoba: Amidio amiko ary aloha ny fizokianao.'
mg1865::mg_1::25::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy kosa Esao: Indro, ho faty ihany aho; ka mahasoa inona izay fizokiana?'
mg1865::mg_1::25::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba: Mianiana ary amiko aloha. Dia nianiana taminy izy; ka dia namidiny tamin''i Jakoba ny fizokiany.'
mg1865::mg_1::25::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 25
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba nanome an''i Esao mofo sy voanemba masaka; dia nihinana sy nisotro izy, ary niainga ka lasa nandeha. Izany no nanamavoan''i Esao ny fizokiany.'
mg1865::mg_1::26::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nivahinian''Isaka tany Gerara'
  verse_text: 'Ary nisy mosary indray teo amin''ny tany afa-tsy ilay mosary voalohany fony fahavelon''i Abrahama. Ary Isaka nankany amin''i Abimeleka mpanjakan''ny Filistina, tany Gerara.'
mg1865::mg_1::26::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah niseho taminy ka nanao hoe: Aza midina any Egypta ianao; mitoera eo amin''ny tany izay holazaiko aminao.'
mg1865::mg_1::26::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mivahinia eto amin''ity tany ity ianao, dia homba anao sy hitahy anao Aho; fa ianao sy ny taranakao no homeko ireto tany rehetra ireto, ka hotoviko ny fianianana izay nataoko tamin''i Abrahama rainao;'
mg1865::mg_1::26::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia hahamaro ny taranakao ho tahaka ny kintana eny amin''ny lanitra Aho, ka homeko ny taranakao ireto tany rehetra ireto, ary amin''ny taranakao no hitahiana ny firenena rehetra ambonin''ny tany;'
mg1865::mg_1::26::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'satria efa nihaino ny feoko Abrahama ka nitandrina izay nasaiko notandremany, dia ny didiko sy ny teniko ary ny lalàko.'
mg1865::mg_1::26::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Isaka dia nitoetra tany Gerara.'
mg1865::mg_1::26::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny lehilahy tompon-tany nanontany ny amin''ny vadiny; ary hoy kosa izy: Anabaviko izy; fa natahotra hilaza hoe: Vadiko izy, fandrao, hoy izy, hamono ahy ny lehilahy tompon-tany noho Rebeka, satria tsara tarehy izy.'
mg1865::mg_1::26::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nitoetra ela teo izy, dia nitsirika teo am-baravarankely Abimeleka, mpanjakan''ny Filistina, ka nahita fa, indro, Isaka nisangy tamin-dRebeka vadiny.'
mg1865::mg_1::26::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abimeleka dia niantso an''Isaka ka nanao hoe: Efa hita mihitsy fa vadinao izy, ka nahoana no nolazainao hoe: Anabaviko izy? Ary hoy Isaka taminy: Satria hoy izaho anakampo: Fandrao maty aho noho ny aminy.'
mg1865::mg_1::26::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abimeleka: Inona izao nataonao taminay izao? Saiky nisy nandry tamin''ny vadinao ny olona, dia ho nahatonga heloka taminay ianao.'
mg1865::mg_1::26::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandidy ny vahoakany rehetra Abimeleka ka nanao hoe: Izay manendry io lehilahy io na ny vadiny dia hatao maty tokoa.'
mg1865::mg_1::26::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namafy tamin''izany tany izany Isaka ka nahazo zato heny tamin''izay taona izay, satria efa notahin''i Jehovah izy.'
mg1865::mg_1::26::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanan-karena ralehilahy ka nandroso sy nitombo ambara-pahatongany ho mpanjatobe indrindra;'
mg1865::mg_1::26::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa nanana fananana be izy, dia ondry aman''osy sy omby ary andevo maro; ka dia nialona azy ny Filistina.'
mg1865::mg_1::26::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny lavaka fantsakana rehetra, izay efa nohadin''ny mpanompon-drainy fony fahavelon''i Abrahama rainy, dia efa novonoin''ny Filistina sy nototofany tany avokoa.'
mg1865::mg_1::26::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Abimeleka tamin''Isaka: Mialà aty aminay; fa ianao mahery lavitra noho izahay.'
mg1865::mg_1::26::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary lasa niala teo Isaka, dia nanorina ny lainy teo an-dohasahan''i Gerara ka nonina teo.'
mg1865::mg_1::26::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia noloaran''Isaka indray ny lavaka fantsakana izay voahady fony fahavelon''i Abrahama rainy, fa efa novonoin''ny Filistina ireny, rehefa maty Abrahama; ary dia nasiany anarana ireny araka ny anarana izay efa nanaovan-drainy azy ihany.'
mg1865::mg_1::26::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nihady teo amin''ny lohasaha ny mpanompon''Isaka ka nahita loharano velona teo.'
mg1865::mg_1::26::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niady tamin''ny mpiandry ombin''Isaka ny mpiandry omby tao Gerara ka nanao hoe: Anay ny rano; ary ny anaran''ny lavaka fantsakana dia nataon''Isaka hoe Eseka, satria nifanditra taminy izy ireo.'
mg1865::mg_1::26::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nihady lavaka fantsakana hafa koa izy, ka niadiany indray io; ary ny anarany dia nataony hoe Sitna.'
mg1865::mg_1::26::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nifindra niala teo izy ka nihady lavaka fantsakana hafa koa indray; fa io kosa tsy mba niadiany; koa ny anarany dia nataony hoe Rehobota; fa hoy izy: Efa nomen''i Jehovah toerana malalaka isika ankehitriny, dia hihamaro eo amin''ny tany.'
mg1865::mg_1::26::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 23
  verse_date_revised: null
  verse_title: 'Ny nifindran''Isaka nankany Beri-sheba, sy ny nanaovany fanekena tamin''i Abimeleka'
  verse_text: 'Dia niakatra niala teo izy ka nankany Beri-sheba.'
mg1865::mg_1::26::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah niseho taminy tamin''iny alina iny ka nanao hoe: Izaho no Andriamanitr''i Abrahama rainao; aza matahotra, fa momba anao Aho ka hitahy anao sy hahamaro ny taranakao noho ny amin''i Abrahama mpanompoko.'
mg1865::mg_1::26::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanorina alitara teo izy, dia niantso ny anaran''i Jehovah sady nanorina ny lainy teo koa; ary nihady lavaka fantsakana teo ny mpanompon''Isaka.'
mg1865::mg_1::26::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abimeleka mbamin''i Ahozata sakaizany sy Pikola, komandin''ny miaramilany, dia niala tao Gerara hankany amin''Isaka.'
mg1865::mg_1::26::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Isaka taminy: Nahoana ianareo no mankaty amiko, kanefa nankahala ahy ianareo ka nandroaka ahy niala teo aminareo?'
mg1865::mg_1::26::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy ireo: Efa hitanay marimarina fa momba anao Jehovah, ka dia hoy izahay: Aoka samy hanao fianianana isika, dia izahay sy ianao, ary aoka izahay hanao fanekena aminao,'
mg1865::mg_1::26::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa tsy hanisy ratsy anay ianao, tahaka ny tsy nanendrenay anao akory, sy tahaka ny tsy nanaovanay na inona na inona taminao afa-tsy ny soa ihany, fa efa nampandehaninay soa aman-tsara ianao. Fa ianao ankehitriny efa notahin''i Jehovah.'
mg1865::mg_1::26::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanao fanasana ho azy Isaka, ka dia nihinana sy nisotro izy.'
mg1865::mg_1::26::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nifoha maraina koa izy, ka samy nanao fianianana; dia nampandehanin''Isaka ireo, ka dia lasa nody soa aman-tsara izy.'
mg1865::mg_1::26::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''izany andro izany dia avy ny mpanompon''Isaka ka nanambara taminy ny amin''ny lavaka fantsakana izay efa nohadiny ka nanao taminy hoe: Efa nahita rano izahay.'
mg1865::mg_1::26::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanao ny anarany hoe Sheba izy; izany no nanaovana ny anaran''ny tanàna hoe Beri-sheba mandraka androany.'
mg1865::mg_1::26::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 34
  verse_date_revised: null
  verse_title: 'Ny nampakaran''i Esao vehivavy Kananita ho vadiny'
  verse_text: 'Ary rehefa efa-polo taona Esao, dia nampakatra an''i Jodita, zanakavavin''i Bery Hetita, sy Basemata, zanakavavin''i Elona Hetita, izy.'
mg1865::mg_1::26::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 26
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nangidy tamin''ny fanahin''Isaka sy Rebeka indrindra ireny.'
mg1865::mg_1::27::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny fitaka nataon''i Jakoba hahazoany ny tso-dranon''ny rainy'
  verse_text: 'Ary rehefa antitra Isaka, ary pahina ny masony ka tsy nahita, dia niantso an''i Esao lahimatoany izy ka nanao taminy hoe: Anaka; ary hoy izy taminy kosa: Inty aho.'
mg1865::mg_1::27::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Indro fa efa antitra aho, ka tsy fantatro izay andro hahafatesako;'
mg1865::mg_1::27::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'koa ankehitriny, masïna ianao, alao ny fitifiranao dia ny tranon-jana-tsipïkanao sy ny tsipïkanao, ary mankanesa any an-tsaha, ka ihazao aho;'
mg1865::mg_1::27::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary anaovy hanim-py aho araka ilay tiako, ka ento aty amiko hohaniko, mba hitsofan''ny fanahiko rano anao, dieny tsy mbola maty aho.'
mg1865::mg_1::27::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Rebeka nandre an''Isaka niteny tamin''i Esao zananilahy. Ary dia lasa nankany an-tsaha Esao nitady haza ho entiny.'
mg1865::mg_1::27::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Rebeka niteny tamin''i Jakoba zananilahy ka nanao hoe: Indro, efa reko ny rainao niteny tamin''i Esao rahalahinao nanao hoe:'
mg1865::mg_1::27::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ihazao aho, ka anaovy hanim-py hohaniko; dia hitso-drano anao aho eo anatrehan''i Jehovah, dieny tsy mbola maty aho.'
mg1865::mg_1::27::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny, anaka, araho ny teniko amin''izay asaiko ataonao.'
mg1865::mg_1::27::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mankanesa kely any amin''ny ondry aman''osy, ka analao zanak''osy roa tsara aho; dia hataoko hanim-py ho an''ny rainao araka ilay tiany izany;'
mg1865::mg_1::27::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary dia ho entinao any amin''ny rainao hohaniny, mba hitsofany rano anao, dieny tsy mbola maty izy.'
mg1865::mg_1::27::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Jakoba tamin-dRebeka reniny: Indro, Esao rahalahiko dia lehilahy voloina, fa izaho lehilahy malambo hoditra kosa;'
mg1865::mg_1::27::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary angamba hitsapa ahy ikaky, dia ho toy ny mpanandoka eo imasony aho ka hahatonga ozona amiko, fa tsy tso-drano.'
mg1865::mg_1::27::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny reniny taminy: Aoka ho ahy ihany anaka, ny ozona ho anao; araho ihany ny teniko, ka mandehana, itondray aho.'
mg1865::mg_1::27::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha izy ka naka, ary nitondra tao amin''ny reniny; ary ny reniny kosa dia nanao hanim-py araka ilay tian''ny rainy.'
mg1865::mg_1::27::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nalain-dRebeka ny fitafian''i Esao lahimatoany, dia ny tsara izay efa notehiriziny tao an-trano, ka nampitafiny an''i Jakoba zanany faralahy.'
mg1865::mg_1::27::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny hoditry ny zanak''osy dia nafonony ny tanany sy ny malambolambo amin''ny vozony;'
mg1865::mg_1::27::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia natolony teo an-tanan''i Jakoba zanany ny hanim-py sy ny mofo izay efa namboariny.'
mg1865::mg_1::27::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba nankany amin''ny rainy ka nanao hoe: Ry ikaky o! ary hoy kosa izy: Inty aho; iza moa ianao, anaka?'
mg1865::mg_1::27::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba tamin-drainy: Izaho no Esao zanakao lahimatoa; efa nanao araka izay nasainao nataoko aho; masïna ianao, miarena, dia mipetraha, ka hano ny hazako, mba hitsofan''ny fanahinao rano ahy.'
mg1865::mg_1::27::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Isaka tamin''ny zanany: Nanao ahoana, anaka, no dia nalaky nahazo toy izany ianao? Ary hoy izy: Satria Jehovah Andriamanitrao no nampahazo ahy.'
mg1865::mg_1::27::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Isaka tamin''i Jakoba; Mba manatona kely hoe hitsapako anao, anaka, hahafantarako na Esao zanako tokoa ianao, na tsia.'
mg1865::mg_1::27::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba nanatona an''Isaka rainy, ary izy dia nitsapa azy ka nanao hoe: Ny feo dia feon''i Jakoba, fa ny tanana dia tanan''i Esao.'
mg1865::mg_1::27::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tsy nahafantatra azy izy, satria voloina tahaka ny tanan''i Esao rahalahiny ny tanany; dia notsofiny rano izy.'
mg1865::mg_1::27::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Ianao tokoa moa no Esao zanako? Dia hoy izy: Izaho no izy.'
mg1865::mg_1::27::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy kosa Isaka: Arosoy eto anoloako ary izato hazan''ny zanako hihinanako, mba hitsofan''ny fanahiko rano anao. Ary dia narosony teo anoloany, ka dia nihinana izy; ary nitondrany divay izy, dia nisotro.'
mg1865::mg_1::27::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Isaka rainy taminy: Mba manatona kely ka manoroha ahy, anaka.'
mg1865::mg_1::27::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanatona izy ka nanoroka azy; ary Isaka nandre ny fofon''ny fitafiany, dia nitso-drano azy ka nanao hoe: E! ny fofon''ny zanako. Dia tahaka ny fofon''ny saha izay notahin''i Jehovah.'
mg1865::mg_1::27::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hanomezan''Andriamanitra anao anie ny andon''ny lanitra sy ny tsiron''ny tany, ary vary sy ranom-boaloboka betsaka.'
mg1865::mg_1::27::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 29
  verse_date_revised: '2022-06-25T06:39:40+0000'
  verse_title: null
  verse_text: 'Hanompo anao anie ny firenena maro, Ary hiankohoka eo anatrehanao ny firenena samy hafa. Ho tompoin''ny rahalahinao anie ianao, ary aoka hiankohoka eo anatrehanao ny zanaky ny reninao. Ho voaozona anie izay rehetra manozona anao, ary hohasoavina anie izay manisy soa anao.'
mg1865::mg_1::27::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa vita ny nitsofan''Isaka rano an''i Jakoba, ary vao nidify Jakoba teo anatrehan''Isaka rainy, dia niditra kosa Esao rahalahiny avy nihaza.'
mg1865::mg_1::27::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izy koa nanao hanim-py ka nitondra azy tao amin''ny rainy; ary hoy izy tamin''ny rainy: Aoka hiarina ny raiko ka hihinana amin''ny hazan''ny zanany, mba hitsofan''ny fanahinao rano ahy.'
mg1865::mg_1::27::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Isaka rainy taminy: Iza indray moa ianao ? Ary hoy izy: Izaho no Esao zanakao lahimatoa.'
mg1865::mg_1::27::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary toran-kovitra indrindra Isaka ka nanao hoe: Iza ary ilay naka haza ka nitondra teto amiko, ary efa nihinanako izany rehetra izany, fony tsy mbola tonga ianao, ka efa notsofiko rano izy; eny, hotahina tokoa izy.'
mg1865::mg_1::27::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha vao ren''i Esao ny tenin''ny rainy, dia nitaraina mafy dia mafy izy ka nanao taminy hoe: Mba tsofy rano re aho, dia izaho koa, ry ikaky o.'
mg1865::mg_1::27::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy rainy: Tonga ny rahalahinao nanandoka ka nahalasa ny tso-dranonao.'
mg1865::mg_1::27::36:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Esao: Moa tsy mandia va ny anarany hoe Jakoba? fa efa namingana ahy indroa izy izao: ny fizokiako efa nalainy; ary, indro, ankehitriny lasany koa ny tso-dranoko. Ary hoy kosa izy: Tsy mba nitahiry tso-drano ho ahy va ianao?'
mg1865::mg_1::27::37:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly Isaka ka nanao tamin''i Esao hoe: Indro, efa nataoko ho tomponao izy, ary ny rahalahiny rehetra nomeko ho mpanompony; ary vary sy ranom-boaloboka no namelomako azy; koa inona indray no hataoko aminao, anaka?'
mg1865::mg_1::27::38:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Esao tamin''ny rainy: Tso-drano iray ihany va no anao, ry ikaky? mba tsofy rano re aho, dia izaho koa, ry ikaky o. Ary Esao dia nanandratra ny feony ka nitomany.'
mg1865::mg_1::27::39:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 39
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly Isaka rainy ka nanao taminy hoe: Indro, tsy ho amin''ny tsiron''ny tany ny fonenanao, ary tsy ho amin''ny andon''ny lanitra avy any ambony;'
mg1865::mg_1::27::40:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 40
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ny sabatrao no hivelomanao, ary ny rahalahinao no hotompoinao; kanefa, raha mby amin''izay andro hahafahanao. Dia hotapahinao ny ziogany ho afaka amin''ny vozonao.'
mg1865::mg_1::27::41:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 41
  verse_date_revised: null
  verse_title: 'Ny nialan''i Jakoba tao amin''ny rainy handositra an i Esao, ary ny nampakaran''i Esao ny zanakavavin''Isimaela ho vadiny'
  verse_text: 'Ary Esao nanao fo-lentika tamin''i Jakoba noho ny tso-drano izay nataon-drainy taminy; dia hoy Esao anakampo: Efa antomotra ny andro hisaonana an''ikaky, dia hamono an''i Jakoba rahalahiko aho.'
mg1865::mg_1::27::42:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 42
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy nanambara tamin-dRebeka izany tenin''i Esao zanany lahimatoa izany; dia naniraka nampaka an''i Jakoba zanany faralahy izy ka nanao taminy hoe: Indro, Esao rahalahinao mikasa hamaly ny nataonao ka hamono anao.'
mg1865::mg_1::27::43:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 43
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ankehitriny, anaka, araho ny teniko; miainga ka mandosira ho any Harana, dia any amin''i Labana anadahiko.'
mg1865::mg_1::27::44:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 44
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary mitoera any aminy andro vitsivitsy mandra-pahafaky ny fahatezeran''ny rahalahinao,'
mg1865::mg_1::27::45:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 45
  verse_date_revised: null
  verse_title: null
  verse_text: 'eny, mandra-pahafaky ny fahatezeran''ny rahalahinao aminao, ka ho hadinony izay nataonao taminy; dia haniraka aho ka hampaka anao any; hataoko ahoana no famoy anareo mirahalahy indray andro?'
mg1865::mg_1::27::46:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 27
  verse_number: 46
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Rebeka tamin''Isaka: Tsy te-ho velona aho noho ireny zanakavavin''ny Hetita; raha maka vady amin''ny zanakavavin''ny Hetita Jakoba, tahaka ireto izay avy amin''ny zazavavy tompon-tany koa hataoko inona ny aiko ?'
mg1865::mg_1::28::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Isaka nampaka an''i Jakoba ka nitso-drano azy ary namepetra azy hoe : Aza maka vady avy amin''ny zanakavavin''ny Kananita ianao.'
mg1865::mg_1::28::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Miainga ka mankanesa any Mesopotamia, any amin''ny tranon''i Betoela rain-dreninao; dia makà vady any, avy amin''ny zanakavavin''i Labana anadahin-dreninao.'
mg1865::mg_1::28::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra Tsitoha anie hitahy anao ka hahamaro fara anao sy hampitombo anao, mba ho tonga firenena maro ianao;'
mg1865::mg_1::28::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary homeny anao anie ny fitahiana an''i Abrahama, dia ho anao sy ny taranakao koa, mba handovanao ny tany fivahinianao, izay efa nomen''Andriamanitra an''i Abrahama.'
mg1865::mg_1::28::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Isaka nampandeha an''i Jakoba ka dia lasa izy nankany Mesopotamia, ho any amin''i Labana, zanak''i Betoela Syriana, anadahin-dRebeka, renin''i Jakoba sy Esao.'
mg1865::mg_1::28::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony hitan''i Esao fa Isaka efa nitso-drano an''i Jakoba ka efa nampandeha azy ho any Mesopotamia haka vady any ary nitso-drano azy sady namepetra azy hoe: Aza maka vady avy amin''ny zanakavavin''ny Kananita ianao;'
mg1865::mg_1::28::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'koa Jakoba efa nanaraka ny tenin''ny rainy aman-dreniny ka lasa nankany Mesopotamia;'
mg1865::mg_1::28::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary hitan''i Esao fa efa ratsy teo imason''Isaka rainy ny zanakavavin''ny Kananita:'
mg1865::mg_1::28::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia lasa Esao nankany amin''Isimaela ka naka an''i Mahalota, zanakavavin''Isimaela, zanak''i Abrahama, sady anabavin''i Nebaiota, ho vadiny, ho fanampin''ny vady izay nananany.'
mg1865::mg_1::28::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 10
  verse_date_revised: null
  verse_title: 'Ny nisehoan''Andriamanitra tamin''i Jakoba tao Betela'
  verse_text: 'Dia nivoaka avy tany Beri-sheba Jakoba ka nankany Harana.'
mg1865::mg_1::28::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tonga teo amin''ny fitoerana anankiray izy ka nandry teo niloaka alina, satria efa maty ny masoandro; dia naka vato tamin''izany fitoerana izany izy, ka nataony ondana, dia nandry teo izy.'
mg1865::mg_1::28::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanonofy izy, ka, indro, nisy tohatra niorina tamin''ny tany, ka nipaka tamin''ny lanitra ny lohany; ary, indreo, nisy anjelin''Andriamanitra niakatra sy nidina teo aminy.'
mg1865::mg_1::28::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary, indro, Jehovah niseho teo amboniny ka nanao hoe: Izaho no Jehovah, Andriamanitr''i Abrahama rainao sy Andriamanitr''Isaka; ny tany izay andrianao dia homeko anao sy ny taranakao;'
mg1865::mg_1::28::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny taranakao ho be tahaka ny vovoka amin''ny tany; dia hiely any andrefana sy any atsinanana ary any avaratra sy any atsimo ianao; ary aminao sy ny taranakao no hitahiana ny firenena rehetra ambonin''ny tany.'
mg1865::mg_1::28::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary, indro, Izaho momba anao ka hiaro anao amin''izay lalan-kalehanao rehetra ary hampody anao indray ho amin''ity tany ity; fa tsy handao anao Aho mandra-panaoko izay voalazako taminao.'
mg1865::mg_1::28::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba nahatsiaro tamin''ny torimasony, dia nanao hoe: Ato amin''ity fitoerana ity tokoa Jehovah, fa izaho no tsy nahalala.'
mg1865::mg_1::28::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia raiki-tahotra izy ka nanao hoe : Endrey, mahatahotra ity fitoerana ity! tsy hafa ity, fa tranon''Andriamanitra sy vavahadin''ny lanitra.'
mg1865::mg_1::28::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nifoha maraina koa Jakoba, dia naka ilay vato izay nataony ondana ka nanorina azy ho tsangam-bato, dia nampidina diloilo teo aminy.'
mg1865::mg_1::28::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''izany fitoerana izany dia nataony hoe Betela, fa Lozy no anaran''ilay tanàna tany aloha.'
mg1865::mg_1::28::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoady Jakoba ka nanao hoe: Raha homba ahy Andriamanitra ka hiaro ahy amin''izao lalana alehako izao, ary hanome ahy mofo hohaniko sy lamba hitafiako,'
mg1865::mg_1::28::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka ho tafaverina soa aman-tsara any amin''ny tranon''ny raiko aho, dia Jehovah no ho Andriamanitro,'
mg1865::mg_1::28::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 28
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ity vato izay naoriko ho tsangam-bato ity ho tranon''Andriamanitra, ary izay rehetra homenao ahy, dia homeko Anao tokoa ny ampahafolony.'
mg1865::mg_1::29::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nanompoan''i Jakoba an''i Labana hahazoany an''i Lea sy Rahely ho vadiny, sy ny nahaterahan''ny zanany'
  verse_text: 'Dia niainga Jakoba ka nankany amin''ny tanin''ny zanaky ny atsinanana.'
mg1865::mg_1::29::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nijery izy, ka, indro, nisy lavaka fantsakana tany an-tsaha, ary, indro, nisy ondry aman''osy telo, dia nandry teo anilany; fa teo amin''izany lavaka fantsakana izany no fampisotroan''ny olona ny andian''ny ondry aman''osy; ary lehibe ny vato teo am-bavan''ny fantsakana.'
mg1865::mg_1::29::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nangonina teo ny andian''ny ondry aman''osy rehetra, dia nakodian''ny olona ny vato hiala amin''ny vavan''ny lavaka fantsakana, ka nampisotroiny ny ondry aman''osy; ary dia naveriny indray ny Vato ho eo am-bavan''ny lavaka fantsakana ho amin''ny fitoerany.'
mg1865::mg_1::29::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba tamin''ny olona: Ry rahalahiko, avy aiza moa ianareo? Ary hoy ireo: Avy any Harana izahay.'
mg1865::mg_1::29::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy taminy: Moa mba fantatrareo va Labana, zanakalahin''i Nahora? Dia hoy izy: Fantatray ihany.'
mg1865::mg_1::29::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy taminy: Tsara ihany va izy? Dia hoy izy: Tsara ihany izy; ary, indro, tamy Rahely zananivavy mitondra ny ondry aman''osy.'
mg1865::mg_1::29::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Indro, mbola antoandrobe ny andro, ka tsy mbola mby amin''ny fotoana famoriana ny omby aman''ondry; ampisotroy ny ondry aman''osy, dia andeha, andraso.'
mg1865::mg_1::29::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Tsy azonay hatao izany, raha tsy efa tafangona avokoa ny andian''ny ondry aman''osy rehetra, ka hakodian''ny olona ny vato hiala amin''ny vavan''ny lavaka fantsakana; dia vao hampisotro ny ondry aman''osy izahay.'
mg1865::mg_1::29::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha mbola niteny taminy izy; dia, indro, tamy Rahely nitondra ny ondry aman''osin-drainy; fa mpiandry ondry izy.'
mg1865::mg_1::29::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''i Jakoba Rahely, zanakavavin''i Labana anadahin-dreniny, sy ny ondry aman''osin''i Labana anadahin-dreniny, dia nanatona izy ka nanakodia ny vato hiala tamin''ny vavan''ny lavaka fantsakana, dia nampisotro ny ondry aman''osin''i Labana anadahin-dreniny izy.'
mg1865::mg_1::29::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 11
  verse_date_revised: '2022-05-12T05:48:27+0000'
  verse_title: null
  verse_text: 'Ary Jakoba nanoroka an-dRahely, dia nanandratra ny feony ka nitomany.'
mg1865::mg_1::29::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nambaran''i Jakoba tamin-dRahely fa havan-drainy sy zana-dRebeka izy; dia nihazakazaka Rahely nanambara izany tamin-drainy.'
mg1865::mg_1::29::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa ren''i Labana ny filazany an''i Jakoba, zanak''anabaviny, dia nihazakazaka nitsena azy izy ka namihina azy sy nanoroka azy ary nitondra azy ho any an-tranony. Dia nambaran''i Jakoba tamin''i Labana izany rehetra izany.'
mg1865::mg_1::29::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Labana taminy: Taolako sy nofoko tokoa ianao. Ary rehefa nitoetra tao aminy andro iray volana Jakoba,'
mg1865::mg_1::29::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia hoy Labana taminy: Moa na dia rahalahiko aza ianao, dia hanompo ahy maina va ? Lazao amiko izay ho karamanao.'
mg1865::mg_1::29::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Labana nanan-janaka roa vavy: Lea no anaran''ny zokiny, ary Rahely no anaran''ny zandriny.'
mg1865::mg_1::29::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Lea nalemy maso; fa Rahely bikàna sady tsara tarehy.'
mg1865::mg_1::29::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba tia an-dRahely ka nanao hoe: Hanompo anao fito taona aho hahazoako an-dRahely, zanakao faravavy.'
mg1865::mg_1::29::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Labana: Aleoko homena anao izy, toy izay homena lehilahy hafa; tomoera eto amiko.'
mg1865::mg_1::29::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanompo an''i Labana fito taona Jakoba hahazoany an-dRahely; ary toa andro vitsy foana teo imasony izany noho ny fitiavany azy.'
mg1865::mg_1::29::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba tamin''i Labana: Aiza ny vadiko, mba hanambadiako azy? fa efa tapitra ny fetr''androko.'
mg1865::mg_1::29::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nampamory ny tompon-tany rehetra Labana ka nanao fanasana.'
mg1865::mg_1::29::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Kanjo nony hariva dia naka an''i Lea zananivavy izy ka nitondra azy ho any amin''i Jakoba; dia nanambady azy Jakoba.'
mg1865::mg_1::29::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nomen''i Labana an''i Lea zananivavy Zilpa ankizivaviny hanompo azy.'
mg1865::mg_1::29::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony efa maraina ny andro, indro fa Lea izy; dia hoy Jakoba tamin''i Labana: Ahoana izao nataonao tamiko izao? Moa tsy Rahely va no nanompoako anao? Ka nahoana no nofitahinao aho?'
mg1865::mg_1::29::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Labana: Tsy fanao aty amin''ny taninay ny mamoaka ny zandriny alohan''ny zokiny.'
mg1865::mg_1::29::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tanteraho ny herinandron''ity anankiray ity, dia homenay anao koa ny anankiray noho ny fanompoana izay mbola hanompoanao ahy fito taona indray.'
mg1865::mg_1::29::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nataon''i Jakoba izany, ka notanterahiny ny herinandrony; dia nomen''i Labana azy koa Rahely zananivavy ho vadiny.'
mg1865::mg_1::29::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nomen''i Labana an-dRahely zananivavy kosa Bila ankizivaviny hanompo azy.'
mg1865::mg_1::29::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia novadin''i Jakoba koa Rahely; ary izy no tiany mihoatra noho Lea; dia nanompo an''i Labana fito taona indray izy.'
mg1865::mg_1::29::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''i Jehovah fa nankahalaina Lea, dia nampanan''anaka azy Izy; fa momba kosa Rahely.'
mg1865::mg_1::29::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka Lea ka niteraka zazalahy, ary ny anarany dia nataony hoe Robena; fa hoy izy: Efa nitsinjo ny fahoriako Jehovah, fa ankehitriny dia ho tian''ny vadiko aho.'
mg1865::mg_1::29::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka indray izy ka niteraka zazalahy; ary hoy izy: Satria ren''i Jehovah fa efa nankalahaina aho, dia nomeny ahy koa ity; dia nataony hoe Simeona ny anarany.'
mg1865::mg_1::29::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka indray izy ka niteraka zazalahy; ary hoy izy: Ankehitriny izao dia hikambana amiko ny vadiko, fa efa niteraka zazalahy telo ho azy aho; izany no nanaovana ny anarany hoe Levy.'
mg1865::mg_1::29::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 29
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka indray izy ka niteraka zazalahy; ary hoy izy: Ankehitriny dia hidera an''i Jehovah aho; izany no nanaovany ny anarany hoe Joda; dia nitsaha-jaza izy.'
mg1865::mg_1::30::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan-dRahely fa tsy mba niteraka tamin''i Jakoba izy, dia nialona ny rahavaviny izy, ka hoy izy tamin''i Jakoba: Mba omeo zaza aho, fa raha tsy izany, dia ho faty aho.'
mg1865::mg_1::30::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nirehitra tamin-dRahely ny fahatezeran''i Jakoba, ka hoy izy: Solon''Andriamanitra, Izay nahamomba anao tsy hiteraka, va aho?'
mg1865::mg_1::30::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Indro Bila ankizivaviko, vadio izy; dia hiteraka eo ampofoako izy, mba hahazoako zaza aminy.'
mg1865::mg_1::30::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nomeny azy Bila ankizivaviny ho vadiny; ary dia novadin''i Jakoba koa izy.'
mg1865::mg_1::30::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka Bila ka niteraka zazalahy tamin''i Jakoba.'
mg1865::mg_1::30::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Rahely: Andriamanitra efa nanome ahy ny rariny sady efa nihaino ny feoko, ka nomeny zazalahy aho; izany no nanaovany ny anarany hoe Dana.'
mg1865::mg_1::30::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka indray Bila, ankizivavin-Rahely, ka niteraka zazalahy faharoany tamin''i Jakoba.'
mg1865::mg_1::30::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Rahely: Fitolomana mafy dia mafy no nitolomako tamin''ny rahavaviko, ka nahery aho; dia nataony hoe Naftaly ny anarany.'
mg1865::mg_1::30::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''i Lea fa efa nitsaha-jaza izy, dia naka an''i Zilpa ankizivaviny izy, ka nomeny ho vadin''i Jakoba koa.'
mg1865::mg_1::30::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Zilpa, ankizivavin''i Lea, dia niteraka zazalahy tamin''i Jakoba.'
mg1865::mg_1::30::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Lea: Manan-jara re aho! dia nataony hoe Gada ny anarany.'
mg1865::mg_1::30::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Zilpa, ankizivavin''i Lea, dia niteraka zazalahy faharoany tamin''i Jakoba.'
mg1865::mg_1::30::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Lea: Sambatra aho, fa hataon''ny zanakavavin''ny olona hoe sambatra aho; dia nataony hoe Asera ny anarany.'
mg1865::mg_1::30::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nivoaka nitsangantsangana Robena tamin''ny andro fijinjam-bary ka nahita dodaima naniry tany an-tsaha, dia nitondra azy ho any amin''i Lea reniny. Ary hoy Rahely tamin''i Lea: Veloma ianao, mba anomezo ahy kely ny dodaiman''ny zanakao.'
mg1865::mg_1::30::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy taminy: Moa zavatra kely va ny nakanao ny vadiko? Dia halainao koa va ny dodaiman''ny zanako? Ary hoy Rahely: Aoka handry aminao ihany ary izy anio alina noho ny dodaiman''ny zanakao.'
mg1865::mg_1::30::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 16
  verse_date_revised: '2022-06-01T08:30:35+0000'
  verse_title: null
  verse_text: 'Ary nony hariva, rehefa tonga avy tany an-tsaha Jakoba, dia nivoaka nitsena azy Lea ka nanao hoe: Ho ato amiko no halehanao; fa ny dodaiman''ny zanako no efa nanakaramako anao tokoa. Dia nandry taminy izy tamin''iny alina iny.'
mg1865::mg_1::30::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nihaino an''i Lea, dia nanan''anaka izy ka niteraka zazalahy fahadiminy tamin''i Jakoba.'
mg1865::mg_1::30::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Lea: Efa nomen''Andriamanitra ny karamako, satria nomeko hovadin''ny vadiko ny ankizivaviko; dia nataony hoe Isakara ny anarany.'
mg1865::mg_1::30::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka indray Lea ka niteraka zazalahy faheniny tamin''i Jakoba.'
mg1865::mg_1::30::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Lea: Efa nanome anjara soa ho ahy Andriamanitra; amin''izao vao hitoetra amiko ny vadiko, fa efa niteraka zaza enin-dahy ho azy aho; dia nataony hoe Zebolona ny anarany.'
mg1865::mg_1::30::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka izany, dia niteraka zazavavy izy, ka nataony hoe Dina ny anarany.'
mg1865::mg_1::30::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nahatsiaro an-dRahely, dia nihaino azy ka nampanan''anaka azy.'
mg1865::mg_1::30::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanan''anaka izy ka niteraka zazalahy; dia hoy izy: Efa nahafa-tondromaso ahy Andriamanitra.'
mg1865::mg_1::30::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nataony hoe Josefa ny anarany, ka hoy izy: Jehovah anie mbola hanampy zazalahy iray ho ahy koa.'
mg1865::mg_1::30::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 25
  verse_date_revised: null
  verse_title: 'Ny fanekena hafa koa izay nataon''i Labana sy Jakoba'
  verse_text: 'Ary rehefa niteraka an''i Josefa Rahely, dia hoy Jakoba tamin''i Labana: Alefaso aho hankany amin''ny fonenako sy ny taniko.'
mg1865::mg_1::30::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Omeo ahy ny vadiko aman-janako, izay nanompoako anao, dia handeha aho; fa fantatrao ny fanompoana izay nanompoako anao.'
mg1865::mg_1::30::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Labana taminy: Masïna ianao, raha nahita fitia eo imasonao aho, mitoera eto amiko, efa namantatra aho, ka fantatro fa avy taminao no nitahian''i Jehovah ahy.'
mg1865::mg_1::30::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa izy: Tonony izay ho karamanao, dia homeko anao.'
mg1865::mg_1::30::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba taminy; Fantatrao ny nanompoako anao sy ny toetry ny omby aman''ondrinao tato amiko.'
mg1865::mg_1::30::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa kely ny fanananao, fony tsy mbola tonga aho, fa efa nitombo be dia be izy; ary efa nitahy anao Jehovah tamin''ny diako rehetra; ary ankehitriny, rahoviana kosa aho no mba hihary ho an''ny ao an-tranoko?'
mg1865::mg_1::30::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Inona ary no homeko anao? Ary hoy Jakoba: Tsy hanome ahy na inona na inona ianao; raha hataonao amiko izao zavatra izao, dia mbola handrasako sy hotandremako ihany ny ondry aman''osinao:'
mg1865::mg_1::30::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Handeha hitety ny ondry aman''osinao rehetra aho anio ka hanavaka ny mara sy ny sada rehetra, ary ny mainty rehetra eo amin''ny ondry ary ny sada sy ny mara eo amin''ny osy; koa ireny no ho karamako.'
mg1865::mg_1::30::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny fahamarinako no ho vavolombeloko amin''ny andro ho avy, raha tonga ianao handinika ny karamako: izay rehetra tsy mara ary tsy sada eo amin''ny osy, ary izay tsy mainty eo amin''ny ondry, dia ho halatro izany.'
mg1865::mg_1::30::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Labana: Eny, aoka ho araka ny teninao ary.'
mg1865::mg_1::30::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia navahany tamin''izany andro izany ny osilahy sadika sy sada, ary izay osivavy rehetra mara sy sada, dia izay rehetra nisy fotsy, ary ny mainty rehetra teo amin''ny ondry; dia natolony teo an-tanan''ny zananilahy ireny.'
mg1865::mg_1::30::36:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nasiany lalankateloana teo anelanelan''izy sy Jakoba; ary Jakoba niandry ny ondry aman''osin''i Labana sisa.'
mg1865::mg_1::30::37:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba dia naka tsorakazo maro tamin''ny hazo popola maitso sy tamin''ny hazo lozy sy tamin''ny hazo platana; ka nataony ofy vandana ireny hisehoan''ny fotsy izay teo amin''ny tsorakazo.'
mg1865::mg_1::30::38:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ireny tsorakazo voaofiny ireny dia napetrany teo anoloan''ny ondry aman''osy, teo anatin''ny tavin-drano, dia teo amin''ny fisotroan-drano, izay nalehan''ny ondry aman''osy hisotro, ka nikambana teo ny lahy sy ny vavy, raha avy hisotro rano izy.'
mg1865::mg_1::30::39:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 39
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nikambana tandrifin''ny tsorakazo ny ondry aman''osy ka niteraka sadika sy mara ary sada.'
mg1865::mg_1::30::40:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 40
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanak''ondry navahan''i Jakoba, ary ny ondry sisa dia nataony manatrika ny sadika sy ny mainty rehetra teo amin''ny ondry aman''osin''i Labana; ary natokany izay ondry aman''osy ho azy ka tsy navelany hiharo tamin''ny ondry aman''osin''i Labana.'
mg1865::mg_1::30::41:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 41
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary na oviana na oviana no hikambanan''ny ondry aman''osy matanjaka, dia napetrak''i Jakoba teo anatin''ny tavin-drano teo anoloan''ny mason''ny ondry aman''osy ireny tsorakazo ireny, mba hikambanany eo anilan''ny tsorakazo.'
mg1865::mg_1::30::42:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 42
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa raha osaosa kosa ny ondry aman''osy, dia tsy mba napetrany teo ireny; ka dia ny osaosa no an''i Labana, fa ny matanjaka kosa no an''i Jakoba.'
mg1865::mg_1::30::43:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 30
  verse_number: 43
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitombo harena indrindra ralehilahy ka nanana ondry aman''osy betsaka ary andevovavy sy andevolahy ary rameva sy boriky.'
mg1865::mg_1::31::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nandosiran''i Jakoba avy tany Mesopotamia hody any Kanana'
  verse_text: 'Ary Jakoba nandre ny tenin''ny zanakalahin''i Labana nanao hoe: Efa lasan''i Jakoba avokoa izay rehetra nananan''ny raintsika; ary avy tamin''ny fananan''ny raintsika no nahazoany izao voninahitra rehetra izao.'
mg1865::mg_1::31::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan''i Jakoba ny tarehin''i Labana, fa indro tsy mba miramirana taminy tahaka ny taloha izy.'
mg1865::mg_1::31::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah tamin''i Jakoba: Modia any amin''ny tanin''ny razanao sy any amin''ny havanao; ary homba anao Aho.'
mg1865::mg_1::31::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba naniraka ka nampaka an-dRahely sy Lea hankany an-tsaha ho any amin''ny ondry aman''osiny'
mg1865::mg_1::31::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka nanao taminy hoe: Hitako ny tarehin''ny rainareo, fa tsy mba miramirana amiko tahaka ny taloha; fa Andriamanitry ny raiko no efa nomba ahy.'
mg1865::mg_1::31::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary fantatrareo fa tamin''ny heriko rehetra no nanompoako ny rainareo.'
mg1865::mg_1::31::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ny rainareo efa namitaka ahy ka efa nanova ny karamako im-polo; nefa tsy navelan''Andriamanitra hahatonga loza tamiko izy.'
mg1865::mg_1::31::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha nilaza hoe izy: Ny mara rehetra ho karamanao, dia niteraka mara ny ondry aman''osy rehetra: ary raha nilaza hoe indray izy: Ny sadika rehetra ho karamanao, dia niteraka sadika ny ondry aman''osy rehetra.'
mg1865::mg_1::31::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nalain''Andriamanitra ny fananan''ny rainareo ka nomeny ahy.'
mg1865::mg_1::31::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa mby amin''ny andro izay nikambanan''ny ondry aman''osy, dia natopiko ny masoko, ka hitako tamin''ny nofy, ary indro, sadika sy mara ary sada ny lahy izay nikambana tamin''ny ondrivavy sy ny osivavy.'
mg1865::mg_1::31::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Ilay Anjelin''Andriamanitra tamiko tamin''ny nofy: Ry Jakoba; dia hoy izaho: Inty aho.'
mg1865::mg_1::31::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy: Mba atopazy ny masonao ka jereo, fa sadika sy mara ary sada ny lahy rehetra izay mikambana amin''ny ondrivavy sy ny osivavy, satria efa hitako izay rehetra nataon''i Labana taminao.'
mg1865::mg_1::31::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izaho no Andriamanitr''i Betela, izay nanosoranao tsangam-bato sy nivoadianao tamiko; miaingà ankehitriny hiala amin''ity tany ity, ka modia any amin''ny tany nahaterahanao.'
mg1865::mg_1::31::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly Rahely sy Lea ka nanao taminy hoe: Mbola misy anjara sy lova ho anay va ao an-tranon''ny rainay?'
mg1865::mg_1::31::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tsy nataony toy ny vahiny va izahay? Fa efa namidiny izahay sady nohaniny lalandava ny volanay rehetra.'
mg1865::mg_1::31::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ny harena rehetra izay nalain''Andriamanitra tamin''ny rainay, dia anay sy an''ny zanakay izany; koa ankehitriny, izay rehetra nolazain''Andriamanitra taminao dia ataovy.'
mg1865::mg_1::31::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niainga Jakoba, ka nampitaingeniny ny rameva ny zanany sy ny vadiny;'
mg1865::mg_1::31::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia nitondra ny ombiny sy ny ondry aman''osiny rehetra izy, mbamin''ny fananana rehetra izay efa nohariny, dia ny omby aman''ondry izay efa azony tany Mesopotamia, mba hankany amin''Isaka rainy any amin''ny tany Kanana.'
mg1865::mg_1::31::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Labana efa lasa nandeha hanety ny ondry aman''osiny; dia nangalarin-dRahely ny sampin-drainy.'
mg1865::mg_1::31::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba dia nangala-dia tamin''i Labana Syriana, fa tsy nambarany taminy ny amin''ny handosirany.'
mg1865::mg_1::31::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nandositra izy ka nitondra ny fananany rehetra; dia niainga izy ka nita ny Ony, ary nizotra hankany an-tendrombohitra Gileada.'
mg1865::mg_1::31::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''ny andro fahatelo dia nisy nanambara tamin''i Labana fa lasa nandositra Jakoba.'
mg1865::mg_1::31::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitondra ny havany homba azy izy ka nanenjika azy lalan-kafitoana, dia nahatratra azy teo an-tendrombohitra Gileada.'
mg1865::mg_1::31::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Andriamanitra nankeo amin''i Labana Syriana tamin''ny nofy nony alina ka nanao taminy hoe: Tandremo mba tsy hasianao teny akory Jakoba, na soa na ratsy.'
mg1865::mg_1::31::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Labana dia nahatratra an''i Jakoba. Ary Jakoba dia efa nanorina ny lainy teo an-tendrombohitra; ary Labana sy ny havany kosa nanorin-day teo an-tendrombohitr''i Gileada.'
mg1865::mg_1::31::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Labana tamin''i Jakoba: Inona izao ataonao izao, no dia nangala-dia tamiko ianao ka nitondra ny zanako-vavy toy ny babo azo tamin''ny sabatra?'
mg1865::mg_1::31::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nahoana no nandositra mangingina ianao ka nangala-dia tamiko; ary tsy nanambara tamiko ianao mba hanaterako anao amin''ny fifaliana sy ny hira, amin''ny amponga-tapaka sy ny lokanga,'
mg1865::mg_1::31::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'sady tsy mba navelanao hanoroka ny zanako-lahy sy ny zanako-vavy aho? Fa izao dia efa nanao adaladala ianao.'
mg1865::mg_1::31::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Manankery hanisy ratsy anareo ny tanako; fa Andriamanitry ny rainareo efa niteny tamiko halina ka nanao hoe: Tandremo mba tsy hasianao teny akory Jakoba, na soa na ratsy.'
mg1865::mg_1::31::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ankehitriny, raha mandeha tokoa ianao, satria manina ny tranon''ny rainao indrindra ianao, nahoana no nangalarinao ny andriamanitro ?'
mg1865::mg_1::31::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly Jakoba ka nanao tamin''i Labana hoe: Satria natahotra aho; fa hoy izaho: Angamba halainao an-keriny amiko ny zanakao-vavy.'
mg1865::mg_1::31::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izay hahitanao ny andriamanitrao dia aza velomina; eto anatrehan''ny havantsika savao izay ato amiko, ka ento ny anao. Fa tsy fantatr''i Jakoba fa Rahely no efa nangalatra azy.'
mg1865::mg_1::31::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Labana niditra tao an-dain''i Jakoba sy tao an-dain''i Lea ary tao an-dain''ny ankiziny roa vavy, fa tsy nahita. Dia niala tao an-dain''i Lea izy ka niditra tao an-dain-Rahely.'
mg1865::mg_1::31::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa efa nalain-dRahely ny sampy ka nataony tao anatin''ny laselin''ny rameva, dia nipetraka teo amboniny izy. Ary Labana dia nikaroka eran''ny lay rehetra, fa tsy nahita.'
mg1865::mg_1::31::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 35
  verse_date_revised: '2022-07-02T07:35:31+0000'
  verse_title: null
  verse_text: 'Ary hoy Rahely tamin''ny rainy: Azafady aho, tompokolahy, fa tsy mahazo mitsangana eto anatrehanao aho, satria azon''ny fombam-behivavy. Dia nikaroka fatratra izy, fa tsy nahita ny sampy.'
mg1865::mg_1::31::36:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia tezitra Jakoba ka nifamaly tamin''i Labana; ary namaly Jakoba ka nanao tamin''i Labana hoe: Inona no heloko? inona no otako, no dia niolomay nanenjika ahy ianao?'
mg1865::mg_1::31::37:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa efa nosavanao avokoa ny entako rehetra, koa inona no fanaka avy tany an-tranonao hitanao tao? Apetraho eto anatrehan''ny havako sy ny havanao izany, hitsarany antsika roa lahy,'
mg1865::mg_1::31::38:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izao roa-polo taona izao no nitoerako tany aminao; ny ondrivavinao sy ny osivavinao tsy mba namotsotra, ary tsy mba nihinana ny ondrilahy avy tamin''ny ondrinao aho.'
mg1865::mg_1::31::39:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 39
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izay voaviraviram-biby tsy mba nentiko tany aminao, fa izaho no nanolo azy; teo an-tanako no nitadiavanao azy, na ny nangalarina andro, na ny nangalarina alina.'
mg1865::mg_1::31::40:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 40
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nony antoandro matin''ny hain''andro aho, ary nony alina dia matin''ny fanala; ary nandositra ny masoko ny torimaso.'
mg1865::mg_1::31::41:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 41
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izao roa-polo taona izao no nitoerako tany an-tranonao, ka efatra ambin''ny folo taona no nanompoako anao hahazoako azy mirahavavy zanakao, ary enin-taona kosa hahazoako ny ondry aman''osinao, ary efa nanova ny karamako im-polo ianao.'
mg1865::mg_1::31::42:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 42
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha tsy Andriamanitry ny raiko, dia Andriamanitr''i Abrahama, Ilay natahoran''Isaka, no nomba ahy, dia ho nampandehaninao maina tokoa aho ankehitriny. Andriamanitra efa nitsinjo ny fahoriako sy ny fisasaran''ny tanako ka nananatra anao halina.'
mg1865::mg_1::31::43:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 43
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly Labana ka nanao tamin''i Jakoba hoe: Ireo zazavavy ireo dia zanako-vavy ary ireo zazalahy ireo dia zanako-lahy; ary ireo ondry aman''osy ireo dia ondry aman''osiko; ary izao rehetra hitanao izao dia ahy avokoa; ary ahoana no hataoko anio amin''ireto zanako-vavy, na amin''ny zanany naterany?'
mg1865::mg_1::31::44:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 44
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny avia hanao fanekena isika, dia izaho sy ianao, ka aoka ho vavolombelona amiko sy aminao izany.'
mg1865::mg_1::31::45:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 45
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naka vato iray Jakoba ka nanangana azy ho tsangam-bato.'
mg1865::mg_1::31::46:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 46
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba tamin''ireo havany: Manangona vato; dia naka vato izy, ka nataony antontany; ary dia nihinana teo anilan''ny antontam-bato izy rehetra.'
mg1865::mg_1::31::47:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 47
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''ny antontam-bato dia nataon''i Labana hoe Jegara-sahadota; fa Jakoba kosa nanao azy hoe Galeda.'
mg1865::mg_1::31::48:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 48
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Labana: Ity antontam-bato ity no vavolombelona amintsika anio. Izany no nanaovany ny anarany hoe Galeda.'
mg1865::mg_1::31::49:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 49
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nataony hoe Mizpa koa izy, fa hoy izy: Jehovah hitazana ahy sy ianao, rehefa tsy mifankahita isika.'
mg1865::mg_1::31::50:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 50
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha tahiny hampahory ny zanako-vavy ianao, na hanambady afa-tsy ireo zanako-vavy ireo ihany, tsy misy olona eto amintsika, fa, indro, Andriamanitra no ho vavolombelona amintsika.'
mg1865::mg_1::31::51:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 51
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy indray Labana tamin''i Jakoba: Indro ity antontam-bato ity, ary indro ity tsangam-bato ity izay naoriko eto anelanelantsika, izaho sy ianao;'
mg1865::mg_1::31::52:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 52
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia aoka ho vavolombelona ity antontam-bato ity, ary aoka ho vavolombelona ity tsangam-bato ity, mba tsy hihoarako ity antontam-bato ity hankany aminao, ary mba tsy hihoaranao ity antontam-bato ity sy ity tsangam-bato ity hankaty amiko kosa hanisy ratsy.'
mg1865::mg_1::31::53:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 53
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny andriamanitr''i Abrahama sy ny andriamanitr''i Nahora, dia ny andriamanitry ny rain''izy mirahalahy anie hitsara antsika. Fa Ilay natahoran''i Isaka rainy kosa no nianianan''i Jakoba.'
mg1865::mg_1::31::54:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 31
  verse_number: 54
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namono zavatra hatao fanatitra teo an-tendrombohitra Jakoba ka nanasa ny havany mba hihinan-kanina; dia nihinana izy ka nitoetra teo an-tendrombohitra nandritra ny alina,'
mg1865::mg_1::32::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nifoha maraina koa Labana, dia nanoroka ny zananilahy sy ny zananivavy ka nitso-drano azy; dia lasa nandeha Labana nody any amin''ny fonenany.'
mg1865::mg_1::32::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba nizotra tamin''ny lalan-kalehany, dia nisy anjelin''Andriamanitra nitsena azy.'
mg1865::mg_1::32::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba, raha nahita ireo: Tobin''Andriamanitra ity; ary ny anaran''izany tany izany nataony hoe Mahanaima.'
mg1865::mg_1::32::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 4
  verse_date_revised: null
  verse_title: 'Ny nihaonan''i Jakoba sy Esao'
  verse_text: 'Ary nandefa iraka Jakoba hialoha azy ho any amin''i Esao rahalahiny, ho any Seira, tanin''i Edoma.'
mg1865::mg_1::32::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanome teny azy izy ka nanao hoe: Izao no holazainareo amin''i Esao tompoko: Izao no tenin''i Jakoba mpanomponao: Efa nivahiny tany amin''i Labana aho ka nitoetra tany mandraka ankehitriny;'
mg1865::mg_1::32::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary manana omby sy boriky sy ondry aman''osy ary andevolahy aho; dia efa mba naniraka hanambara aminao tompokolahy ihany aho mba hahitako fitia eo imasonao.'
mg1865::mg_1::32::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 7
  verse_date_revised: '2022-07-12T08:26:35+0000'
  verse_title: null
  verse_text: 'Dia niverina tany amin''i Jakoba ny iraka ka nanao hoe: Tafahaona tamin''i Esao rahalahinao izahay, ary izy koa dia avy hitsena anao mitondra olona efa-jato lahy.'
mg1865::mg_1::32::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia natahotra indrindra Jakoba ka poritra dia poritra; dia nozarainy roa toko ny olona izay nomba azy mbamin''ny ondry aman''osy sy ny omby ary ny rameva;'
mg1865::mg_1::32::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa hoy izy: Raha tafahaona amin''ny antokony anankiray Esao ka mamely azy, dia handositra kosa ny antokony anankiray.'
mg1865::mg_1::32::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba: E Andriamanitr''i Abrahama raiko, sady Andriamanitr''Isaka raiko, dia Jehovah Izay efa nanao tamiko hoe: Modia any amin''ny taninao sy any amin''ny havanao dia hanao soa aminao Aho;'
mg1865::mg_1::32::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'tsy mendrika ho nahazo na kely akory aza aho tamin''ny famindram-po rehetra sy ny fahamarinana rehetra, izay nataonao tamiko mpanomponao; fa tsy nitondra na inona na inona afa-tsy ny tehiko ihany aho fony nita ity Jordana ity; nefa ankehitriny efa tonga toby roa aho.'
mg1865::mg_1::32::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'O vonjeo aho amin''ny tanan''ny rahalahiko, dia amin''ny tanan''i Esao; fa matahotra azy aho, fandrao avy mamely ahy mbamin''ny vadiko aman-janako izy.'
mg1865::mg_1::32::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Ianao efa nanao hoe: Hanisy soa anao tokoa Aho, ka hataoko maro ny taranakao ho tahaka ny fasika any an-dranomasina, izay tsy azo isaina noho ny hamaroany.'
mg1865::mg_1::32::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitoetra teo izy tamin''iny alina iny; ary naka tamin''izay teo an-tanany izy mba hampanaterina ho an''i Esao rahalahiny,'
mg1865::mg_1::32::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia osivavy roan-jato sy osilahy roa-polo, ondrivavy roan-jato sy ondrilahy roa-polo'
mg1865::mg_1::32::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary rameva telo-polo ampianahany, vantotr''ombivavy efa-polo sy vantotr''ombilahy folo, borikivavy roa-polo ary zana-boriky folo.'
mg1865::mg_1::32::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia natolony teo an-tanan''ny mpanompony ireny, mitokantokana isan-toko; ary hoy izy tamin''ny mpanompony: Mandehana eo alohako, ary asio elanelany eo amin''ny isan-toko.'
mg1865::mg_1::32::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanome teny ny voalohany izy ka nanao hoe: Raha mifanena aminao Esao rahalahiko ka manontany anao hoe: An''iza ianao? ary hankaiza moa? ary an''iza ireo alohanao?'
mg1865::mg_1::32::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia lazaonao hoe: An''i Jakoba mpanomponao ireo, dia zavatra nampanaterina ho an''itompokolahy Esao; ary indro koa izy ao aorianay ao.'
mg1865::mg_1::32::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanome teny ny faharoa sy ny fahatelo koa izy, ary izay rehetra nandeha nanaraka ny isan-toko, ka nanao hoe: Araka izany teny izany no lazaonareo amin''i Esao, raha hitanareo izy.'
mg1865::mg_1::32::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary lazao hoe koa: Indro, Jakoba mpanomponao ao aorianay ao. Fa hoy izy: Hampionona ny hatezerany aho amin''ireo zavatra nampialohaviko ireo, ary rehefa afaka izany, dia vao hahita ny tavany aho; angamba hahazo fitia aminy aho.'
mg1865::mg_1::32::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dia lasa nialoha azy ireny zavatra nampanateriny ireny; fa izy mbola nitoetra teo amin''ny toby ihany tamin''iny alina iny.'
mg1865::mg_1::32::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitsangana tamin''iny alina iny ihany izy ka nitondra ny vadiny roa vavy sy ny ankizivaviny roa ary ny zananilahy iraika ambin''ny folo, dia nita tamin''ny fitàna tao Jaboka izy.'
mg1865::mg_1::32::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary naka azy ireo izy, dia nampita azy tamin''ny renirano, ary nampita ny fananany koa izy.'
mg1865::mg_1::32::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia Jakoba irery no sisa nitoetra teo; ary nisy lehilahy anankiray nitolona taminy ambara-pahazavaratsin''ny andro.'
mg1865::mg_1::32::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitany fa tsy naharesy azy izy, dia notendreny ny foto-peny; ka dia nivika ny foto-pen''i Jakoba, raha mbola nitolona taminy Izy.'
mg1865::mg_1::32::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy: Avelao Aho handeha, fa efa mazavaratsy ny andro. Fa hoy kosa Jakoba: Tsy havelako handeha Ianao, raha tsy tahinao aho.'
mg1865::mg_1::32::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy taminy: Iza moa no anaranao? dia hoy izy: Jakoba.'
mg1865::mg_1::32::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy indray Izy: Tsy hatao hoe Jakoba intsony ny anaranao, fa Isiraely; satria efa nitolona tamin''Andriamanitra sy tamin''ny olona ianao ka nahery.'
mg1865::mg_1::32::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanontany Jakoba ka nanao hoe: Masïna Ianao, lazao kely izay anaranao. Ary hoy Izy: Ahoana no anontanianao ny anarako? Dia nitahy azy teo Izy.'
mg1865::mg_1::32::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''izany tany izany dia nataon''i Jakoba hoe Peniela; fa, hoy izy, efa nahita an''Andriamanitra nifanatrika tamiko aho, nefa voavonjy ny aiko.'
mg1865::mg_1::32::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niposaka taminy ny masoandro, raha niala teo Peniela izy, ary nitolitsika izy noho ny feny.'
mg1865::mg_1::32::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 32
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izany no tsy ihinanan''ny Zanak''Isiraely ny ozatry ny atodiakanga mandraka androany; satria nanendry ny foto-pen''i Jakoba teo amin''ny ozatry ny atodiakanga Izy.'
mg1865::mg_1::33::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba dia nanopy ny masony ka nahatazana fa indro tamy Esao, mitondra efa-jato lahy. Dia nozarazarainy ny zaza ho amin''i Lea sy Rahely ary ho amin''ny ankizivavy roa.'
mg1865::mg_1::33::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nataony loha-lalana ny ankizivavy roa sy ny zanany, ary Lea sy ny zanany nanarakaraka, ary Rahely sy Josefa no vodi-lalana.'
mg1865::mg_1::33::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba nandeha teo alohan''izy rehetra ka niankohoka impito tamin''ny tany mandra-pahatongany teo akaikin''ny rahalahiny.'
mg1865::mg_1::33::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nihazakazaka hitsena azy Esao, ary nisakambina ny tendany, dia namihina sy nanoroka azy; ary samy nitomany izy mirahalahy.'
mg1865::mg_1::33::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Esao nanopy ny masony ka nahita ny zaza amim-behivavy; dia hoy izy: Iza moa ireto miaraka aminao ireto? Ary hoy kosa Jakoba: Ny zaza izay nomen''Andriamanitra ny mpanomponao noho ny fahasoavany.'
mg1865::mg_1::33::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanatona ny ankizivavy sy ny zanany ka niankohoka.'
mg1865::mg_1::33::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanatona koa Lea sy ny zanany ka niankohoka; ary farany, dia nanatona koa Josefa sy Rahely ka niankohoka.'
mg1865::mg_1::33::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Esao: Inona moa no hevitr''ireny antokony rehetra nifanena tamiko ireny? Ary hoy izy: Mba hahitako fitia eto imason''itompokolahy.'
mg1865::mg_1::33::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dia hoy Esao: Manam-be ihany aho, ry rahalahiko; aoka ihany ho anao ny anao.'
mg1865::mg_1::33::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba: Trarantitra ianao, aza an''izany; raha mba mahita fitia eto imasonao aho, dia raiso amin''ny tanako ny zavatra nampanateriko; fa efa nahita ny tavanao aho tahaka ny mahita ny tavan''Andriamanitra, ary efa sitrakao aho.'
mg1865::mg_1::33::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Trarantitra ianao, raiso re ny saotro izay nampanaterina ho anao; fa efa nanisy soa ahy Andriamanitra, ka manam-be aho. Dia nanery azy izy, ka dia noraisiny ihany ny zavatra.'
mg1865::mg_1::33::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Esao: Aoka hiainga isika, ka handeha hialoha anao aho.'
mg1865::mg_1::33::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Jakoba taminy: Fantatr''itompokolahy fa mbola osa ny zaza, sady ampianahany ny ondry aman''osy sy ny omby ato amiko; koa raha hokorodonina indray andro aza ireo, dia ho faty avokoa ny ondry aman''osy rehetra.'
mg1865::mg_1::33::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Trarantitra ianao, aoka itompokolahy hialoha ny mpanompony; ary izaho handeha miadana araka izay dian''ny omby aman''ondry, izay ho eo alohako, sy ny dian''ny zaza, mandra-pahatongako any amin''itompokolahy any Seira.'
mg1865::mg_1::33::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Esao: Masïna ianao, aoka ary mba hamelako hiaraka aminao ny olona izay momba ahy. Fa hoy Jakoba: Ahoana no anaovanao izany? Aoka hahita fitia eto imason''itompokolahy aho.'
mg1865::mg_1::33::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niverina androtrizay Esao tamin''ny lalany ho any Seira.'
mg1865::mg_1::33::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba nifindra nankany Sokota ka nanao trano ho azy ary nanao trano rantsan-kazo maromaro ho an''ny omby aman''ondriny; izany no nanaovana ny anaran''io tany io hoe Sokota.'
mg1865::mg_1::33::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba tonga soa aman-tsara tao an-tanàna Sekema, izay eo amin''ny tany Kanana, rehefa avy tany Mesopotamia izy; dia nitoby tandrifin''ny tanàna.'
mg1865::mg_1::33::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia novidiny vola zato tamin''ny zanak''i Hamora, rain''i Sekema, ny tany izay nanorenany ny lainy.'
mg1865::mg_1::33::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 33
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanorina alitara teo izy, ka nataony hoe El-elohe-Isiraely ny anarany.'
mg1865::mg_1::34::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nakan''i Sekema an''i Dina sy ny namalian''i Simeona sy Levy izany'
  verse_text: 'Dia nivoaka Dina, zanakavavin''i Lea, izay naterany tamin''i Jakoba, mba hizaha ny zazavavy tompon-tany.'
mg1865::mg_1::34::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nahita azy Sekema, zanakalahin''i Hamora Hivita, andriana tamin''izany tany izany; dia naka azy izy ary nandry taminy ka nampietry azy.'
mg1865::mg_1::34::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny fony dia raiki-pitia tamin''i Dina, zanakavavin''i Jakoba; eny, tia ny zazavavy izy, ka dia nanao teny malefaka nahafinaritra azy.'
mg1865::mg_1::34::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Sekema dia niteny tamin''i Hamora rainy ka nanao hoe: Alao io zazavavy io ho vadiko.'
mg1865::mg_1::34::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ren''i Jakoba fa efa nandoto an''i Dina zananivavy izy; nefa ny zananilahy mbola niandry ny omby aman''ondriny tany an-tsaha; ka dia nangina aloha Jakoba mandra-pahatongany.'
mg1865::mg_1::34::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka Hamora, rain''i Sekema, nankany amin''i Jakoba hidinika taminy.'
mg1865::mg_1::34::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanak''i Jakoba dia tonga avy tany an-tsaha, rehefa nandre izy, ka nalahelo sady tezitra indrindra, satria Sekema efa nanao izay fady indrindra teo amin''ny Isiraely noho ny nandriany tamin''ny zanakavavin''i Jakoba; fa zavatra izay tsy tokony hatao izany.'
mg1865::mg_1::34::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Hamora nidinika taminy ka nanao hoe: Ny fon''i Sekema zanakolahy efa raiki-pitia amin''ny zanakareo-vavy; koa masïna ianareo, mba omeo azy ho vadiny.'
mg1865::mg_1::34::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary aoka hifanambady anaka isika: omeo anay ny zanakareo vavy, ary alao ho anareo kosa ny zanakai-vavy,'
mg1865::mg_1::34::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hiara-monina aminay ianareo; ary indro ny tany eo anoloanareo; oneno, dia manaova varotra ao, ary aoka ho isan''ny tompon-tany ianareo.'
mg1865::mg_1::34::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Sekema tamin''ny rain''i Dina sy ny anadahiny: Aoka mba hahita fitia eto imasonareo aho, ary izay lazainareo amiko dia homeko;'
mg1865::mg_1::34::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'na dia harena be sy zavatra betsaka aza no asainareo homeko, dia homeko ihany araka izay holazainareo amiko; fa omeo ahy ny zazavavy ho vadiko.'
mg1865::mg_1::34::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanak''i Jakoba namaly an''i Sekema sy Hamora rainy tamin''ny fitaka ka nisaroro azy noho ny nandotoany an''i Dina anabaviny;'
mg1865::mg_1::34::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary hoy izy taminy: Tsy azonay atao ny hanome ny anabavinay ho an''izay lehilahy tsy voafora; fa fahavetavetana aminay izany.'
mg1865::mg_1::34::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izao ihany no azonay hanekena anareo: Raha ho tahaka anay ianareo, ka hoforana ny lehilahy rehetra aminareo,'
mg1865::mg_1::34::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia homenay anareo ny zanakai-vavy, ary ny zanakareo-vavy kosa halainay ho anay, dia hiara-monina aminareo izahay, ka ho firenena iray isika.'
mg1865::mg_1::34::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa raha tsy hanaraka ny teninay ianareo ka hoforana dia halainay ny zanakai-vavy, ka handeha izahay.'
mg1865::mg_1::34::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia sitrak''i Hamora sy Sekema zanany izany teniny izany.'
mg1865::mg_1::34::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tsy nitaredretra ilay zatovo hanao izany zavatra izany, satria efa tia ny zanakavavin''i Jakoba izy. Ary izy no nalaza indrindra tamin''izay rehetra tao an-tranon''ny rainy.'
mg1865::mg_1::34::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Hamora sy Sekema zananilahy nankeo amin''ny vavahadin''ny tanànany, dia niteny tamin''ny mponina tao an-tanànany ka nanao hoe:'
mg1865::mg_1::34::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo olona ireo mipetraka tsara eto amintsika, dia aoka honina eto amin''ny tany izy ka hanao varotra eto; fa. indro, ny tany dia malalaka eo anoloany; ny zananivavy dia aoka halaintsika ho vadintsika, ary ny zanatsika vavy dia aoka homentsika azy kosa.'
mg1865::mg_1::34::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa izao monja ihany no hanaovan''ireo lehilahy ireo fanekena amintsika mba hiara-monina amintsika ho firenena iray: mba hoforana koa, hono, ny lehilahy rehetra eto amintsika tahaka izay namorana azy ireo.'
mg1865::mg_1::34::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tsy ho antsika va ny omby aman''ondriny sy ny fananany mbamin''ny biby fiompiny rehetra? Aoka hanaiky ny teniny ihany isika, dia hiara-monina amintsika izy.'
mg1865::mg_1::34::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izay rehetra nivoaka tamin''ny vavahadin''ny tanànany dia nanaiky ny tenin''i Hamora sy Sekema zanany; ary noforana ny lehilahy rehetra, dia izay rehetra nivoaka tamin''ny vavahadin''ny tanànany.'
mg1865::mg_1::34::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony tamin''ny andro fahatelo, rehefa ilay narary mafy iny izy ireo, dia samy nitondra ny sabany ny zanak''i Jakoba roa lahy, dia Simeona sy Levy, anadahin''i Dina, ka niakatra sahisahy tao an-tanàna, dia namono ny lehilahy rehetra tao.'
mg1865::mg_1::34::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Hamora sy Sekema zananilahy dia novonoiny tamin''ny lelan-tsabatra koa; dia naka an''i Dina tao an-tranon''i Sekema izy ka lasa nandeha.'
mg1865::mg_1::34::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanak''i Jakoba nankeny amin''ny faty ka namabo ny tanàna noho ny nandotoany ny anabaviny.'
mg1865::mg_1::34::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny ondry aman''osiny sy ny ombiny sy ny borikiny mbamin''izay rehetra tao an-tanàna sy izay rehetra tany an-tsaha dia nahorony avokoa;'
mg1865::mg_1::34::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny fananany rehetra sy ny zanany madinika rehetra ary ny vadiny dia nobaboiny ka nofaohiny avokoa mbamin''izay rehetra tao an-trano.'
mg1865::mg_1::34::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba tamin''i Simeona sy Levy: Efa nahatonga loza amiko ianareo, fa efa nomaimboinareo eto amin''ny mponina amin''ny tany aho, dia amin''ny Kananita sy ny Perizita; nefa olom-bitsy aho, ka dia hiangona hamely ahy izy ireo ka hamono ahy; dia ho fongotra aho, dia izaho sy ny ankohonako.'
mg1865::mg_1::34::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 34
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy kosa izy: Moa ny anabavinay havela hataony toy ny vehivavy janga va?'
mg1865::mg_1::35::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nankanesan''i Jakoba tany Betela, sy ny nisehoan''Andriamanitra taminy indray'
  verse_text: 'Ary hoy Andriamanitra tamin''i Jakoba : Miaingà, miakara any Betela ianao ka monena any; ary manorena alitara any ho an''Andriamanitra Izay niseho taminao, fony ianao nandositra ny tavan''i Esao rahalahinao.'
mg1865::mg_1::35::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Jakoba tamin''izay tao an-tranony mbamin''izay rehetra nomba azy: Ario ireo andriamani-kafa, izay ao aminareo, dia madiova, sady ovay ny fitafianareo;'
mg1865::mg_1::35::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary andeha hiainga isika ka hiakatra any Betela; ary hanao alitara any aho ho an''Andriamanitra, Izay nihaino ahy tamin''ny andron''ny fahoriako ary nomba ahy tamin''ny lalana izay nalehako.'
mg1865::mg_1::35::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia natolony teo amin''i Jakoba ny andriamani-kafa rehetra izay notanany sy ny kavina izay teny an-tsofiny; ary dia nalevin''i Jakoba tao am-pototry ny hazo terebinta izay tao akaikin''i Sekema ireo.'
mg1865::mg_1::35::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia lasa nandeha izy; ary nisy tahotra avy amin''Andriamanitra nahazo ny tanàna manodidina azy, ka tsy nanenjika ny zanak''i Jakoba izy.'
mg1865::mg_1::35::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba dia tonga tany Lozy (Betela izany), izay any amin''ny tany Kanana, dia izy sy ny olona rehetra izay nomba azy.'
mg1865::mg_1::35::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanorina alitara teo izy, ka nataony hoe El-betela no anaran''izany tany izany; fa teo no nisehoan''Andriamanitra taminy, fony izy nandositra ny tavan''ny rahalahiny.'
mg1865::mg_1::35::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary maty Debora, mpitaiza an-dRebeka, ka naleviny tao am-pototr''i Betela, teo ambanin''ny hazo oka; ary ny anaran''io dia nataony hoe Alona-bakota.'
mg1865::mg_1::35::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra niseho indray tamin''i Jakoba, raha tonga avy tany Mesopotamia izy, ka nitahy azy.'
mg1865::mg_1::35::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Andriamanitra taminy: Jakoba no anaranao; nefa tsy hatao hoe Jakoba intsony ny anaranao, fa Isiraely ny anaranao; dia nataony hoe Isiraely no anarany.'
mg1865::mg_1::35::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Andriamanitra taminy: Izaho no Andriamanitra Tsitoha; maroa fara sy mihabetsaha; firenena maro no hiseho avy aminao, ary hisy mpanjaka amin''ny haterakao;'
mg1865::mg_1::35::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny tany izay nomeko an''i Abrahama sy Isaka dia homeko anao; ary ny taranakao mandimby anao koa no homeko ny tany.'
mg1865::mg_1::35::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra niakatra niala taminy, teo amin''ilay niresahany taminy.'
mg1865::mg_1::35::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba dia nanorina tsangam-bato teo amin''ny fitoerana izay niresahany taminy ka nanidina fanatitra aidina teo aminy sady nampidina diloilo teo aminy koa.'
mg1865::mg_1::35::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''ny tany izay niresahan''Andriamanitra taminy dia nataon''i Jakoba hoe Betela.'
mg1865::mg_1::35::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 16
  verse_date_revised: null
  verse_title: 'Ny nialan''i Jakoba tany Betela, sy ny nahafatesan-dRahely tany an-dàlana, ary ny anaran''ny zanakalahin''i Jakoba roa ambin''ny folo'
  verse_text: 'Dia nifindra niala tany Betela izy; ary nony efa kely foana no sisa tsy nahatongavany tao Efrata, dia nihetsi-jaza Rahely sady sarotiny.'
mg1865::mg_1::35::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony sarotiny toy izany izy, dia hoy ny mpampivelona taminy: Aza matahotra ianao; fa izato koa no zazalahy ho anao.'
mg1865::mg_1::35::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hiala aina (fa maty izy), dia nataony hoe Benony ny anarany; fa ny rainy kosa nanao azy hoe Benjamina.'
mg1865::mg_1::35::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia maty Rahely ka nalevina teo amin''ny lalana mankany Efrata (Betlehema izany).'
mg1865::mg_1::35::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba nanorina tsangam-bato teo ambonin''ny fasany, dia ilay tsangam-bato ao amin''ny fasan-dRahely mandraka androany.'
mg1865::mg_1::35::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia lasa nifindra Isiraely ka nanorina ny lainy tao ankoatr''i Migdaledera.'
mg1865::mg_1::35::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha nonina teo amin''izany tany izany Isiraely, dia avy Robena ka nandry tamin''i Bila, vaditsindranon-drainy; ary nahare izany Isiraely.'
mg1865::mg_1::35::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Jakoba dia roa ambin''ny folo mirahalahy: ny zanak''i Lea dia Robena, lahimatoan''i Jakoba, sy Simeona sy Levy sy Joda sy Isakara ary Zebolona;'
mg1865::mg_1::35::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'ny zana-dRahely kosa dia Josefa sy Benjamina;'
mg1865::mg_1::35::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny zanak''i Bila, ankizivavin-dRahely, kosa dia Dana sy Naftaly;'
mg1865::mg_1::35::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny zanak''i Zilpa, ankizivavin''i Lea, kosa dia Gada sy Asera. Ireo no zanakalahin''i Jakoba izay naterany tany Mesopotamia.'
mg1865::mg_1::35::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba nankany amin''Isaka rainy tany Mamre, any Kiriat-arba (Hebrona izany), izay nivahinian''i Abrahama sy Isaka.'
mg1865::mg_1::35::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''Isaka dia valo-polo amby zato taona.'
mg1865::mg_1::35::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 35
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niala aina Isaka ka maty, ary voangona any amin''ny razany, rehefa tratrantitra sady ela niainana izy; ary dia nandevina azy Esao sy Jakoba zananilahy.'
mg1865::mg_1::36::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny taranak''i Esao'
  verse_text: 'Ary izao no taranak''i Esao (Edoma izany):'
mg1865::mg_1::36::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Esao naka vady tamin''ny zanakavavin''ny Kananita, dia Ada, zanak''i Elona Hetita, sy Oholibama, zanak''i Ana, zanakavavin''i Zibona Hivita,'
mg1865::mg_1::36::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary Basemata, zanakavavin''Isimaela sady anabavin''i Nebaiota.'
mg1865::mg_1::36::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Ada niteraka an''i Elifaza tamin''i Esao; ary Basemata niteraka an''i Regoela;'
mg1865::mg_1::36::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary Oholibama niteraka an''i Jeosy sy Jalama ary Kora. Ireo no zanak''i Esao, izay naterany tany amin''ny tany Kanana.'
mg1865::mg_1::36::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nentin''i Esao ny vadiny sy ny zananilahy sy ny zananivavy sy ny olona rehetra tao an-tranony sy ny omby aman''ondriny sy ny biby fiompiny rehetra, mbamin''ny fananany rehetra izay efa nohariny tany amin''ny tany Kanana, ka dia lasa nankany amin''izay tany hialana eo anatrehan''i Jakoba rahalahiny.'
mg1865::mg_1::36::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa samy be loatra ny haren''izy mirahalahy, ka tsy mba nahazo niray monina izy; ary tsy omby azy ny tany fivahiniany, noho ny omby aman ondriny.'
mg1865::mg_1::36::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa nonina tany an-tendrombohitra Seira Esao. (Edoma izany).'
mg1865::mg_1::36::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no taranak''i Esao, rain''ny Edomita any an-tendrombohitra Seira:'
mg1865::mg_1::36::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny anaran''ny zanakalahin''i Esao dia izao: Elifaza, zanak''i Ada, vadin''i Esao, sy Regoela, zanak''i Basemata, vadin''i Esao.'
mg1865::mg_1::36::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Elifaza dia Temana sy Omara sy Zefo sy Gatama ary Kenaza.'
mg1865::mg_1::36::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Timna no vaditsindranon''i Elifaza, zanakalahin''i Esao; ary niteraka an''i Amaleka tamin''i Elifaza izy. Ireo no zanakalahin''i Ada, vadin''i Esao.'
mg1865::mg_1::36::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanakalahin''i Regoela: Nahata sy Zera sy Sama ary Miza; ireo no zanakalahin''i Basemata, vadin''i Esao.'
mg1865::mg_1::36::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanakalahin''i Oholibama, zanakavavin''i Ana, zanakavavin''i Zibona, vadin''i Esao: niteraka an''i Jeosy sy Jalama ary Kora tamin''i Esao izy.'
mg1865::mg_1::36::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izao no loham-pirenena tamin''ny taranak''i Esao: ny zanakalahin''i Elifaza, lahimatoan''i Esao, dia Temana loham-pireneny sy Omara loham-pireneny sy Zefo loham-pireneny sy Kenaza loham-pireneny'
mg1865::mg_1::36::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Kora loham-pireneny sy Gatama loham-pireneny ary Amaleka loham-pireneny. Ireo no loham-pireneny avy tamin''i Elifaza tany amin''ny tany Edoma; ireo no zanak''i Ada.'
mg1865::mg_1::36::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanakalahin''i Regoela, zanak''i Esao: Nahata loham-pireneny sy Zera loham-pireneny sy Sama loham-pireneny sy Miza loham-pireneny. Ireo no loham-pirenena avy tamin''i Regoela tany amin''ny tany Edoma; ireo no zanak''i Basemata, vadin''i Esao.'
mg1865::mg_1::36::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanakalahin''i Oholibama, vadin''i Esao: Jeosy loham-pireneny sy Jalama loham-pireneny sy Kora loham-pireneny. Ireo no loham-pirenena avy tamin''i Oholibama, zanakavavin''i Ana, vadin''i Esao.'
mg1865::mg_1::36::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo no zanak''i Esao, izay atao hoe koa Edoma, ary ireo no loham-pireneny.'
mg1865::mg_1::36::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanakalahin''i Seïra Horita, izay nonina tany amin''ny tany: Lotana sy Sobala sy Zibona sy Ana'
mg1865::mg_1::36::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Disona sy Ezera ary Disana. Ireo no loham-pirenena tamin''ny Horita, dia ny taranak''i Seïra, tany amin''ny tany Edoma.'
mg1865::mg_1::36::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Lotana dia Hory sy Hemana; ary Timna no anabavin''i Lotana.'
mg1865::mg_1::36::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanakalahin''i Sobala: Alvana sy Manahata sy Ebala sy Sefo ary Onama.'
mg1865::mg_1::36::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanakalahin''i Zibona: Aia sy Ana (izany Ana izany ilay nahita ny ranomafana tany an''efitra, raha niandry ny borikin''i Zibona rainy izy).'
mg1865::mg_1::36::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanak''i Ana: Disona sy Oholibama, zanakavavin''i Ana.'
mg1865::mg_1::36::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanakalahin''i Disona: Hemdana sy Esbana sy Jitrana ary Kerana.'
mg1865::mg_1::36::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanak''i Ezera: Bilana sy Zavana ary Akana.'
mg1865::mg_1::36::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no zanak''i Disana: Oza sy Arana.'
mg1865::mg_1::36::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no loham-pirenena tamin''ny Horita: Lotana loham-pireneny sy Sobala loham-pireneny sy Zibona loham-pireneny sy Ana loham-pireneny'
mg1865::mg_1::36::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Disona loham-pireneny sy Ezera loham-pireneny ary Disana loham-pireneny. Ireo no loham-pirenena tamin''ny Horita, dia ny loham-pireneny tany amin''ny tany Seïra.'
mg1865::mg_1::36::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no mpanjaka izay nanjaka tany amin''ny tany Edoma, fony tsy mbola nisy mpanjaka nanjaka tamin''ny Zanak''Isiraely:'
mg1865::mg_1::36::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nanjaka tany Edoma Bela, zanak''i Beora; ary Dinaba no anaran''ny tanànany.'
mg1865::mg_1::36::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary maty Bela, dia nanjaka nandimby azy Jobaba, zanak''i Zera avy tany Bozra.'
mg1865::mg_1::36::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary maty Jobaba, dia nanjaka nandimby azy Hosama avy tamin''ny tanin''ny Temanita.'
mg1865::mg_1::36::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary maty Hosama, dia nanjaka nandimby azy Hadada, zanak''i Bedada, izay namely ny Midianita tany amin''ny tany Moaba; ary Avita no anaran''ny tanànany.'
mg1865::mg_1::36::36:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary maty Hadada, dia nanjaka nandimby azy Samla avy tany Masreka.'
mg1865::mg_1::36::37:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary maty Samla, dia nanjaka nandimby azy Saoly avy tany Rehobota eo amoron''ny Ony.'
mg1865::mg_1::36::38:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary maty Saoly, dia nanjaka nandimby azy Bala-hanana, zanak''i Akbora.'
mg1865::mg_1::36::39:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 39
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary maty Bala-hanana, zanak''i Akbora; dia nanjaka nandimby azy Hadara; ary Pao no anaran''ny tanànany; ary ny anaran''ny vadiny dia Mehetabela, zanakavavin''i Matreda, zanakavavin''i Me-zahaba.'
mg1865::mg_1::36::40:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 40
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no anaran''ny loham-pirenena tamin''ny taranak''i Esao, araka ny mpianakaviny, araka ny fonenany sy araka ny anarany: Timna loham-pireneny sy Alva loham-pireneny sy Jeteta loham-pireneny'
mg1865::mg_1::36::41:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 41
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Oholibama loham-pireneny sy Elaha loham-pireneny sy Pinona loham-pireneny'
mg1865::mg_1::36::42:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 42
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Kenaza loham-pireneny sy Temana loham-pireneny sy Mibzara loham-pireneny'
mg1865::mg_1::36::43:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 36
  verse_number: 43
  verse_date_revised: null
  verse_title: null
  verse_text: 'sy Magdiela loham-pireneny ary Irama loham-pireneny. Ireo no loham-pirenena tamin''ny Edomita, araka ny fonenany, tany amin''ny taniny avy. Izany no Esao, rain''ny Edomita.'
mg1865::mg_1::37::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nankahalan''ny rahalahin''i Josefa azy, sy ny nivarotany azy ho andevo'
  verse_text: 'Ary Jakoba nonina tany amin''ny tany fivahinian''ny rainy, dia tany amin''ny tany Kanana.'
mg1865::mg_1::37::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no tantaran''i Jakoba: Rehefa fito ambin''ny folo taona Josefa, dia niara-niandry ondry tamin''ny rahalahiny izy (fa mbola zaza izy), dia tamin''ny zanak''i Bila sy ny zanak''i Zilpa, vadin''i Jakoba rainy; ary Josefa nitati-bolana tamin-drainy.'
mg1865::mg_1::37::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tian''Isiraely mihoatra noho ny zanany rehetra Josefa, satria zanaky ny fahanterany izy, ka nanaovany akanjo lava.'
mg1865::mg_1::37::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony hitan''ny rahalahiny fa Josefa no tian''ny rainy mihoatra noho izy mirahalahy avy, dia nankahala azy izy ka tsy nahazaka hanao teny tsara taminy.'
mg1865::mg_1::37::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanonofy Josefa, ka nambarany tamin''ireo rahalahiny; dia vao mainka nankahalany azy izany.'
mg1865::mg_1::37::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa efa nilaza taminy hoe izy: Mba henoy kely ange izao nofy izao:'
mg1865::mg_1::37::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Indro, namehy amboara tany an-tsaha isika, ary, indro, niarina ny amboarako sady nijoro; ary, indreo, nilahatra manodidina kosa ny amboaranareo ka niankohoka teo anatrehan''ny amboarako.'
mg1865::mg_1::37::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny rahalahiny taminy: Moa hanjaka aminay tokoa va ianao? na hanapaka anay tokoa va ianao? Ary izany nofiny sy teniny izany dia vao mainka nankahalany azy.'
mg1865::mg_1::37::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanonofy indray izy ka nolazainy tamin''ny rahalahiny; dia hoy izy: Indro, nanonofy indray aho; ary, indreo, ny masoandro sy ny volana ary ny kintana iraika ambin''ny folo niankohoka teo anatrehako.'
mg1865::mg_1::37::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nambarany tamin''ny rainy sy ireo rahalahiny koa izany; dia niteny mafy azy ny rainy ka nanao taminy hoe: Manao ahoana izany nofy efa nonofisinao izany? Moa ho avy tokoa va aho sy ny reninao ary ny rahalahinao ka hiankohoka amin''ny tany eo anatrehanao?'
mg1865::mg_1::37::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nialona azy ny rahalahiny; fa ny rainy kosa nitadidy izany zavatra izany.'
mg1865::mg_1::37::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary lasa ny rahalahiny niandry ny ondrin''ny rainy tany Sekema.'
mg1865::mg_1::37::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Isiraely tamin''i Josefa: Tsy miandry ondry any Sekema va ny rahalahinao? Avia mba hirahiko hankany aminy ianao. Ary hoy izy taminy : Inty Aho.'
mg1865::mg_1::37::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny rainy taminy: Masïna ianao, andeha, izahao na tsara ihany ny rahalahinao sy ny ondry aman''osy, na manao ahoana; ka miverena hilaza amiko. Dia nirahiny hiala avy teo amin''ny lohasahan''i Hebrona izy, dia nankany Sekema.'
mg1865::mg_1::37::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy lehilahy nahita azy, fa, indro, nirenireny tany an-tsaha izy; dia nanontany azy ralehilahy ka nanao hoe: Inona moa no tadiavinao?'
mg1865::mg_1::37::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy kosa izy: Ny rahalahiko no tadiaviko; koa masïna ianao, mba lazao amiko izay iandrasany ondry.'
mg1865::mg_1::37::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ralehilahy: Efa nifindra niala teto izy: fa efa reko izy niresaka hoe: Andeha isika hankany Dotana. Dia lasa Josefa nanaraka ny rahalahiny ka nahita azy tany Dotana.'
mg1865::mg_1::37::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nahatazana azy eny lavidavitra eny ny rahalahiny; koa raha tsy mbola nanakaiky azy Josefa, dia niray tetika hamono azy izy.'
mg1865::mg_1::37::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niresaka hoe izy: Indro, tamy ilay mpanonofy.'
mg1865::mg_1::37::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny, andeha hovonointsika izy ka hatsipintsika ao anatin''ny anankiray amin''ireto lavaka ireto; ary dia aoka holazaintsika hoe: Efa lanin''ny biby masiaka izy; dia ho hitantsika amin''izany na hanao ahoana ny nofiny.'
mg1865::mg_1::37::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Robena nandre izany, dia namonjy azy tamin''ny tanany ka nanao hoe: Aza dia mamono ny ainy isika.'
mg1865::mg_1::37::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa Robena taminy: Aoka tsy handatsa-drà ianareo; atsipazo ao anatin''io lavaka ety an''efitra io izy, fa aza misy maninji-tanana aminy ianareo, mba hamonjeny azy amin''ny tanan''ny rahalahiny hitondrany azy any amin''ny rainy indray.'
mg1865::mg_1::37::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tonga teo amin''ny rahalahiny Josefa, dia nendahany ny akanjony, dia ilay akanjo lava teny aminy;'
mg1865::mg_1::37::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia nobetainy izy ka natsipiny tao an-davaka; ary maina ny lavaka tamin''izay, fa tsy nisy rano tao.'
mg1865::mg_1::37::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nipetraka nihinan-kanina izy ireo, ary sendra nanopy ny masony ka nahatazana fa, indreo, nisy Isimaelita niara-dia, avy tany Gileada, ary ny ramevany nitondra ditin-kazo, dia nekota sy balsama ary lota, izay nentiny hidina any Egypta.'
mg1865::mg_1::37::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Joda tamin''ny rahalahiny: Inona no soa ho azontsika, raha hamono ny rahalahintsika sy hanafina ny ràny isika?'
mg1865::mg_1::37::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Andeha hamidintsika amin''ireo Isimaelita ireo izy, ary aoka tsy haninona azy ny tanantsika; fa rahalahintsika sy nofontsika ihany izy. Dia nanaiky ny rahalahiny.'
mg1865::mg_1::37::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha nandalo teo ny Midianita mpandranto, dia nakarin''ny rahalahiny niala tao an-davaka Josefa ka namidiny sekely volafotsy roa-polo tamin''ny Isimaelita; ary dia nitondra an''i Josefa ho any Egypta ireo.'
mg1865::mg_1::37::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niverina nankeo amin''ny lavaka Robena, ka, indro, tsy tao an-davaka intsony Josefa; dia nandriatra ny fitafiany izy.'
mg1865::mg_1::37::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niverina nankeo amin''ny rahalahiny izy ka nanao hoe: Tsy ao ny zaza, ary izaho, aiza no halehako?'
mg1865::mg_1::37::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nalain''ireo rahalahiny ilay akanjon''i Josefa, dia namono zanak''osy izy, ka natsobony tamin''ny rà ny akanjo.'
mg1865::mg_1::37::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampanateriny ho any amin''ny rainy ilay akanjo, sady hoy no filazany azy: Ity no efa hitanay; koa fantaro na akanjon''ny zanakao ity, na tsia?'
mg1865::mg_1::37::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia fantany, ka hoy izy: Akanjon''ny zanako io: efa lanin''ny biby masiaka izy; voaviravira tokoa Josefa.'
mg1865::mg_1::37::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba dia nandriatra ny fitafiany ka nisikina lamba fisaonana tamin''ny valahany; ary nisaona ny zanany andro maro.'
mg1865::mg_1::37::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia avy ny zananilahy rehetra sy ny zananivavy rehetra mba hampionona azy, fa tsy nety nampiononina izy, fa hoy izy; Tsia, fa hidina misaona ho any amin''ny zanako any amin''ny fiainan-tsy hita aho. Ary dia mbola nitomany azy ny rainy.'
mg1865::mg_1::37::36:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 37
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Midianita nivarotra an''i Josefa tany Egypta tamin''i Potifara, tandapan''i Farao sady mpifehy ny mpiambina.'
mg1865::mg_1::38::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny fanambadian''i Joda, sy ny zanany naterany, ary ny nijangajangany tamin''i Tamara'
  verse_text: 'Ary tamin''izany andro izany Joda dia nidina niala teo amin''ny rahalahiny ka lasa nanatona ny lehilahy Adolamita anankiray. Hira no anarany.'
mg1865::mg_1::38::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary teo no nahitan''i Joda ny zanakavavin''i Soa, lehilahy Kananita anankiray; dia naka azy izy ka nanambady azy.'
mg1865::mg_1::38::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka ravehivavy ka niteraka zazalahy; ary ny anarany nataony hoe Era.'
mg1865::mg_1::38::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka indray izy ka niteraka zazalahy; ary ny anarany nataony hoe Onana.'
mg1865::mg_1::38::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanan''anaka indray koa izy ka niteraka zazalahy; ary ny anarany nataony hoe Sela; ary Joda nitoetra tany Keziba tamin''ny niterahan''ny vadiny an''i Sela.'
mg1865::mg_1::38::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Joda naka vady ho an''i Era lahimatoany, Tamara no anarany.'
mg1865::mg_1::38::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ratsy fanahy teo imason''i Jehovah Era, lahimatoan''i Joda; dia novonoin''i Jehovah izy.'
mg1865::mg_1::38::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Joda tamin''i Onana: Vadio ny vadin''ny rahalahinao, ka ento loloha izy, dia velomy maso ny rahalahinao.'
mg1865::mg_1::38::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary fantatr''i Onana fa tsy ho azy tsinona ny zaza; koa raha nandry tamin''ny vadin''ny rahalahiny izy, dia nandraraka tamin''ny tany mba tsy hiterahany zanaka ho an''ny rahalahiny.'
mg1865::mg_1::38::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ratsy teo imason''i Jehovah izay nataony; ka dia novonoiny koa izy.'
mg1865::mg_1::38::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Joda tamin''i Tamara vinantoni-vavy: Tomoera ho mpitondratena ao an-tranon-drainao mandra-pahalehiben''i Sela zanako-lahy (fa hoy izy: Fandrao maty koa tahaka ny rahalahiny izy) dia nandeha Tamara ka nitoetra tao an-tranon-drainy.'
mg1865::mg_1::38::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa ela, dia maty ny vadin''i Joda, dia ilay zanakavavin''i Soa; ary rehefa nionona ny alahelon''i Joda, dia niakatra tany amin''ny mpanety ondriny tany Timna izy sy Hira Adolamita sakaizany.'
mg1865::mg_1::38::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nisy nanambara tamin''i Tamara hoe Indro, ny rafozanao miakatra ho any Timna hanety ny ondriny.'
mg1865::mg_1::38::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanaisotra ny akanjony fanaon''ny mpitondratena izy, dia nisarona fisalobonana ka nisalobona, dia nipetraka teo am-bavahadin''i Enaima, izay eo amin''ny lalana mankany Timna; satria efa hitan''i Tamara fa efa lehibe Sela, nefa tsy mbola nomen''i Joda ho vadin''i Sela izy.'
mg1865::mg_1::38::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan''i Joda izy ka nataony fa vehivavy janga, satria efa nanarona ny tavany izy.'
mg1865::mg_1::38::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivily nanatona azy teo amoron-dalana Joda ka nanao hoe: Aoka mba handry aminao aho (fa tsy fantany ho vinantony izy) dia hoy kosa ravehivavy: Inona ary no homenao ahy, raha handry amiko ianao?'
mg1865::mg_1::38::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Hampanatitra zanak''osy avy amin''ny ondry aman''osy aho. Fa hoy kosa ravehivavy: Hanome fampitanana va ianao mandra-pampanatitrao azy?'
mg1865::mg_1::38::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Inona no fampitanana homeko anao? Ary hoy ravehivavy: Ny fanombohan-kasenao sy ny kofehinao ary iny tehinao eny an-tananao iny. Ary nomeny azy ireny, dia nandry taminy izy, ka nanan''anaka taminy ravehivavy.'
mg1865::mg_1::38::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niainga ravehivavy ka lasa nandeha, dia nanala ny fisalobonana izay notafiny ka niakanjo ny akanjony fanaon''ny mpitondratena indray.'
mg1865::mg_1::38::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampitondrain''i Joda ilay Adolamita sakaizany ny zanak''osy, hangalany ilay fampitanana amin-dravehivavy; kanjo tsy hitany izy.'
mg1865::mg_1::38::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanontany ny olona teo amin''ny fonenan-dravehivavy izy ka nanao hoe: Aiza moa ilay vehivavy janga izay tamoron-dalana teo Enaima ? Fa hoy ny olona: Tsy nisy vehivavy janga teo.'
mg1865::mg_1::38::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niverina tany amin''i Joda izy ka nanao hoe: Tsy nahita azy aho; ary nolazain''ny olona tompon-tany fa tsy nisy vehivavy janga teo.'
mg1865::mg_1::38::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Joda: Aoka ho lasany ho azy, fandrao ho afa-baraka isika; indro, efa nampanateriko ity zanak''osy ity, nefa ianao tsy nahita an-dravehivavy.'
mg1865::mg_1::38::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka tokony ho telo volana, dia nisy nanambara tamin''i Joda hoe: Efa nijangajanga Tamara vinantovavinao; ka indro, efa manan''anaka tamin''ny fijangajangana izy. Dia hoy Joda: Avoahy izy hodorana.'
mg1865::mg_1::38::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa navoaka izy, dia naniraka tany amin''ny rafozany ka nanao hoe: Ny lehilahy izay tompon''ireto no nananako anaka; ary hoy koa izy: Masïna ianao, fantaro izay tompon''ireto fanombohan-kase sy kofehy ary tehina ireto.'
mg1865::mg_1::38::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nahafantatra ireo Joda ka nanao hoe: Marina noho izaho izy, satria tsy nomeko ho vadin''i Sela zanako. Dia tsy nandry taminy intsony izy.'
mg1865::mg_1::38::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''ny andro niterahany, indro, nisy zaza kambana tao an-kibony.'
mg1865::mg_1::38::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha niteraka izy, dia niseho ny tanan''ny anankiray, ary naka kofehy mena ny mpampivelona, ka nafehiny tamin''ny tanany, sady hoy izy: Ity no niseho voalohany.'
mg1865::mg_1::38::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nahemony ny tanany, dia, indro, teraka ny rahalahiny; ary hoy ny mpampivelona: Ahoana no nibosesehanao? dia nataony hoe Fareza no anarany.'
mg1865::mg_1::38::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 38
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka izany, dia teraka koa ny rahalahiny, izay nisy ilay kofehy mena tamin''ny tanany; dia nataony hoe Zera no anarany.'
mg1865::mg_1::39::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nanaovana an''i Josefa tao an-trano-maizina'
  verse_text: 'Ary Josefa nentina nidina ho any Egypta; ary Potifara, lehilahy Egyptiana, tandapan''i Farao sady mpifehy ny mpiambina, no nividy azy tamin''ny Isimaelita, izay nitondra azy nidina tany.'
mg1865::mg_1::39::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah nomba an''i Josefa, dia lehilahy nambinina izy; ary nitoetra tao an-tranon''ilay Egyptiana tompony izy.'
mg1865::mg_1::39::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan''ny tompony fa nomban''i Jehovah izy, ka izay rehetra nataony dia nambinin''i Jehovah avokoa teo aminy.'
mg1865::mg_1::39::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa nahita fitia teo imason''ny tompony, ka dia nanompo azy; dia notendreny ho mpikarakara ny tao an-tranony, ary izay rehetra nananany dia natolony ho andraikiny.'
mg1865::mg_1::39::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hatramin''izay nanendreny azy ho mpikarakara ny tao an-tranony mbamin''izay rehetra nananany dia notahin''i Jehovah ny tranon''ilay Egyptiana noho ny amin''i Josefa; ary ny fitahian''i Jehovah nomba izay rehetra nananany, na ny tao an-trano, na ny tany an-tsaha.'
mg1865::mg_1::39::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia navelany ho andraikitr''i Josefa izay rehetra nananany; ary izy tsy nihevitra intsony izay rehetra nananany na inona na inona afa-tsy ny hanin-kohaniny ihany. Ary Josefa dia bikàna sady tsara tarehy.'
mg1865::mg_1::39::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary taorian''izany ny vadin''ny tompony nanopy ny masony hijery an''i Josefa ka nanao hoe: Avia handry amiko.'
mg1865::mg_1::39::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandà izy ka nanao tamin''ny vadin''ny tompony hoe: Indro, ny tompoko tsy mahalala izay tandremako ato an-trano, fa izay rehetra ananany dia efa natolony ho andraikitro avokoa.'
mg1865::mg_1::39::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tsy misy lehibe noho izaho raha amin''ity trano ity, ary tsy misy zavatra narovany amiko afa-tsy ianao ihany, satria vadiny ianao; koa hataoko ahoana no hanao izany, ratsy lehibe izany ka hanota amin''Andriamanitra?'
mg1865::mg_1::39::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary na dia niteny tamin''i Josefa isan''andro aza ravehivavy, dia tsy nety nanaiky azy handry aminy izy na hiara-mitoetra aminy.'
mg1865::mg_1::39::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''ny indray andro dia niditra tao an-trano Josefa hanao ny raharahany; ary sendra tsy nisy mpanompo tao an-trano tamin''izay.'
mg1865::mg_1::39::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nisambotra azy tamin''ny akanjony ravehivavy ka nanao hoe : Avia handry amiko; fa navelan''i Josefa teo an-tanany ny akanjony, dia nandositra izy ka nivoaka teny ala-trano.'
mg1865::mg_1::39::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan-dravehivavy fa navelany teo an-tanany ny akanjony, sady lasa nandositra any ala-trano izy,'
mg1865::mg_1::39::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia niantso ny mpanompo izy ka nilaza taminy hoe: Indro, efa nampiditra lehilahy Hebreo tato amintsika hisangy antsika izy; nanatona ahy mba handry amiko iny, dia niantso tamin''ny feo mahery aho;'
mg1865::mg_1::39::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary nony reny fa nanandratra ny feoko aho ka niantso, dia navelany teto anilako ny akanjony, ary nandositra iny ka lasa any ala-trano.'
mg1865::mg_1::39::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia napetra-dravehivavy teo anilany ny akanjon''i Josefa, mandra-pahatongan''ny tompony tao an-trano.'
mg1865::mg_1::39::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nilaza taminy izy araka ireo teny ireo ka nanao hoe: Nanatona ahy ilay andevolahy Hebreo, izay nentinao ho eto amintsika, mba hisangy ahy;'
mg1865::mg_1::39::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary rehefa nanandratra ny feoko aho ka niantso, dia navelany eto anilako ny akanjony, ka lasa nandositra any ala-trano izy.'
mg1865::mg_1::39::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa ren''ny tompony ny tenin''ny vadiny, izay niteny taminy ka nanao hoe: Araka ireo teny ireo no nataon''ilay andevolahinao tamiko, dia nirehitra ny fahatezerany.'
mg1865::mg_1::39::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny tompon''i Josefa dia naka azy ka nanao azy tao an-trano-maizina, izay fitoeran''ny mpifatotra diso tamin''ny mpanjaka; dia nitoetra tao an-trano-maizina izy.'
mg1865::mg_1::39::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa Jehovah nomba an''i Josefa sy namindra fo taminy ka nampahita fitia azy teo imason''ny mpitandrina ny trano-maizina.'
mg1865::mg_1::39::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia natolotry ny mpitandrina ny trano-maizina ho andraikitr''i Josefa ny mpifatotra rehetra izay tao an-trano-maizina; ary izay rehetra nataony tao dia izy no antony.'
mg1865::mg_1::39::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 39
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny mpitandrina ny trano-maizina tsy mba nikarakara na inona na inona izay efa mby an-tanany, satria Jehovah nomba an''i Josefa, ary izay nataony dia nambinin''i Jehovah.'
mg1865::mg_1::40::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nilazan''i Josefa ny nofin''izy roa lahy tandapan''i Farao'
  verse_text: 'Ary taorian''izany ny mpitondra kapoakan''ny mpanjakan''i Egypta sy ny mpanao mofony dia diso tamin''ny mpanjakan''i Egypta tompony.'
mg1865::mg_1::40::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tezitra indrindra tamin''ireo tandapany roa lahy ireo Farao, dia tamin''ny lehiben''ny mpitondra kapoaka sy ny lehiben''ny mpanao mofo.'
mg1865::mg_1::40::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nataony tao an-trano-maizina izy roa lahy, tao an-tranon''ny mpifehy ny mpiambina, tao anatin''ny trano-maizina izay nifatoran''i Josefa.'
mg1865::mg_1::40::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa notendren''ny mpifehy ny mpiambina ho eo amin''izy roa lahy, dia nanompo ireo izy; ary nitoetra andro maromaro tao amin''ny trano-maizina izy roa lahy.'
mg1865::mg_1::40::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanonofy izy roa lahy indray alina, dia ilay mpitondra kapoaka sy ilay mpanao mofon''ny mpanjakan''i Egypta, izay nifatotra tao amin''ny trano-maizina, ka samy nanana ny nofiny araka ny hevitry ny nofiny avy.'
mg1865::mg_1::40::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa nankao aminy nony maraina ny andro ka nahita azy, fa, indreo, nalahelo tarehy izy.'
mg1865::mg_1::40::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanontanian''i Josefa ny tandapan''i Farao izay niara-nifatotra taminy tao an-tranon''ny tompony, ka hoy izy: Nahoana no malahelo tarehy izato ianareo ankehitriny?'
mg1865::mg_1::40::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy roa lahy taminy: Nanonofy izahay, ka tsy misy mahalaza ny heviny. Dia hoy Josefa taminy: Tsy avy amin''Andriamanitra va ny filazana ny hevitry ny nofy? Masïna ianareo, lazao amiko izany.'
mg1865::mg_1::40::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nambaran''ny lehiben''ny mpitondra kapoaka tamin''i Josefa ny nofiny, ka hoy izy taminy: Nofiko fa indro, hono, nisy tahom-boaloboka teo anatrehako;'
mg1865::mg_1::40::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ilay tahom-boaloboka nisampana telo, ka nony nitsimoka izy, dia niposaka ny voniny, ary ny sampahony nahavanona voaloboka masaka.'
mg1865::mg_1::40::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary teny an-tanako ny kapoakan''i Farao; dia nalaiko ny voaloboka ka nofiazako ho ao amin''ny kapoakan''i Farao, dia natolotro teo an-tanan''i Farao ny Kapoaka.'
mg1865::mg_1::40::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Josefa taminy: Izao no heviny: Ny sampany telo dia hateloana.'
mg1865::mg_1::40::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ato anatin''ny hateloana dia hasandratr''i Farao ianao ka hampodiny ho ao amin''ilay nipetrahanao; dia hanolotra ny kapoakan''i Farao ho eo an-tanany ianao tahaka ilay fanao fahiny, fony ianao mpitondra kapoakany.'
mg1865::mg_1::40::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa mba tsarovy aho, rehefa mahita soa ianao, ka trarantitra ianao, iantrao aho, dia lazao amin''i Farao aho, ka avoahy amin''ity trano ity;'
mg1865::mg_1::40::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa nangalarina mihitsy avy tany amin''ny tanin''ny Hebreo aho, ary aty koa tsy mba nanao izay tokony ho nanaovany ahy eto amin''ity lavaka ity aho.'
mg1865::mg_1::40::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''ny lehiben''ny mpanao mofo fa tsara ny filazana ny hevitry ny nofy, dia hoy izy tamin''i Josefa: Izaho koa nanonofy, ka, indro, niloloha karaba telo feno mofo fotsy aho;'
mg1865::mg_1::40::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary teo anatin''ny karaba ambony indrindra dia nisy ny fihinan''i Farao samy hafa karazana rehetra fanaon''ny mpanao mofo; ary nohanin''ny vorona teo anatin''ny karaba izay nololohaviko izany.'
mg1865::mg_1::40::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly Josefa ka nanao hoe: Izao kosa no heviny. Ny karaba telo dia hateloana.'
mg1865::mg_1::40::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ato anatin''ny hateloana dia hasandratr''i Farao ho afaka aminao ny lohanao, (ka hahantony amin''ny hazo ianao) dia hohanin''ny vorona ny nofonao.'
mg1865::mg_1::40::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''ny andro fahatelo, izay niherenan''ny taona nahaterahan''i Farao, dia nanao fanasana ho an''ny mpanompony rehetra izy; dia nasandrany ny lohan''ny lehiben''ny mpitondra kapoaka sy ny lohan''ny lehiben''ny mpanao mofo teo amin''ny mpanompony.'
mg1865::mg_1::40::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny lehiben''ny mpitondra kapoaka dia nampodiny tamin''ny fitondrany kapoaka indray, ka dia nanolotra ny kapoaka ho eo an-tanan''i Farao izy;'
mg1865::mg_1::40::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa ny lehiben''ny mpanao mofo kosa dia nahantony, araka izay efa nolazain''i Josefa tamin''izy roa lahy avy.'
mg1865::mg_1::40::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 40
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Kanjo tsy mba nahatsiaro an''i Josefa ilay lehiben''ny mpitondra kapoaka, fa nanadino azy.'
mg1865::mg_1::41::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nilazan''i Josefa ny nofin''i Farao, sy ny nanandratana azy ho mpanapaka any Egypta'
  verse_text: 'Ary rehefa afaka roa taona mipaka, dia nanonofy Farao, fa, indro, nitsangana teo amoron''i Neily izy.'
mg1865::mg_1::41::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa, indreo, nisy ombivavy fito tsara tarehy sady matavy niakatra avy teo Neily ka nihinana teny amin''ny bararata.'
mg1865::mg_1::41::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary indreo, nisy ombivavy fito hafa kosa ratsy tarehy sady mahia niakatra avy teo Neily nanaraka azy, ka dia nijanona teo anilan''ireo ombivavy teo amoron''i Neily.'
mg1865::mg_1::41::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ireo ombivavy ratsy tarehy sady mahia nihinana ireo ombivavy fito tsara tarehy sady matavy. Dia nahatsiaro Farao.'
mg1865::mg_1::41::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary natory indray izy ka nanonofy fanindroany; ary, indro, nisy salohim-bary fito niseho tamin''ny tahony iray, sady vokatra no tsara.'
mg1865::mg_1::41::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary, indreo kosa, nisy salohim-bary fito maivam-boa sady main''ny rivotra avy any atsinanana, niseho nanaraka ireny.'
mg1865::mg_1::41::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny salohim-bary maivam-boa nitelina ny salohim-bary fito vokatra sy be voa. Dia nahatsiaro Farao, koa indro fa nofy ihany izany.'
mg1865::mg_1::41::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony maraina, dia nitebiteby ny fanahiny, ka dia naniraka nampaka ny ombiasy rehetra tao Egypta sy ny olon-kendry rehetra tao izy; ary nambaran''i Farao tamin''ireny ny nofiny, kanjo tsy nisy na dia iray aza nahalaza izay heviny tamin''i Farao.'
mg1865::mg_1::41::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niteny tamin''i Farao ilay lehiben''ny mpitondra kapoaka ka nanao hoe: Tsaroako izao ny fahadisoako:'
mg1865::mg_1::41::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Farao dia tezitra tamin''ny mpanompony ka nanao ahy tao an-trano-maizina tao anatin''ny tranon''ny mpifehy ny mpiambina, dia izaho sy ilay lehiben''ny mpanao mofo.'
mg1865::mg_1::41::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanonofy izahay indray alina, dia izaho sy izy; samy nanonofy araka ny hevitry ny nofinay avy izahay.'
mg1865::mg_1::41::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tao aminay dia nisy zatovo Hebreo anankiray, mpanompon''ny mpifehy ny mpiambina; dia nambaranay taminy ny nofinay, ka nolazainy taminay ny heviny; samy nilazany araka ny nofinay avy izahay.'
mg1865::mg_1::41::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary samy tonga araka izay efa nolazainy taminay indrindra izany: izaho nampodiny ho ao amin''ilay nipetrahako, fa izy kosa nahantony.'
mg1865::mg_1::41::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naniraka Farao ka nampaka an''i Josefa, dia nalaina faingana niala tao andavaka izy; ary nanaratra ny volom-bavany sy niova fitafiana izy, dia nankany amin''i Farao.'
mg1865::mg_1::41::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Farao tamin''i Josefa : Nanonofy aho, koa tsy misy mahalaza ny heviny; ary izaho nahare fa ianao, hono, raha mandre nofy, dia mahalaza ny heviny.'
mg1865::mg_1::41::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa dia namaly an''i Farao ka nanao hoe: Tsy ahy izany; Andriamanitra no hilaza izay valiny hiadanan''i Farao.'
mg1865::mg_1::41::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Farao tamin''i Josefa: Nofiko fa indro, hono, nitsangana teo amoron''i Neily aho;'
mg1865::mg_1::41::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'koa, indreo, nisy ombivavy fito matavy sady tsara tarehy niakatra avy teo Neily; ary nihinana teny amin''ny bararata ireny.'
mg1865::mg_1::41::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary, indreo, nisy ombivavy fito hafa koa niakatra nanaraka ireny, mihozohozo sady ratsy tarehy indrindra no mahia, ka tsy mbola hitako izay ratsy toa azy teto amin''ny tany Egypta rehetra.'
mg1865::mg_1::41::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ireo ombivavy fito mahia sady ratsy tarehy dia nihinana ireo ombivavy fito matavy izay nialoha azy.'
mg1865::mg_1::41::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nihinana azy izy, dia tsy fantatra akory fa efa mby ao an-kibony ireny; fa mbola ratsy tarehy tahaka ny tamin''ny fahiny ihany izy. Dia nahatsiaro aho.'
mg1865::mg_1::41::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitako tamin''ny nofiko indray, ka, indreo nisy salohim-bary fito niseho tamin''ny tahony iray, sady vokatra no tsara;'
mg1865::mg_1::41::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary, indreo kosa, nisy salohim-bary fito sady malazo no maivam-boa, main''ny rivotra avy any atsinanana, niseho nanaraka ireny;'
mg1865::mg_1::41::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny salohim-bary maivam-boa dia nitelina ny salohim-bary fito vokatra. Ary nolazaiko tamin''ny ombiasy izany, nefa tsy nisy nahalaza ny heviny tamiko.'
mg1865::mg_1::41::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Josefa tamin''i Farao: Ny nofin''i Farao dia iray ihany; izay efa hataon''Andriamanitra no nambarany tamin''i Farao.'
mg1865::mg_1::41::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny ombivavy fito tsara tarehy dia fito taona; ary ny salohim-bary fito vokatra koa dia fito taona; iray ihany ny nofy.'
mg1865::mg_1::41::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny ombivavy fito mahia sady ratsy tarehy, izay niakatra nanaraka ireny, dia fito taona; ary ny salohim-bary fito tsy nisy voa sady main''ny rivotra avy any atsinanana, dia ho fito taona mosarena.'
mg1865::mg_1::41::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izany dia ilay efa nolazaiko tamin''i Farao teo hoe: Izay efa hataon''Andriamanitra no asehony amin''i Farao.'
mg1865::mg_1::41::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Indro, hisy fito taona zina indrindra eran''ny tany Egypta rehetra;'
mg1865::mg_1::41::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary manaraka izany kosa dia hisy fito taona mosarena, ka ho hadino ny fahavokarana be rehetra teo amin''ny tany Egypta ary ho ritry ny mosary ny tany;'
mg1865::mg_1::41::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny fahavokarana eo amin''ny tany tsy ho fantatra noho izany mosary manaraka azy izany; fa ho mafy indrindra izany.'
mg1865::mg_1::41::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary naverina indroa ny nofin''i Farao, satria efa voatendrin''Andriamanitra izany zavatra izany ka hotanterahin''Andriamanitra faingana.'
mg1865::mg_1::41::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny aoka Farao hizaha lehilahy manan-tsaina sady hendry ka hanendry azy hanapaka ny tany Egypta.'
mg1865::mg_1::41::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Aoka hanao izany Farao, ary aoka izy hanendry mpikarakara hitandrina ny tany sy hamory ny ampahadimin''ny vokatry ny tany Egypta amin''ny taon-jina fito.'
mg1865::mg_1::41::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary aoka izy ireo hanangona ny hanina rehetra amin''ireo taona tsara ho avy ireo ka hamory vary be amin''ny anaran''i Farao ho fihinana any amin''ny tanana maro, ka aoka hitahiry izany izy'
mg1865::mg_1::41::36:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary aoka izany hanina izany hotehirizina ao amin''ny tany ho amin''ny fito taona mosarena, izay ho tonga amin''ny tany Egypta, mba tsy ho simban''ny mosary ny tany.'
mg1865::mg_1::41::37:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary sitrak''i Farao sy ny mpanompony rehetra izany hevitra izany.'
mg1865::mg_1::41::38:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Farao tamin''ny mpanompony: Hahita lehilahy tahaka io, izay manana ny Fanahin''Andriamanitra ao anatiny, va isika?'
mg1865::mg_1::41::39:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 39
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa Farao tamin''i Josefa: Satria efa nampahafantarin''Andriamanitra anao izany rehetra izany, dia tsy misy lehilahy manan-tsaina sady hendry tahaka anao;'
mg1865::mg_1::41::40:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 40
  verse_date_revised: null
  verse_title: null
  verse_text: 'koa ianao no hanapaka ny ato an-tranoko, ary araka ny teninao no hitondrana ny oloko rehetra; ny seza fiandrianana ihany no hahalehibe ahy noho ianao.'
mg1865::mg_1::41::41:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 41
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy indray Farao tamin''i Josefa: Indro, efa nanendry anao hanapaka ny tany Egypta rehetra aho.'
mg1865::mg_1::41::42:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 42
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nesorin''i Farao ny peratra tamin''ny tanany ka nataony tamin''ny tanan''i Josefa, dia nampitafiny rongony fotsy madinika izy, ary nasiany rojo volamena ny vozony;'
mg1865::mg_1::41::43:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 43
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia nampitaingeniny teo anatin''ny kalesiny faharoa izy, ary ny vahoaka niantso teo alohany nanao hoe: Mandohaleha; ary notendreny ho mpanapaka ny tany Egypta rehetra izy.'
mg1865::mg_1::41::44:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 44
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Farao tamin''i Josefa: Izaho no Farao, ary raha tsy teninao, dia tsy hisy olona hanetsika ny tanany na ny tongony eto amin''ny tany Egypta rehetra.'
mg1865::mg_1::41::45:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 45
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nataon''i Farao hoe Zafenata-panea no anaran''i Josefa; dia nomeny azy Asenata, zanakavavin''i Poti-fera, mpisorona tao Ona, ho vadiny. Ary Josefa nandeha nitety ny tany Egypta.'
mg1865::mg_1::41::46:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 46
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary efa telo-polo taona Josefa, raha niseho teo anatrehan''i Farao, mpanjakan''i Egypta. Dia niala teo anatrehan''i Farao Josefa ka nandeha nitety ny tany Egypta rehetra.'
mg1865::mg_1::41::47:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 47
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny tany dia nahavokatra tsy omby fàmpana tamin''ny taon-jina fito.'
mg1865::mg_1::41::48:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 48
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namory ny hanina rehetra tamin''izany fito taona izany teo amin''ny tany Egypta izy ka nitahiry izany tao amin''ny tanàna rehetra: ny vokatry ny saha manodidina ny isan-tanàna dia notehiriziny tao anatin''ny tanàna.'
mg1865::mg_1::41::49:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 49
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa namory vary tahaka ny fasika any an-dranomasina, eny, be indrindra, ka tsy nanisa intsony izy, satria efa tsy hita isa.'
mg1865::mg_1::41::50:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 50
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy zazalahy roa naterak''i Asenata, zanakavavin''i Poti-fera, mpisorona tao Ona, tamin''i Josefa, raha tsy mbola tonga ny taona mosarena.'
mg1865::mg_1::41::51:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 51
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''ny lahimatoa dia nataon''i Josefa hoe Manase; fa hoy izy: Andriamanitra efa nampanadino ahy ny fahoriako rehetra sy izay rehetra tao an-tranon''ny raiko.'
mg1865::mg_1::41::52:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 52
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''ny zandriny kosa nataony hoe Efraima; fa hoy izy: Andriamanitra efa nahamaro ahy teto amin''ny tanin''ny fahoriako.'
mg1865::mg_1::41::53:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 53
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tapitra ny taon-jina fito teo amin''ny tany Egypta;'
mg1865::mg_1::41::54:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 54
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia niandoha kosa ny fito taona mosarena, araka izay efa nolazain''i Josefa; ary nisy mosary tany amin''ny tany rehetra; nefa eran''ny tany Egypta rehetra dia mbola nisy hanina ihany.'
mg1865::mg_1::41::55:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 55
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa mosarena ny tany Egypta rehetra, dia nitaraina nangataka hanina tamin''i Farao ny olona; ary hoy Farao tamin''ny Egyptiana rehetra: Mankanesa any amin''i Josefa; ary izay holazainy aminareo dia ataovy.'
mg1865::mg_1::41::56:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 56
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny mosary dia tany amin''ny tany rehetra. Ary Josefa namoha ny trano fitehirizam-bary ka nivaro-bary tamin''ny Egyptiana.'
mg1865::mg_1::41::57:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 41
  verse_number: 57
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny tany rehetra nankany Egypta ho any amin''i Josefa mba hividy vary; fa efa mafy ny mosary tany amin''ny tany rehetra.'
mg1865::mg_1::42::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nandehanan''ny zanak''i Jakoba hividy vary tany Egypta, sy ny nihaonany tamin''i Josefa'
  verse_text: 'Ary fantatr''i Jakoba fa nisy vary tany Egypta, dia hoy izy tamin''ny zananilahy: Nahoana no mifampijery foana ianareo ?'
mg1865::mg_1::42::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy koa izy: Indro, efa reko fa misy vary any Egypta; andeha midina any ianareo, ka mividia ho antsika, mba ho velona isika, fa tsy ho faty.'
mg1865::mg_1::42::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia lasa nidina izy folo lahy rahalahin''i Josefa mba hividy vary tany Egypta.'
mg1865::mg_1::42::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Benjamina, rahalahin''i Josefa, tsy mba nampandehanin''i Jakoba niaraka tamin''ny rahalahiny; fa hoy izy: Andrao hisy loza hanjo azy.'
mg1865::mg_1::42::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia tonga ny zanak''Isiraely mba hividy vary niaraka tamin''izay nankany; fa tratry ny mosary koa ny tany Kanana.'
mg1865::mg_1::42::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa no mpanapaka ny tany, sady izy no mpivaro-bary tamin''ny tompon-tany rehetra; ary tonga ny rahalahin''i Josefa ka niankohoka tamin''ny tany teo anatrehany.'
mg1865::mg_1::42::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan''i Josefa ny rahalahiny, dia fantany ihany izy, nefa nody olon-kafa taminy izy ka niteny mafy taminy nanao hoe: Avy aiza ianareo? Ary hoy kosa izy: Avy any amin''ny tany Kanana izahay mba hividy hanina.'
mg1865::mg_1::42::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary fantatr''i Josefa ny rahalahiny, nefa izy ireo kosa tsy mba nahafantatra azy.'
mg1865::mg_1::42::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa nahatsiaro ireo nofy nanofisany azy ka nanao taminy hoe: Mpisafo ianareo; hizaha ny fangadihadin''ny tany no nahatongavanareo.'
mg1865::mg_1::42::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy izy ireo taminy: Tsia, tompokolahy; fa tonga mba hividy hanina ny mpanomponao.'
mg1865::mg_1::42::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Zanaky ny lehilahy iray ihany izahay rehetra; olo-marina izahay, fa tsy mba mpisafo tsy akory ny mpanomponao.'
mg1865::mg_1::42::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy taminy: Tsia, fa hizaha ny fangadihadin''ny tany no nahatongavanareo.'
mg1865::mg_1::42::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy izy; Roa ambin''ny folo mirahalahy ny mpanomponao, zanaky ny lehilahy iray ihany any amin''ny tany Kanana; ary, indro, ny faralahy dia any amin''ny rainay ankehitriny, fa ny anankiray tsy ao intsony.'
mg1865::mg_1::42::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Josefa taminy: Ilay voalazako taminareo ihany hoe: Mpisafo ianareo no marina;'
mg1865::mg_1::42::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 15
  verse_date_revised: '2022-05-17T10:36:35+0000'
  verse_title: null
  verse_text: 'dia izao ary no hamantarana anareo: Raha velona koa Farao, tsy hiala aty ianareo, raha tsy tonga aty izany zandrinareo faralahy izany.'
mg1865::mg_1::42::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Iraho ny anankiray aminareo, ary aoka izy haka ny zandrinareo, fa ianareo hafatotra, mba hofantarina ny teninareo, na marina na tsia; fa raha tsy izany, raha velona koa Farao, dia mpisafo tokoa ianareo.'
mg1865::mg_1::42::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nataony tao an-trano-maizina hateloana izy rehetra.'
mg1865::mg_1::42::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony tamin''ny andro fahatelo dia hoy Josefa taminy: Izao no ataovy, dia ho velona ianareo; fa izaho matahotra an''Andriamanitra:'
mg1865::mg_1::42::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha olo-marina ary ianareo, dia aoka ny anankiray aminareo mirahalahy avy no hafatotra ao amin''ny trano-maizina nitoeranareo; ary mandehana ianareo hitondra vary noho ny mosary any amin''ny tranonareo;'
mg1865::mg_1::42::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny zandrinareo faralahy dia ento mankaty amiko; dia ho hita fa marina ny teninareo, ary tsy hovonoina ianareo. Ary nataony izany.'
mg1865::mg_1::42::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niresaka hoe izy: Efa meloka tokoa isika noho ny amin''ny rahalahintsika, satria nahita ny fahorian''ny fanahiny isika, raha nitaraina tamintsika izy, nefa tsy mba nihaino isika; koa izany no nahatongavan''izao fahoriana izao amintsika.'
mg1865::mg_1::42::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly azy Robena ka nanao hoe: Moa tsy niteny taminareo va aho ka nanao hoe: Aza manota amin''ny zaza? nefa tsy mba nihaino ianareo; koa indro fa adinina ny ràny izao.'
mg1865::mg_1::42::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izy ireo tsy mba nahalala fa Josefa nahafantatra ny teniny, satria nisy mpandika teny niresahany taminy.'
mg1865::mg_1::42::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa dia nihodina niala teo aminy ka nitomany; ary niverina nankeo aminy indray izy ka niteny taminy, ary dia naka an''i Simeona teo aminy izy ka namatotra azy teo imasony.'
mg1865::mg_1::42::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa nanome teny hameno vary ny lasakany sady hamerina ny volan''ny isan-dahy ho ao anatin''ny lasakany avy ary hanome vatsy azy ho entiny eny an-dàlana; dia nanao izany taminy izy.'
mg1865::mg_1::42::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary natainginy tamin''ny borikiny ny vary, dia lasa nandeha izy.'
mg1865::mg_1::42::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha nosokafan''ny anankiray ny lasakany hampihinanany ny borikiny teo amin''izay handriany, dia hitany ny volany; fa, indro, teo am-bavan''ny lasakany izany.'
mg1865::mg_1::42::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy tamin''ireo rahalahiny: Naverina ny volako, ka, indro, eo anatin''ny lasakako izany; dia ketraka ny fony, ary nifampijery amin-tahotra izy ka niresaka hoe: Inona izao ataon''Andriamanitra amintsika izao ?'
mg1865::mg_1::42::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tonga tany amin''i Jakoba rainy, tany amin''ny tany Kanana izy, dia nambarany taminy izay rehetra efa nanjo azy, ka hoy izy :'
mg1865::mg_1::42::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mafy ny teny nataon-dralehilahy, tompon''ny tany, taminay, fa nataony ho mpisafo ny tany izahay.'
mg1865::mg_1::42::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izahay taminy: Olo-marina izahay, fa tsy mba mpisafo tsy akory;'
mg1865::mg_1::42::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'roa ambin''ny folo mirahalahy izahay no zanaky ny rainay; tsy ao intsony ny anankiray, ary ny faralahy dia any amin''ny rainay any amin''ny tany Kanana ankehitriny.'
mg1865::mg_1::42::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ralehilahy, tompon''ny tany, taminay: Izao ary no hahafantarako fa olo-marina ianareo : ny anankiray aminareo mirahalahy avy dia avelao aty amiko, ka mitondra vary noho ny mosary any amin''ny tranonareo, dia mandehana;'
mg1865::mg_1::42::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ento mankaty amiko ny zandrinareo faralahy, dia ho fantatro fa tsy mba mpisafo ianareo, fa olo-marina; dia homeko anareo ny rahalahinareo, ka dia hanao varotra eto amin''ny tany ianareo.'
mg1865::mg_1::42::35:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha nandraraka izay tao anatin''ny lasakany izy ireo, dia, indro, ny volany am-ponosana samy teo anatin''ny lasakany avy; ary rehefa nahita ny volany am-ponosana izy sy ny rainy, dia samy raiki-tahotra.'
mg1865::mg_1::42::36:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba rainy taminy: Foananareo anaka aho: Josefa tsy eto intsony, Simeona koa tsy eto intsony, ary Benjamina indray halainareo; izaho ihany no ozoin''izany rehetra izany,'
mg1865::mg_1::42::37:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Robena niteny tamin''ny rainy ka nanao hoe: Vonoy ny zanako roa lahy, raha tsy entiko miverina aty aminao izy; atolory eto an-tanako izy, dia izaho no hitondra azy mody ho aty aminao indray.'
mg1865::mg_1::42::38:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 42
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba: Tsy hidina hiaraka aminareo ny zanako; fa maty ny rahalahiny, ary izy irery ihany no sisa, ary raha hisy loza hanjo azy any amin''ny lalana izay halehanareo, dia hampidininareo any amin''ny fiainan-tsy hita amin''alahelo ny volo fotsiko.'
mg1865::mg_1::43::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nandehanan''ny zanak''i Jakoba fanindroany, sy ny nizahan''i Josefa toetra azy'
  verse_text: 'Ary mafy ny mosary teo amin''ny tany.'
mg1865::mg_1::43::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa laniny ny vary izay efa nalainy tany Egypta, dia hoy ny rainy taminy: Mandehana indray, mividia hanina kely ho antsika.'
mg1865::mg_1::43::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Joda niteny taminy ka nanao hoe: Efa nilaza mafy taminay ralehilahy ka nanao hoe: Tsy hahita ny tavako ianareo, raha tsy hiaraka aminareo ilay rahalahinareo.'
mg1865::mg_1::43::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha hampandehaninao hiaraka aminay ny rahalahinay, dia hidina izahay ka hividy hanina ho anao;'
mg1865::mg_1::43::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa raha tsy hampandehaninao izy, dia tsy hidina izahay; fa hoy ralehilahy taminay: Tsy hahita ny tavako ianareo, raha tsy hiaraka aminareo ilay rahalahinareo.'
mg1865::mg_1::43::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Isiraely: Nahoana no dia nampidi-doza tamiko ianareo ka nanambara tamin-dralehilahy fa mbola nanan-drahalahy koa ianareo?'
mg1865::mg_1::43::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy ireo: Nanadina dia nanadina ny amin''ny tenanay sy ny mpianakavinay ralehilahy ka nanao hoe: Mbola velona ihany va izay rainareo? ary manan-drahalahy hafa koa va ianareo? Dia nambaranay taminy araka izany teny izany; moa nampoizinay akory va izay hanaovany hoe: Ento midina ny rahalahinareo?'
mg1865::mg_1::43::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Joda tamin''Isiraely rainy: Ampandehano hiaraka amiko ny zaza, dia hiainga izahay ka handeha, mba ho velona isika ka tsy ho faty, dia izahay sy ianao ary ny zanatsika madinika koa.'
mg1865::mg_1::43::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izaho no hiantoka azy; amin''ny tanako no handraisanao azy; raha tsy ho entiko aty aminao ka hatolotro eto anatrehanao izy, dia ho meloka aminao amin''ny andro rehetra hiainako aho;'
mg1865::mg_1::43::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa raha tsy nijanonjanona izahay, dia efa tafaverina fanindroany toy izay.'
mg1865::mg_1::43::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Isiraely rainy taminy: Raha izany ary no izy, dia izao no ataovy: analao ny vokatra malaza amin''ny tany ka ataovy ao anatin''ny fitondran-entanareo, dia ento midina haterina ho an-dralehilahy, dia balsama kely sy tantely kely, ditin-kazo nekota sy lota sy pistakia ary amygdala;'
mg1865::mg_1::43::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary mitondra vola toraka ny teo eny an-tananareo; ary ilay vola izay naverina teo am-bavan''ny lasakanareo dia ento miverina indray; angamba fahadisoana izany.'
mg1865::mg_1::43::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny rahalahinareo ento ihany; dia miainga ka miverena indray ho any amin-dralehilahy;'
mg1865::mg_1::43::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary Andriamanitra Tsitoha anie hampahita famindram-po anareo eo anatrehan-dralehilahy, mba hampodiny ny rahalahinareo anankiray sy Benjamina. Ary izaho, raha foanana anaka aho, dia foana anaka ihany.'
mg1865::mg_1::43::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nentin''ireo lehilahy ireo ny zavatra hateriny, ary vola indroa toraka ny teo koa no nentiny teny an-tanany mbamin''i Benjamina; ary niainga izy, dia nidina tany Egypta ka tonga teo anatrehan''i Josefa.'
mg1865::mg_1::43::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa, raha nahita an''i Benjamina niaraka taminy, dia nanao tamin''ny mpikarakara ny tao an-tranony hoe: Ampidiro atsy an-trano ireo lehilahy ireo, dia amonoy zavatra izy ka anaovy nahandro; fa hiara-mihinana amiko izy raha mitataovovonana ny andro.'
mg1865::mg_1::43::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nataon-dralehilahy araka izay nandidian''i Josefa; ka nampidirin-dralehilahy tao an-tranon''i Josefa ireo.'
mg1865::mg_1::43::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia raiki-tahotra ireo lehilahy ireo, satria nampidirina tao an-tranon''i Josefa, ka hoy izy: Maintsy ilay vola naverina tao anatin''ny lasakantsika fahiny va no nampidirana antsika, hivarinany amintsika sy hianjerany amintsika! dia halainy ho andevo isika, ary halainy koa ny borikintsika.'
mg1865::mg_1::43::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanatona an-dralehilahy, mpikarakara ny tao an-tranon''i Josefa, izy ka niteny taminy teo am-baravaran''ny trano nanao hoe:'
mg1865::mg_1::43::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mba henoy kely izahay, tompokolahy: nidina hividy hanina tokoa izahay fahiny:'
mg1865::mg_1::43::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary rehefa tonga teo amin''izay nandrianay izahay, dia nosokafanay ny lasakanay, ka indreo ny volanay isan-dahy teo am-bavan''ny lasakanay avy, tonga lanja avokoa ny volanay; ary efa nentinay niverina eto an-tananay izany.'
mg1865::mg_1::43::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nitondra vola hafa koa eto an-tananay izahay hamidy hanina: tsy fantatray izay nanao ny volanay tao anatin''ny lasakanay.'
mg1865::mg_1::43::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Matokia ianareo, fa aza matahotra; Andriamanitrareo, dia Andriamanitry ny rainareo, no nanome anareo harena tao anatin''ny lasakanareo; ny volanareo dia efa tonga taty amiko ihany. Dia namoaka an''i Simeona ho eo aminy izy.'
mg1865::mg_1::43::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nampidirin-dralehilahy tao an-tranon''i Josefa ireo olona ireo ka nomeny rano, dia nanasa tongotra izy, ary ny borikiny nomeny hanina koa.'
mg1865::mg_1::43::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandamina ny zavatra hateriny izy mandra-pihavin''i Josefa rehefa mitataovovonana ny andro; fa efa reny fa eo no hihinanany hanina.'
mg1865::mg_1::43::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tonga tao an-trano Josefa, dia nampidirin''izy mirahalahy avy ho ao an-trano mba hatolotra azy ireo zavatra efa nentiny, dia niankohoka tamin''ny tany teo anatrehany izy.'
mg1865::mg_1::43::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa nanontany ny toeny ka nanao hoe: Tsara ihany va ny rainareo, ilay lahy antitra nolazainareo? mbola velona ihany va izy?'
mg1865::mg_1::43::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Tsara ihany ny mpanomponao rainay; mbola velona ihany izy. Dia niondrika izy ireo ka niankohoka.'
mg1865::mg_1::43::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa nanopy ny masony ka nahita an''i Benjamina rahalahiny, zanakalahin''ny reniny, dia hoy izy: Io va no zandrinareo faralahy, izay nolazainareo tamiko? Sady hoy koa izy: Andriamanitra anie hanisy soa anao, anaka'
mg1865::mg_1::43::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niala faingana Josefa, fa nangorakoraka ny fony noho ny rahalahiny, ka nitady izay hitomaniany izy; dia niditra tao an-efi-trano izy ka nitomany tao.'
mg1865::mg_1::43::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nanasa ny tavany izy, dia nivoaka; ary nanindry ny fangorakoraky ny fony izy ka nanao hoe: Ento ny nahandro.'
mg1865::mg_1::43::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia narosony mitokana ny ho an''i Josefa, ary mitokana ny ho an''ny rahalahiny, ary mitokana koa ny ho an''ny Egyptiana izay nihinana teo aminy, satria ny Egyptiana tsy mahazo miara-komana amin''ny Hebreo, fa fahavetavetana amin''ny Egyptiana izany.'
mg1865::mg_1::43::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nipetraka teo anatrehany izy, ny lahimatoa araka ny fizokiany, ary ny faralahy araka ny fizandriany; dia samy talanjona ka nifampijerijery izy.'
mg1865::mg_1::43::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 43
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary samy nitondrana anjara-hanina avy teo anoloan''i Josefa izy mirahalahy avy; kanefa ny anjara-hanin''i Benjamina dia indimy toraka ny anjaran-drery tamin''izy rehetra. Dia niara-nisotro sy nivoky divay teo aminy izy.'
mg1865::mg_1::44::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nampahafantaran''i Josefa ny rahalahiny fa izy no Josefa, sy ny nanirahany haka ny rainy'
  verse_text: 'Ary Josefa nanome teny ny mpikarakara ny tao an-tranony ka nanao hoe: Fenoy hanina ny lasakan''ireo lehilahy ireo, araka izay zakany ho entina, ary ataovy eo am-bavan''ny lasakany avy ny volan''ny isan-dahy;'
mg1865::mg_1::44::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny kapoakako, dia ilay kapoaka volafotsy, ataovy eo am-bavan''ny lasakan''ilay faralahy mbamin''ny vola hamidiny vary. Dia nataony araka ny teny izay nolazain''i Josefa.'
mg1865::mg_1::44::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha vao nazava ny andro, dia nampandehanina ireo lehilahy ireo, dia izy sy ny borikiny.'
mg1865::mg_1::44::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 4
  verse_date_revised: '2022-05-18T05:12:46+0000'
  verse_title: null
  verse_text: 'Ary rehefa tafavoaka ny tanàna izy ka tsy mbola lasan-davitra, dia hoy Josefa tamin''ny mpikarakara ny tao an-tranony: Andeha araho ireny lehilahy ireny; ary rehefa tratranao izy, dia ataovy aminy hoe: Nahoana ianareo namaly ratsy ny soa?'
mg1865::mg_1::44::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tsy iny va no fisotroan''ny tompoko sy famantarany zavatra? ratsy izao nataonareo izao.'
mg1865::mg_1::44::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nahatratra azy ralehilahy ka nilaza izany teny izany taminy.'
mg1865::mg_1::44::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy ireo taminy: Nahoana itompokolahy no dia miteny toy izany? Sanatria amin''ny mpanomponao ny hanao zavatra toy izany.'
mg1865::mg_1::44::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Indro fa ny vola izay hitanay teo am-bavan''ny lasakanay aza naverinay indray taty aminao avy tany amin''ny tany Kanana; ka hataonay ahoana no fangalatra volafotsy na volamena ao amin''ny tranon''ny tomponao?'
mg1865::mg_1::44::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izay anankiray amin''ny mpanomponao hahitana izany, dia aoka hovonoina izy, ary izahay kosa dia ho andevon''itompokolahy.'
mg1865::mg_1::44::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Aoka ary hatao araka ny teninareo: izay hahitana izany dia ho andevoko; fa ianareo tsy hanan-tsiny.'
mg1865::mg_1::44::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary samy nampidina faingana ny lasakany tamin''ny tany izy, ka samy nanokatra ny lasakany avy.'
mg1865::mg_1::44::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nikaroka fatratra ralehilahy, ka tamin''ny lahimatoa no nanombohany, ary tamin''ny faralahy no niafarany, ka tao amin''ny lasakan''i Benjamina no nahitana ilay kapoaka.'
mg1865::mg_1::44::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary samy nandriatra ny fitafiany izy, dia nanaingina ny entany tamin''ny borikiny avy ka niverina ho any an-tanàna.'
mg1865::mg_1::44::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Joda sy ny rahalahiny niditra tao an-tranon''i Josefa (fa mbola tao izy), dia nidaboka tamin''ny tany teo anatrehany.'
mg1865::mg_1::44::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Josefa taminy: Ahoana izao zavatra nataonareo izao? tsy fantatrareo va fa izay lehilahy tahaka ahy dia mahay mamantatra zavatra tokoa?'
mg1865::mg_1::44::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Joda: Inona no teny hataonay amin''itompokolahy? inona intsony no holazainay? ary hataonay ahoana no fiala tsiny? Andriamanitra efa nahita ny heloky ny mpanomponao; koa, indreto, samy ho andevon''itompokolahy, na izahay, na ilay nahitana ny kapoaka tao aminy.'
mg1865::mg_1::44::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa hoy Josefa: Sanatria ahy ny hanao izany! izay lehilahy nahitana ny kapoaka tao aminy ihany no ho andevoko; fa ianareo kosa dia miakara soa aman-tsara ho any amin''ny rainareo.'
mg1865::mg_1::44::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanatona azy Joda ka nanao hoe: Mba henoy kely aho, tompokolahy, aoka ny mpanomponao handaha-teny kely eto anatrehan''itompokolahy, ary aoka tsy mba hirehitra amin''ny mpanomponao ny fahatezeranao; fa tahaka an''i Farao ianao.'
mg1865::mg_1::44::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Itompokolahy nanontany ny mpanompony hoe : Manan-dray na rahalahy koa va ianareo?'
mg1865::mg_1::44::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izahay tamin''itompokolahy: Manan-dray lahy antitra izahay sy zandry faralahy, zanaky ny fahanterany; ary maty ny rahalahiny, fa izy irery ihany no zana-dreniny sisa, ary tian''ny rainy izy.'
mg1865::mg_1::44::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ianao nanao tamin''ny mpanomponao hoe: Ento mankaty amiko izy mba ho hitan''ny masoko.'
mg1865::mg_1::44::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izahay tamin''itompokolahy: Ny zazalahy tsy mahazo misaraka amin-drainy; fa raha misaraka amin-drainy izy, dia ho faty rainy.'
mg1865::mg_1::44::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ianao tamin''ny mpanomponao: Raha tsy hiara-midina aminareo ny zandrinareo faralahy, dia tsy hahita ny tavako intsony ianareo.'
mg1865::mg_1::44::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tafakatra tany amin''ny mpanomponao raiko izahay, dia nambaranay azy ny tenin''itompokolahy.'
mg1865::mg_1::44::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny rainay: Mandehana indray, mividia hanina kely ho antsika.'
mg1865::mg_1::44::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izahay: Tsy sahy hidina izahay; nefa raha hiaraka aminay ny zandrinay faralahy, dia hidina ihany izahay; fa tsy mahazo mahita ny tavan-dralehilahy izahay raha tsy miaraka aminay ny zandrinay faralahy.'
mg1865::mg_1::44::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny mpanomponao raiko taminay: Fantatrareo fa ny vadiko efa niteraka roa lahy tamiko;'
mg1865::mg_1::44::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa lasa niala tamiko ny anankiray, ka hoy izaho: Voaviraviram-biby tokoa izy; ary tsy mbola hitako mandraka ankehitriny izy;'
mg1865::mg_1::44::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary raha halainareo hiala eto anoloako koa ity, ka hisy loza hanjo azy koa, dia hampidininareo any amin''ny fiainan-tsy hita amim-pahoriana ny volo fotsiko.'
mg1865::mg_1::44::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny, raha tonga any amin''ny mpanomponao raiko aho, ka tsy tafaraka aminay ny zaza (fa ny ainy mifamatotra amin''ny ain''ny zaza),'
mg1865::mg_1::44::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'koa raha hitany fa tsy eo ny zaza, dia ho faty izy; ary ny mpanomponao hampidina ny volo fotsin''ny mpanomponao rainay ho any amin''ny fiainan-tsy hita amin''alahelo.'
mg1865::mg_1::44::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ny mpanomponao efa niantoka ny zaza tamin''ny raiko ka nanao hoe: Raha tsy ho entiko aty aminao izy, dia ho meloka amin''ny raiko amin''ny andro rehetra hiainako aho.'
mg1865::mg_1::44::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny, trarantitra ianao, aoka ny mpanomponao hitoetra ho andevon''itompokolahy hisolo ny zaza; fa aoka ny zaza hiara-miakatra amin''ny rahalahiny.'
mg1865::mg_1::44::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 44
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hataoko ahoana no fiakatra any amin''ny raiko, raha tsy hiaraka amiko ny zaza? fandrao hahita izay loza hanjo ny raiko aho.'
mg1865::mg_1::45::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa tsy nahatsindry ny fangorakoraky ny fony intsony teo anatrehan''izay rehetra teo aminy; dia niantso izy ka nanao hoe: Avoahy ny olona rehetra hiala eto amiko. Ary dia tsy nisy olona na dia iray aza nijanona teo amin''i Josefa, raha nanao izay hahafantaran''ny rahalahiny azy izy.'
mg1865::mg_1::45::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitomany mafy izy, ka ren''ny Egyptiana, ary ren''ny tao an-tranon''i Farao koa.'
mg1865::mg_1::45::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Josefa tamin''ny rahalahiny: Izaho no Josefa; mbola velona ihany va ikaky? Ary tsy nahavaly azy ny rahalahiny; fa toran-kovitra teo anatrehany ireo.'
mg1865::mg_1::45::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Josefa tamin''ny rahalahiny: Avia, manatona ahy ianareo. Dia nanatona ireo. Ary hoy Josefa: Izaho no Josefa rahalahinareo, ilay namidinareo ho aty Egypta.'
mg1865::mg_1::45::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ankehitriny, aza malahelo na tezitra amin''ny tenanareo noho ny nivarotanareo ahy ho aty; fa hamonjy aina no nampandehanan''Andriamanitra ahy hialoha anareo aty.'
mg1865::mg_1::45::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa roa taona izao no efa nisian''ny mosary teto amin''ny tany; ary mbola misy dimy taona koa, izay tsy hisy hiasan-tany na hijinjana.'
mg1865::mg_1::45::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra efa nampandeha ahy hialoha anareo, mba tsy hahalany taranaka anareo amin''ny tany, fa hamelona anareo amin''ny famonjena lehibe.'
mg1865::mg_1::45::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary amin''izany, tsy ianareo no nampandeha ahy ho aty, fa Andriamanitra; ary Izy nanao ahy ho rain''i Farao, sy ho tompon''ny ao an-tranony rehetra, ary ho mpanapaka ny tany Egypta rehetra.'
mg1865::mg_1::45::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Andeha miakatra faingana ianareo ho any amin''ikaky, ka lazao aminy hoe: Izao no tenin''i Josefa zanakao: Efa nataon''Andriamanitra ho tompon''i Egypta rehetra aho; ka midìna hankaty amiko, fa aza mijanona;'
mg1865::mg_1::45::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia honina eo amin''ny tany Gosena ianao, ka ho eo akaikiko ianao sy ny zanakao sy ny zafinao ary ny ondry aman''osinao sy ny ombinao mbamin''izay rehetra anananao.'
mg1865::mg_1::45::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hamelona anao eo aho (fa mbola haharitra dimy taona ny mosary), fandrao ho lany harena ianao sy ny ankohonanao ary izay rehetra anananao.'
mg1865::mg_1::45::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary, indro, hitan''ny masonareo sy ny mason''i Benjamina rahalahiko izao fa ny vavako no miteny aminareo.'
mg1865::mg_1::45::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hambaranareo amin''ikaky ny voninahitro rehetra aty Egypta sy izay rehetra efa hitanareo; koa mandehana faingana ianareo, ka ento midina aty ikaky.'
mg1865::mg_1::45::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namihina ny vozon''i Benjamina rahalahiny izy ka nitomany; ary Benjamina koa dia mba nitomany teo amin''ny vozony.'
mg1865::mg_1::45::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dia nanoroka ny rahalahiny rehetra izy ka nitomany teo am-pamihinany azy; ary rehefa afaka izany, dia niresaka taminy ireo rahalahiny.'
mg1865::mg_1::45::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary re tao an-tranon''i Farao ny teny hoe: Tonga ny rahalahin''i Josefa; dia sitrak''i Farao sy ny mpanompony izany.'
mg1865::mg_1::45::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Farao tamin''i Josefa: Lazao amin''ny rahalahinao: Izao no ataovy: ataingeno ny entana ho entin''ny bibinareo, ka mankanesa any amin''ny tany Kanana;'
mg1865::mg_1::45::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary alao ny rainareo sy ny ankohonanareo, ka mankanesa aty amiko; ary dia homeko anareo ny tsara eto amin''ny tany Egypta, ka hihinana ny matavy eto amin''ny tany ianareo.'
mg1865::mg_1::45::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ankehitriny efa nomena teny ianao, ka izao no ataovy: makà sariety amin''ny tany Egypta hitondranareo ny vady aman-janakareo, ary ento ny rainareo, ka mankanesa aty.'
mg1865::mg_1::45::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Aza malahelo ny amin''ny fanakareo; fa anareo izay tsara eto amin''ny tany Egypta rehetra.'
mg1865::mg_1::45::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nataon''ny zanak''Isiraely izany, ka dia nomen''i Josefa sariety izy, araka ny tenin''i Farao; ary nomeny vatsy koa ho entiny eny an-dàlana izy.'
mg1865::mg_1::45::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izy rehetra samy nomeny akanjo indray miova avy; fa Benjamina kosa nomeny sekely volafotsy telon-jato sy akanjo indimy miova.'
mg1865::mg_1::45::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao kosa no nampitondrainy ho an-drainy: borikilahy folo nitondra zava-tsoa avy tany Egypta, sy borikivavy folo nitondra vary sy mofo, ary vatsy ho an''ny rainy ho entiny eny an-dàlana.'
mg1865::mg_1::45::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampandehaniny ny rahalahiny, ka lasa nandeha izy ireo; ary hoy Josefa taminy: Aza mifanditra eny an-dàlana ianareo.'
mg1865::mg_1::45::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niakatra avy tany Egypta izy ireo ka tonga tany amin''i Jakoba rainy tany amin''ny tany Kanana.'
mg1865::mg_1::45::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nilaza taminy izy ka nanao hoe: Mbola velona ihany Josefa, ary izy no mpanapaka ny tany Egypta rehetra, kanefa nangatsiaka ihany ny fon''i Jakoba, fa tsy nino azy izy.'
mg1865::mg_1::45::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nolazain''izy ireo ny teny rehetra izay efa nolazain''i Josefa taminy: ary rehefa hitany ny sariety izay efa nampitondrain''i Josefa hitondrana azy, dia izay vao velona indray ny fanahin''i Jakoba rainy'
mg1865::mg_1::45::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 45
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Isiraely: Aoka ary, fa mbola velona ihany Josefa zanako; handeha aho ka hahita azy, dieny tsy mbola maty aho.'
mg1865::mg_1::46::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nifindran''Isiraely sy ny ankohonany ho any amin''ny tany Egypta'
  verse_text: 'Ary niainga Isiraely nitondra izay rehetra nananany ka nankany Beri-sheba, dia namono zavatra hatao fanatitra ho an''Andriamanitr''Isaka rainy izy.'
mg1865::mg_1::46::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 2
  verse_date_revised: '2022-08-18T06:28:55+0000'
  verse_title: null
  verse_text: 'Ary Andriamanitra niteny tamin''Isiraely tao amin''ny fahitana nony alina ka nanao hoe : Ry Jakoba, ry Jakoba o! Ary hoy kosa izy: Inty aho.'
mg1865::mg_1::46::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Izy: Izaho no Andriamanitra, dia Andriamanitry ny rainao; aza matahotra hidina any Egypta ianao, fa hataoko firenena lehibe any ianao.'
mg1865::mg_1::46::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izaho hiara-midina aminao ho any Egypta; ary Izaho hitondra anao hiakatra indray tokoa ary ny tanan''i Josefa no hanirina ny masonao.'
mg1865::mg_1::46::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niainga Jakoba ka niala tao Beri-sheba; ary ny zanak''Isiraely nitondra an''i Jakoba rainy sy ny zanany madinika ary ny vadiny teo anatin''ny sariety, izay efa nampitondrain''i Farao hitondrana azy.'
mg1865::mg_1::46::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nentin''izy ireo ny omby aman''ondriny sy ny fananany, izay efa nohariny tany amin''ny tany Kanana, dia tonga tany Egypta Jakoba sy ny zanany rehetra nomba azy:'
mg1865::mg_1::46::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'ny zananilahy sy ny zafini-lahy nomba azy, ary ny zananivavy sy ny zafini-vavy; eny, nentiny nomba azy ho any Egypta avokoa ny zanany rehetra.'
mg1865::mg_1::46::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no anaran''ny zanak''Isiraely izay tonga tany Egypta, dia Jakoba sy ny zananilahy :'
mg1865::mg_1::46::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Robena, lahimatoan''i Jakoba. Ary ny zanakalahin-dRobena dia Hanoka sy Palo sy Hezrona ary Karmy'
mg1865::mg_1::46::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Simeona dia Jemoela sy Jamina sy Ohada sy Jakina sy Zohara ary Saoly, zanakalahin''ny vehivavy Kananita.'
mg1865::mg_1::46::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Levy dia Gersona sy Kehata aty Merary.'
mg1865::mg_1::46::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Joda dia Era sy Onana sy Sela sy Fareza ary Zera; ary Era sy Onana anefa dia maty tany amin''ny tany Kanana ihany. Ary ny zanakalahin''i Fareza dia Hezrona sy Hamola.'
mg1865::mg_1::46::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''Isakara dia Tola sy Pova sy Joba ary Simrona.'
mg1865::mg_1::46::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Zebolona dia Sereda sy Elona ary Jahalela.'
mg1865::mg_1::46::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo no zanakalahin''i Lea izay naterany tamin''i Jakoba tany Mesopotamia, ary Dina zananivavy; ny isan''ny zananilahy rehetra mbamin''ny zananivavy dia telo amby telo-polo.'
mg1865::mg_1::46::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 16
  verse_date_revised: '2022-08-18T06:27:44+0000'
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Gada dia Zifiona sy Hagy sy Sony sy Ezbona sy Ery sy Aroda ary Arely.'
mg1865::mg_1::46::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanak''i Asera dia Jimna sy Jisva sy Jisvy sy Beria ary Sera, anabavin''ireo; ary ny zanakalahin''i Beria dia Hebera sy Malkiela.'
mg1865::mg_1::46::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo no zanak''i Zilpa, izay nomen''i Labana an''i Lea zananivavy, ary ireo no naterany tamin''i Jakoba, dia enina ambin''ny folo izy.'
mg1865::mg_1::46::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny zanakalahin-dRahely, vadin''i Jakoba dia Josefa sy Benjamina.'
mg1865::mg_1::46::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Asenata, zanakavavin''i Poti-fera, mpisorona tao Ona, izay naterak''i Josefa tany amin''ny tany Egypta, dia Manase sy Efraima.'
mg1865::mg_1::46::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Benjamina dia Bela sy Bakera sy Asbela sy Gera sy Namana sy Ehy sy Rosy sy Mopima sy Hopima ary Arda.'
mg1865::mg_1::46::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo no zanakalahin-dRahely, izay naterany tamin''i Jakoba; efatra ambin''ny folo ny isan''izy rehetra.'
mg1865::mg_1::46::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Dana dia Hosima.'
mg1865::mg_1::46::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Naftaly dia Jaziela sy Gony sy Jezera ary Silema.'
mg1865::mg_1::46::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo no zanakalahin''i Bila, izay nomen''i Labana an-dRahely zananivavy, ary ireo no naterak''i Jakoba; fito no isan''izy rehetra.'
mg1865::mg_1::46::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny isan''izay rehetra nankany Egypta niaraka tamin''i Jakoba, dia izay naloaky ny kibony, afa-tsy ny vadin''ny zanakalahin''i Jakoba dia enina amby enim-polo.'
mg1865::mg_1::46::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Josefa, izay naterany tany Egypta, dia roa lahy; ny isan''ny terak''i Jakoba rehetra, izay tonga tany Egypta, dia fito-polo.'
mg1865::mg_1::46::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Joda nirahiny nialoha azy hankany amin''i Josefa mba hanoro lalana azy ho any Gosena; dia tonga tany amin''ny tany Gosena izy.'
mg1865::mg_1::46::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa nampanamboatra ny kalesiny, dia niakatra hitsena an''Isiraely rainy tany Gosena izy; ary raha niseho taminy izy, dia namihina ny vozony ka nitomany ela teo amin''ny vozony.'
mg1865::mg_1::46::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Isiraely tamin''i Josefa: Aoka ho faty amin''izao aho, satria efa hitako ny tavanao, fa mbola velona ihany ianao.'
mg1865::mg_1::46::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Josefa tamin''ny rahalahiny sy ny ankohonan''ny rainy: Hiakatra aho hilaza amin''i Farao ka hanao aminy hoe: Ny rahalahiko sy ny ankohonan''ny raiko, izay tany amin''ny tany Kanana, dia efa tonga aty amiko.'
mg1865::mg_1::46::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary mpiandry ondry ireo lehilahy ireo, fa mpiompy omby aman''ondry izy; ary ny ondry aman''osiny sy ny ombiny mbamin''izay rehetra ananany dia nentiny avokoa.'
mg1865::mg_1::46::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha hiantso anareo Farao ka hanao hoe : Inona no raharaha fanaonareo?'
mg1865::mg_1::46::34:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 46
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia izao no havalinareo: Miompy omby aman''ondry no raharaha fanaon''ny mpanomponao, hatry ny fony vao zaza ka ambaraka ankehitriny, dia izahay sy ny razanay koa mba hahazoanareo monina ao amin''ny tany Gosena, satria fahavetavetana amin''ny Egyptiana ny mpiandry ondry rehetra.'
mg1865::mg_1::47::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nahazoan''Isiraely sy ny ankohonany fonenana tsara tao Gosena, ary ny nanjo ny Egyptiana noho ny hamafin''ny mosary'
  verse_text: 'Ary Josefa nankao amin''i Farao ka nilaza taminy hoe: Ny raiko sy ny rahalahiko ary ny ondry aman''osiny sy ny ombiny mbamin''izay rehetra ananany dia efa tonga avy tany amin''ny tany Kanana; ka, indreo, ao amin''ny tany Gosena izy.'
mg1865::mg_1::47::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny dimy lahy tamin''ny rahalahiny no nalainy ka nentiny teo anatrehan''i Farao.'
mg1865::mg_1::47::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Farao tamin''ireo rahalahin''i Josefa: Inona moa no raharaha fanaonareo? Dia hoy izy tamin''i Farao: Mpiandry ondry izahay mpanomponao hatramin''ny razanay.'
mg1865::mg_1::47::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa izy tamin''i Farao: Mba hivahiny eto amin''ity tany ity no nihavianay; fa tsy misy ahitra ho an''ny ondry aman''osin''ny mpanomponao, fa mafy ny mosary any amin''ny tany Kanana; koa ankehitriny, trarantitra ianao, aoka mba honina ao amin''ny tany Gosena ny mpanomponao.'
mg1865::mg_1::47::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Farao dia niteny tamin''i Josefa ka nanao hoe: Ny rainao sy ny rahalahinao efa tonga aty aminao;'
mg1865::mg_1::47::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'ny tany Egypta dia eo anoloanao; koa amin''izay tany tsara indrindra no amponeno ny rainao sy ny rahalahinao; aoka honina ao amin''ny tany Gosena izy ary raha fantatrao fa misy lehilahy mahay eo aminy, tendreo izy ho lehiben''ny mpiandry ny omby aman''ondriko.'
mg1865::mg_1::47::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nentin''i Josefa ho eo anatrehan''i Farao Jakoba rainy; ary Jakoba dia nisaotra an''i Farao.'
mg1865::mg_1::47::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Farao tamin''i Jakoba: Firy taona moa no andro niainanao?'
mg1865::mg_1::47::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Jakoba tamin''i Farao: Telo-polo amby zato taona no andro nivahiniako; sady vitsy no ratsy ny andro niainako ka tsy nahatratra ny andro niainan''ny razako tamin''ny andro nivahiniany.'
mg1865::mg_1::47::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jakoba, rehefa nisaotra an''i Farao, dia lasa niala teo anatrehany.'
mg1865::mg_1::47::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namponenin''i Josefa ny rainy sy ny rahalahiny ka nomeny zara-tany tao amin''ny tany Egypta, dia tao amin''ny tany tsara indrindra, tao amin''ny tany Ramesesa, araka izay efa nandidian''i Farao.'
mg1865::mg_1::47::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia novelomin''i Josefa tamin''ny hanina ny rainy sy ny rahalahiny mbamin''ny ankohonan''ny rainy rehetra, araka ny isan''ny zanany avy.'
mg1865::mg_1::47::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tsy nisy hanina teo amin''ny tany rehetra; fa mafy indrindra ny mosary, ka efa reraka ny tany Egypta sy ny tany Kanana noho ny mosary.'
mg1865::mg_1::47::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nangonin''i Josefa ny vola rehetra izay hita tany amin''ny tany Egypta sy tany amin''ny tany Kanana, dia izay vidin''ny vary novidin''ny olona, ka nampidirin''i Josefa tao an-tranon''i Farao ny vola.'
mg1865::mg_1::47::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa lany avokoa ny vola tany amin''ny tany Egypta sy tany amin''ny tany Kanana, dia nankeo amin''i Josefa ny Egyptiana rehetra ka nanao hoe: Omeo hanina izahay; fa nahoana no dia ho faty eto anatrehanao izahay? fa efa lany avokoa ny vola.'
mg1865::mg_1::47::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy kosa Josefa : Omeo ny omby aman''ondrinareo hotakalozako, raha lany ny vola.'
mg1865::mg_1::47::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nentiny tany amin''i Josefa ny omby aman''ondriny, ka notakalozan''i Josefa hanina ny soavaliny sy ny ondry aman''osiny ary ny ombiny sy ny borikiny; dia nomeny hanina izy tamin''izany taona izany ho takalon''ny bibiny rehetra.'
mg1865::mg_1::47::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tapitra izany taona izany, dia nankeo aminy indray ny olona tamin''ny taona faharoa ka nanao taminy hoe: Tsy azonay afenina amin''itompokolahy fa efa lany ny vola, ary efa lasan''itompokolahy avokoa ny biby fiompy; tsy misy na inona na inona intsony eto imason''itompokolahy afa-tsy ny tenanay sy ny taninay;'
mg1865::mg_1::47::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'nahoana no dia ho faty izahay eto anatrehanao, dia izahay sy ny taninay? Takalozy hanina ny tenanay sy ny taninay, dia ho mpanompon''i Farao izahay sy ny taninay: ary omeo voa hafafy izahay, mba ho velona, fa tsy ho faty, ary mba tsy ho lao ny tany.'
mg1865::mg_1::47::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia notakalozan''i Josefa ho an''i Farao ny tany Egypta rehetra; fa ny Egyptiana samy nanakalo ny sahany avy, satria resy mosary izy; ary dia lasan''i Farao ny tany.'
mg1865::mg_1::47::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny olona dia nafindrany ho ao amin''ny tanàna hatramin''ny faran''ny faritr''i Egypta rehetra.'
mg1865::mg_1::47::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny tanin''ny mpisorona ihany no tsy mba natakalony; fa nanana anjara tamin''i Farao ny mpisorona ka nihinana ny anjara izay nomen''i Farao azy; izany no tsy nanakalozany ny taniny.'
mg1865::mg_1::47::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Josefa tamin''ny olona: Indro, efa voavidiko androany ianareo sy ny taninareo ho an''i Farao; koa indreny ny voa hafafinareo, dia hofafazanareo ny tany.'
mg1865::mg_1::47::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa misy vokatra, dia haterinareo ho an''i Farao ny ampahadiminy; ary ho anareo kosa ny efa-toko, ho voa hafafy any an-tsaha sy hohaninareo mbamin''izay ao an-tranonareo ary hohanin''ny zanakareo.'
mg1865::mg_1::47::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Efa namonjy ny ainay ianao; aoka mba hahita fitia eto imason''itompokolahy izahay, dia ho mpanompon''i Farao.'
mg1865::mg_1::47::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nataon''i Josefa ho lalana tany amin''ny tany Egypta mandraka androany izany; fa ho an''i Farao ny ampahadiminy; fa ny tanin''ny mpisorona ihany no tsy mba lasan''i Farao.'
mg1865::mg_1::47::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nonina tao amin''ny tany Egypta ny Isiraely, dia tao amin''ny tany Gosena; ary nahazo zara-tany tao izy, dia nihamaro anaka ka nihabetsaka indrindra.'
mg1865::mg_1::47::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andro niainan''i Jakoba tao amin''ny tany Egypta dia fito ambin''ny folo taona; koa ny andro rehetra niainan''i Jakoba dia fito amby efa-polo amby zato taona.'
mg1865::mg_1::47::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa antomotra ny andro hahafatesan''Isiraely, dia nampaka an''i Josefa zanany izy ka nanao taminy hoe: Raha mba nahita fitia eo imasonao aho, masïna ianao, ataovy ato ambanin''ny feko ny tananao, ka ataovy amiko izay soa sy izay marina; masïna ianao aza alevina aty Egypta aho.'
mg1865::mg_1::47::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa rehefa lasa mody mandry any amin''ny razako aho, dia ho entinao hiala aty Egypta ka halevinao ao amin''ny fasany. Dia hoy Josefa: Hanao araka ny teninao aho.'
mg1865::mg_1::47::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 47
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba: Mianiana ary amiko. Dia nianiana taminy izy. Dia niankohoka teo an-dohan''ny farafara Isiraely.'
mg1865::mg_1::48::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny tso-drano nataon''i Jakoba tamin''i Manase sy Efraima, zanakalahin''i Josefa'
  verse_text: 'Ary rehefa afaka izany, dia nisy nilaza tamin''i Josefa, hoe: Indro marary ny rainao. Dia nentiny niaraka taminy Manase sy Efraima, zanany mirahalahy.'
mg1865::mg_1::48::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy nilaza tamin''i Jakoba ka nanao hoe: Indro, Josefa zanakao tamy ho ety aminao; dia nanatanja-tena Isiraely ka niarina teo ambonin''ny farafara.'
mg1865::mg_1::48::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jakoba tamin''i Josefa: Andriamanitra Tsitoha efa niseho tamiko tany Lozy any amin''ny tany Kanana ary nitahy ahy ka nanao tamiko hoe:'
mg1865::mg_1::48::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Indro, Izaho hahamaro ny taranakao, dia hampitombo anao sy hanao anao ho firenena maro; dia homeko ny taranakao mandimby anao ity tany ity ho lovany mandrakizay.'
mg1865::mg_1::48::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ankehitriny, ny zanakao mirahalahy, izay efa naterakao taty amin''ny tany Egypta, fony tsy mbola tonga taty aminao eto Egypta aho, dia ho ahy ireo: eny, Efraima sy Manase dia ho ahy, tahaka an''i Robena sy Simeona.'
mg1865::mg_1::48::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ny zanakao izay haterakao aorian''izy mirahalahy dia ho anao kosa, ary ny anarany hatao araka ny an''ny rahalahiny eo amin''ny zara-taniny.'
mg1865::mg_1::48::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izaho, raha niala tany Mesopotamia aho, dia maty teo anatrehako Rahely tany amin''ny tany Kanana, tany an-dàlana, rehefa kely foana no sisa tsy nahatongavana tao Efrata, ary nandevina azy aho teo amoron''ny lalana mankany Efrata (Betlehema izany).'
mg1865::mg_1::48::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''Isiraely ny zanak''i Josefa, dia hoy izy: Iza moa ireo?'
mg1865::mg_1::48::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Josefa tamin-drainy: Zanako ireto, izay nomen''Andriamanitra ahy taty. Ary hoy izy : Masïna ianao, ento eto amiko izy, dia hotsofiko rano.'
mg1865::mg_1::48::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary efa pahina ny mason''Isiraely noho ny fahanterany, ka tsy nahita izy; dia nentin''i Josefa nanatona azy izy mirahalahy; ary Isiraely nanoroka sy namihina azy.'
mg1865::mg_1::48::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Isiraely tamin''i Josefa; Tsy nanampo izay hahita ny tavanao intsony aho; kanjo, indro, Andriamanitra efa nampahita ahy ny zanakao koa aza.'
mg1865::mg_1::48::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa nampiala azy mirahalahy teo anelanelan''ny lohalik''Isiraely, dia niankohoka tamin''ny tany izy.'
mg1865::mg_1::48::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia notantanan''i Josefa izy mirahalahy: Efraima tamin''ny ankavanany ho eo amin''ny ankavian''Isiraely, ary Manase tamin''ny ankaviany ho eo amin''ny ankavanan''Isiraely, ka nentiny nanatona azy.'
mg1865::mg_1::48::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nahinjitr''Isiraely ny tanany ankavanana ka napetrany tamin''ny lohan''i Efraima, nefa izy no zandriny, fa ny tanany ankavia kosa teo amin''ny lohan''i Manase; fa niniany natao toy izany ny tanany, nefa Manase no lahimatoa.'
mg1865::mg_1::48::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitso-drano an''i Josefa izy ka nanao hoe: Andriamanitra, Izay nandehanan''i Abrahama sy Isaka razako teo anatrehany, Andriamanitra, Izay Mpiandry ahy hatrizay niainako ka mandraka androany,'
mg1865::mg_1::48::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'ny Anjely Izay Mpamonjy ahy tamin''ny loza rehetra: Izy anie hitahy ireto zaza ireto; ary aoka ny anarako sy ny anaran''i Abrahama sy Isaka raiko no hanononana azy, ary hitombo ho maro dia maro eo amin''ny tany anie izy.'
mg1865::mg_1::48::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''i Josefa fa ny rainy nametraka ny tanany ankavanana teo amin''ny lohan''i Efraima, dia tsy sitrany izany; ka noraisiny ny tanan''ny rainy, mba hampiala azy amin''ny lohan''i Efraima ho amin''ny lohan''i Manase,'
mg1865::mg_1::48::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka hoy Josefa tamin''ny rainy: Tsy izao no izy, ry ikaky; fa ity no lahimatoa, ka apetraho eo amin''ny lohany ny tananao ankavanana.'
mg1865::mg_1::48::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa tsy nety ny rainy, fa nanao hoe: Fantatro ihany, anaka, fantatro ihany, izy koa ho tonga firenena, ary izy koa ho lehibe; kanefa ny zandriny ho lehibe noho izy, ary ny taranany ho firenena maro.'
mg1865::mg_1::48::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitso-drano azy tamin''izany andro izany izy ka nanao hoe: Ianao no hitsofan''ny Isiraely rano hoe: Hataon''Andriamanitra tahaka an''i Efraima sy tahaka an''i Manase anie ianao. Ary Efraima no nataony alohan''i Manase.'
mg1865::mg_1::48::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Isiraely tamin''i Josefa: Indro, ho faty aho, nefa Andriamanitra homba anareo ka hampody anareo indray ho any amin''ny tanindrazanareo.'
mg1865::mg_1::48::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 48
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izaho manome anao zara-tany iray ho tombon-dahinao amin''ny rahalahinao, izay nalaiko tamin''ny sabatro sy ny tsipikako teo an-tanan''ny Amorita.'
mg1865::mg_1::49::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny tso-dranon''Isiraely nanambarany izay ho toetry ny zanany mirahalahy avy'
  verse_text: 'Ary Jakoba namory ny zananilahy ka nanao hoe: Mivoria ianareo, mba hanambarako aminareo izay ho tonga aminareo any am-parany.'
mg1865::mg_1::49::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Miangona, ka mandrenesa, ry zanakalahin''i Jakoba, eny, mihainoa an''Isiraely rainareo:'
mg1865::mg_1::49::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ry ROBENA, lahimatoako ianao, heriko sy voalohan''ny tanjako, manan-tombom-pisandratana, manan-tombon-kery.'
mg1865::mg_1::49::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mandroadroatra toy ny rano ianao ka tsy hanan-tombo, fa niakatra tamin''ny fandrian''ny rainao ianao, tamin''izany no nandotoanao azy. Endrey, ny farafarako lahy, ka dia niakarany!'
mg1865::mg_1::49::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'SIMEONA sy LEVY dia mpirahalahy, fiadia-mandoza ny sabany;'
mg1865::mg_1::49::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Aza mankeo amin''izay iokoany, ry foko, ary aza miray amin''ny fiangonany. ry fanahiko; fa tamin''ny fahatezerany no namonoany olona, ary tamin''ny fahasahisahiany no nanatraingoany omby.'
mg1865::mg_1::49::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ho voaozona anie ny fahatezerany, fa nasiaka izany, ary ny fahavinirany, fa loza izany; hampihahakahaka azy eny amin''i Jakoba aho, ary hanely azy eny amin''Isiraely.'
mg1865::mg_1::49::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ry JODA, hoderain''ny rahalahinao ianao, ny tananao ho ao amin''ny vozon''ny fahavalonao; hiankohoka eo anatrehanao ny zanaky ny rainao.'
mg1865::mg_1::49::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Zana-diona, Joda, avy niremby ianao, anaka; mamitsaka, mandry toy ny liona izy, ary toy ny liom-bavy, ka iza no hanaitra azy!'
mg1865::mg_1::49::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny tehim-panjakana tsy hiala amin''i Joda, na ny tehina fanapahana eo anelanelan''ny tongony, mandra-pahatongan''i Silo, ka hanoa Azy ny firenena.'
mg1865::mg_1::49::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 11
  verse_date_revised: '2022-05-20T06:15:28+0000'
  verse_title: null
  verse_text: 'Mamatotra ny borikiny tanora eo amin''ny tahom-boaloboka izy. Ary ny zanaky ny borikivaviny eo amin''ny tahom-boaloboka tsara; nanasa ny fitafiany tamin''ny divay izy, ary ny akanjony tamin''ny ranom-boaloboka.'
mg1865::mg_1::49::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mangamanga ny masony azon''ny divay ary fotsy ny nifiny azon''ny ronono.'
mg1865::mg_1::49::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'ZEBOLONA, ao amoron-dranomasina no honenany, dia ao amoron-dranomasina fitodian-tsambo; ary ny sisin-taniny hifanolotra amin''i Sidona.'
mg1865::mg_1::49::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'ISAKARA dia boriky henjana, mandry eo anelanelan''ny vala;'
mg1865::mg_1::49::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitany fa tsara ny fialan-tsasatra, sady mahafinaritra ny tany; dia nanongilana ny sorony hitondra entana izy ka tonga mpanompo mandoa hetra.'
mg1865::mg_1::49::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'DANA hitsara ny olony tahaka ny anankiray amin''ny firenen''ny Isiraely.'
mg1865::mg_1::49::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dana ho menarana ao amoron-dalana, ho bibilava misy tandroka ao an-dàlana izy, izay manaikitra ny kitrokelin''ny soavaly, ka potraka miantsilany ny mpitaingina azy.'
mg1865::mg_1::49::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny famonjenao no andrasako, Jehovah ô!'
mg1865::mg_1::49::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'GADA, ny manao andiany hamoritra azy; fa izy kosa hamely ny otrika.'
mg1865::mg_1::49::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'ASERA dia avy ao aminy ny matavy fihinany, ary izy no ihavian''ny hanim-pin''andriana.'
mg1865::mg_1::49::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'NAFTALY dia dieravavy alefa; manao teny mahafinaritra izy.'
mg1865::mg_1::49::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'JOSEFA dia sampana mahavokatra, eny, sampana mahavokatra eo anilan-doharano; ny rantsany mananika mihoatra ny fefy.'
mg1865::mg_1::49::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nampahory azy ny mpitifitra, dia nitifitra azy sy nanenjika azy;'
mg1865::mg_1::49::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Kanefa mateza hery ny tsipïkany, ary mailamailaka ny sandrin-tanany, avy amin''ny tanan''Ilay Maherin''i Jakoba, dia avy ao amin''ny Mpiandry, Izay Vatolampin''ny Isiraely,'
mg1865::mg_1::49::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Avy amin''ny Andriamanitry ny rainao, ka Izy hamonjy anao avy amin''ny Tsitoha, ka Izy hitahy anao: Dia fitahiana avy amin''ny lanitra any ambony, sy fitahiana avy amin''ny lalina, izay mamitsaka any ambany, ary fitahiana avy amin''ny nono sy ny kibo.'
mg1865::mg_1::49::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny tso-dranon''ny rainao dia mihoatra noho ny havoana mandrakizay sy ny zavatra mahafinaritra amin''ny tendrombohitra fahagola; ho eo an-dohan''i Josefa izany, dia ho eo an-tampon-dohan''ilay nalaza tamin''ny rahalahiny.'
mg1865::mg_1::49::27:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'BENJAMINA dia amboadia mamiravira: Nony maraina homan-dremby izy, nony hariva mizara babo.'
mg1865::mg_1::49::28:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ireo rehetra ireo no firenen''ny Isiraely roa ambin''ny folo; ary izany no nolazain''ny rainy taminy sy nitsofany rano azy; samy araka ny tso-drano izay tokony ho azy avy no nitsofany rano azy.'
mg1865::mg_1::49::29:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanafatra azy izy ka nanao taminy hoe: Izaho efa madiva hangonina ho any amin''ny razako; aleveno ao amin''ny razako aho, dia ao anatin''ny zohy izay any amin''ny sahan''i Efrona Hetita,'
mg1865::mg_1::49::30:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'ao anatin''ny zohy izay any amin''ny saha Makpela, izay tandrifin''i Mamre, any amin''ny tany Kanana, dia ilay novidin''i Abrahama mbamin''ny saha tamin''i Efrona Hetita ho tany fandevenana.'
mg1865::mg_1::49::31:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tao no nandevenany an''i Abrahama sy Saraha vadiny; ary tao koa no nandevenany an''Isaka sy Rebeka vadiny; ary tao koa no nandevenako an''i Lea,'
mg1865::mg_1::49::32:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'ny saha sy ny zohy ao anatiny izay novidiny tamin''ny taranak''i Heta.'
mg1865::mg_1::49::33:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 49
  verse_number: 33
  verse_date_revised: null
  verse_title: 'Ny nahafatesan''i Jakoba sy ny nandevenana azy, ary ny nahafatesan''i Josefa'
  verse_text: 'Ary rehefa vitan''i Jakoba ny hafatra nataony tamin''ny zananilahy rehetra, dia navonkiny teo am-parafara ny tongony, dia niala aina izy ka voangona any amin''ny razany.'
mg1865::mg_1::50::1:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa nihohoka tamin''ny tavan''ny rainy ka nitomany teo amboniny sady nanoroka azy.'
mg1865::mg_1::50::2:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nasain''i Josefa nanosotra zava-manitra an-drainy ny mpanompony izay mpanao fanafody; dia nanosotra an''Isiraely ny mpanao fanafody.'
mg1865::mg_1::50::3:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary notanterahiny taminy ny efa-polo andro, fa izany no isan''ny andro nanosoram-paty; ary ny Egyptiana nisaona azy fito-polo andro.'
mg1865::mg_1::50::4:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tapitra ny andro nisaonana azy, Josefa dia niteny tamin''ny tao an-tranon''i Farao ka nanao hoe: Raha mba nahita fitia eo imasonareo aho, masïna ianareo, lazao amin''i Farao, ka ataovy hoe:'
mg1865::mg_1::50::5:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny raiko efa nampianiana ahy ka nanao hoe: Indro, ho faty aho; koa ao amin''ny fasako, izay nohadiko ho ahy any amin''ny tany Kanana, dia ao no andeveno ahy. Koa ankehitriny, trarantitra ianao, aoka aho hiakatra handevina ny raiko, dia hiverina aty indray.'
mg1865::mg_1::50::6:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Farao: Miakara ary, ka aleveno ny rainao araka izay nampianianany anao.'
mg1865::mg_1::50::7:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia lasa niakatra Josefa handevina ny rainy; ary niara-niakatra taminy ny mpanompon''i Farao rehetra, dia ny loholona tao an-tranony sy ny loholona rehetra tany amin''ny tany Egypta,'
mg1865::mg_1::50::8:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny ankohonan''i Josefa rehetra sy ny rahalahiny ary ny ankohonan-drainy; ny ankizy madinika sy ny ondriny aman''osiny sy ny ombiny ihany no navelany tao amin''ny tany Gosena.'
mg1865::mg_1::50::9:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy kalesy sy mpitaingin-tsoavaly niara-niakatra taminy koa, ka lehibe dia lehibe ny tobiny.'
mg1865::mg_1::50::10:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tonga teo Goren''atada izy, izay ao an-dafin''i Jordana, dia nanao fisaonana lehibe sy mafy indrindra teo izy; dia nisaona an-drainy hafitoana Josefa.'
mg1865::mg_1::50::11:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''ny Kananita tompon-tany ny fisaonana teo Goren-atada, dia hoy izy: Fisaonana mafy amin''ny Egyptiana izao; izany no nanaovany ny anarany hoe Abel-Egyptiana, izay ao an-dafin''i Jordana.'
mg1865::mg_1::50::12:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny zanakalahin''i Jakoba nanao taminy araka izay nandidiany azy,'
mg1865::mg_1::50::13:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia nitondra azy tany amin''ny tany Kanana, ary nandevina azy tao amin''ny zohy amin''ny saha Makpela, tandrifin''i Mamre, dia ilay novidin''i Abrahama mbamin''ny saha tamin''i Efrona Hetita ho tany fandevenana.'
mg1865::mg_1::50::14:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa voalevin''i Josefa ny rainy, dia niverina tany Egypta izy sy ny rahalahiny mbamin''izay rehetra niara-niakatra taminy handevina ny rainy.'
mg1865::mg_1::50::15:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''ny rahalahin''i Josefa fa maty ny rainy, dia hoy izy: Andrao hanao fo-lentika amintsika Josefa ka hamaly antsika tokoa noho izay ratsy rehetra nataontsika taminy.'
mg1865::mg_1::50::16:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naniraka nankany amin''i Josefa izy ka nanao hoe: Ny rainao nanafatra, fony izy tsy mbola maty,'
mg1865::mg_1::50::17:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka nanao hoe: Izao no holazainareo amin''i Josefa: Mamela re ny fahadisoan''ny rahalahinao sy ny fahotany, fa efa nanao ratsy taminao izy; eny, mamela ankehitriny ny fahadisoan''ny mpanompon''ny Andriamanitry ny rainao. Dia nitomany Josefa, raha niteny taminy izy ireo.'
mg1865::mg_1::50::18:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa nanatona azy ny rahalahiny, dia niankohoka teo anatrehany ka nanao hoe: Indreto izahay ho mpanomponao.'
mg1865::mg_1::50::19:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Josefa taminy: Aza matahotra; fa moa solon''Andriamanitra va aho?'
mg1865::mg_1::50::20:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ianareo no nisaina hanisy ratsy ahy; fa Andriamanitra kosa nisaina izany ho soa, hanao tahaka ny amin''izao anio izao, hamelona olona betsaka.'
mg1865::mg_1::50::21:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny, aza matahotra ianareo; fa izaho hamelona anareo sy ny zanakareo madinika. Dia nampionona azy sy nanao teny malefaka nahafinaritra azy izy.'
mg1865::mg_1::50::22:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa sy ny ankohonan''ny rainy nonina tany Egypta; ary ny andro niainan''i Josefa dia folo amby zato taona.'
mg1865::mg_1::50::23:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan''i Josefa ny zafiafin''i Efraima; ny zanak''i Makira koa, zanakalahin''i Manase, dia noraisin''i Josefa ho eo am-pofoany.'
mg1865::mg_1::50::24:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Josefa tamin''ny rahalahiny: Ho faty aho; nefa Andriamanitra hamangy anareo tokoa ka hitondra anareo hiala amin''ity tany ity ho any amin''ny tany izay nianianany tamin''i Abrahama sy Isaka ary Jakoba homena azy.'
mg1865::mg_1::50::25:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Josefa dia nampianiana ny zanak''Isiraely ka nanao hoe: Hamangy anareo tokoa Andriamanitra, dia hitondra ny taolako hiala eto ianareo.'
mg1865::mg_1::50::26:
  verse_version: mg1865
  verse_book: mg_1
  verse_chapter: 50
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia maty Josefa, rehefa folo amby zato taona; ary dia nohosorany zava-manitra izy ka napetrany tao anatin''ny vata tany Egypta.'

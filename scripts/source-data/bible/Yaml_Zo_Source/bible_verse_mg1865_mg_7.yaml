mg1865::mg_7::1::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny niadian''ny Zanak''Isiraely tamin''ny Kananita taorian''ny nahafatesan''i Josoa'
  verse_text: 'Ary rehefa maty Josoa, dia nanontany tamin''i Jehovah ny Zanak''Isiraely hoe: Iza no hiakatra voalohany hiady amin''ny Kananita ho anay?'
mg1865::mg_7::1::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Jehovah: Joda no hiakatra; indro, efa nanolotra ny tany ho eo an-tanany Aho.'
mg1865::mg_7::1::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Joda tamin''i Simeona rahalahiny: Andeha hiara-miakatra amiko ianao ho any amin''ny lovako, ka aoka isika hiady amin''ny Kananita; ary izaho kosa dia handeha hiaraka aminao ho any amin''ny lovanao. Ary Simeona dia nandeha niaraka taminy.'
mg1865::mg_7::1::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niakatra Joda, ary natolotr''i Jehovah teo an-tanany ny Kananita sy ny Perizita, ka nahafaty iray alin-dahy tany Bezeka izy.'
mg1865::mg_7::1::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nahita an''i Adoni-bezeka tany Bezeka izy, dia niady taminy ka naharesy ny Kananita sy ny Perizita.'
mg1865::mg_7::1::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa nandositra Adoni-bezeka;ary nanenjika azy izy ireto ka nisambotra azy, dia nanapaka ny ankihiben-tanany sy ny ankihiben-tongony.'
mg1865::mg_7::1::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Adoni-bezeka: Mpanjaka fito-polo voatapaka ny ankihiben-tanany sy ny ankihiben-tongony no nitsindroka hanina teo ambanin''ny latabatro; ka mba tahaka ny nataoko ihany lahy ity no navalin''Andriamanitra ahy! Ary nentin''ireo ho any Jerosalema izy ka maty tany.'
mg1865::mg_7::1::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary namely an''i Jerosalema ny taranak''i Joda, ka nahafaka azy, dia namely azy tamin''ny lelan-tsabatra ka nandoro ny tanàna.'
mg1865::mg_7::1::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka izany, dia nidina ny taranak''i Joda hiady amin''ny Kananita izay nonina tany amin''ny tany havoana sy tany amin''ny tany atsimo ary tany amin''ny tany lemaka amoron-tsiraka*. [*Hebreo: Sefela]'
mg1865::mg_7::1::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha Joda hiady amin''ny Kananita, izay nonina tany Hebrona (Kiriat-arba no anaran''i Hebrona taloha), ka namono an''i Sesay sy Ahimana ary Talmay.'
mg1865::mg_7::1::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niala tao izy ka nandeha hiady amin''ny mponina any Debira (Kiriata-sefera no anaran''i Debira taloha).'
mg1865::mg_7::1::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Kaleba: Izay mamely an''i Kiriata-sefera ka mahafaka azy dia homeko azy Aksa zanako-vavy ho vadiny.'
mg1865::mg_7::1::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Otniela, zanakalahin''i Kenaza, zandrin''i Kaleba, no nahafaka azy; ka dia nomeny azy Aksa zananivavy ho vadiny.'
mg1865::mg_7::1::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa voampakatra ravehivavy, dia nanome vava ny lahy hangataka saha tamin-drainy; dia niala faingana tamin''ny borikiny izy, ka hoy Kaleba taminy: Inona moa no ilainao?'
mg1865::mg_7::1::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Omeo tso-drano aho; fa tany tsy misy rano no nomenao ahy ka mba omeo loharano koa aho. Dia nomen''i Kaleba azy ny loharano ambony sy ny loharano ambany.'
mg1865::mg_7::1::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny taranak''ilay Kenita, zaodahin*''i Mosesy dia niara-niakatra tamin''ny taranak''i Joda niala tao amin''ny tanàna be rofia** hankany an''efitr''i Joda, atsimon''i Arada nandeha ireo ka nonina teo amin''ny Isiraely. [*Na: rafozan''] [**palma]'
mg1865::mg_7::1::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Joda nandeha niaraka tamin''i Simeona rahalahiny, dia namely ny Kananita, izay nonina tany Zefata, ka nataony ringana* ireo, ary ny anaran''ny tanàna nataony hoe Horma**. [*Hebreo: herema] [**Horma = Herema]'
mg1865::mg_7::1::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia afak''i Joda Gaza sy ny sisin-taniny an Askelona sy ny sisin-taniny ary Ekrona sy ny sisin-taniny.'
mg1865::mg_7::1::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah nomba an''i Joda, ka dia azony ny tany havoana; nefa tsy naharoaka ny mponina teny amin''ny tany lemaka izy, satria nanana kalesy vy ireny.'
mg1865::mg_7::1::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Hebrona dia nomeny an''i Kaleba, araka izay efa nolazain''i Mosesy, ka noroahin''i Kaleba niala tao izy telo lahy, taranaky ny Anakita.'
mg1865::mg_7::1::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny taranak''i Benjamina tsy nandroaka ny Jebosita, izay mponina any Jerosalema; fa ny Jebosita dia miara-monina amin''ny taranak''i Benjamina any Jerosalema ihany mandraka androany.'
mg1865::mg_7::1::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny taranak''i Josefa dia niakatra koa hamely an''i Betela; ary Jehovah nomba azy.'
mg1865::mg_7::1::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naniraka hisafo an''i Betela ny taranak''i Josefa (Lozy no anaran''ny tanàna taloha)'
mg1865::mg_7::1::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary nahita lehilahy anankiray nivoaka avy tao an-tanàna ny mpisafo ka nanao taminy hoe: Mba atoroy kely anay ny fidirana mankao an-tanàna, dia hamindra fo aminao izahay.'
mg1865::mg_7::1::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia natoron-dralehilahy azy ny fidirana mankao an-tanàna, ka dia nasiany tamin''ny lelan-tsabatra ny tanàna; fa ralehilahy sy ny mpianakaviny rehetra dia navelany handeha.'
mg1865::mg_7::1::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nandeha ho any amin''ny tanin''ny Hetita ralehilahy, ka nanorina tanàna izy, ary ny anarany dia nataony hoe Lozy, ary mbola izany ihany no anarany mandraka androany.'
mg1865::mg_7::1::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Manase tsy nahafaka an''i Beti-sana sy ny zana-bohiny, na Tanaka sy ny zana-bohiny, sady tsy naharoaka ny mponina tany Dora sy ny zana-bohiny, na ny mponina tany Ibleama sy ny zana-bohiny, na ny mponina tany Megido sy ny zana-bohiny, satria tian''ny Kananita hitoerana indrindra izany tany izany.'
mg1865::mg_7::1::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa rehefa nihahery kosa ny Isiraely, dia nampanaoviny fanompoana ny Kananita. fa tsy nandroaka azy rehetra izy.'
mg1865::mg_7::1::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Efraima tsy nandroaka ny Kananita. izay nonina tany Gazera; fa nonina teo aminy tany Gazera ny Kananita.'
mg1865::mg_7::1::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Zebolona tsy nandroaka ny mponina tany Kitrona, na ny mponina tany Nahalola; fa nonina teo aminy ny Kananita ka nampanaovina fanompoana.'
mg1865::mg_7::1::31:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Asera tsy nandroaka ny mponina tany Ako, na ny mponina tany Sidona, na ny tany Alaba, na ny tany Akziba, na ny tany Helba, na ny tany Afika. na ny tany Rehoba;'
mg1865::mg_7::1::32:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa nonina teo amin''ny Kananita tompon-tany ny taranak''i Asera, fa tsy nandroaka azy.'
mg1865::mg_7::1::33:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Naftaly tsy nandroaka ny mponina tany Beti-semesy, na ny mponina tany Bet-anata; fa nonina teo amin''ny Kananita tompon-tany izy, kanefa nampanaoviny fanompoana ny mponina tany Beti-semesy sy Bet-anata.'
mg1865::mg_7::1::34:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Amorita nanesika ny taranak''i Dana ho any amin''ny tany havoana, fa tsy namela azy hidina ho any amin''ny tany lemaka,'
mg1865::mg_7::1::35:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa tian''ny Amorita hitoerana indrindra ny tendrombohitra Heresa sy ny tany Aialona sy Salbima; nefa nahery ny tanan''ny taranak''i Josefa, ka dia nampanaovina fanompoana ireo.'
mg1865::mg_7::1::36:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 1
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny faritanin''ny Amorita dia hatramin''ny fiakarana Akrabima ka hatramin''ilay harambato no ho mankany.'
mg1865::mg_7::2::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nisehoan''Ilay Anjelin''i Jehovah tamin''ny Isiraely tao Bokima'
  verse_text: 'Ary Ilay Anjelin''i Jehovah niakatra avy tany Gilgala ka nankany Bokima, dia nanao hoe: Nitondra anareo niakatra avy tany Egypta Aho ka nampiditra anareo eto amin''ny tany izay nianianako tamin''ny razanareo homena azy, ka hoy Izaho: Tsy hanatsoaka ny fanekeko taminareo Aho mandrakizay;'
mg1865::mg_7::2::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'koa aza manao fanekena amin''ny tompon-tany ianareo, fa ravao ny alitarany; kanefa tsy nihaino ny feoko ianareo; koa inona moa izao nataonareo izao?'
mg1865::mg_7::2::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izaho indray: Tsy handroaka azy eo anoloanareo Aho; fa ho tsilo eo amin''ny tehezanareo sy ho fandrika aminareo ny andriamaniny.'
mg1865::mg_7::2::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony niteny izany teny izany tamin''ny Zanak''Isiraely rehetra Ilay Anjelin''i Jehovah, dia nanandratra ny feony ny vahoaka ka nitomany.'
mg1865::mg_7::2::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''izany tany izany dia nataony hoe Bokima*; ary namono zavatra teo izy hatao fanatitra ho an''i Jehovah. [*Bokima = Mitomany]'
mg1865::mg_7::2::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 6
  verse_date_revised: null
  verse_title: 'Ny toetry ny Isiraely tamin''ny andron''ny Mpitsara, ary ny anaran''ny firenena sisa mbola tsy resiny'
  verse_text: 'Ary rehefa nampodin''i Josoa ny vahoaka, dia nandeha ho any amin''ny lovany avy ny Zanak''Isiraely rehetra handova ny tany.'
mg1865::mg_7::2::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanompo an''i Jehovah ny vahoaka tamin''ny andro rehetra niainan''i Josoa sy tamin''ny andro rehetra niainan''ny loholona izay velona taorian''i Josoa, dia ireo izay efa nahita ny asa lehibe rehetra nataon''i Jehovah ho an''ny Isiraely.'
mg1865::mg_7::2::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary maty Josoa, zanak''i Nona, mpanompon''i Jehovah, rehefa folo amby zato taona ny androny.'
mg1865::mg_7::2::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nalevina tao anatin''ny faritanin''ny lovany izy, dia tao Timnata-heresa, any amin''ny tany havoan''i Efraima, avaratry ny tendrombohitra Gasa.'
mg1865::mg_7::2::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izany taranaka rehetra izany koa dia voangona any amin''ny razany; ary taranaka hafa, izay tsy nahalala an''i Jehovah na ny asa efa nataony ho an''ny Isiraely, no nitsangana nandimby azy.'
mg1865::mg_7::2::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanao izay ratsy eo imason''i Jehovah ny Zanak''Isiraely, fa nanompo ireo Bala'
mg1865::mg_7::2::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka nahafoy an''i Jehovah, Andriamanitry ny razany, Izay nitondra azy nivoaka avy tany amin''ny tany Egypta, ka nanaraka andriamani-kafa amin''ny andriamanitry ny firenena manodidina azy, dia niankohoka teo anatrehany ka nampahatezitra an''i Jehovah.'
mg1865::mg_7::2::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 13
  verse_date_revised: '2022-07-12T08:24:27+0000'
  verse_title: null
  verse_text: 'Eny, nahafoy an''i Jehovah izy ka nanompo an''i Bala sy Astarta.'
mg1865::mg_7::2::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nirehitra tamin''ny Isiraely ny fahatezeran''i Jehovah, ka natolony teo an-tanan''ny mpamabo izay namabo azy izy, ary namidiny ho eo an-tanan''ny fahavalony manodidina azy ka tsy nahajanona teo anoloan''ny fahavalony intsony.'
mg1865::mg_7::2::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Na taiza na taiza nivoahany, dia namely azy ny tanan''i Jehovah ka nampahory azy, araka izay efa nolazain''i Jehovah sy araka izay efa nianianany taminy; ka dia ory indrindra izy.'
mg1865::mg_7::2::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Kanefa Jehovah nanangana mpitsara izay namonjy azy tamin''ny tanan''ireo namabo azy.'
mg1865::mg_7::2::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa na dia ny mpitsara azy aza dia tsy mba nohenoiny, fa nandeha nijangajanga nanaraka andriamani-kafa izy ka niankohoka teo anatrehany; nivily faingana niala tamin''ny lalana izay nandehanan''ny razany nanaraka ny didin''i Jehovah izy, fa tsy mba nanaraka izany.'
mg1865::mg_7::2::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nanangana mpitsara ho azy Jehovah, dia nomba izany mpitsara izany Izy ka namonjy ny olona tamin''ny tanan''ny fahavalony tamin''ny andro rehetra niainan''izany mpitsara izany; fa nalahelo azy Jehovah amin''ny fitarainany noho ireo nampahory sy nampalahelo azy.'
mg1865::mg_7::2::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Kanjo nony maty ilay mpitsara, dia nanao ratsy indray izy mihoatra noho ny nataon''ny razany, fa nanaraka andriamani-kafa sy nanompo azy ary niankohoka teo anatrehany izy; tsy nitsahatra tàmin''ny fanaony na tamin''ny lalana nanaovany ditra izy.'
mg1865::mg_7::2::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nirehitra tamin''ny Isiraely ny fahatezeran''i Jehovah, ka hoy Izy: Satria nivadika ny fanekeko izay nandidiako ny razany ity firenena ity ka tsy nihaino ny feoko,'
mg1865::mg_7::2::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia tsy handroaka olona eo anoloany intsony Aho amin''ny firenena izay tsy mbola resy hatramin''ny andro nahafatesan''i Josoa,'
mg1865::mg_7::2::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'mba hizahako toetra ny Isiraely amin''ireny, na hitandrina ny lalan''i Jehovah ka handeha amin''izany araka izay nitandreman''ny razany izany izy, na tsia.'
mg1865::mg_7::2::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 2
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia navelan''i Jehovah ireny firenena ireny ka tsy noroahiny faingana; sady tsy voatolony teo an-tanan''i Josoa ireny.'
mg1865::mg_7::3::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny firenena navelan''i Jehovah ho entiny mizaha toetra ny Isiraely dia izay rehetra tsy mba nahita ny ady rehetra tany Kanana,'
mg1865::mg_7::3::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'mba ho fantatry ny taranaky ny Zanak''Isiraely izany amin''ny hampianarany azy hiady, indrindra fa izay tsy mbola nahalala izany akory teo aloha;'
mg1865::mg_7::3::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia ireo andriana dimy tamin''ny Filistina sy ny Kananita rehetra sy ny Sidoniana ary ny Hivita, izay nonina tany an-tendrombohitra Libanona, hatrao akaikin''i Bala-hermona ka hatramin''ny lalana mankany Hamata.'
mg1865::mg_7::3::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nentina hizaha toetra ny Isiraely ireo mba hahalalana na hihaino ny didin''i Jehovah, izay nasainy nandidian''i Mosesy ny razany, izy, na tsia.'
mg1865::mg_7::3::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Zanak''Isiraely nonina teo amin''ny Kananita sy ny Hetita sy ny Amorita sy ny Perizita sy ny Hivita ary ny Jebosita.'
mg1865::mg_7::3::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary naka ny zanakavavin''ireny ho vadiny izy sady nanome ny zananivavy ho vadin''ny zanakalahin''ireny ka nanompo ny andriamaniny.'
mg1865::mg_7::3::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 7
  verse_date_revised: null
  verse_title: 'Ny ratsy nataon''ny Isiraely, sy ny nanirahan''Andriamanitra mpitsara hamonjy azy. Ny tantaran''i Otniela sy Ehoda ary Samgara'
  verse_text: 'Ary nanao izay ratsy eo imason''i Jehovah ny Zanak''Isiraely ka nanadino an''i Jehovah Andriamaniny ary nanompo ireo Bala sy Aseraha*. [*Anaran''andriamani-tsy izy, na ny sariny]'
mg1865::mg_7::3::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nirehitra tamin''ny Isiraely ny fahatezeran''i Jehovah, ka nivarotra azy ho eo an-tanan''i Kosan-risataima, mpanjakan''i Mesopotamia*, Izy; dia nanompo an''i Kosan-risataima valo taona ny Zanak''Isiraely. [*Arama-naharaima]'
mg1865::mg_7::3::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitaraina tamin''i Jehovah ny Zanak''Isiraely, ary Jehovah nanangana mpamonjy ho an''ny Zanak''Isiraely, izay namonjy azy, dia Otniela, zanakalahin''i Kenaza, zandrin''i Kaleba.'
mg1865::mg_7::3::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Fanahin''i Jehovah no tao aminy, dia nitsara ny Isiraely izy sady nivoaka hiady; ary Kosan-risataima, mpanjakan''i Mesopotamia, dia natolotr''i Jehovah teo an-tanany; ary nahery ny tanany ka namely an''i Kosan-risataima.'
mg1865::mg_7::3::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandry ny tany efa-polo taona. Ary maty Otniela, zanak''i Kenaza.'
mg1865::mg_7::3::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa nanao izay ratsy eo imason''i Jehovah indray ny zanak''Isiraely ary i Jehovah nampahery an''i Eglona, mpanjakan''i Moaba, hiady amin''ny Isiraely, satria nanao izay ratsy eo imason''i Jehovah izy.'
mg1865::mg_7::3::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampiangona ny taranak''i Amona sy Amaleka ho any aminy izy, ary nandeha izy ireo ka namely ny Isiraely, dia nahafaka ny tanàna be rofia*. [*Palma]'
mg1865::mg_7::3::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanompo an''i Eglona, mpanjakan''i Moaba, valo ambin''ny folo taona ny Zanak''Isiraely.'
mg1865::mg_7::3::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nitaraina tamin''i Jehovah izy, dia nanangana mpamonjy ho azy Jehovah, dia Ehoda, zanak''i Gera, avy amin''ny taranak''i Benjamina, lehilahy kavia; dia nampitondra azy fanomezana ho an''i Eglona, mpanjakan''i Moaba, ny Zanak''Isiraely.'
mg1865::mg_7::3::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanao sabatra roa lela Ehoda, hakiho ny halavany; dia nataony tao amin''ny fehin-kibony ambanin''ny akanjo fiadiany izany, teny am-balahany ankavanana.'
mg1865::mg_7::3::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitondra ny fanomezana ho an''i Eglona, mpanjakan''i Moaba, izy; ary lehilahy matavibe Eglona.'
mg1865::mg_7::3::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa vitany ny nanolorana ny fanomezana, dia nampodiny ny olona izay nitondra izany.'
mg1865::mg_7::3::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa nony tonga teo amin''ny fihadiam-bato* izay any Gilgala kosa izy, dia niverina ka nanao hoe: Misy teny holazaiko mangingina aminao, ry mpanjaka o. Dia hoy kosa izy: Mialà kely ianareo, rizareo. Ary izay rehetra nitsangana teo anoloany dia niala teo aminy. [*Na: sarin-javatra voasokitra]'
mg1865::mg_7::3::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Ehoda nanatona azy, raha nipetraka irery tao an-tilikambony fihatsiatsiahana izy. Dia hoy Ehoda: Misy teny avy amin''Andriamanitra holazaiko aminao. Dia nitsangana niala tamin''ny seza fiandrianana Eglona.'
mg1865::mg_7::3::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary naninjitra ny tanany ankavia Ehoda ka nandray ny sabatra teny am-balahany ankavanana, dia natsatony tamin''ny kibon''i Eglona izany;'
mg1865::mg_7::3::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary difotra mbamin''ny zarany, ka voasaron''ny taviny ny lelan-tsabatra, ka dia tsy nanatsoaka ny sabatra tamin''ny kibony izy; ary niboroaka teo amin''ny vodiny izany.'
mg1865::mg_7::3::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka teo amin''ny lavarangana Ehoda ka nandrindrina ny varavaran''ny trano ka nanidy azy tao.'
mg1865::mg_7::3::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nivoaka izy, dia tonga teo kosa ny mpanompon''i Eglona; ary raha hitany fa, indro, voahidy ny varavaran''ny tilikambo, dia hoy izy: Miavela ato an-tilikambo fihatsiahana izy aloha.'
mg1865::mg_7::3::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niandry mandra-pahaveri-heviny izy ireo, kanjo tsy namoha ny varavaran''ny trano izy; ka dia naka ny fanalahidy izy ireo ka namoha azy; ary, indro, maty niampatra tamin''ny rihana ny tompony'
mg1865::mg_7::3::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Ehoda efa nandositra, raha mbola nitaredretra izy ireo, ka efa nihoatra ny fihadiam-bato, dia nandositra ho any Seirata.'
mg1865::mg_7::3::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tonga teo izy, dia nitsoka ny anjomara tany amin''ny tany havoan''i Efraima, dia nidina nanaraka azy avy tany amin''ny tany havoana ny Zanak''Isiraely, ary izy no nitarika azy.'
mg1865::mg_7::3::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy taminy: Manaraha ahy, fa efa natolotr''i Jehovah eo an-tananareo ny Moabita fahavalonareo. Dia nidina nanaraka azy ny olona, ka azony ny fitàna any Jordana hankany Moaba, ary tsy nisy navelany hita na dia iray akory aza.'
mg1865::mg_7::3::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namono ny Moabita tokony ho iray alin-dahy tamin''izany andro izany izy, samy olona vaventy sady mahery izy rehetra; ary tsy nisy afaka nandositra na dia iray akory aza.'
mg1865::mg_7::3::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia resin''ny tanan''ny Isiraely ny Moabita tamin''izany andro izany. Ary nandry valo-polo taona ny tany.'
mg1865::mg_7::3::31:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 3
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanarakaraka azy Samgara, zanak''i Anata, izay namely ny Filistina enin-jato lahy tamin''ny fanindronan-omby; dia namonjy ny Isiraely koa izy.'
mg1865::mg_7::4::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nampahorian''i Jabina ny Isiraely, sy ny namonjen''i Debora mpaminanivavy azy'
  verse_text: 'Ary ny Zanak''Isiraely nanao izay ratsy eo imason''i Jehovah indray, rehefa maty Ehoda.'
mg1865::mg_7::4::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah nivarotra azy ho eo an-tanan''i Jabina, mpanjakan''i Kanana, izay nanjaka tany Hazora, ary Sisera, izay nonina tany Harosetan''ny Jentilisa, no komandin''ny miaramilany.'
mg1865::mg_7::4::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitaraina tamin''i Jehovah ny Zanak''Isiraely; fa nanana kalesy vy sivin-jato Jabina, ary nampahory fatratra ny Zanak''Isiraely roa-polo taona izy.'
mg1865::mg_7::4::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Debora mpaminanivavy, vadin''i Lapidota, no nitsara ny Isiraely tamin''izany andro izany.'
mg1865::mg_7::4::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izy nipetraka teo ambanin''ny hazo rofian*''i Debora, teo anelanelan''i Rama sy Betela, tany amin''ny tany havoan''i Efraima; ary niakatra ho any aminy ny Zanak''Isiraely hotsaraina. [*Palma]'
mg1865::mg_7::4::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Debora naniraka ka niantso an''i Baraka, zanak''i Abinoama, tany Kadesi-naftaly, ka nanao taminy hoe: Moa tsy efa nandidy va Jehovah, Andriamanitry ny Isiraely, nanao hoe: Mandehana, ka mankanesa any an-tendrombohitra Tabara, ary mitondrà iray alin-dahy amin''ny taranak''i Naftaly sy Zebolona hiaraka aminao?'
mg1865::mg_7::4::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia ho entiko ho eo aminao, eo amoron''ny ony Kisona, Sisera, komandin''ny miaramilan''i Jabina, mbamin''ny kalesiny sy ny vahoakany maro be; dia hanolotra azy eo an-tananao Aho.'
mg1865::mg_7::4::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Baraka taminy: Raha handeha hiaraka amiko ianao, dia handeha aho; fa raha tsy handeha hiaraka amiko kosa ianao, dia tsy handeha aho.'
mg1865::mg_7::4::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy kosa izy: handeha hiaraka aminao ihany aho; kanefa tsy ho voninahitrao izao halehanao izao, satria ho eo an-tanam-behivavy no hivarotan''i Jehovah an''i Sisera. Dia niainga Debora ka nandeha niaraka tamin''i Baraka hankany Kadesy'
mg1865::mg_7::4::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nantsoin''i Baraka ho any Kadesy ny Zebolona sy ny Naftaly; dia nisy iray alin-dahy niakatra nanaraka azy; ary Debora niara-niakatra taminy.'
mg1865::mg_7::4::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Hebera Kenita efa nisaraka tamin''ny Kenita izay avy amin''ny taranak''i Hobaba, zaodahin*''i Mosesy, ary nilasy ambara-pahatongany teo amin''ny hazo terebinta ao Zananima, izay eo anilan''i Kadesy. [*Na: rafozan'']'
mg1865::mg_7::4::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy nilaza tamin''i Sisera fa Baraka, zanak''i Abinoama, niakatra any an-tendrombohitra Tabara.'
mg1865::mg_7::4::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nangonin''i Sisera ny kalesiny rehetra, dia kalesy vy sivin-jato, sy ny vahoaka rehetra izay niaraka taminy avy tany Harosetan''ny Jentilisa, hankany amin''ny ony Kisona.'
mg1865::mg_7::4::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Debora tamin''i Baraka: Miakara, fa anio no andro hanoloran''i Jehovah an''i Sisera eo an-tananao; tsy mivoaka eo anoloanao va Jehovah? Dia nidina Baraka sy ny olona iray alina nanaraka azy, avy tany an-tendrombohitra Tabara.'
mg1865::mg_7::4::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampifanaritahin''i Jehovah tamin''ny lelan-tsabatra Sisera teo anoloan''i Baraka sy ny kalesy rehetra ary ny miaramila rehetra; dia nidina niala tamin''ny kalesy Sisera ka nandositra nandeha tongotra.'
mg1865::mg_7::4::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Baraka nanenjika nanaraka ny kalesy sy ny miaramila hatrany Haroseta; dia lavon''ny lelan-tsabatra avokoa ny miaramilan''i Sisera rehetra; tsy nisy niangana na dia iray akory aza.'
mg1865::mg_7::4::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Sisera nandositra nandeha tongotra ho any amin''ny lain''i Jaela, vadin''i Hebera Kenita; fa nihavana Jabina, mpanjakan''i Hazora, sy ny mpianakavin''i Hebera Kenita.'
mg1865::mg_7::4::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka Jaela hitsena an''i Sisera ka nanao taminy hoe: Miakara, tompokolahy, miakara aty amiko; aza matahotra. Ary rehefa niakatra ho ao aminy ao an-day izy, dia norakofany ny lamba firakotra.'
mg1865::mg_7::4::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Sisera taminy: Masïna ianao, omeo rano kely hosotroiko, fa mangetaheta aho izany. Dia nanokatra ny siny hoditra nisy ronono izy ka nomeny hosotroiny; ary dia norakofany indray izy.'
mg1865::mg_7::4::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy taminy: Mitsangàna eo am-baravaran''ny lay, ka raha tàhiny misy avy ka manontany anao hoe: Misy olona va ato? dia ataovy hoe: Tsia.'
mg1865::mg_7::4::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naka tsima-day Jaela, vadin''i Hebera, sady nitondra tantanana teny an-tanany ka nitsaitsaika nankeo aminy; dia natsatony tamin''ny fihirifany ny tsima-day, ka nihatra tamin''ny tany fa efa renoky ny torimaso Sisera, satria sasatra ka dia maty izy.'
mg1865::mg_7::4::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony, indro, avy Baraka manenjika an''i Sisera, dia nivoaka hitsena azy Jaela ka nanao taminy hoe; Avia aty, fa hasehoko anao ny lehilahy izay tadiavinao. Ary rehefa tonga tao aminy izy, dia indro, ny fatin''i Sisera niampatra teo, ary ny tsima-day teo amin''ny fihirifany.'
mg1865::mg_7::4::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naetrin''Andriamanitra teo anoloan''ny Zanak''Isiraely tamin''izany andro izany Jabina, mpanjakan''i Kanana.'
mg1865::mg_7::4::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 4
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny tanan''ny Zanak''Isiraely nihahery tamin''i Jabina, mpanjakan''i Kanana, mandra-pandringany azy.'
mg1865::mg_7::5::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny fihirana nataon''i Debora noho ny nandresena an''i Sisera'
  verse_text: 'Ary Debora sy Baraka, zanak''i Abinoama, dia nihira tamin''izany andro izany ka nanao hoe:'
mg1865::mg_7::5::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Noho ny fitarihan*''ny lehibe tamin''ny Isiraely sy ny fahazotoan''ny vahoaka nanolotena, dia miderà an''i Jehovah. [*Na: fitombadahin'']'
mg1865::mg_7::5::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mandrenesa ianareo, ry mpanjaka, mihainoa ianareo, ry mpanapaka! Izaho indrindra no hihira ho an''i Jehovah; hankalaza an''i Jehovah, Andriamanitry ny Isiraely, aho.'
mg1865::mg_7::5::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Jehovah ô, fony nivoaka avy tany* Seïra Ianao ary nandeha avy tany amin''ny tany Edoma, dia nihorohoro ny tany, ary ny lanitra koa nitete; Eny, ny rahona matevina nitete rano. [*Hebreo: tamin''ny saha]'
mg1865::mg_7::5::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny tendrombohitra niempo teo anatrehan''i Jehovah. Eny, na dia iry Sinay iry aza teo anatrehan''i Jehovah, Andriamanitry ny Isiraely.'
mg1865::mg_7::5::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tamin''ny andron''i Samgara, zanak''i Anata, sy tamin''ny andron''i Jaela dia tsy nodiavina ny lalambe, fa ny sakeli-dalana mivilivily no nalehan''ny mpandeha.'
mg1865::mg_7::5::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Lao ny tany an-tsaha; eny, lao* tamin''ny Isiraely izany, Mandra-pitsangako, izaho Debora, eny, mandra-pitsangako ho reny teo amin''ny Isiraely. [*Na: Tsy nisy mpanapaka; eny nitsahatra]'
mg1865::mg_7::5::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nifidy andriamani-baovao ny olona, Ary tamin''izay dia nisy ady hatrany am-bavahady. Moa nisy ampinga na lefona na dia iray akory aza hita va teo amin''ny olona efatra alina tamin''ny Isiraely?'
mg1865::mg_7::5::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny foko mankasitraka ny mpanapaka amin''ny Isiraely, izay nazoto nanolo-tena teo amin''ny vahoaka, miderà an''i Jehovah ianareo.'
mg1865::mg_7::5::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ianareo izay mitaingina borikivavy fotsy, ianareo izay mipetraka amin''ny lamba fitoerana, ary ianareo koa izay mandeha amin''ny lalana, samia milaza.'
mg1865::mg_7::5::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Lavitra ny feon''ny mpandefa zana-tsipïka, dia eo amin''ny fantsakan-drano, no hiresahany ny asa marina nataon''i Jehovah, dia ny fahamarinany tamin''ny tany* Isily; Tamin''izany dia nidina ny olon''i Jehovah ho any am-bavahady. [*Na: tamin''ny fitondrany ny]'
mg1865::mg_7::5::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mifohaza, mifohaza, ry Debora; Mifohaza, mifohaza, ka mihirà! Mitsangana, ry Baraka; ento ny babonao, ry zanakalahin''i Abinoama.'
mg1865::mg_7::5::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tamin''izany dia nidina izay olo-malaza sisa mbamin''ny vahoaka, Jehovah nidina homba ahy koa hamely* ny olo-mahery. [*Na: ho isan'']'
mg1865::mg_7::5::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny avy amin''i Efraima, izay miorina amin''i Amaleka, dia nomba anao teo amin''ny firenenao, ry Benjamina; Avy tany Makira no nidinan''ny mpanao lalàna, ary avy tamin''i Zebolona ireo mitana ny tehin''ny mpifehy*. [*Na: mpanoratra]'
mg1865::mg_7::5::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny andrianan''Isakara niaraka tamin''i Debora, dia Isakara sy Baraka koa; Nampandehanina nanaraka azy any an-dohasaha izy. Lehibe ny fiheverana am-po teny amin''ny sakeli-dranon''i Robena!'
mg1865::mg_7::5::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nahoana ianao no nitoetra teo anelanelan''ny vala, hihainoanao ny feon-tsodina any amin''ny ondry? Lehibe ny fiheverana am-po teny amin''ny sakeli-dranon''i Robena!'
mg1865::mg_7::5::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Gileada nitoetra tany an-dafin''i Jordana; Ary nahoana Dana no nitoetra tany an-tsambo? Asera nitoetra tany amoron-dranomasina, Ary teny amin''ny fitodiany no nipetrahany.'
mg1865::mg_7::5::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Zebolona dia firenena nanao tsinontsinona ny ainy, na dia ho faty aza, Ary Naftaly koa teo amin''ny fitoerana avo any an-tsaha.'
mg1865::mg_7::5::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tonga ireo mpanjaka ka niady, eny, niady tao Tanaka ireo mpanjakan''i Kanana, dia teo anilan''ny ranon''i Megido; Tsy nisy volafotsy azony ho babo.'
mg1865::mg_7::5::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Avy tany an-danitra no nisy ady: ny kintana tamin''ny nalehany niady tamin''i Sisera.'
mg1865::mg_7::5::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny ony Kisona nipaoka azy, Izany ony ela* izany, dia ny ony Kisona. Mandrosoa amin-kery ianao, ry fanahiko! [*Na: ony be ady]'
mg1865::mg_7::5::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tamin''izany dia nikatrokatroka ny kitron-tsoavaly noho ny fihazakazaka, dia ny fihazakazaky ny maheriny.'
mg1865::mg_7::5::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ozony Meroza, hoy Ilay Anjelin''i Jehovah, Ozony dia ozony ny mponina ao, Satria tsy mba tonga hanampy an''i Jehovah izy, eny, tsy nanampy an''i Jehovah hamely* ny mahery. [*Na: isan'']'
mg1865::mg_7::5::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Hotahina mihoatra noho ny vehivavy anie Jaela, vadin''i Hebera Kenita; Eny, hotahina mihoatra noho ny vehivavy mitoetra an-day anie izy.'
mg1865::mg_7::5::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Rano no nangatahin-dralehilahy, fa ronono aza no nomeny azy; Teo an-dovian''andriana no nitondrany rononomandry.'
mg1865::mg_7::5::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ny tanany nandray ny tsima-day, Ary ny tanany ankavanana nandray ny tantanan''ny mpiasa, dia namely an''i Sisera tamin''ny tantanana izy ka nahavoa ny lohany; Namely mafy izy, dia nahaboroaka ny fihirifany.'
mg1865::mg_7::5::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Teo amin''ny tongo-dravehivavy no niondrehany nahalavoany niamparany, eny, teo amin''ny tongony no niondrehany nahalavoany teo amin''izay niondrehany no niamparan''ny fatiny.'
mg1865::mg_7::5::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tao amin''ny varavarankely no nitsirihan''ny renin''i Sisera ka niantsoantsoany mafy; Eny, niantso tao amin''ny makarakara izy hoe: Nahoana no ela izato kalesiny vao tonga? Nahoana no mitaredretra ny kodian''ny kalesiny?'
mg1865::mg_7::5::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izay hendry tamin''ny andriambaviny no namaly azy, eny, ny tenany aza namaly hoe:'
mg1865::mg_7::5::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tsy efa mahita va izy? Tsy mizara babo va izy? Dia zazavavy iray na roa ho an''ny isan-dahy, Ary lamba samy hafa volo ho babon''i Sisera, Lamba roa samy hafa soratra ho eo am-bozon''ny nahazo babo.'
mg1865::mg_7::5::31:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 5
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ho levona tahaka izany anie ny fahavalonao rehetra, Jehovah ô; Fa aoka izay tia Azy kosa ho tahaka ny masoandro, raha miposaka amin''ny heriny izy. Dia nandry ny tany efa-polo taona.'
mg1865::mg_7::6::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nampahorian''ny Midiana ny Isiraely, sy ny niantsoan''Andriamanitra an''i Gideona ho mpamonjy azy'
  verse_text: 'Ary nanao izay ratsy eo imason''i Jehovah ny Zanak''Isiraely, ka dia natolotr''i Jehovah ho eo an-tanan''ny Midiana fito taona izy;'
mg1865::mg_7::6::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary ny tanan''ny Midiana dia nahery tamin''ny Isiraely, ka ny tahony ny Midiana no nanamboaran''ny Zanak''Isiraely ireo fierena any an-tendrombohitra sy ireo zohy mbamin''ny fiarovana.'
mg1865::mg_7::6::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa namafy voa ny Isiraely, dia avy ny Midiana sy ny Amalekita ary ny zanaky ny atsinanana ka niakatra hanafika azy.'
mg1865::mg_7::6::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitoby tandrifiny ireny ka nanimba ny vokatry ny tany hatrany akaikin''i Gaza; ary tsy nisy zavatra navelany hiveloman''ny Isiraely, na ondry aman''osy, na omby, na boriky;'
mg1865::mg_7::6::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa niakatra izy nitondra ny omby aman''ondriny sy ny lainy, ka ny fihaviny dia tahaka ny valala ny hamarony, ary tsy hita isa izy sy ny ramevany; dia niditra tamin''ny tany izy handrava azy'
mg1865::mg_7::6::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dia nahantra indrindra ny Isiraely noho ny Midiana, ka nitaraina tamin''i Jehovah izy.'
mg1865::mg_7::6::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha nitaraina tamin''i Jehovah ny Zanak''Isiraely noho ny Midiana,'
mg1865::mg_7::6::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Jehovah dia naniraka mpaminany anankiray ho any amin''ny zanak''Isiraely, izay nilaza taminy hoe: Izao no lazain''i Jehovah Andriamanitry ny Isiraely Izaho no nitondra anareo niakatra avy tany Egypta sady nitondra anareo nivoaka avy tany amin''ny trano nahandevozana'
mg1865::mg_7::6::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary namonjy anareo tamin''ny tanan''ny Egyptiana sy ny tanan''izay rehetra nampahory anareo, dia nandroaka ireny teo anoloanareo Aho, ka nomeko anareo ny taniny;'
mg1865::mg_7::6::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary hoy Izaho taminareo: Izaho no Jehovah Andriamanitrareo; aza matahotra ny andriamanitry ny Amorita, izay tompon''ny tany onenanareo; nefa tsy nihaino ny feoko ianareo.'
mg1865::mg_7::6::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia tonga Ilay Anjelin''i Jehovah ka nipetraka teo ambanin''ny hazo terebinta teo Ofra, izay an''i Joasy Abiezrita; ary Gideona zanany nively vary tamin''ny fantàka teo anilan''ny famiazam-boaloboka mba hafeniny amin''ny Midiana.'
mg1865::mg_7::6::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Ilay Anjelin''i Jehovah niseho taminy ka nanao taminy hoe: Jehovah no momba anao, ry lehilahy mahery.'
mg1865::mg_7::6::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Gideona taminy: Indrisy, Tompoko, raha momba anay Jehovah, nahoana no ozoin''izao rehetra izao izahay? Ary aiza ny fahagagana rehetra nataony, izay nolazain''ny razanay taminay hoe: Tsy nitondra anay niakatra avy tany Egypta va Jehovah? Fa ankehitriny efa nahafoy anay mihitsy Jehovah ka nanolotra anay eo an-tanan''ny Midiana.'
mg1865::mg_7::6::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitodika nijery azy Jehovah ka nanao hoe: Mandehana amin''izao herinao izao, ka vonjeo ny Isiraely amin''ny tanan''ny Midiana; tsy efa naniraka anao va Aho?'
mg1865::mg_7::6::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy izy taminy: Indrisy, Tompo o, hataoko ahoana no famonjy ny Isiraely? He! ny mpianakaviko no malahelo indrindra eo amin''ny Manase, ary izaho no kely indrindra amin''ny ankohonan''ny raiko.'
mg1865::mg_7::6::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Jehovah taminy: Homba anao tokoa Aho, ka hamely ny Midiana toy ny famely olona iray monja ianao.'
mg1865::mg_7::6::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy taminy: Masina Ianao, raha mahita fitia eto imasonao ary aho, dia anehoy famantarana fa Ianao no miteny amiko.'
mg1865::mg_7::6::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Masina Ianao, aza miala eto mandra-pihaviko eto aminao hitondra ny fanatitra hohanina, ka hapetrako eto anatrehanao. Dia hoy Izy: Eny, Izaho hiandry mandra-piverinao.'
mg1865::mg_7::6::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Gideona lasa niditra ka namboatra zanak''osy sy mofo tsy misy masirasira tamin''ny koba iray efaha, ka ny hena nataony tao anatin''ny harona, ary ny ron-kena nataony tao anatin''ny vilany, dia nentiny ho eo aminy, teo ambanin''ilay hazo terebinta ka natolony Azy.'
mg1865::mg_7::6::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Ilay Anjelin''Andriamanitra taminy: Raiso ny hena sy ny mofo tsy misy masirasira, ka apetraho eo ambonin''ity harambato ity, ary aidino ny ron-kena. Dia nataony izany.'
mg1865::mg_7::6::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary naroson''Ilay Anjelin''i Jehovah ny lohan''ny tehina izay teny an-tanany ka natendriny ny hena sy ny mofo tsy misy masirasira; dia nisy afo nivoaka avy tamin''ny vatolampy ka nandevona ny hena sy ny mofo tsy misy masirasira. Ary Ilay Anjelin''i Jehovah dia lasa niala teo imasony.'
mg1865::mg_7::6::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hitan''i Gideona fa Anjelin''i Jehovah Izy, ka hoy izy: Adray, Jehovah Tompo o! fa nahita Ilay Anjelin''i Jehovah nifanatrika aho.'
mg1865::mg_7::6::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Jehovah taminy: Fiadanana anie ho anao; aza matahotra; tsy ho faty ianao tsy akory.'
mg1865::mg_7::6::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Gideona nanorina alitara teo ho an''i Jehovah-saloma*; mbola ao Ofran''ny Abiezrita izany mandraka androany. [*Jehovah-saloma = Jehovah no fiadanana]'
mg1865::mg_7::6::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''izany alina izany dia hoy Jehovah taminy: Alao ny ombilain-drainao, dia* ilay ombilahy faharoa, izay efa fito taona, ka ravao ny alitaran''i Bala, izay an''ny rainao, ary kapao ny Aseraha** eo anilany; [*Na: sy] [**Anaran''andriamani-tsy izy, na ny sariny]'
mg1865::mg_7::6::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia manorena alitara eto an-tampon''ity fiarovana ity ho an''i Jehovah Andriamanitrao, ka amboary tsara izy*, ary alao ilay ombilahy faharoa, ka atero ho fanatitra dorana amin''ny hazon''ny Aseraha izay hokapainao. [*Na: amin''ny zavatra vonona eo]'
mg1865::mg_7::6::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Gideona naka folo lahy tamin''ny mpanompony ka nanao araka izay efa nolazain''i Jehovah taminy; ary satria natahotra ny fianakavian-drainy sy ny lehilahy tao an-tanàna izy dia tsy nanao izany tamin''ny antoandro, fa tamin''ny alina no nanaovany azy.'
mg1865::mg_7::6::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa nony nifoha maraina koa ny lehilahy tao an-tanàna, ka indro, efa rava ny alitaran''i Bala, sady voakapa ny Aseraha teo anilany, ary ilay ombilahy faharoa dia efa naterina teo ambonin''ny alitara izay natao,'
mg1865::mg_7::6::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia nifanontany hoe izy: Iza re no nanao izany zavatra izany e? Ary raha nifanontany sy nifamoaka teo izy, dia hoy izy: Gideona, zanak''i Joasy, no nanao izany zavatra izany.'
mg1865::mg_7::6::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny lehilahy tao an-tanàna tamin''i Joasy: Avoahy ny zanakao mba hovonoina, satria efa nandrava ny alitaran''i Bala izy sady efa nikapa ny Aseraha teo anilany.'
mg1865::mg_7::6::31:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Joasy tamin''izay rehetra nitsangana teo anatrehany: Moa ianareo handahatra ho an''i Bala va? Ianareo va no hamonjy azy? Izay handahatra ho an''i Bala dia hatao maty, raha mbola maraina* ny andro: raha andriamanitra Bala, aoka izy handahatra ho an''ny tenany, fa nisy nandrava ny alitarany. [*Na: mandra-pahamarain'']'
mg1865::mg_7::6::32:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''izany andro izany ny anaran''ny Gideona dia nataony hoe Jerobala*, fa hoy izy: Aoka Bala no hifandahatra aminy, satria noravany ny alitarany. [*Jerobala = Aoka Bala no handahatra]'
mg1865::mg_7::6::33:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 33
  verse_date_revised: null
  verse_title: 'Ny nandresen''i Gideona ny Midiana'
  verse_text: 'Ary ny Midiana rehetra sy ny Amalekita ary ny zanaky ny atsinanana nivory, dia nita ka nitoby teny amin''ny tany lemaka Jezirela.'
mg1865::mg_7::6::34:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary notsindrian''ny Fanahin''i Jehovah Gideona, dia nitsoka anjomara izy, ka nivory nanaraka azy ny Abiezrita.'
mg1865::mg_7::6::35:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary naniraka olona nankany amin''ny Manase rehetra izy, dia nivory nanaraka azy ireo; ary naniraka olona tany amin''ny Asera sy ny Zebolona ary ny Naftaly izy; dia niakatra nitsena azy koa ireo.'
mg1865::mg_7::6::36:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Gideona tamin''Andriamanitra: Raha ny tanako no hamonjenao ny Isiraely araka izay efa nolazainao,'
mg1865::mg_7::6::37:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'indro, hapetrako eo amin''ny famoloana ity volon''ondry iray manontolo ity, ka raha ny volon''ondry ihany no lenan''ny ando, fa maina ny tany rehetra, dia ho fantatro fa ny tanako no hamonjenao ny Isiraely araka izay efa nolazainao.'
mg1865::mg_7::6::38:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dia nisy izany; fa nifoha, maraina koa izy, ka nofiazany ny volon''ondry, ary nisy ranon''ando eran''ny lovia.'
mg1865::mg_7::6::39:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 39
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa Gideona tamin''Andriamanitra: Aoka tsy hirehitra amiko ny fahatezeranao, fa hiteny izao indray mandeha izao monja aho; aoka mba hizahako izao indray mandeha izao monja amin''ny volon''ondry: aoka ny volon''ondry ihany no ho maina, fa ny tany rehetra kosa no ho lenan''ny ando.'
mg1865::mg_7::6::40:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 6
  verse_number: 40
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nataon''Andriamanitra izany tamin''ny alin''iny, ka ny volon''ondry ihany no maina, fa ny tany rehetra kosa dia lenan''ny ando.'
mg1865::mg_7::7::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nifoha maraina koa Jerobala (Gideona izany) sy ny vahoaka rehetra teo aminy ka nitoby teo akaikin''ny loharano Haroda*; ary ny tobin''ny Midiana kosa teo avarany, teo an-dohasaha anilan''ny havoana More. [*Haroda = Fangovitana; izahao Mpitsara 7:3]'
mg1865::mg_7::7::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah tamin''i Gideona: Maro loatra ny vahoaka eo aminao, ka tsy hanolotra ny Midiana eo an-tanany Aho, fandrao hirehareha amiko ny Isiraely ka hanao hoe: Ny tanako ihany no namonjy ahy.'
mg1865::mg_7::7::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny andeha miantso eo anatrehan''ny vahoaka hoe: Na iza na iza no matahotra sy mangovitra, aoka izy hiverina ka hiala amin''ny tany havoan''i Gileada. Dia niverina ny olona roa arivo sy roa alina; fa ny iray alina no sisa.'
mg1865::mg_7::7::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Jehovah tamin''i Gideona: Mbola maro ihany ny olona; koa ampidino ho eo amin''ny rano izy, ary eo no hizahako toetra azy ho anao; ary izay holazaiko aminao hoe: Io no hiaraka aminao, dia izy no hiaraka aminao; ary izay rehetra holazaiko aminao hoe: Io no tsy hiaraka aminao, dia izy kosa no tsy hiaraka aminao.'
mg1865::mg_7::7::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dia nampidinin''i Gideona ho eo amin''ny rano ny olona; ary hoy Jehovah taminy: Izay rehetra milelaka rano amin''ny lelany tahaka ny filelaky ny amboa dia atokàny, ary izay rehetra mandohalika kosa hisotro dia atokàny koa.'
mg1865::mg_7::7::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary telon-jato lahy no isan''izay nanainga ny tanany tamin''ny vavany ka nilelaka; fa ny olona sisa rehetra dia nandohalika hisotro rano.'
mg1865::mg_7::7::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah tamin''i Gideona: Ny telon-jato lahy izay nilelaka rano no hamonjeko anareo ka hanolorako ny Midiana eo an-tananao; fa aoka ny olona sisa rehetra samy hody any amin''ny fonenany avy.'
mg1865::mg_7::7::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny olona nitondra vatsy* sy ny anjomarany teny an-tanany; ary ny Isiraely sisa dia nalefany hody samy ho any amin''ny lainy avy, fa ny telon-jato lahy ihany no nohazoniny; ary ny tobin''ny Midiana dia teo ambaniny teo an-dohasaha. [*Na: Ary nitondra ny vatsin''ny olona ireo]'
mg1865::mg_7::7::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tamin''izany alina izany dia hoy Jehovah tamin''i Gideona: Mitsangàna, midina ho any amin''ny toby ianao; fa efa natolotro eo an-tananao io.'
mg1865::mg_7::7::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa raha matahotra hidina ianao, dia aoka hidina miaraka aminao ho any amin''ny toby Pora zatovonao;'
mg1865::mg_7::7::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia ho renao izay lazain''ny olona, ary rehefa afaka izany, dia hampaherezina ny tananao hidinanao any amin''ny toby. Dia nidina niaraka tamin''i Pora zatovony izy ho any an-tsisin''ny olona efa voaomana hiady, izay teo amin''ny toby.'
mg1865::mg_7::7::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Midiana sy ny Amalekita ary ny zanaky ny atsinanana rehetra dia nandry teny an-dohasaha, tahaka ny valala ny hamarony; ary tsy hita isa ny ramevany, tahaka ny fasika any amoron-dranomasina ny hamarony.'
mg1865::mg_7::7::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha tonga tao Gideona, indro, nisy lehilahy nilaza nofy tamin''ny namany ka nanao hoe: Nanonofy aho, ka, indro, nisy mofo vary hordea nikodiadia ho eo amin''ny tobin''ny Midina ka nankamin''ny lay anankiray, dia nampiongana ka nampivadika azy, ka dia nipetraka teo ny lay.'
mg1865::mg_7::7::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly ilay namany ka nanao hoe: Tsy zavatra hafa izany, fa ny sabatr''i Gideona, zanak''i Joasy, lehilahy Isiraelita, mihitsy: efa natolotr''Andriamanitra eo an-tanany ny Midiana sy ny toby rehetra.'
mg1865::mg_7::7::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa ren''i Gideona ny filàzany ny nofy sy ny heviny, dia nivavaka izy; ary niverina ho any amin''ny tobin''ny Isiraely izy ka nanao hoe: Mitsangàna, fa efa natolotr''i Jehovah eo an-tananareo ny tobin''ny Midiana.'
mg1865::mg_7::7::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nozarainy telo toko ny telon-jato lahy, ary samy nomeny anjomara iray avy ho eny an-tanany ary siny tsy nisy rano sy fanilo tao anatin''ny siny.'
mg1865::mg_7::7::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy taminy: Mijere ahy ianareo, ka manaova araka izay ataoko; ary, indro, raha mankany amin''ny sisin''ny toby aho, dia izay ataoko ihany no mba ataovinareo koa.'
mg1865::mg_7::7::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha mitsoka ny anjomara izaho sy izay miaraka amiko, dia mba mitsofa ny anjomara manodidina ny toby rehetra koa ianareo, ka miantsoa hoe: An''i Jehovah sy Gideona!'
mg1865::mg_7::7::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nankany amin''ny sisin''ny toby tamin''ny fiandohan''ny fiambenana faharoa Gideona sy ny zato lahy izay teo aminy; raha vao nalatsaka ny fiambenana; dia nitsoka ny anjomara ireo sady namaky ny siny teny an-tanany.'
mg1865::mg_7::7::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia mba nitsoka ny anjomara avokoa ny telo toko sady namaky ny sininy, ka nihazona ny fanilo teny an-tanany ankavia ary ny anjomara teny an-tanany ankavanana mba hotsofiny; dia niantso hoe izy: Ny sabatr''i Jehovah sy Gideona!'
mg1865::mg_7::7::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary samy nijanona teo amin''ny fitoerany avy manodidina ny toby izy rehetra; dia nihazakazaka ny miaramila rehetra ka ninananana sady nandositra.'
mg1865::mg_7::7::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitsoka ny anjomara ny telon-jato lahy, ary nampifamelezin''i Jehovah tamin''ny sabatra ny miaramila eran''ny toby rehetra, dia nandositra hatrany Beti-sita izy ka hatrany Zereraha sy hatramin''ny faritanin''i Abela-mehola akaiky an''i Tabata.'
mg1865::mg_7::7::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivory ny lehilahy amin''ny Isiraely avy tamin''ny Naftaly sy ny Asera ary ny Manase rehetra ka nanenjika ny Midiana.'
mg1865::mg_7::7::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Gideona naniraka olona hitety ny tany havoan''i Efraima rehetra ka nanao hoe: Midina hisakana ny Midiana, ka vonjeo ny rano eo alohany hatrany Beti-bara sy Jordana. Dia nivory ny lehilahy rehetra amin''ny Efraima ka namonjy ny rano hatrany Beti-bara sy Jordana.'
mg1865::mg_7::7::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 7
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisambotra ny andriana roa lahy amin''ny Midiana izy, dia Oreba sy Zeba, ary Oreba novonoiny teo ambonin''ny vatolampin''i Oreba, ary Zeba novonoiny teo amin''ny famiazam-boalobok''i Zeba, dia nanenjika ny Midiana izy; ary ny lohan''i Oreba sy Zeba dia nentiny tany amin''i Gideona tany an-dafin''i Jordana.'
mg1865::mg_7::8::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny lehilahy amin''ny Efraima tamin''i Gideona: Ahoana izao zavatra nataonao taminay izao, no tsy nantsoinao izahay, raha nandeha hiady tamin''ny Midiana ianao? Dia nanome tsiny azy mafy ireo.'
mg1865::mg_7::8::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Gideona taminy: Zinona izao nataoko izao. raha oharina amin''izay nataonareo? Tsy tsara va ny fitsimponam-boalobok''i Efraima noho ny fiotazam-boalobok''i Abiezera?'
mg1865::mg_7::8::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Teo an-tananareo no nanoloran''Andriamanitra ny andrianan''ny Midiana, dia Oreba sy Zeba; ary inona no azoko atao, raha oharina amin''ny nataonareo? Ary rehefa nilaza izany teny izany Gideona, dia nitony ny fahatezeran''ireo taminy.'
mg1865::mg_7::8::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Gideona nankany Jordana, ka nita izy sy ny telon-jato lahy teo aminy, na dia efa reraka aza, mbola nanenjika ihany.'
mg1865::mg_7::8::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy tamin''ny mponina tao Sokota: Masïna ianareo, mba omeo mofo ny olona manaraka ahy, fa reraka izy, ary izaho manenjika an''i Zebaha sy Zalmona, mpanjakan''ny Midiana.'
mg1865::mg_7::8::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy ireo andrianan''i Sokota: Moa efa voahazon''ny tananao ankehitriny va ny tanan''i Zebaha sy Zalmona, no homenay mofo ny miaramilamao?'
mg1865::mg_7::8::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Gideona: Rehefa voatolotr''i Jehovah eo an-tanako Zehaba sy Zalmona, dia handalasiko amin''ny tsilo avy any an''efitra sy ny sampivato ny tenanareo*. [*Hebreo: nofonareo]'
mg1865::mg_7::8::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niakatra avy teo izy ka nankany Penoela, dia nanao teny tahaka izany koa tamin''ny olona tao; ary ny mponina tao Penoela koa dia namaly azy tahaka ny navalin''ny mponina tao Sokota ihany.'
mg1865::mg_7::8::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niteny tamin''ny mponina tao Penoela izy ka nanao hoe: Raha tafaverina soa aman-tsara aho, dia horavako ity tilikambo ity.'
mg1865::mg_7::8::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Zebaha sy Zalmona dia tonga tao Karkora mbamin''ny miaramila teo aminy tokony ho dimy arivo sy iray alin-dahy, dia izay sisa rehetra tamin''ny miaramila rehetra an''ny zanaky ny atsinanana; ary ny maty kosa dia roa alina sy iray hetsy, samy lehilahy mpitan-tsabatra* avokoa ireo. [*Hebreo: mpanatsoaka sabatra]'
mg1865::mg_7::8::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Gideona niakatra tamin''ny lalan''ny mpitoetra an-day, atsinanan''i Noha sy Jogbeha, ka dia namely ny toby, raha mbola ilay tsy nanampo iny ny olona.'
mg1865::mg_7::8::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandositra Zebaha sy Zalmona, ary nanenjika azy ny Isiraely ka nisambotra ny mpanjaka roa tamin''ny Midiana, dia Zebaha sy Zalmona, fa efa nampihorohoroiny avokoa ny toby rehetra.'
mg1865::mg_7::8::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niverina avy tamin''ny ady Gideona, zanak''i Joasy, avy teo amin''ny fiakarana Heresa;'
mg1865::mg_7::8::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'ary nisambotra zatovo tamin''ny mponina tao Sokota izy ka nanontany azy; dia nosoratan''ilay zatovo ny anaran''ireo andrianan''i Sokota sy ny loholona tao, ka fito amby fito-polo lahy izy.'
mg1865::mg_7::8::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Gideona dia nankany amin''ny mponina tao Sokota ka nanao hoe: Indreo Zebaha sy Zalmona, izay efa nandatsanareo ahy hoe: Moa efa voahazon''ny tananao ankehitriny va ny tanan''i Zebaha sy Zalmona, no homenay mofo ny olonao efa reraka?'
mg1865::mg_7::8::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naka ny loholona tao an-tanàna izy ary tsilo avy tany an''efitra sy sampivato, ka ireny no namaizany ny mponina tao Sokota.'
mg1865::mg_7::8::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nandrava ny tilikambo tao Penoela koa izy ka namono ny lehilahy tao an-tanàna.'
mg1865::mg_7::8::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy tamin''i Zebaha sy Zalmona: Lehilahy toy inona ange izay novonoinareo tany Tabara? Ary hoy izy roa lahy: Tahaka anao ihany izy. Nitarehin-janak''andriana avokoa izy rehetra.'
mg1865::mg_7::8::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Rahalahiko, zanaky ny reniko ireo. Raha velona koa Jehovah, dia tsy mba hovonoiko ianareo, raha novelominareo ireo.'
mg1865::mg_7::8::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy tamin''i Jatera lahimatoany: Mitsangàna, ka vonoy izy roa lahy. Fa ilay zatovo tsy nanatsoaka ny sabany, fa natahotra, satria mbola tanora fanahy izy.'
mg1865::mg_7::8::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Zebaha sy Zalmona: Aoka ianao no hitsangana hamely anay; fa araka ny toetry ny olona ihany ny heriny. Dia nitsangana Gideona ka namono an''i Zebaha sy Zalmona ary naka ny ravaka sarim-bolan-tsinana, izay teo amin''ny vozon''ny ramevany.'
mg1865::mg_7::8::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny lehilahy amin''ny Isiraely tamin''i Gideona: Manapaha anay ianao sy ny zanakao ary ny zafinao; fa efa namonjy anay tamin''ny tanan''ny Midiana ianao.'
mg1865::mg_7::8::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Gideona taminy: Tsy hanapaka anareo aho, ary tsy hanapaka anareo koa ny zanako; Jehovah ihany no hanapaka anareo.'
mg1865::mg_7::8::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy koa Gideona taminy: Zavatra iray loha monja no hany mba angatahiko aminareo; aoka samy hanome ahy ny kavina izay avy amin''ny babony avy ianareo (fa nanana kavim-bolamena ireny, satria Isimaelita).'
mg1865::mg_7::8::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy kosa ny olona: Eny, fa homenay tokoa izany. Dia namelatra lamba ny olona, ka samy nanipy ny kavina izay avy tamin''ny babony teo.'
mg1865::mg_7::8::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny lanjan''ny kavim-bolamena nangatahiny dia sekely volamena fiton-jato amby arivo, afa-tsy ny ravaka sarim-bolan-tsinana sy ny kavina voavola sy ny lamba volomparasy, izay teny amin''ireo mpanjakan''ny Midiana, ary ny rojo, izay teny amin''ny vozon''ny ramevany.'
mg1865::mg_7::8::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nataon''i Gideona efoda ireo, ka nataony tao an-tanànany, dia tao Ofra; ary ny Isiraely rehetra nankany nijangajanga nanaraka izany efoda izany; ary tonga fandrika tamin''i Gideona sy ny ankohonany izany.'
mg1865::mg_7::8::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia resy teo anoloan''ny Zanak''Isiraely ny Midiana ka tsy nahatraka ny lohany intsony. Dia nandry efa-polo taona ny tany tamin''ny andron''i Gideona.'
mg1865::mg_7::8::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha Jerobala, zanak''i Joasy, ka nitoetra tao an-tranony.'
mg1865::mg_7::8::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Gideona nanan-janaka fito-polo lahy izay naterany: fa maro vady izy.'
mg1865::mg_7::8::31:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny vaditsindranony, izay tany Sekema, dia niteraka zazalahy taminy koa, ka ny anarany nataony hoe Abimeleka.'
mg1865::mg_7::8::32:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia maty Gideona. zanak''i Joasy, rehefa tratrantitra tsara, ka nalevina tao amin''ny fasan''i Joasy rainy tao Ofran''ny Abiezrita izy.'
mg1865::mg_7::8::33:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa maty Gideona, dia nijangajanga nanaraka ireo Bala indray ny Zanak''Isiraely ka nanao an''i Bala-berita ho andriamaniny.'
mg1865::mg_7::8::34:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Zanak''Isiraely tsy nahatsiaro an''i Jehovah Andriamaniny, Izay efa namonjy azy tamin''ny tanan''ny fahavalony rehetra nanodidina,'
mg1865::mg_7::8::35:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 8
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'sady tsy nanao soa tamin''ny taranak''i Jerobala (na Gideona), araka izay soa rehetra nataon''i Gideona tamin''ny Isiraely, izy.'
mg1865::mg_7::9::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny ratsy nataon''i Abimeleka, sy ny nanjo azy'
  verse_text: 'Ary Abimeleka, zanak''i Jerobala, dia nandeha nankany Sekema tany amin''ny anadahin-dreniny ka niresaka taminy sy tamin''izay rehetra isan''ny fianakavian-dreniny nanao hoe:'
mg1865::mg_7::9::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mba mitenena ianareo eo anatrehan''ny mponina rehetra eto Sekema hoe: Iza no tsara ho anareo: ny hiarahan''izy fito-polo lahy zanak''i Jerobala manjaka aminareo va, sa ny hanjakan''ny lehilahy iray? Koa tsarovy fa taolanareo sy nofonareo aho.'
mg1865::mg_7::9::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anadahin-dreniny nilaza azy teo anatrehan''ny mponina rehetra tao Sekema ka nanao izany teny rehetra izany; koa ny fon''ireo dia ta-hanaraka an''i Abimeleka, fa hoy izy: Rahalahintsika izy.'
mg1865::mg_7::9::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nomeny sekely volafotsy fito-polo avy tao an-tranon''i Bala-berita izy, ary nanambazan''i Abimeleka olom-poana sy marivo salosana izany, ka dia nanaraka azy ireo.'
mg1865::mg_7::9::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nankany an-tranon-drainy tany Ofra izy ka namono ny rahalahiny fito-polo lahy, zanak''i Jerobala, teo ambonin''ny vato iray; ary Jotama, faralahin''i Jerobala, no sisa velona. satria niery izy.'
mg1865::mg_7::9::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivory ny mponina rehetra tao Sekema sy ny olona rehetra tao Milo* ka nandeha nampanjaka an''i Abimeleka teo anilan''ny hazo terebinta, akaikin''ny tsangambato** any Sekema. [*Hebreo: fiarovana] [**Na: rovan''ny miaramila]'
mg1865::mg_7::9::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy nilaza izany tamin''i Jotama, dia nandeha izy ka nitsangana teo an-tampon''ny tendrombohitra Gerizima, ary nanandratra ny feony ka niantso hoe: Mihainoa, ahy ianareo mponina ao Sekema mba hihainoan''Andriamanitra anareo kosa.'
mg1865::mg_7::9::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Niainga, hono, ny hazo hanosotra mpanjaka hanjaka aminy; ka hoy izy tamin''ny oliva: Manjaka aminay ianao.'
mg1865::mg_7::9::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy ny oliva taminy: Ho foiko va ny diloiloko, izay ankalazan''ireny andriamanitra sy ny olona ahy, ka handeha hitsingevingevina ery ambony hazo aho?'
mg1865::mg_7::9::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny hazo tamin''ny aviavy*: Avia ianao ka manjakà aminay. [*aviavimbazaha]'
mg1865::mg_7::9::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny aviavy* taminy: Ho foiko va ny fahamamiako sy ny vokatro tsara, ka handeha hitsingevingevina ery ambony hazo aho? [*aviavimbazaha]'
mg1865::mg_7::9::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny hazo tamin''ny voaloboka: Avia ianao, ka manjakà aminay.'
mg1865::mg_7::9::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy ny voaloboka taminy: Ho foiko va ny ranoko, izay mahafaly an''Andriamanitra sy ny olona, ka handeha hitsingevingevina ery ambony hazo aho?'
mg1865::mg_7::9::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny hazo rehetra tamin''ny tsilo: Avia ianao, ka manjakà aminay.'
mg1865::mg_7::9::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy ny tsilo tamin''ny hazo: Raha hohosoranareo ho mpanjakanareo tokoa ary aho, dia avia ianareo ka mialofa ato amin''ny alokaloko; fa raha tsy izany, aoka hisy afo hivoaka avy amin''ny tsilo ka handevona ny sederan''i Libanona.'
mg1865::mg_7::9::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny, raha marina sy mahitsy ny nataonareo tamin''ny nampanjakanareo an''i Abimeleka, ary raha soa no nataonareo tamin''i Jerobala sy ny taranany, ka novalianareo araka izay nataon''ny tanany izy'
mg1865::mg_7::9::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: '(fa ny raiko niady ho anareo sady nanao ny ainy tsy ho zavatra ka namonjy anareo tamin''ny tanan''ny Midiana;'
mg1865::mg_7::9::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'nefa ianareo kosa niodina tamin''ny taranaky ny raiko androany ka namono ny zanany fito-polo lahy teo ambonin''ny vato iray, ary Abimeleka, zanaky ny ankizivaviny, no nampanjakainareo tamin''ny mponina ao Sekema, satria rahalahinareo izy),'
mg1865::mg_7::9::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'koa raha marina sy mahitsy ny nataonareo androany tamin''i Jerobala sy ny zanany, dia mifalia amin''i Abimeleka ianareo, ary aoka izy kosa hifaly aminareo.'
mg1865::mg_7::9::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa raha tsy izany kosa, dia aoka hisy afo hivoaka avy amin''i Abimeleka ka handevona ny mponina ao Sekema sy ny olona ao Milo*; ary aoka koa hisy afo hivoaka avy amin''ny mponina ao Sekema sy ny olona ao Milo ka handevona an''i Abimeleka. [*Hebreo: fiarovana]'
mg1865::mg_7::9::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia riatra nandositra Jotama ka nankany Bera ary nitoetra teo mba hiery an''i Abimeleka rahalahiny.'
mg1865::mg_7::9::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nanapaka telo taona tamin''ny Isiraely Abimeleka,'
mg1865::mg_7::9::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Andriamanitra dia naniraka fanahy ratsy tamin''i Abimeleka sy ny mponina tao Sekema; ary ny mponina tao Sekema dia nivadika nahafoy an''i Abimeleka,'
mg1865::mg_7::9::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'mba hitsingerenan''ny loza natao tamin''ny namonoana* ny zanak''i Jerobala fito-polo lahy ka hanody an''i Abimeleka rahalahiny izay namono azy, sy ny mponina tao Sekema, izay nampahery ny tanany hamono ny rahalahiny. [*Hebreo: ran'']'
mg1865::mg_7::9::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanaovan''ny mponina tao Sekema otrika tany an-tampon-tendrombohitra izy, dia nobaboin''ny otrika izay rehetra nandalo tamin''izany lalana izany; ary nolazaina tamin''i Abimeleka izany.'
mg1865::mg_7::9::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia tonga tao Gala, zanak''i Ebeda, sy ny rahalahiny ka nankany Sekema, ary ny mponina tao Sekema natoky azy.'
mg1865::mg_7::9::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka ho any an-tsaha izy ka nioty ny voalobony ary nanosihosy azy, dia nanao fanati-piderana ka niditra tao an-tranon''ny andriamaniny izy, dia nihinana sy nisotro ary nanozona an''i Abimeleka.'
mg1865::mg_7::9::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Gala, zanak''i Ebeda: Iza moa Abimeleka, ary iza moa Sekema, no hotompointsika? Tsy zanak''i Jerobala va izy? ary tsy Zebola va no lefiny? Manompoa ny taranak''i Hamora, rain''i Sekema; fa nahoana no hanompo io isika?'
mg1865::mg_7::9::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary enga anie ka ho eo ambanin''ny tanako ireto olona ireto! dia hesoriko Abimeleka. Dia hoy izy tamin''i Abimeleka: Hamaroy ny miaramilanao ka mivoaha.'
mg1865::mg_7::9::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa ren''i Zebola, komandin''ny tanàna, ny tenin''i Gala, zanak''i Ebeda, dia nirehitra ny fahatezerany.'
mg1865::mg_7::9::31:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naniraka olona mangingina tany amin''i Abimeleka izy hanao hoe: Indro, Gala, zanak''i Ebeda, sy ny rahalahiny dia tonga ato Sekema; ary, indro, mandrendrika ny ato an-tanàna hiodina aminao izy.'
mg1865::mg_7::9::32:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny, miaingà alina ianao sy ny vahoaka eo aminao, ka manotreha any an-tsaha.'
mg1865::mg_7::9::33:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha maraina, raha vao miposaka ny masoandro, dia mifohaza maraina koa ianao, ka miroata hamely ny tanàna; ary, indro, raha mivoaka hiady aminao izy sy ny vahoaka eo aminy, dia ataovy aminy izay zakan''ny tananao.'
mg1865::mg_7::9::34:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niainga alina Abimeleka sy ny vahoaka rehetra teo aminy ka nanao otrika efa-toko tandrifin''i Sekema,'
mg1865::mg_7::9::35:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka Gala, zanak''i Ebeda, ka nijanona teo anoloan''ny vavahadin''ny tanàna; dia niroatra avy tao ampanotrehana Abimeleka sy ny vahoaka teo aminy.'
mg1865::mg_7::9::36:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''i Gala ny olona, dia hoy izy tamin''i Zebola: Indreo, misy olona midina avy eny an-tampon''ny tendrombohitra. Fa hoy Zebola taminy: Ny aloky ny tendrombohitra no hitanao ka toa olona.'
mg1865::mg_7::9::37:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niteny indray Gala ka nanao hoe: Indreo, misy olona eo amin''ny havoana, ary, indreo misy, antokony hafa mandeha amin''ny lalana eo amin''ny hazo terebinta Meonenima*. [*Hebreo: mpanandro]'
mg1865::mg_7::9::38:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Zebola taminy: Aiza ny vavanao izay niteny hoe: Iza moa Abimeleka, no hotompointsika? Tsy ireo va no olona izay nohamavoinao? Mivoaha ankehitriny ka miadia aminy.'
mg1865::mg_7::9::39:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 39
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka teo anoloan''ny mponina tao Sekema Gala ka niady tamin''i Abimeleka.'
mg1865::mg_7::9::40:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 40
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanenjika azy Abimeleka, ary nandositra teo anoloany izy, ka maro ny faty niampatrampatra hatreny anoloan''ny vavahady aza.'
mg1865::mg_7::9::41:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 41
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abimeleka nonina tany Aroma; ary Zebola nandroaka an''i Gala sy ny rahalahiny mba tsy honina any Sekema intsony.'
mg1865::mg_7::9::42:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 42
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony ampitson''iny dia nivoaka ho  any an-tsaha ny olona; ary nolazaina tamin''i Abimeleka izany,'
mg1865::mg_7::9::43:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 43
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naka ny vahoaka izy ka nizara azy ho telo toko ary nanotrika tany an-tsaha; dia nijery izy, ka, indreo, ny olona nivoaka avy tao an-tanàna; dia nitsangana hiady aminy izy ka namely azy.'
mg1865::mg_7::9::44:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 44
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abimeleka sy ny antokony izay teo aminy dia niroatra ka nitsangana teo anoloan''ny vavahadin-tanàna; ary ny roa toko kosa niroatra namely ny vahoaka rehetra tany an-tsaha ka namono azy.'
mg1865::mg_7::9::45:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 45
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abimeleka namely ny tanàna mandritra izany andro izany, dia nahafaka ny tanàna ka namono ny olona tao; ary noravany ny tanàna sady nofafazany sira.'
mg1865::mg_7::9::46:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 46
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony nandre izany ny olona rehetra tao amin''ny tilikambo tao Sekema, dia niditra tao amin''ny efi-trano fierena tao an-tranon''i Berita andriamaniny izy.'
mg1865::mg_7::9::47:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 47
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nolazaina tamin''i Abimeleka fa tafangona tao amin''ny tilikambo tao Sekema ny olona rehetra.'
mg1865::mg_7::9::48:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 48
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abimeleka sy ny vahoaka teo aminy dia niakatra tany an-tendrombohitra Zalmona; ary Abimeleka nitondra famaky teny an-tanany, dia nikapa sampan-kazo, ka nobetainy izany, dia nolanjainy teny an-tsorony, ary hoy izy tamin''ny vahoaka teo aminy: Izay hitanareo ataoko, dia mba manaova faingana toy izany koa ianareo.'
mg1865::mg_7::9::49:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 49
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa samy nikapa sampan-kazo avy ny vahoaka rehetra ka nanaraka an''i Abimeleka, dia nametraka izany teo an-trano fiarovana ka nandoro azy tamin''ny afo, raha mbola tao ny olona, ka maty koa ny olona rehetra tao amin''ny tilikambo tao Sekema, na lehilahy na vehivavy, tokony ho arivo no isany.'
mg1865::mg_7::9::50:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 50
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha Abimeleka nankany Tebeza ary nitoby tandrifin''i Tebeza ka nahafaka azy.'
mg1865::mg_7::9::51:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 51
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa nisy tilikambo mafy tao anatin''ny tanàna, ka nandositra tao ny lehilahy rehetra sy ny vehivavy ary izay rehetra tao an-tanàna ka nihidy tao, dia niakatra teo an-tampon''ny tilikambo izy.'
mg1865::mg_7::9::52:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 52
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abimeleka nankany amin''ny tilikambo ka namely azy, dia nanatona ny varavaran''ny tilikambo izy handoro azy amin''ny afo.'
mg1865::mg_7::9::53:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 53
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa nisy vehivavy anankiray, nanjera vato* fikosoham-bary tamin''ny lohan''i Abimeleka ka nahavaky ny karan-dohany. [*Hebreo: vato ambony]'
mg1865::mg_7::9::54:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 54
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nantsoin''i Abimeleka faingana ny zatovo, mpitondra ny fiadiany, ka hoy izy taminy: Tsoahy ny sabatrao, ka vonoy aho, mba tsy hanaovan''ny olona ahy hoe: Vehivavy no nahafaty azy. Dia namely azy miboroaka ilay zatovo, ka maty izy.'
mg1865::mg_7::9::55:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 55
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''ny lehilahy amin''ny Isiraely fa maty Abimeleka, dia samy lasa nandeha ho any amin''ny fonenany avy izy.'
mg1865::mg_7::9::56:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 56
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izany no namalian''Andriamanitra ny ratsy nataon''i Abimeleka, izay efa nataony tamin''ny rainy tamin''ny namonoany ny rahalahiny fito-polo lahy.'
mg1865::mg_7::9::57:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 9
  verse_number: 57
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny ratsy rehetra nataon''ny mponina tao Sekema dia natsingerin''Andriamanitra tamin''ny lohany avokoa, ka dia nihatra taminy ilay fanozonana nataon''i Jotama, zanak''i Jerobala.'
mg1865::mg_7::10::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny tantaran''i Tola sy Jaïra'
  verse_text: 'Ary taorian''i Abimeleka dia nitsangana hamonjy ny Isiraely Tola, zanak''i Dodo, lehilahy avy tamin''ny Isakara; ary mponina tao Samira any amin''ny tany havoan''i Efraima izy.'
mg1865::mg_7::10::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nitsara ny Isiraely telo amby roa-polo taona izy, dia maty ka nalevina tao Samira.'
mg1865::mg_7::10::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nitsangana nandimby azy Jaïra Gileadita ka nitsara ny Isiraely roa amby roa-polo taona.'
mg1865::mg_7::10::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanana zanakalahy telo-polo izay nitaingina zana-boriky telo-polo izy, ary izy ireo nanana tanàna telo-polo any amin''ny tany Gileada; ary atao hoe Havota-jaïra* mandraka androany ireo. [*Havota-jaïra = Tanàna madinika an''i Jaïra]'
mg1865::mg_7::10::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia maty Jaïra ka nalevina tany Kamona.'
mg1865::mg_7::10::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 6
  verse_date_revised: null
  verse_title: 'Ny nihemoran''ny Isiraely indray, sy ny namalian''Andriamanitra azy'
  verse_text: 'Ary ny Zanak''Isiraely dia nanao izay ratsy eo imason''i Jehovah indray ka nanompo ireo Bala sy Astarta sy ny andriamanitr''i Syria sy ny andriamanitr''i Sidona sy ny andriamanitr''i Moaba sy ny andriamanitry ny taranak''i Amona ary ny andriamanitry ny Filistina, dia nahafoy an''i Jehovah izy ka tsy nanompo Azy.'
mg1865::mg_7::10::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nirehitra tamin''ny Isiraely ny fahatezeran''i Jehovah, ka nivarotra azy ho eo an-tanan''ny Filistina sy ho eo an-tanan''ny taranak''i Amona Izy.'
mg1865::mg_7::10::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nampahory sy nanorotoro ny Zanak''Isiraely ireo tamin''izany taona izany: valo ambin''ny folo taona no nampahoriany ny Zanak''Isiraely rehetra, izay tany an-dafin''i Jordana, tany amin''ny tanin''ny Amorita any Gileada.'
mg1865::mg_7::10::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nita an''i Jordana ny taranak''i Amona mba hiady koa amin''ny Joda sy ny Benjamina ary ny taranak''i Efraima; ka dia nahantra indrindra ny Isiraely.'
mg1865::mg_7::10::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitaraina tamin''i Jehovah ny Zanak''Isiraely ka nanao hoe: Efa nanota taminao izahay, satria efa nahafoy an''Andriamanitray ka nanompo ireo Bala.'
mg1865::mg_7::10::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Jehovah tamin''ny Zanak''Isiraely: Moa tsy efa namonjy anareo tamin''ny tanan''ny Egyptiana sy ny Amorita sy ny taranak''i Amona ary ny Filistina va Aho?'
mg1865::mg_7::10::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nampahory anareo koa ny Sidoniana sy ny Amalekita ary ny Maonita, ka nitaraina tamiko ianareo, dia novonjeko tamin''ny tanany.'
mg1865::mg_7::10::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa ianareo nahafoy Ahy ka nanompo andriamani-kafa; koa izany kosa no tsy hamonjeko anareo intsony.'
mg1865::mg_7::10::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Mandehana, ka mitaraina amin''ireo andriamanitra efa nofidinareo; aoka ireo no hamonjy anareo amin''ny andron''ny fahantranareo.'
mg1865::mg_7::10::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny Zanak''Isiraely tamin''i Jehovah: Efa nanota izahay; ataovy aminay izay rehetra sitrakao; kanefa mba vonjeo ihany izahay anio.'
mg1865::mg_7::10::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanary ireo andriamani-kafa tao aminy izy ka nanompo an''i Jehovah; dia tsy nahatsindry ny fanahiny intsony Jehovah noho ny fahantran''ny Isiraely.'
mg1865::mg_7::10::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 17
  verse_date_revised: null
  verse_title: 'Ny tantaran''i Jefta, sy ny nandreseny ny Amonita'
  verse_text: 'Dia nivory ny taranak''i Amona ka nitoby tany Gileada. Ary nivory kosa ny Zanak''Isiraely ka nitoby tany Mizpa.'
mg1865::mg_7::10::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 10
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nifampiera ny olona, dia ireo andrianan''i Gileada, hoe: Iza no lehilahy handeha voalohany hiady amin''ny taranak''i Amona? dia ho lohany amin''ny mponina rehetra any Gileada izy.'
mg1865::mg_7::11::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jefta Gileadita dia lehilahy mahery sy zanaky ny vehivavy janga; ary Gileada no rainy niteraka azy.'
mg1865::mg_7::11::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny vadin''i Gileada dia niteraka zazalahy maro taminy; ary nony efa lehibe ireo zana-badiny ireo, dia nandroaka an''i Jefta ka nanao taminy hoe: Tsy handova eto amin''ny taranaky ny rainay ianao, fa zanaky ny vehivavy hafa.'
mg1865::mg_7::11::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jefta nandositra ny rahalahiny ka nonina tany amin''ny tany Toba; dia nisy olom-poana nivory teo amin''i Jefta ka niaraka taminy.'
mg1865::mg_7::11::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony ela, dia nanafika ny Zanak''Isiraely ny taranak''i Amona.'
mg1865::mg_7::11::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nanafika ny Isiraely ny taranak''i Amona, dia nandeha ny loholon''i Gileada haka an''i Jefta hiala any amin''ny tany Toba.'
mg1865::mg_7::11::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy ireo taminy: Avia ho mpitarika anay ianao, hiadiantsika amin''ny taranak''i Amona.'
mg1865::mg_7::11::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Jefta tamin''ny loholon''i Gileada: Tsy efa nankahala ahy va ianareo ka nandroaka ahy hiala tao an-tranon''ny raiko? Koa nahoana no mankaty amiko indray ianareo ankehitriny, nony azom-pahoriana?'
mg1865::mg_7::11::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny loholon''i Gileada tamin''i Jefta: Izany no iverenanay aty aminao ankehitriny, mba handehananao miaraka aminay, sy hiadianao amin''ny taranak''i Amona, ka dia ho lohany aminay mponina rehetra any Gileada ianao.'
mg1865::mg_7::11::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Jefta tamin''ny loholon''i Gileada: Raha ho entinareo mody indray aho mba hiady amin''ny taranak''i Amona, ka hatolotr''i Jehovah eo anoloako ireny, dia izaho hoe no ho lohany aminareo?'
mg1865::mg_7::11::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny loholon''i Gileada tamin''i Jefta: Jehovah no ho vavolombelona amintsika, raha tsy hataonay araka izany teninao izany.'
mg1865::mg_7::11::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha Jefta niaraka tamin''ny loholon''i Gileada, ka dia nasandratry ny vahoaka ho lohany sy ho mpitarika azy izy; ary Jefta nilaza ny teniny rehetra teo anatrehan''i Jehovah tao Mizpa.'
mg1865::mg_7::11::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naniraka olona Jefta nankamin''ny mpanjakan''ny taranak''i Amona hanao hoe: Moa mifaninona akory izaho sy ianao, no tonga aty amiko hiady amin''ny taniko ianao?'
mg1865::mg_7::11::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny mpanjakan''ny taranak''i Amona tamin''ny irak''i Jefta: Satria nalain''ny Isiraely ny taniko hatrany Arnona ka hatrany Jaboka ary hatrany Jordana, fony niakatra avy tany Egypta izy; koa avereno amin''ny fihavanana ary izany ankehitriny.'
mg1865::mg_7::11::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jefta naniraka olona indray nankany amin''ny mpanjakan''ny taranak''i Amona'
mg1865::mg_7::11::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka nanao taminy hoe: Izao no lazain''i Jefta: Ny Isiraely tsy naka ny tanin''i Moaba na ny tanin''ny taranak''i Amona.'
mg1865::mg_7::11::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa fony niakatra avy tany Egypta ny Isiraely, dia nandeha nitety ny efitra hatramin''ny Ranomasina Mena izy ka tonga tany Kadesy.'
mg1865::mg_7::11::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naniraka olona ny Isiraely nankany amin''ny mpanjakan''i Edoma ka nanao hoe: Aoka mba handeha hamaky ny taninao aho; fa tsy nety nihaino izany ny mpanjakan''i Edoma. Ary naniraka tany amin''ny mpanjakan''i Moaba koa izy; fa tsy nety koa izy; dia nitoetra tany Kadesy ny Isiraely.'
mg1865::mg_7::11::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha nitety ny efitra izy ka nanodidina ny tany Edoma sy ny tany Moaba, dia tonga teo atsinanan''i Moaba, ka nitoby teo an-dafin''i Arnona, fa tsy niditra teo anatin''ny faritanin''i Moaba; fa Arnona no faritanin''i Moaba.'
mg1865::mg_7::11::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Isiraely dia naniraka olona tany amin''i Sihona, mpanjakan''ny Amorita, izay mpanjakan''i Hesbona; ary hoy ny Isiraely taminy: Aoka mba handeha hamaky ny taninao izahay hankany amin''ny fonenanay.'
mg1865::mg_7::11::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa Sihona tsy natoky ny Isiraely hamaky ny faritaniny, fa namory ny vahoakany rehetra izy, dia nitoby tany Jahaza ka niady tamin''ny Isiraely.'
mg1865::mg_7::11::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah, Andriamanitry ny Isiraely, nanolotra an''i Sihona sy ny vahoakany rehetra teo an-tanan''ny Isiraely, ka namely azy ireo; dia azon''ny Isiraely ny tanin''ny Amorita rehetra, mponina tany amin''izany tany izany.'
mg1865::mg_7::11::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nahazo ny tanin''ny Amorita rehetra izy hatrany Arnona, ka hatrany Jaboka ary hatramin''ny efitra ka hatrany Jordana.'
mg1865::mg_7::11::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny, Jehovah, Andriamanitry ny Isiraely, efa nandroaka ny Amorita teo anoloan''ny Isiraely olony: ary ianao kosa va te haka ny tany?'
mg1865::mg_7::11::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Moa tsy hotananao izay tany omen''i Kemosy andriamanitrao anao va? aty izay tany rehetra omen''i Jehovah Andriamanitray anay dia mba hotananay kosa.'
mg1865::mg_7::11::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Moa tsara noho Balaka, zanak''i Zipora, mpanjakan''i Moaba, va ianao? Nety nanohitra ny Isiraely na niady taminy akory va izy?'
mg1865::mg_7::11::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha ny Isiraely nitoetra telon-jato taona tany Hesboala sy ny zana-bohiny ary tany Aroera sy ny zana-bohiny ary tany amin''ny tanàna rehetra eny amoron''i Arnona, nahoana no tsy nalainareo ny tany tamin''izany andro izany?'
mg1865::mg_7::11::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izaho tsy nanota taminao, fa ianao no manisy ratsy ahy, fa miady amiko;'
mg1865::mg_7::11::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa tsy nohenoin''ny mpanjakan''ny taranak''i Amona ny tenin''i Jefta, izay nampitondrainy tany aminy.'
mg1865::mg_7::11::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tonga tao amin''i Jefta ny Fanahin''i Jehovah, dia nandeha nitety an''i Gileada sy Manase izy; ka dia nitety an''i Mizpa any Gileada koa izy ka niala tany Mizpa any Gileada, dia nandroso nankany amin''ny taranak''i Amona.'
mg1865::mg_7::11::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jefta nivoady tamin''i Jehovah ka nanao hoe: Raha hatolotrao eo an-tanako tokoa ny taranak''i Amona,'
mg1865::mg_7::11::31:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia ho an''i Jehovah Izay mivoaka amin''ny varavaran''ny tranoko hitsena ahy, rehefa miverina soa aman-tsara avy any amin''ny taranak''i Amona aho, ary hateriko ho fanatitra dorana izany.'
mg1865::mg_7::11::32:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha Jefta nankany amin''ny taranak''i Amona hiady aminy: ary natolotr''i Jehovah teo an-tanany ireo.'
mg1865::mg_7::11::33:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namely azy izy hatrany Aroera ka hatrany akaikin''i Minita sy hatrany Abela-keramima, dia tanàna roa-polo, ka be dia be no maty. Dia resy teo anoloan''ny Zanak''Isiraely ny taranak''i Amona.'
mg1865::mg_7::11::34:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jefta tonga tany Mizpa ho any an-tranony, ary, indro, nivoaka ny zananivavy nitondra ampongatapaka sy mpandihy hitsena azy; ary vavy tokany io, fa tsy nanana zanakalahy na zanakavavy afa-tsy io izy.'
mg1865::mg_7::11::35:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa rehefa nahita azy Jefta, dia nandriatra ny fitafiany ka nanao hoe: Indrisy, ry zanako-vavy! Efa nampitanondrika ahy indrindra ianao, ary ianao no tonga nampidi-doza tamiko; fa izaho efa niloa-bava tamin''i Jehovah, ka tsy azoko afody intsony.'
mg1865::mg_7::11::36:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy ny zananivavy taminy: Ry dada o, raha niloa-bava tamin''i Jehovah ary ianao, dia ataovy amiko araka izay naloaky ny vavanao, satria Jehovah efa namaly ny taranak''i Amona fahavalonao ho anao.'
mg1865::mg_7::11::37:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy koa izy tamin''ny rainy: Aoka izao no hatao amiko: aza maninona ahy aloha hatramin''ny roa volana mba handehandehanako hankeny amin''ny havoana hitomaniako, izaho sy ny namako, noho izaho mbola tsy nanambady akory.'
mg1865::mg_7::11::38:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy kosa rainy: Mandehana ary. Dia nampandeha azy roa volana izy; ary dia nandeha razazavavy sy ny namany ka nitomany teny amin''ny havoana noho izy mbola tsy nanam-bady akory.'
mg1865::mg_7::11::39:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 39
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tapitra ny roa volana, dia niverina tany amin''ny rainy izy; ary nataony taminy araka ny voadiny izay nataony; ary tsy mbola nahalala lahy izy. Ary tonga fanao tamin''ny Isiraely'
mg1865::mg_7::11::40:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 11
  verse_number: 40
  verse_date_revised: null
  verse_title: null
  verse_text: 'ny fandehanan''ny zazavavin''ny Isiraely isan-taona hankalaza* ny zanakavavin''i Jefta Gileadita hefarana isan-taona. [*Na: hitomany]'
mg1865::mg_7::12::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny hatezeran''ny Efraima tamin''i Jefta, sy ny niadian''i Jefta taminy'
  verse_text: 'Ary nivory ny lehilahy amin''ny Efraima, dia nandeha nianavaratra* ka nanao tamin''i Jefta hoe: Nahoana no nandeha niady tamin''ny taranak''i Amona ianao ka tsy mba niantso anay hiaraka aminao? Hodoranay amin''ny afo ny tranonao sy ianao. [*Na: nankany Zafona]'
mg1865::mg_7::12::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Jefta taminy: Izaho sy ny oloko efa nanana ady mafy tamin''ny taranak''i Amona; ary niantso anareo aho, fa tsy namonjy ahy tamin''ny tanany ianareo.'
mg1865::mg_7::12::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitako fa tsy namonjy ahy ianareo, dia nanao ny aiko tsy ho zavatra aho ka nandeha niady tamin''ny taranak''i Amona, ary natolotr''i Jehovah teo an-tanako izy, koa nahoana ianareo no miakatra aty amiko anio hila ady amiko?'
mg1865::mg_7::12::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jefta dia namory ny lehilahy rehetra amin''ny Gileada ka niady tamin''ny Efraima; ary dia namely ny Efraima ny lehilahy amin''ny Gileada, satria hoy ireo: Ianareo Gileadita dia mpandositra avy amin''ny Efraima ao amin''ny taranak''i Efraima sy Manase.'
mg1865::mg_7::12::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia novonjen''ny Gileada ny fitàna any Jordana mankany amin''ny Efraima; ary nony niteny ny mpandositra avy amin''ny Efraima nanao hoe: Aoka mba hita aho; dia hoy ny lehilahy amin''ny Gileada taminy: Efraimita va ianao? ary raha hoy izy: Tsia,'
mg1865::mg_7::12::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'dia hoy izy ireo taminy: Tonony ary ny hoe Shiboleta; fa hoy kosa izy: Siboleta, satria tsy nahay nanonona izany marina izy. Dia nisambotra azy ireo ka namono azy teo amin''ny fitàna ao Jordana; ary nahafatesana roa arivo sy efatra alina ny Efraimita tamin''izany andro izany.'
mg1865::mg_7::12::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitsara ny Isiraely enin-taona Jefta. Ary maty Jefta Gileadita ka nalevina tao amin''ny tanàna anankiray any Gileada.'
mg1865::mg_7::12::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 8
  verse_date_revised: null
  verse_title: 'Ny tantaran''Ibzana sy Elona ary Abdona'
  verse_text: 'Ary Ibzana, avy any Betlehema, no nitsara ny Isiraely nandimby an''i Jefta.'
mg1865::mg_7::12::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izy nanana zanakalahy telo-polo sy zanakavavy telo-polo, izay nampanambadiny tany ivelany, ary zazavavy telo-polo kosa no nampidiriny ho an''ny zananilahy. Ary nitsara ny Isiraely fito taona izy.'
mg1865::mg_7::12::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia maty Ibzana ka nalevina tany Betlehema.'
mg1865::mg_7::12::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Elona Zebolonita no nitsara ny Isiraely nandimby azy; ary nitsara ny Isiraely folo taona izy.'
mg1865::mg_7::12::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia maty Elona Zebolonita ka nalevina tany Aialona ao amin''ny tanin''ny Zebolona.'
mg1865::mg_7::12::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Abdona, zanak''i Elela, avy any Piratona, no nitsara ny Isiraely nandimby azy.'
mg1865::mg_7::12::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanana zanakalahy efa-polo sy zafy telo-polo izay nitaingina zana-boriky fito-polo izy, ary nitsara ny Isiraely valo taona.'
mg1865::mg_7::12::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 12
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia maty Abdona, zanak''i Elela, avy any Piratona, ka nalevina tany Piratona, any amin''ny tanin''ny Efraima any amin''ny tany havoan''ny Amalekita.'
mg1865::mg_7::13::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nahaterahan''i Samsona'
  verse_text: 'Ary ny Zanak''Isiraely nanao izay ratsy eo imason''i Jehovah indray, ka dia natolotr''i Jehovah teo an-tanan''ny Filistina efa-polo taona izy.'
mg1865::mg_7::13::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy lehilahy avy tany Zora amin''ny fokon''ny Danita, Manoa no anarany; ary momba ny vadiny ka tsy niteraka.'
mg1865::mg_7::13::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Ilay Anjelin''i Jehovah niseho tamin-dravehivavy ka nanao taminy hoe: Indro, momba ianao ka tsy niteraka; nefa hanan''anaka ianao ka hiteraka zazalahy.'
mg1865::mg_7::13::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa mitandrema ianao ankehitriny, ka aza misotro divay na toaka, ary aza mihinana akory izay zava-padina.'
mg1865::mg_7::13::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa, indro, hanan''anaka ianao ka hiteraka zazalahy; ary tsy mba hokasihin-kareza ny lohany; fa ho Nazirita ho an''Andriamanitra hatrany an-kibo ny zaza; ary izy no hanomboka hamonjy ny Isiraely amin''ny tanan''ny Filistina.'
mg1865::mg_7::13::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha ravehivavy ka nilaza tamin''ny vadiny hoe: Nisy lehilahin''Andriamanitra tonga tamiko, ary nahatahotra indrindra ny fijery azy, tahaka ny fijery Ilay Anjelin''Andriamanitra, ka tsy nanontany Azy izay nihaviany aho, ary tsy nambarany ahy ny anarany.'
mg1865::mg_7::13::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy Izy tamiko: Indro, hanan''anaka ianao ka hiteraka zazalahy; koa ankehitriny aza misotro divay na toaka ianao, ary aza mihinana akory izay zava-padina; fa ho Nazirita ho an''Andriamanitra ny zaza hatrany an-kibo ka ambara-pahafatiny'
mg1865::mg_7::13::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Manoa nangataka tamin''i Jehovah ka nanao hoe: Ry Tompo o, aoka hankaty aminay indray ny lehilahin''Andriamanitra, ilay efa nirahinao, ka hampianatra anay ny hitondranay ny zaza izay ho teraka.'
mg1865::mg_7::13::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Andriamanitra nihaino ny feon''i Manoa, ka dia nankany amin-dravehivavy indray Ilay Anjelin''Andriamanitra, raha tany an-tsaha izy; fa Manoa vadiny tsy teo aminy.'
mg1865::mg_7::13::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nihazakazaka faingana ravehivavy ka nanambara tamin''ny vadiny hoe: Indro, niseho tamiko indray ny lehilahy izay tonga tamiko tamin''ilay indray andro.'
mg1865::mg_7::13::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitsangana Manoa ka nandeha nanaraka ny vadiny, dia nankany amin-dralehilahy ka nanao taminy hoe: Ianao moa ilay lehilahy niteny tamin-dravehivavy? Dia hoy Izy: Eny, Izaho no Izy.'
mg1865::mg_7::13::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Manoa: Raha tanteraka ilay teninao, ahoana ange no hitondranay ny zaza, ary inona no ho asany?'
mg1865::mg_7::13::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Ilay Anjelin''i Jehovah tamin''i Manoa: Izay rehetra efa nolazaiko tamin-dravehivavy dia aoka hotandremany avokoa.'
mg1865::mg_7::13::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Izay rehetra avy amin''ny voaloboka dia aza avela hohaniny, ary aza avela hisotro divay na toaka izy, na hihinana akory izay zava-padina; izay rehetra nandidiako azy dia aoka hotandremany avokoa.'
mg1865::mg_7::13::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Manoa tamin''Ilay Anjelin''i Jehovah: Aoka mba hotananay Ianao mandra-pamboatray zanak''osy ho Anao.'
mg1865::mg_7::13::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Ilay Anjelin''i Jehovah tamin''i Manoa: Na dia tananao aza Aho, tsy mba hihinana amin''ny haninao Aho tsy akory; fa raha hanatitra fanatitra dorana ianao, dia aoka Jehovah no hanateranao izany. Fa tsy fantatr''i Manoa ho Anjelin''i Jehovah Izy.'
mg1865::mg_7::13::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Manoa tamin''Ilay Anjelin''i Jehovah: Iza moa no anaranao, mba hanomezanay voninahitra Anao, rehefa tanteraka ny teninao?'
mg1865::mg_7::13::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Ilay Anjelin''i Jehovah taminy: Nahoana no manontany ny anarako ianao? Fa anarana mahagaga izany.'
mg1865::mg_7::13::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naka ny zanak''osy sy ny fanatitra hohanina Manoa ka nanatitra ireny teo ambonin''ny vatolampy ho an''i Jehovah; ary Ilay Anjely kosa nanao zava-mahagaga, raha mbola nijery teo Manoa mivady.'
mg1865::mg_7::13::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha niakatra ho amin''ny lanitra ny lelafo avy teo amin''ny alitara, dia niakatra teo anatin''ny lelafo avy teo amin''ny alitara Ilay Anjelin''i Jehovah. Ary nijery izany Manoa mivady, ka dia niankohoka tamin''ny tany.'
mg1865::mg_7::13::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tsy niseho tamin''i Manoa sy ny vadiny intsony Ilay Anjelin''i Jehovah; dia fantatr''i Manoa fa Anjelin''i Jehovah Izy.'
mg1865::mg_7::13::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Manoa tamin''ny vadiny: Ho faty tokoa isika, satria efa nahita an''Andriamanitra.'
mg1865::mg_7::13::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy ny vadiny taminy: Raha sitrak''i Jehovah ny hahafaty antsika, dia tsy ho nety nandray fanatitra dorana sy fanatitra hohanina tamin''ny tanantsika akory Izy, ary tsy ho nampahita antsika izany zavatra rehetra izany, ary tsy ho nampandre antsika izany zavatra izany ankehitriny.'
mg1865::mg_7::13::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niteraka zazalahy ravehivavy, ka ny anarany nataony hoe Samsona; dia nitombo ny zaza, ary Jehovah nitahy azy.'
mg1865::mg_7::13::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 13
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niantomboka nanindry azy indraindray ny Fanahin''i Jehovah tany Mahane-dana*, teo anelanelan''i Zora sy Estaola. [*Mahane-dana = Tobin''i Dana]'
mg1865::mg_7::14::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nanambadian''i Samsona ny vehivavy Filistina anankiray, sy ny namaliany ny Filistina'
  verse_text: 'Ary Samsona nidina nankany Timna ka nahita vehivavy tao avy amin''ny zanakavavin''ny Filistina.'
mg1865::mg_7::14::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niakatra izy, dia nilaza tamin-drainy sy reniny hoe: Efa nahita vehivavy tany Timna avy amin''ny zanakavavin''ny Filistina aho; koa alao ho vadiko izy ankehitriny.'
mg1865::mg_7::14::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy ny rainy sy ny reniny taminy: Moa tsy misy vehivavy va eto amin''ny zana-kavanao, na ato amin''ny fireneko rehetra, no dia mandeha maka vady any amin''ny Filistina tsy mifora ianao? Dia hoy Samsona tamin-drainy: Izy ihany no alao ho ahy, fa izy no mahafinaritra ahy.'
mg1865::mg_7::14::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa tsy fantatry ny rainy sy ny reniny fa avy tamin''i Jehovah izany, satria nitady izay hiadiany tamin''ny Filistina Izy*; fa tamin''izany andro izany ny Filistina no nanapaka ny Isiraely. [*Na: izy]'
mg1865::mg_7::14::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nidina Samsona sy ny rainy aman-dreniny nankany Timna. Ary nony tonga tao amin''ny tanim-boaloboka tany Timna izy, indro, nisy liona tanora nierona taminy.'
mg1865::mg_7::14::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nilatsaka tamin''i Samsona ny Fanahin''i Jehovah, ary ilay liona tanora dia nosamatsamahiny hoatra ny fanasamaka zanak''osy, nefa tsy nisy na inona na inona teny an-tanany; ary tsy nambarany tamin''ny rainy na tamin''ny reniny izay efa nataony.'
mg1865::mg_7::14::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nidina izy ka niresaka tamin-dravehivavy; ary nahafinaritra an''i Samsona izy.'
mg1865::mg_7::14::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka kelikely, dia niverina hampakatra azy Samsona ka nivily hizaha ny fatin''ilay liona; ary, indro, nisy reni-tantely nivangongo sy tantely tao amin''ilay fatin''ny liona.'
mg1865::mg_7::14::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nalain''i Samsona izany ka nentiny teny an-tanany, dia nihinana teny am-pandehanana izy; ary nankany amin''ny rainy aman-dreniny izy, dia nanome azy, ka nihinana koa izy mivady; nefa tsy nambarany taminy fa tao amin''ny fatin''ilay liona no nangalany ny tantely.'
mg1865::mg_7::14::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nidina ho any amin-dravehivavy ny rain''i Samsona; ary nanao fanasana teo Samsona, fa izany no fanaon''ny zatovo.'
mg1865::mg_7::14::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nahita azy izy mianakavy, dia nametraka namana telo-polo lahy hitoetra ao aminy.'
mg1865::mg_7::14::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Samsona tamin''ireo: Hanao fampanonona aminareo aho; koa raha lazainareo amiko ny heviny ao anatin''ny hafitoana fanasana ka fantatrareo, dia homeko lobaka telo-polo sy akanjo intelo-polo miova ianareo.'
mg1865::mg_7::14::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa raha tsy mahalaza amiko kosa ianareo, dia homenareo lobaka telo-polo sy akanjo intelo-polo miova aho. Dia hoy izy ireo: Ataovy ary ny fampanonona mba hohenoinay.'
mg1865::mg_7::14::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Samsona aminy: Avy tao amin''ny mpihinana no nivoahan''ny hanina; Ary avy tao amin''ny mahery no nivoahan''ny mamy. Dia tsy nahalaza ny fampanonona izy tao anatin''ny hateloana.'
mg1865::mg_7::14::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony tamin''ny andro fahafito*, dia hoy izy tamin''ny vadin''i Samsona: Taomy ny vadinao hilaza ny fampanonona aminay, fandrao hodoranay amin''ny afo ianao sy ny ankohonan-drainao; efa nanasa anay va ianareo ho entinareo mifafa izay anananay? Moa tsy izany va? [*Na: (fahefatra)]'
mg1865::mg_7::14::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny vadin''i Samsona dia nitomany teo anatrehany ka nanao hoe: Halanao aho, fa tsy tianao tsy akory; efa nanao fampanonona tamin''ny zanaky ny fireneko ianao, nefa tsy nolazainao tamiko ny heviny. Fa hoy izy taminy: Indro, na dia ny raiko sy ny reniko aza tsy nilazako azy, ka ianao va no hilazako?'
mg1865::mg_7::14::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitomany teo anatrehany tamin''ny hafitoana izay nisian''ny fanasana ravehivavy; ary nony tamin''ny andro fahafito dia nolazain''i Samsona taminy, satria nitorikisina taminy izy; ary izy kosa nilaza ny fampanonona tamin''ny zanaky ny fireneny.'
mg1865::mg_7::14::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony tamin''ny andro fahafito, raha tsy mbola maty ny masoandro, dia hoy ny lehilahy tao an-tanàna tamin''i Samsona: Inona no mamy noho ny tantely; Ary inona no mahery noho ny liona? Ary hoy kosa izy taminy: Raha tsy nampiasa ny ombivavikeliko ianareo. Dia tsy ho nahalala ny fampanonona nataoko.'
mg1865::mg_7::14::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nilatsaka tamin''i Samsona ny Fanahin''i Jehovah ka nidina nankany Askelona izy, dia namono telo-polo lahy tao, ary nalainy ny fitafian''ireo ka nomeny ho an''izay nilaza ny fampanonona. Dia nirehitra ny fahatezeran''i Samsona, ka niakatra nankany amin''ny tranon-drainy izy.'
mg1865::mg_7::14::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 14
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny vadiny dia lasan''ny namany, izay efa nataony sakaizany.'
mg1865::mg_7::15::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony afaka kelikely, tamin''ny taom-pijinjana ny vary tritika, dia nitondra zanak''osy Samsona ho entiny mamangy ny vadiny, ka hoy izy: Hiditra ao amin''ny vadiko ao an-efi-trano aho. Nefa tsy namela azy hiditra ny rafozany,'
mg1865::mg_7::15::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa hoy izy: Nataoko fa halanao mihitsy izy, ka dia nomeko ho an''ny namanao; moa tsy tsara tarehy noho izy va ny zandriny? Masina ianao, aoka izy halainao ho solony.'
mg1865::mg_7::15::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Samsona taminy: Tsy hanan-tsiny aho izao, na dia hanisy ratsy ny Filistina aza.'
mg1865::mg_7::15::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha Samsona ka nisambotra amboahaolo telon-jato; dia naka zavatra hatao fanilo izy, ary nampifanendreny ny rambon''ny amboahaolo tsiroaroa avy ka nafehiny teo anelanelan''ny rambony ilay hatao fanilo.'
mg1865::mg_7::15::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nampirehetiny ny fanilo, dia nalefany ho any amin''ny varin''ny Filistina ireny, ka nandoro ny amboara sy ny vary mbola mitsangana ary ny voli-oliva koa.'
mg1865::mg_7::15::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny Filistina: Iza no nanao izany? Ary nisy nanao hoe: Samsona, vinanton''ilay Timnita, satria ny rafozany efa nanome ny vadiny ho an''ny sakaizany. Dia niakatra ny Filistina ka nandoro an-dravehivavy sy ny ankohonan-drainy tamin''ny afo.'
mg1865::mg_7::15::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Samsona taminy: Raha manao tahaka izany ianareo, dia mbola hamaly anareo tokoa aho, koa rehefa afaka izany, vao hitsahatra aho.'
mg1865::mg_7::15::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namely azy izy ka nahatapaka ranjo sy fe ary nahafaty be dia be; dia nidina izy ka nitoetra teo an-tsefatsefak''ilay harambato mitresaka any Etama.'
mg1865::mg_7::15::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niakatra ny Filistina, dia nitoby teo amin''ny Joda ka niely tany Lehy.'
mg1865::mg_7::15::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny lehilahy amin''ny Joda: Nahoana no miakatra hamely anay ianareo? Dia hoy izy Hamatotra an''i Samsona no niakaranay, mba hanao aminy tahaka izay efa nataony taminay.'
mg1865::mg_7::15::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha ny lehilahy telo arivo amin''ny Joda nankany amin''ilay tsefatsefaky ny harambato mitresaka any Etama ka nanao tamin''i Samsona hoe: Tsy fantatrao va fa manapaka antsika ny Filistina? Inona izao nataonao taminay izao? Dia hoy izy taminy: araka izay nataony tamiko no mba nataoko taminy.'
mg1865::mg_7::15::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy kosa izy ireo taminy: Hamatotra anao no nidinanay, mba hatolotray ho eo an-tanan''ny Filistina ianao. Dia hoy Samsona taminy: Mianiana amiko ary fa tsy hamely ahy ianareo.'
mg1865::mg_7::15::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niteny taminy izy ireo ka nanao hoe: Tsia; fa hamatotra anao fotsiny ihany izahay ka hanolotra anao eo an-tanany; fa tsy hamono anao tsy akory izahay. Dia namatotra azy tamin''ny mahazaka roa vaovao izy ka nitondra azy niala tamin''ilay harambato.'
mg1865::mg_7::15::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha tonga tany Lehy izy, dia nanakora azy ny Filistina; ary ny Fanahin''i Jehovah nilatsaka taminy, dia tonga tahaka ny rongony izay nodorana tamin''ny afo ny mahazaka teny amin''ny sandriny ary afaka tamin''ny tanany ny fatorana.'
mg1865::mg_7::15::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nahita valanoranom-boriky vaovao izy, dia naninjitra ny tanany naka azy, ka iny no namonoany arivo lahy.'
mg1865::mg_7::15::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Samsona: Tamin''ny valanoranom-boriky no nahafatesako ho antontany iray, eny, antontany roa; Tamin''ny valanoranom-boriky no nahafatesako arivo lahy.'
mg1865::mg_7::15::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nitsahatra niteny izy, dia nariany ilay valanoranom-boriky teny an-tanany; ary ny anaran''izany tany izany dia natao hoe Ramata-lehy*. [*Ramata-hely = Havoanan''ny valanorano]'
mg1865::mg_7::15::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nangetaheta indrindra izy, dia nitaraina tamin''i Jehovah ka nanao hoe: Ianao no nanome izao famonjen-dehibe izao tamin''ny tanan''ny mpanomponao; ary ankehitriny efa ho fatin-ketaheta aho ka hianjera ho eo an-tanan''ny tsy mifora!'
mg1865::mg_7::15::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nampitresahin''Andriamanitra ilay fitoerana hoboka tany Lehy, ka niboiboika teo ny rano; ary rehefa nisotro izy, dia nody ny ainy, ka velona Izy; ka izany no nanaovany ny anarany hoe En-hakore*, izay any Lehy mandraka androany. [*En-hakore = Loharanon''ilay niantso]'
mg1865::mg_7::15::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 15
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitsara ny Isiraely roa-polo taona tamin''ny andron''ny Filistina izy.'
mg1865::mg_7::16::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nisamboran''ny Filistina an''i Samsona sy ny namalian''i Samsona azy'
  verse_text: 'Ary Samsona nankany Gaza ka nahita vehivavy janga teo, dia niditra tao aminy.'
mg1865::mg_7::16::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nolazaina tamin''ny Gazita hoe: Tonga aty Samsona. Dia nanemitra azy izy ary nanotrika mandritra ny alina teo am-bavahadin''ny tanàna ka nangina mandritra ny alina; fa hoy izy: Raha maraina ny andro, dia hovonointsika izy.'
mg1865::mg_7::16::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nandry Samsona mandra-pamatonalina, dia nifoha izy nony namatonalina, ka noraisiny ny vavahadin''ny tanàna mbamin''ny tolana roa, dia nongotany izy mbamin''ny hidiny ka nataony teny antsorony, dia nentiny ho any an-tampon''ny tendrombohitra izay tandrifin''i Hebrona.'
mg1865::mg_7::16::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa afaka izany, dia tia vehivavy atao hoe Delila tany an-dohasaha Soreka izy.'
mg1865::mg_7::16::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ireo andrianan''ny Filistina niakatra nankany amin-dravehivavy ka nanao taminy hoe: Kolikoleo izy, ka izahao izay itoeran''ny heriny lehibe sy izay hahazoanay mamatotra azy mba hahafolaka azy; dia samy hanome anao sekely zato amby arivo avy izahay rehetra.'
mg1865::mg_7::16::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Delila tamin''i Samsona: Masïna ianao, lazao amiko izay itoeran''ny herinao lehibe sy izay hahazoana mamatotra anao hahafolaka anao.'
mg1865::mg_7::16::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Samsona taminy: Raha tady vaovao fito izay tsy mbola maina no amatorany ahy, dia ho osa aho ka ho tahaka ny olon-kafa.'
mg1865::mg_7::16::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niakatra nankany aminy ireo andrianan''ny Filistina nitondra tady vaovao fito izay tsy mbola maina, dia namatotra azy tamin''ireny ravehivavy.'
mg1865::mg_7::16::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy lehilahy nanotrika ka nitoetra taminy tao an''efi-trano. Dia hoy ravehivavy tamin''i Samsona: Hamely anao ny Filistina, ry Samsona! Dia notosany ny tady, tahaka ny fahamaiton''ny taretra rongony, raha lelafin''ny afo. Dia tsy fantatra ny heriny.'
mg1865::mg_7::16::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Delila tamin''i Samsona: Indro, efa namitaka ahy ianao ka nilaza lainga tamiko; ankehitriny, masïna ianao, lazao amiko izay hahazoana mamatotra anao.'
mg1865::mg_7::16::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy kosa izy taminy: Raha mahazaka vaovao izay tsy mbola nanaovan-draharaha no amatorany ahy mafy, dia ho osa aho ka ho tahaka ny olon-kafa.'
mg1865::mg_7::16::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naka mahazaka vaovao Delila, ka namatorany azy, dia hoy izy taminy: Hamely anao ny Filistina, ry Samsona! Ary nisy mpanotrika nitoetra tao an''efi-trano. Dia notosan''i Samsona ho afaka amin''ny sandriny ireny tahaka ny fahamaiton''ny taretra.'
mg1865::mg_7::16::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Delila tamin''i Samsona: Mandraka ankehitriny dia mbola namitaka ahy ihany ianao ka nilaza lainga tamiko; lazao amiko izay hahazoana mamatotra anao. Dia hoy kosa izy taminy: Raha tenomina hikambana amin''ny tenona ny foto-bolo fito amin''ny lohako.'
mg1865::mg_7::16::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary notsatohany ny fantaka izany, dia hoy izy taminy: Hamely anao ny Filistina, ry Samsona! Dia nifoha tamin''ny torimasony izy, ka nangotany ny fantaka sy ny tenona.'
mg1865::mg_7::16::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ravehivavy taminy: Nahoana ianao no nanao hoe: Tiako ianao, nefa ny fonao tsy amiko tsinona? Efa namitaka ahy intelo ianao izay, ka tsy mbola nolazainao tamiko ihany izay itoeran''ny herinao lehibe.'
mg1865::mg_7::16::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nitorikisina taminy isan''andro ravehivavy ka nahasosotsosotra azy, dia tsy nahafinaritra azy intsony ny miaina.'
mg1865::mg_7::16::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dia nambarany azy ny tao am-pony rehetra, ka hoy izy taminy: Tsy mbola nokasihin-kareza ny lohako, fa Nazirita ho an''Andriamanitra hatrany an-kibon-dreniko aho; koa raha haratana aho, dia hiala amiko ny heriko, ary ho osa aho ka ho tahaka ny olona rehetra,'
mg1865::mg_7::16::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa hitan''i Delila fa efa nambarany azy ny tao am-pony rehetra, dia naniraka izy nampaka ireo andrianan''ny Filistina nanao hoe: Miakara amin''izao indray mandeha izao, fa efa nambarany ahy ny tao ampony rehetra. Ary ireo andrianan''ny Filistina niakatra ho any aminy nitondra ny vola teny an-tanany.'
mg1865::mg_7::16::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ravehivavy nanondana an''i Samsona hatory teo an-dohaliny, dia niantso lehilahy ka nanaratra ny foto-bolo fito amin''ny lohany; dia vao izay no nampietry azy izy, satria niala taminy ny heriny.'
mg1865::mg_7::16::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ravehivavy: Hamely anao ny Filistina, ry Samsona! Dia nifoha tamin''ny torimasony izy ka nanao hoe: Hivoaka tahaka ny teo aloha aho ka hanetsika ny tenako. Kanjo tsy fantany fa Jehovah efa niala taminy.'
mg1865::mg_7::16::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nisambotra azy ny Filistina ka namotsitra ny masony, dia nitondra azy nidina nankany Gaza ary namatotra azy tamin''ny gadra varahina; ary nitoto vary tao an-trano famatorana izy.'
mg1865::mg_7::16::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary dia naniry indray ny volon-dohany, rehefa voaharatra.'
mg1865::mg_7::16::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nivory ireo andrianan''ny Filistina hamono zavatra betsaka hatao fanatitra ho an''i Dagona andriamaniny sy hifaly; fa hoy izy: Efa natolotry ny andriamanitsika eto an-tanantsika Samsona fahavalontsika.'
mg1865::mg_7::16::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nahita azy ny vahoaka, dia nidera ny andriamaniny ka nanao hoe: Efa natolotry ny andriamanitsika eto an-tanantsika ilay fahavalontsika, mpanimba ny tanintsika, izay nahabe maty antsika.'
mg1865::mg_7::16::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa faly ny fony, dia hoy izy: Alao Samsona mba hanao laolao ho antsika. Dia nampaka an''i Samsona avy tao an-trano famatorana izy, ka nanao laolao teo anatrehan''ireo Samsona; ary nampitsanganiny teo anelanelan''ny andry izy.'
mg1865::mg_7::16::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Samsona tamin''ny zatovo izay nitantana azy: Avelao kely aho hitsapa ny andry izay manohana ny trano, hiankinako aminy.'
mg1865::mg_7::16::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary feno lehilahy sy vehivavy ny trano, ary tao ireo andrianan''ny Filistina rehetra, ary teo an-tampon-trano koa nisy lehilahy sy vehivavy tokony ho telo arivo, izay finaritra nijery an''i Samsona nanao laolao.'
mg1865::mg_7::16::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Samsona niantso an''i Jehovah ka nanao hoe: Jehovah Tompo o, mifona aminao aho, tsarovy aho, ka ampaherezo izao indray mandeha izao monja, ry Andriamanitra o, hamaliako ny Filistina noho ny anankiray amin''ny masoko roa.'
mg1865::mg_7::16::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia notanan''i Samsona ny andry roa teo afovoany izay nanohana ny trano, ny anankiray tamin''ny tanany ankavanana, ary ny anankiray tamin''ny tanany ankavia, ka niankina teo izy.'
mg1865::mg_7::16::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Samsona: Aoka hiara-maty amin''ny Filistina aho. Dia nezahiny mafy, ka dia nianjera tamin''ireo andriana sy ny vahoaka rehetra izay teo ny trano. Ary ny maty izay novonoiny teo amin''ny nahafatesany no be lavitra noho izay novonoiny tamin''ny andro niainany.'
mg1865::mg_7::16::31:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 16
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nidina ny rahalahiny sy ny mpianakavin-drainy rehetra, dia naka ny fatiny ka nitondra azy niakatra, dia nandevina azy teo anelanelan''i Zora sy Estaola tao amin''ny fasan''i Manoa rainy. Ary izy efa nitsara ny Isiraely roa-polo taona.'
mg1865::mg_7::17::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nanaovan''i Mika sarin-javatra hivavahana'
  verse_text: 'Nisy lehilahy tany amin''ny tany havoan''i Efraima, Mika no anarany.'
mg1865::mg_7::17::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy tamin''ny reniny: Ilay sekely volafotsy zato amby arivo nalaina taminao, izay nasianao ozona sady nolazainao teo anatrehako, indro, ato amiko ny vola; izaho no naka azy. Dia hoy ny reniny: Hotahin''i Jehovah anie ny zanako.'
mg1865::mg_7::17::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa naveriny tamin''ny reniny ny sekely volafotsy zato amby arivo, dia hoy reniny: Atokako* ho an''i Jehovah mihitsy ity vola avy amin''ny tanako ity ka hatolotro ho anao, ry zanako, hanaovana sarin-javatra voasokitra sy sarin-javatra an-idina, ary ankehitriny dia averiko ho aminao izy. [*Na: Efa natokako]'
mg1865::mg_7::17::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa naveriny tamin-dreniny ny volafotsy, dia naka volafotsy roan-jato ny reniny, ka nomeny ny mpanao an-idina hataony sarin-javatra voasokitra sy sarin-javatra an-idina; dia natao tao an-tranon''i Mika izany.'
mg1865::mg_7::17::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanana tranon''andriamanitra Mika sady efa nanao efoda sy terafima; ary ny zanany anankiray no natokany* ka tonga mpisorony. [*Hebreo: nofenoiny ny tanany]'
mg1865::mg_7::17::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tamin''izany andro izany tsy nisy mpanjaka tamin''ny Isiraely: fa samy nanao izay nataony ho marina avy ny olona rehetra.'
mg1865::mg_7::17::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nisy zatovo avy any Betlehema-joda, tamin''ny fokon''i Joda, ary Levita izy sady nivahiny tao.'
mg1865::mg_7::17::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ralehilahy niala tao an-tanàna Betlehema-joda hivahiny any amin''izay azony hitoerana; ary nony nandeha izy, dia tonga tany amin''ny tany havoan''i Efraima tao an-tranon''i Mika.'
mg1865::mg_7::17::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Mika taminy: Avy aiza moa ianao? Dia hoy kosa izy taminy: Levita avy any Betlehema-joda aho ka mandeha hivahiny eny amin''izay azoko hitoerana.'
mg1865::mg_7::17::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Mika taminy: Mitoera aty amiko ianao, ary aoka ho raiko sy ho mpisoroko, dia homeko sekely folo volafotsy isan-taona sy fitafiana ary hanina. Dia niditra ilay Levita.'
mg1865::mg_7::17::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nanaiky hitoetra tao amin-dralehilahy ilay Levita, ka dia tonga tahaka ny zanany izy.'
mg1865::mg_7::17::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia natokan''i Mika ilay Levita, ka dia tonga mpisorony izy ary nitoetra tao an-tranon''i Mika.'
mg1865::mg_7::17::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 17
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy Mika: Fantatro izao fa hanisy soa ahy Jehovah, satria manana ity Levita ity ho mpisoroko aho.'
mg1865::mg_7::18::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny nandehandehanan''ny firenen''i Dana nizaha tany hitoerany'
  verse_text: 'Ary tamin''izany andro izany dia tsy nisy mpanjaka teo amin''ny Isiraely; ary tamin''izany andro izany kosa ny firenen''i Dana nitady lova mba honenany, satria na dia hatramin''izany andro izany aza dia tsy mbola nahazo lova ho azy teo amin''ny firenen''Isiraely izy.'
mg1865::mg_7::18::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny taranak''i Dana naniraka dimy lahy nofantenany avy amin''ny fokony rehetra, dia lehilahy mahery, avy tany Zora sy Estaola, mba hisafo ny tany sy hizaha ny toetrany; ary hoy izy taminy: Mandehana izahao ny toetry ny tany. Ary tonga tany amin''ny tany havoan''i Efraima tao an-tranon''i Mika izy, dia nandry tao.'
mg1865::mg_7::18::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Rehefa mby teo akaikin''ny tranon''i Mika izy, dia fantany ny feon''ilay Levita zatovo; dia nivily teo izy ka nanao taminy hoe: Iza no nitondra anao taty? ary maninona aty ianao? ary inona no anananao aty?'
mg1865::mg_7::18::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy kosa izy taminy: Izany ka izany no nataon''i Mika tamiko, ary efa nanamby ahy izy, ka efa mpisorony aho izao.'
mg1865::mg_7::18::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy ireo taminy: Masïna ianao, manontania amin''Andriamanitra mba ho fantatray na hambinina amin''ny lalana alehanay izahay, na tsia.'
mg1865::mg_7::18::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ilay mpisorona taminy: Mandehana soa aman-tsara; fa eo anatrehan''i Jehovah izao lalana alehanareo izao.'
mg1865::mg_7::18::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha izy dimy lahy ka tonga tany Laisy, ary hitany ny olona tao, fa nonina tsy nanana ahiahy tahaka ny fanaon''ny Sidoniana izy, dia nandry fahizay ka tsy nanana ahiahy, sady tsy nisy mpanapaka hampahory* azy teo amin''ny tany na amin''inona na amin''inona; ary lavitra ny Sidoniana izy sady tsy nanan-draharaha tamin''olona akory. [*Na: hahamena-maso]'
mg1865::mg_7::18::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha ho any amin''ny rahalahiny any Zora sy Estaola ireo; ary hoy ny rahalahiny taminy: Naninona moa ianareo?'
mg1865::mg_7::18::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Mitsangàna, ka aoka isika hiakatra hamely azy; fa efa nahita ny tany izahay, fa, indro, tsara indrindra izany; moa mbola mijanonjanona ihany va ianareo? aza malain-kandeha hiditra handova ny tany.'
mg1865::mg_7::18::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Raha mandeha ianareo, dia ho tonga any amin''ny olona tsy manana ahiahy sy any amin''ny tany malalaka; fa efa natolotr''Andriamanitra ho eo an-tananareo izany; dia tany tapi-javatra irina aty ambonin''ny tany.'
mg1865::mg_7::18::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nisy niainga avy tamin''ny fokon''i Dana, avy tany Zora sy Estaola, dia enin-jato lahy efa voaomana tamin''ny fiadiany.'
mg1865::mg_7::18::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niakatra ireo ka nitoby tany Kiriata-jearima any Joda (izany no nanaovana ny anaran''izany tany izany hoe mandraka androany Mahane-dana*; indro, eo andrefan''i Kiriata-jearima izany).'
mg1865::mg_7::18::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niala tao izy ka nandroso nankany amin''ny tany havoan''i Efraima, dia tonga tao an-tranon''i Mika.'
mg1865::mg_7::18::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niteny izy dimy lahy, izay nandeha hisafo ny tany Laisy, ka nanao tamin''ny rahalahiny hoe: Fantatrareo va fa ato amin''ireto trano ireto misy efoda sy terafima ary sarin-javatra voasokitra sy sarin-javatra anidina? koa hevero izay hataonareo.'
mg1865::mg_7::18::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivily tao izy ka tonga tao an-tranon''ilay Levita zatovo, dia tao an-tranon''i Mika, ka niarahaba azy.'
mg1865::mg_7::18::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny enin-jato lahy efa voaomana tamin''ny fiadiany, izay avy tamin''ny taranak''i Dana, dia nijanona teo anoloan''ny vavahady.'
mg1865::mg_7::18::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niakatra izy dimy lahy, izay nandeha hisafo ny tany, dia niditra ka naka ny sarin-javatra voasokitra sy ny efoda sy ny terafima ary ny sarin-javatra an-idina; ary ny mpisorona mbamin''ny enin-jato lahy efa voaomana tamin''ny fiadiany nijanona teo anoloan''ny vavahady.'
mg1865::mg_7::18::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niditra tao an-tranon''i Mika ireo ka naka ny sarin-javatra voasokitra sy ny efoda sy ny terafima ary ny sarin-javatra an-idina. Ary hoy ny mpisorona taminy: Maninona ianareo?'
mg1865::mg_7::18::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ireo taminy: Mangina ianao, tampeno ny tananao ny vavanao, ka andeha hiaraka aminay, dia ho rainay sy mpisoronay ianao; moa tsara ho anao va ny ho mpisorona ho an''ny olona iray trano noho ny ho mpisorona amin''ny firenena iray sy ny foko iray amin''ny Isiraely?'
mg1865::mg_7::18::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia faly ny fon''ilay mpisorona, ka nalainy ny efoda sy ny terafima ary ny sarin-javatra voasokitra, ary nandeha voahodidin''ny olona izy.'
mg1865::mg_7::18::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nihodina izy ireo ka lasa nandeha; ary ny zaza amim-behivavy sy ny omby aman''ondry mbamin''ny entany tsara dia nataony teo alohany.'
mg1865::mg_7::18::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa lasa lavitra ny tranon''i Mika izy, dia nivory ny lehilahy nifanolo-bodirindrina tamin''i Mika ka nahatratra ny taranak''i Dana.'
mg1865::mg_7::18::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niantso ny taranak''i Dana izy. Ary niherika ireo ka nanao tamin''i Mika hoe: Haninona ianao, no nanangona olona maro toy izao?'
mg1865::mg_7::18::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy Izy: Ny andriamanitro izay nataoko sy ny mpisorona koa dia nalainareo, ka lasa ianareo; koa inona intsony no mba ho ahy? Ary ahoana no anaovanareo amiko hoe: Haninona ianao?'
mg1865::mg_7::18::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny taranak''i Dana taminy: Aoka tsy ho re eto aminay intsony ny feonao, fandrao hisy olo-masiaka hamely anareo, ka dia hanao izay hahafaty ny tenanao sy ny ankohonanao ianao.'
mg1865::mg_7::18::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandeha tamin''ny nalehany ny taranak''i Dana; ary rehefa hitan''i Mika fa ireo dia nahery noho izy, dia niverina izy ka nody tany an-tranony.'
mg1865::mg_7::18::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izy ireo naka izay zavatra efa nataon''i Mika sy ny mpisorona izay tao aminy, dia nankany Laisy ho any amin''ny olona mandry fahizay ka tsy manana ahiahy, dia namely azy tamin''ny lelan-tsabatra ireo; ary ny tanàna nodorany tamin''ny afo.'
mg1865::mg_7::18::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tsy nisy namonjy, satria lavitra an''i Sidona izany, ary tsy nanan-draharaha tamin''olona akory izy, sady teo amin''ny lohasaha izay any Beti-rehoba izany. Dia nanorina ny tanàna izy ireo ka nonina tao.'
mg1865::mg_7::18::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny anaran''ny tanàna nataony hoe Dana, araka ny anaran''i Dana rainy, izay naterak''Isiraely; kanefa Laisy no anaran''ny tanàna taloha.'
mg1865::mg_7::18::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia natsangan''ny taranak''i Dana ilay sarin-javatra voasokitra; ary Jonatana, zanak''i Gersoma, zanak''i Mosesy*, sy ny zanany, no mpisorona ho an''ny firenen''i Dana hatramin''ny andro namaboana ny tany. [*Na: Manase]'
mg1865::mg_7::18::31:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 18
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nampitoeriny ho azy ilay sarin-javatra voasokitra nataon''i Mika mandritra ny andro rehetra niorenan''ny tranon''Andriamanitra tao Silo.'
mg1865::mg_7::19::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 1
  verse_date_revised: null
  verse_title: 'Ny ratsy nataon''ny mponina tao Gibea, sy ny namalian''ny Isiraely rehetra azy'
  verse_text: 'Ary tamin''izany andro izany, raha tsy nisy mpanjaka teo amin''ny Isiraely, dia nisy Levita anankiray nivahiny tary an-tsisin''ny tany havoan''i Efraima, ka naka vaditsindrano avy any Betlehema-joda.'
mg1865::mg_7::19::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny vaditsindranony nijangajanga sy nisintaka taminy ka nandao azy ary nankany an-tranon-drainy any Betlehema-joda, dia nitoetra tao efa-bolana mipaka.'
mg1865::mg_7::19::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niainga ralehilahy ka nandeha nanaraka azy hanao teny malefaka taminy hampody azy ary nitondra ny zatovony sy boriky roa; dia nampiantranoin-dravehivavy ho ao an-tranon-drainy izy, ka nony hitan''ny rain-drazazavavy ralehilahy, dia faly izy nihaona taminy.'
mg1865::mg_7::19::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nihazona azy ny rafozany, rain-drazazavavy, ka nitoetra teo aminy hateloana izy, dia nihinana sy nisotro ary nandry tao izy roa lahy.'
mg1865::mg_7::19::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony tamin''ny andro fahefatra, dia nifoha maraina koa izy ka niomana handeha; fa hoy ny rain-drazazavavy tamin''ny vinantony: Aoka aloha mba hanao ody am-bavafo kely ianao, ary rehefa afaka izany, dia handeha ianareo.'
mg1865::mg_7::19::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nipetraka izy roa lahy ka niara-nihinana sy nisotro; dia hoy ny rain-drazazavavy tamin-dralehilahy: Mba maneke ny handry eto anio alina, ary aoka ho faly ny fonao.'
mg1865::mg_7::19::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha niomana handeha ralehilahy, dia nanery azy hitoetra ny rafozany, ka dia tafandriana tao indray izy.'
mg1865::mg_7::19::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nifoha maraina koa izy handeha nony tamin''ny andro fahadimy; fa hoy ny rain-drazavazavy: Aoka mba hanao ody am-bavafo kely ianao, ary mijanonjanona aloha mandra-pihilan''ny andro; ary dia niara-nihinana izy roa lahy.'
mg1865::mg_7::19::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha niainga handeha ralehilahy sy ny vaditsindranony ary ny ankizilahiny, dia hoy ny rafozany, rain-drazazavavy, taminy Indro, efa ho hariva ny andro izao, koa masïna ianao, mandria re anio alina; indro, efa hilentika ny masoandro, ka mandria eto, mba hifalian''ny fonao; ary rahampitso dia hifoha maraina koa ianareo, ka handeha hody ianao.'
mg1865::mg_7::19::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa tsy nety nijanona intsony ralehilahy tamin''izany alina izany, fa niainga ihany izy ka nandeha, dia tonga tandrifin''i Jebosa (Jerosalema izany) ary boriky roa samy voaisy lasely no nentiny, ary ny vaditsindranony niaraka taminy koa.'
mg1865::mg_7::19::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa mby teo akaiky an''i Jebosa izy, ka efa ho hariva ny andro, dia hoy ny zatovo tamin''ny tompony: Andeha hiakatra ato amin''ity tanànan''ny Jebosita ity isika ka handry ato.'
mg1865::mg_7::19::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa hoy ny tompony taminy: Tsy hiakatra amin''ny tanànan''ny olona hafa firenena izay tsy isan''ny Zanak''Isiraely isika, fa handroso ihany ho any Gibea.'
mg1865::mg_7::19::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy tamin''ny zatovony: Andeha isika hankamin''ny anankiray amin''ireto tanàna ireto, dia any Gibea, na any Rama, ka handry any.'
mg1865::mg_7::19::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nandroso izy ka nandeha; ary raha mbola teo akaiky an''i Gibea, izay an''ny Benjamita, izy, dia nilentika ny masoandro.'
mg1865::mg_7::19::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ka dia nivily teo izy handeha handry any Gibea; ary niakatra izy ka nipetraka teo amin''ny kianjan''ny tanàna; fa tsy nisy olona nampiantrano azy handry tao an-tranony.'
mg1865::mg_7::19::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary, indro, nisy lehilahy anti-panahy avy niasa tany an-tsaha nony hariva, sady olona avy any amin''ny tany havoan''i Efraima koa izy, saingy nitoetra tany Gibea, fa ny mponina tao amin''izany tanana izany dia Benjamita.'
mg1865::mg_7::19::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa nanopy ny masony izy ka nahita ilay vahiny teo an-kianjan''ny tanana, dia hoy ilay lehilahy anti-panahy: Hankaiza moa ianao? Ary avy taiza?'
mg1865::mg_7::19::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy taminy: Avy tany Betlehema-joda izahay ka hankary an-tsisin''ny tany havoan''i Efraima, fa any no tany nihaviako; ary nankany Betlehema-joda aho, fa mpankany* an-tranon''i Jehovah; ary tsy misy olona mampiantrano ahy; [*Na: mankany]'
mg1865::mg_7::19::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'kanefa misy mololo sy hanina ihany ho an''ny borikinay, sady misy mofo sy divay ho ahy sy ny ankizivavinao ary ho an''ny zatovo manaraka ny mpanomponao: tsy misy zavatra ilainay intsony.'
mg1865::mg_7::19::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ilay lehilahy anti-panahy: Fiadanana anie ho anao; aoka ho adidiko izay rehetra ilainao, fa aza mandry foana eto an-kianja.'
mg1865::mg_7::19::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitondra azy tany an-tranony izy ka nampihinana ny boriky; dia nanasa tongotra izy ireo ka nihinana sy nisotro.'
mg1865::mg_7::19::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha mbola nampifaly ny fony izy, indro, ny mponina tao an-tanàna, olona tena ratsy fanahy, dia nanodidina ny trano ka nandondona mafy ny varavarana ary niteny tamin''ilay lehilahy anti-panahy tompo-trano hoe: Avoahy ny lehilahy izay niditra ato an-tranonao, mba hahalalanay azy.'
mg1865::mg_7::19::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka nankeo aminy ralehilahy tompo-trano ka nanao taminy hoe: Tsia, ry rahalahiko, masïna ianareo, aza manao ratsy; fa tonga ato an-tranoko ity lehilahy ity, koa aza manao izany zavatra fady indrindra* izany ianareo. [*Hebreo: fahadalana]'
mg1865::mg_7::19::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Indreto ny zanako-vavy virijina sy ny vaditsindranon-dralehilahy, aoka mba ho entiko mivoaka ireo, ka mandria aminy, ary ataovy aminy izay sitrakareo; fa aza ity lehilahy ity no anaovanareo izany zavatra fady indrindra izany.'
mg1865::mg_7::19::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa tsy nety nihaino azy ireo lehilahy ireo, ka dia nalain-dralehilahy ilay vaditsindrano ka navoakany taminy teo ala-trano; dia nahalala azy ireo ka nanao ditra taminy mandritra ny alina mandra-pahamarain''ny andro; ary rehefa hiposaka ny masoandro, vao nalefany handeha izy.'
mg1865::mg_7::19::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa ho maraina ny andro, dia tonga ravehivavy, ka lavo teo am-baravaran''ny tranon-dralehilahy, izay nitoeran''ny vadiny, ka nivalandotra teo mandra-pahazavan''ny andro.'
mg1865::mg_7::19::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nifoha maraina ralehilahy ka namoha ny varavaran''ny trano, dia nivoaka handeha tamin''ny lalan-kalehany; ary, indro, ravehivavy vaditsindranony miampatra eo am-baravaran''ny trano, ary ny tanany eo amin''ny tokonana.'
mg1865::mg_7::19::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ralehilahy taminy: Mitsangàna, andeha isika. Kanjo tsy nisy namaly. Dia nobetain-dralehilahy izy ka nasampiny teo amin''ny borikiny; dia niainga izy nandeha ho any amin''ny fonenany.'
mg1865::mg_7::19::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary rehefa tonga tao an-tranony izy, dia naka antsy, ka noraisiny ny fatin''ny vaditsindranony, dia norasainy araka ny famavanin''ny taolana ho roa ambin''ny folo toko, ka nampitondrainy eran''ny tanin''ny Isiraely rehetra.'
mg1865::mg_7::19::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 19
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ity rehetra nahita: Tsy nisy zavatra natao na hita toy izany hatramin''ny andro niakaran''ny Zanak''Isiraely avy tany amin''ny tany Egypta ka mandraka androany; hevero izany, samia maka saina, ka ambarao.'
mg1865::mg_7::20::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka ny Zanak''Isiraely rehetra, ary ny fiangonana hatrany Dana ka hatrany Beri-sheba ary ny tany Gileada koa nivory tahaka ny olona iray ho any amin''i Jehovah tany Mizpa.'
mg1865::mg_7::20::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny loholona rehetra tamin''ny firenen''Isiraely niseho teo amin''ny fiangonan''ny olon''Andriamanitra, dia lehilahy efatra hetsy mandeha tongotra sady mahatan-tsabatra.'
mg1865::mg_7::20::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ren''ny taranak''i Benjamina fa niakatra ho any Mizpa ny Zanak''Isiraely. Dia hoy ny Zanak''Isiraely: Lazao izay nahatonga izao ratsy izao.'
mg1865::mg_7::20::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia namaly ilay Levita, vadin-dravehivavy novonoina, ka nanao hoe: Tonga tany Gibea, izay an''ny Benjamita, izaho sy ny vaditsindranoko handry tao.'
mg1865::mg_7::20::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 5
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitsangana hamely ahy ny mponina tao Gibea ka nanodidina ny trano hamely ahy tamin''ny alina; izaho saiky novonoiny, ary ny vaditsindranoko nandriany ka matiny.'
mg1865::mg_7::20::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nalaiko ny vaditsindranoko ka norasaiko ary nampitondraiko tany amin''ny tany rehetra izay lovan''ny Isiraely, satria efa nanao fahavetavetana sy zavatra fady indrindra* teo amin''ny Isiraely ireo. [*Hebreo: fahadalana]'
mg1865::mg_7::20::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa indreto ianareo Zanak''Isiraely rehetra, mba alaharo izay teny sy hevitrareo.'
mg1865::mg_7::20::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nitsangana tahaka ny olona iray ny vahoaka rehetra ka nanao hoe: Tsy hisy hankany amin''ny laintsika akory isika, ary tsy hisy hody any an-tranontsika akory.'
mg1865::mg_7::20::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa ankehitriny, izao no hataontsika amin''i Gibea: araka ny filokana no aoka hanaovantsika azy.'
mg1865::mg_7::20::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary haka folo lahy isan-jato amin''ny firenen''Isiraely rehetra isika, dia zato amin''ny arivo, ary arivo amin''ny iray alina, mba haka vatsy ho an''ny olona, ka rehefa tonga any Gibean''ny Benjamina izy, dia araka ilay zavatra fady indrindra efa nataony teo amin''ny Isiraely no hataony aminy.'
mg1865::mg_7::20::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivory ny lehilahy rehetra amin''ny Isiraely ka efa nikambana tahaka ny olona iray hamely ny tanàna.'
mg1865::mg_7::20::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny firenen''Isiraely dia naniraka olona tany amin''ny firenen''i Benjamina rehetra hanao hoe: Inona izao ratsy natao teto aminareo izao?'
mg1865::mg_7::20::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Koa ankehitriny atolory anay ireo olona tena ratsy fanahy avy any Gibea ireo, mba hataonay maty izy, ka hesorinay tsy ho eo amin''ny Isiraely ny ratsy. Fa ny taranak''i Benjamina tsy nety nihaino ny feon''ny Zanak''Isiraely rahalahiny.'
mg1865::mg_7::20::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nivory ny taranak''i Benjamina avy tamin''ny tanànany rehetra hankany Gibea mba handeha hiady amin''ny Zanak''Isiraely.'
mg1865::mg_7::20::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia voalamina tamin''izany andro izany ny taranak''i Benjamina avy tamin''ireo tanàna ireo, ka enina arivo sy roa alin-dahy nahatan-tsabatra, afa-tsy ny mponina tao Gibea izay voalamina, dia fiton-jato lahy voafantina.'
mg1865::mg_7::20::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary teo amin''izany olona rehetra izany nisy olona kavia fiton-jato lahy nofantenany, samy nahay nitoraka tamin''ny antsamotady, ka tsy nisy nivena na dia hoatra ny singam-bolo aza.'
mg1865::mg_7::20::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny lehilahy voalamina tamin''ny Isiraely, afa-tsy ny Benjamina, dia efatra hetsy nahatan-tsabatra; mpanafika avokoa ireo rehetra ireo.'
mg1865::mg_7::20::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niainga ny Zanak''Isiraely ka niakatra tany Betela ary nanontany tamin''Andriamanitra hoe: Iza no hiakatra voalohany hiady amin''ny taranak''i Benjamina ho anay? Dia hoy Jehovah: Joda no ho voalohany.'
mg1865::mg_7::20::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niainga maraina koa ny Zanak''Isiraely ka nitoby tandrifin''i Gibea.'
mg1865::mg_7::20::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nivoaka ny lehilahy amin''ny Isiraely hiady amin''ny Benjamita; ary nilahatra ny lehilahy amin''ny Isiraely hiady aminy tao akaiky an''i Gibea.'
mg1865::mg_7::20::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nivoaka avy tany Gibea kosa ny taranak''i Benjamina ka naharingana ny Zanak''Isiraely roa arivo sy roa alin-dahy niampatrampatra tamin''ny tany tamin''izany andro izany.'
mg1865::mg_7::20::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa nifanome toky ny lehilahy amin''ny Isiraely ka nilahatra hiady indray teo amin''ilay nilaharany tamin''ny andro voalohany.'
mg1865::mg_7::20::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary niakatra ny Zanak''Isiraely ka nitomany teo anatrehan''i Jehovah mandra-paharivan''ny andro, dia nanontany tamin''i Jehovah hoe: Handroso indray va aho hiady amin''ny taranak''i Benjamina rahalahiko? Ary hoy Jehovah: Miakara hiady aminy.)'
mg1865::mg_7::20::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Zanak''Isiraely dia nandroso tamin''ny andro faharoa hiady amin''ny taranak''i Benjamina.'
mg1865::mg_7::20::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka avy tany Gibea ny Benjamita hiady aminy indray tamin''ny andro faharoa ka naharingana ny Zanak''Isiraely valo arivo sy iray alin-dahy niampatrampatra tamin''ny tany; nahatan-tsabatra avokoa ireo rehetra ireo.'
mg1865::mg_7::20::26:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 26
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niakatra ny Zanak''Isiraely rehetra sy ny olona rehetra ka nankany Betela, dia nitomany sy nipetraka teo anatrehan''i Jehovah ary nifady hanina tamin''izany andro izany mandra-paharivan''ny andro; ary nanatitra fanatitra dorana sy fanati-pihavanana teo anatrehan''i Jehovah izy.'
mg1865::mg_7::20::27:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 27
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanontany tamin''i Jehovah ny Zanak''Isiraely (fa tao ny fiaran''ny faneken''Andriamanitra tamin''izany andro izany,)'
mg1865::mg_7::20::28:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 28
  verse_date_revised: null
  verse_title: null
  verse_text: '(ary Finehasa, zanak''i Eleazara, zanak''i Arona, nijanona teo anoloany tamin''izany andro izany) ka nanao hoe : Mbola hivoaka indray va aho hiady amin''ny taranak''i Benjamina rahalahiko, sa hitsahatra? Ary hoy Jehovah: Miakara, fa rahampitso dia hatolotro ho eo an-tananao izy.'
mg1865::mg_7::20::29:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 29
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nasian''ny Isiraely otrika manodidina an''i Gibea.'
mg1865::mg_7::20::30:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 30
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niakatra ny Zanak''Isiraely tamin''ny andro fahatelo hiady amin''ny taranak''i Benjamina ka nilahatra tandrifin''i Gibea tahaka ilay teo aloha ihany.'
mg1865::mg_7::20::31:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 31
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivoaka ny taranak''i Benjamina hiady tamin''ny olona ka voatarika niala tamin''ny tanàna izy ary nanomboka namely sy nahafaty ny olona tahaka ny teo aloha, dia tokony ho telo-polo lahy teo amin''ny Isiraely tany an-tsampanan-dàlana, miakatra ho any Betela ny anankiray, ary ny anankiray kosa ho any Gibea any an-tsaha.'
mg1865::mg_7::20::32:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 32
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy ny taranak''i Benjamina: Resy eo anoloantsika tahaka ilay teo aloha ihany izy. Fa hoy ny Zanak''Isiraely: Andeha hanao tari-dositra isika mba hampiala azy amin''ny tanàna ho any an-dalambe.'
mg1865::mg_7::20::33:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 33
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny lehilahy rehetra amin''ny Isiraely nitsangana niala tamin''ny fitoerany ka nilahatra tany Bala-tamara; ary ny Isiraely izay nanotrika dia niroatra avy tamin''ny fitoerany, avy tao an-tsahan''i Gibea.'
mg1865::mg_7::20::34:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 34
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary tonga tandrifin''i Gibea ny iray alin-dahy voafantina tamin''ny Isiraely rehetra, ary efa mafy ny ady nefa tsy fantatry ny Benjamita fa efa hiharan-doza izy.'
mg1865::mg_7::20::35:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 35
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary Jehovah namely ny Benjamita teo anoloan''ny Isiraely, ary tamin''izany andro izany ny taranak''i Benjamina dia nahafatesan''ny Zanak''Isiraely zato sy dimy arivo amby roa alin-dahy; nahatan-tsabatra avokoa ireo rehetra ireo.'
mg1865::mg_7::20::36:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 36
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hitan''ny taranak''i Benjamina fa resy izy; ary ny lehilahy amin''ny Isiraely nanao tari-dositra tamin''ny Benjamita, satria natoky ny otrika izay efa napetrany teo akaikin''i Gibea izy.'
mg1865::mg_7::20::37:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 37
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny otrika niroatra faingana hankany Gibea, dia nandeha faingana ka namely ny tanàna rehetra tamin''ny lelan-tsabatra.'
mg1865::mg_7::20::38:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 38
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny famantarana nifaneken''ny lehilahy amin''ny Isiraely sy ny otrika dia tsangan''afo lehibe hisavoana ao an-tanàna.'
mg1865::mg_7::20::39:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 39
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nirona tamin''ny ady ny lehilahy amin''ny Isiraely (ny taranak''i Benjamina nanomboka namely sy nahafaty ny lehilahy amin''ny Isiraely tokony ho telo-polo lahy; fa hoy izy: Resy tokoa eo anoloantsika izy tahaka ny tamin''ny ady voalohany;'
mg1865::mg_7::20::40:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 40
  verse_date_revised: null
  verse_title: null
  verse_text: 'fa raha vao niakatra avy tao amin''ny tanàna ny setroka mitankosina, dia niherika ny taranak''i Benjamina; ary, indro, niakatra ho amin''ny lanitra avokoa ny setroky ny tanàna).'
mg1865::mg_7::20::41:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 41
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha niverina ny lehilahy amin''ny Isiraely, dia talanjona ny Benjamita, satria hitany fa efa nidiran-doza izy.'
mg1865::mg_7::20::42:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 42
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niamboho teo anoloan''ny lehilahy amin''ny Isiraely hankany amin''ny lalana ho any an''efitra izy, fa ny ady nahatratra azy: ary izay nivoaka avy tao amin''ny tanàna koa dia novonoiny teo.'
mg1865::mg_7::20::43:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 43
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nanemitra ny Benjamita izy ka nanenjika azy ary nanitsaka azy mora foana* tandrifin''i Gibea atsinanany. [*Na: teo Menoha]'
mg1865::mg_7::20::44:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 44
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Benjamita dia nahafatesany valo arivo sy iray alin-dahy; lehilahy nahery avokoa ireo rehetra ireo.'
mg1865::mg_7::20::45:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 45
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nivily sy sisa ka nandositra nankany an''efitra ho any amin''ny harambato any Rimona; ary ny voatsimpona teny an-dàlana dia dimy arivo lahy, ary mbola nenjehiny mafy ihany hatrany Gidoma izy ka nahafatesany roa arivo lahy.'
mg1865::mg_7::20::46:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 46
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Benjamita rehetra izay lavo tamin''izany andro izany dia dimy arivo sy roa alin-dahy nahatan-tsabatra; lehilahy nahery avokoa ireo rehetra ireo.'
mg1865::mg_7::20::47:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 47
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa nisy enin-jato lahy nihodina ka nandositra nankany an''efitra ho any amin''ny harambato any Rimona, dia nitoetra tao efa-bolana.'
mg1865::mg_7::20::48:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 20
  verse_number: 48
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny lehilahy amin''ny Isiraely niverina indray tany amin''ny taranak''i Benjamina ka namely azy tamin''ny lelan-tsabatra, hatramin''ny olona tao an-tanàna ka hatramin''ny biby fiompy ary izay hitany dia nodorany tamin''ny afo avokoa.'
mg1865::mg_7::21::1:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 1
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny lehilahy amin''ny Isiraely efa nianiana tany Mizpa nanao hoe: Aoka tsy hisy amintsika hanome ny zananivavy ho vadin''ny Benjamita.'
mg1865::mg_7::21::2:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 2
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nankany Betela ny olona ka nitoetra teo anatrehan''Andriamanitra mandra-paharivan''ny andro, dia nanandratra ny feony ka nitomany mafy dia mafy'
mg1865::mg_7::21::3:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 3
  verse_date_revised: null
  verse_title: null
  verse_text: 'nanao hoe: Jehovah, Andriamanitry ny Isiraely o, nahoana no tonga tamin''ny Isiraely izao ankehitriny, ka fongotra ny firenena iray amin''ny Isiraely?'
mg1865::mg_7::21::4:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 4
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nony ampitson''iny dia nifoha maraina koa ny olona ka nanorina alitara teo ary nanatitra fanatitra dorana sy fanati-pihavanana.'
mg1865::mg_7::21::5:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 5
  verse_date_revised: '2022-04-16T04:21:37+0000'
  verse_title: null
  verse_text: 'Ary hoy ny Zanak''Isiraely: Iza amin''ny firenen''Isiraely rehetra no tsy niakatra teo amin''ny fiangonana hanatona an''i Jehovah? fa efa nisy fianianana lehibe ny amin''izay tsy niakatra ho any amin''i Jehovah tany Mizpa hoe: Hatao maty tokoa izy.'
mg1865::mg_7::21::6:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 6
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny Zanak''Isiraely nanenina ny amin''i Benjamina rahalahiny ka nanao hoe: Misy firenena iray voafongotra eo amin''ny Isiraely ankehitriny.'
mg1865::mg_7::21::7:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 7
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ahoana no hataontsika amin''ireo sisa hahazoany vady; fa isika efa nianiana tamin''i Jehovah tsy hanome vady azy amin''ny zanakavavintsika?'
mg1865::mg_7::21::8:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 8
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Iza amin''ny firenen''Isiraely no tsy mba niakatra ho any amin''i Jehovah tany Mizpa? Ary, indro, tsy nisy olona avy tany Jebesi-gileada na dia iray akory aza nankany an-toby ho ao amin''ny fiangonana.'
mg1865::mg_7::21::9:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 9
  verse_date_revised: null
  verse_title: null
  verse_text: 'Fa rehefa voalamina ny olona, dia, indro, tsy nisy tao na dia iray akory aza avy tamin''ny tompon-tany tany Jabesi-gileada.'
mg1865::mg_7::21::10:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 10
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia naniraka lehilahy mahery roa arivo sy iray alin-dahy ny fiangonana ka nandidy azy hoe: Mandehana, ka mameleza ny mponina any Jabesi-gileada amin''ny lelan-tsabatra mbamin''ny zaza amim-behivavy.'
mg1865::mg_7::21::11:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 11
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary izao no hataonareo: Ny lehilahy rehetra sy ny vehivavy rehetra izay efa nahalala lahy dia haringanareo*. [*Hebreo: hataonareo herema]'
mg1865::mg_7::21::12:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 12
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nahita zazavavy virijina efa-jato tsy mbola nahalala lahy teo amin''ny mponina tany Jabesi-gileada izy ka nitondra ireo ho any an-toby tany Silo any amin''ny tany Kanana.'
mg1865::mg_7::21::13:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 13
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny fiangonana rehetra dia naniraka niteny tamin''ny taranak''i Benjamina, izay tao amin''ny harambato tao Rimona, ka niantso azy hihavana aminy.'
mg1865::mg_7::21::14:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 14
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia niverina tamin''izany andro izany ny Benjamita, ka nomeny azy ireo vehivavy efa novelominy tamin''ny vehivavy tao Jabesi-gileada ireo; kanjo mbola tsy nahenina azy ihany ireo.'
mg1865::mg_7::21::15:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 15
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary ny olona nanenina noho ny amin''i Benjamina, satria nisy nobangain''i Jehovah ny firenen''Isiraely.'
mg1865::mg_7::21::16:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 16
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy ny loholon''ny fiangonana: Ahoana no hataontsika ho an''ireo sisa mba hahazoany vady, fa efa naringana ny vehivavy tamin''ny Benjamita?'
mg1865::mg_7::21::17:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 17
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary hoy izy: Tsy maintsy mahazo lova ny Benjamita izay afa-nandositra, mba tsy hisy firenena iray fongotra amin''ny Isiraely.'
mg1865::mg_7::21::18:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 18
  verse_date_revised: null
  verse_title: null
  verse_text: 'Nefa isika tsy mahazo manome azy ny zanakavavintsika ho vadiny, satria efa nianiana ny Zanak''Isiraely ka nanao hoe: Ho voaozona anie izay manome vady ho an''ny Benjamita.'
mg1865::mg_7::21::19:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 19
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia hoy izy: Indro, misy andro firavoravoana isan-taona ho an''i Jehovah any Silo, izay avaratr''i Betela, atsinanan''ny lalambe miakatra avy any Betela hankany Sekema, ary atsimon''i Lebona.'
mg1865::mg_7::21::20:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 20
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary nandidy ny taranak''i Benjamina izy ka nanao hoe: Mandehana, ka manotreha any amin''ny tanim-boaloboka,'
mg1865::mg_7::21::21:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 21
  verse_date_revised: null
  verse_title: null
  verse_text: 'ka jereo, ka raha, indreo, mivoaka handihy ny zazavavy avy any Silo, dia mivoaha avy ao amin''ny tanim-boaloboka ianareo, ary samia misambotra amin''ny zazavavy avy any Silo ho vadiny avy, ka mandehana any amin''ny tanin''ny Benjamina indray.'
mg1865::mg_7::21::22:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 22
  verse_date_revised: null
  verse_title: null
  verse_text: 'Ary raha mankany aminay hitaraina ny rainy na ny anadahiny, dia holazainay aminy hoe: Omeo anay ihany izy, fa izahay tsy mba nahazo vady tany amin''ilay ady teo; fa tsy ianareo no nanome azy; fa raha izany, dia meloka ihany ianareo.'
mg1865::mg_7::21::23:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 23
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia nanao izany ny taranak''i Benjamina ka samy naka vady araka ny isany tamin''ny mpandihy izay nosamboriny; dia nandeha izy ka niverina ho any amin''ny lovany ary namboatra ireo tanàna ireo ka nonina tao.'
mg1865::mg_7::21::24:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 24
  verse_date_revised: null
  verse_title: null
  verse_text: 'Dia samy nandeha niala teo ny Zanak''Isiraely tamin''izany andro izany, samy ho any amin''ny fireneny sy ny fokony avy; dia niala teo ho any amin''ny lovany avy ny olona rehetra.'
mg1865::mg_7::21::25:
  verse_version: mg1865
  verse_book: mg_7
  verse_chapter: 21
  verse_number: 25
  verse_date_revised: null
  verse_title: null
  verse_text: 'Tsy nisy mpanjaka teo amin''ny Isiraely tamin''izany andro izany; fa samy nanao izay nataony ho marina avy izy rehetra.'
